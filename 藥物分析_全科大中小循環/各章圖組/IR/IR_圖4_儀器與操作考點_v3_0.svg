<circle cx="1200" cy="2070" r="15" fill="#fff" stroke="#685185"/>
<circle cx="1270" cy="2070" r="15" fill="#fff" stroke="#685185"/>
<circle cx="1340" cy="2070" r="15" fill="#fff" stroke="#685185"/>
