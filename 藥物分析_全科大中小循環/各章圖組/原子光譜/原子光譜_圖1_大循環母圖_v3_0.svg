<svg width="1900" height="2460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2460" style="max-width:100%;height:auto" role="img" aria-labelledby="at3_g1_title at3_g1_desc"><title id="at3_g1_title">分析全流程母圖｜先認作用，再把含量算回來</title><desc id="at3_g1_desc">原子光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="at3_g1_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="at3_g1_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="at3_g1_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="2460" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH31  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">分析全流程母圖｜先認作用，再把含量算回來</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">先問「量哪個元素、要辨身分或定量？」；共同準備後分流，讀數與品質再匯流。小循環回查見圖 2。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">原子化、作用、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><rect x="330" y="395" width="1240" height="190" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="354" y="439" font-size="27" fill="#326991" font-weight="bold">M01｜先定問題</text><text x="354" y="483" font-size="24" fill="#24343f" font-weight="normal">元素＋目的＋檢品／基質＋預期範圍 → 選可回答問題的路徑。</text><text x="354" y="530.8" font-size="24" fill="#24343f" font-weight="normal">例：Na／K 輸注液選傳統焰光；Pb／Ni 限量題選 AAS。實務方法須確認適用性。</text><path d="M 950 585 L 950 660" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,660 944,645 956,645" fill="#61717a"/><rect x="330" y="660" width="1240" height="245" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="354" y="704" font-size="27" fill="#9e771c" font-weight="bold">M02｜共同準備</text><text x="354" y="748" font-size="24" fill="#24343f" font-weight="normal">取樣／消化或溶解／適當稀釋 → 空白與標準匹配 → 控制進樣及原子化。</text><text x="354" y="795.8" font-size="24" fill="#24343f" font-weight="normal">先分清：原瓶 C ≠ 送入速率 CQη ≠ 中性／離子／激發態人口。</text><text x="354" y="843.6" font-size="24" fill="#24343f" font-weight="normal">主掛載：A 組 L02、L08、L14；試劑與原子化干擾接 D 組。</text><path d="M 950 905 L 950 950 L 335 950 L 335 1005" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="335,1005 329,990 341,990" fill="#61717a"/><path d="M 950 905 L 950 950 L 950 950 L 950 1005" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1005 944,990 956,990" fill="#61717a"/><path d="M 950 905 L 950 950 L 1565 950 L 1565 1005" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1565,1005 1559,990 1571,990" fill="#61717a"/><rect x="50" y="1005" width="570" height="325" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="74" y="1049" font-size="27" fill="#286c68" font-weight="bold">M02｜Flame AES（火焰放射）</text><text x="74" y="1093" font-size="24" fill="#24343f" font-weight="normal">樣品原子化 → 受激發 → 回到低能階放光。</text><text x="74" y="1140.8" font-size="24" fill="#24343f" font-weight="normal">光來自樣品；火焰供激發能，無需 HCL 照樣品量</text><text x="74" y="1175.6" font-size="24" fill="#24343f" font-weight="normal">吸收。</text><text x="74" y="1223.4" font-size="24" fill="#24343f" font-weight="normal">主掛載：B 組 L03；C 組 L07。</text><rect x="665" y="1005" width="570" height="325" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="689" y="1049" font-size="27" fill="#286c68" font-weight="bold">M02｜AAS（原子吸收）</text><text x="689" y="1093" font-size="24" fill="#24343f" font-weight="normal">HCL（中空陰極燈）供特徵光 → 樣品原子吸收 →</text><text x="689" y="1127.8" font-size="24" fill="#24343f" font-weight="normal">透射光減少。</text><text x="689" y="1175.6" font-size="24" fill="#24343f" font-weight="normal">樣品與燈內原子分開；火焰或石墨爐負責原子化。</text><text x="689" y="1223.4" font-size="24" fill="#24343f" font-weight="normal">主掛載：B 組 L04；C 組 L05。</text><rect x="1280" y="1005" width="570" height="325" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="1304" y="1049" font-size="27" fill="#326991" font-weight="bold">M02｜ICP-OES（電漿放射）</text><text x="1304" y="1093" font-size="24" fill="#24343f" font-weight="normal">RF（射頻）耦合 Ar 電漿 → 原子／離子受激發</text><text x="1304" y="1127.8" font-size="24" fill="#24343f" font-weight="normal">→ 放光。</text><text x="1304" y="1175.6" font-size="24" fill="#24343f" font-weight="normal">後端量光。ICP-MS 量離子質荷比，另屬質譜。</text><text x="1304" y="1223.4" font-size="24" fill="#24343f" font-weight="normal">主掛載：E 組 L12。</text><path d="M 335 1330 L 335 1375 L 950 1375 L 950 1435" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1435 944,1420 956,1420" fill="#61717a"/><path d="M 950 1330 L 950 1375 L 950 1375 L 950 1435" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1435 944,1420 956,1420" fill="#61717a"/><path d="M 1565 1330 L 1565 1375 L 950 1375 L 950 1435" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1435 944,1420 956,1420" fill="#61717a"/><rect x="330" y="1435" width="1240" height="305" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="354" y="1479" font-size="27" fill="#356844" font-weight="bold">M03｜讀訊號：先說量與單位</text><text x="354" y="1523" font-size="24" fill="#24343f" font-weight="normal">λ（nm）＝線的位置；S（依儀器，如 a.u.）＝放射訊號，兩者不可混用。</text><text x="354" y="1570.8" font-size="24" fill="#24343f" font-weight="normal">AAS：T＝I/I₀ → A＝−log₁₀T；T、A 都無因次，%T 需先除以 100。</text><text x="354" y="1618.6" font-size="24" fill="#24343f" font-weight="normal">選線、偵測、調變與背景處理後，才交出可校正讀數。</text><text x="354" y="1666.4" font-size="24" fill="#24343f" font-weight="normal">主掛載：C 組 L06、D 組 L11；與原子／離子線配對一起讀。</text><path d="M 950 1740 L 950 1815" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1815 944,1800 956,1800" fill="#61717a"/><rect x="330" y="1815" width="1240" height="220" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="354" y="1859" font-size="27" fill="#b72d4a" font-weight="bold">M04｜核對結論</text><text x="354" y="1903" font-size="24" fill="#24343f" font-weight="normal">辨方向／選方法題：逐項檢查理由與適用條件。</text><text x="354" y="1950.8" font-size="24" fill="#24343f" font-weight="normal">定量題：有效校正 → 測定液濃度 → 稀釋回算 → 查空白、範圍與品質。</text><text x="354" y="1998.6" font-size="24" fill="#24343f" font-weight="normal">主掛載：F 組 L13、L16。品質合格便交出結論。</text><path d="M 950 2035 L 950 2110" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,2110 944,2095 956,2095" fill="#61717a"/><rect x="520" y="2110" width="860" height="140" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="544" y="2154" font-size="27" fill="#b72d4a" font-weight="bold">正常出口｜方向、方法或原液含量</text><text x="544" y="2198" font-size="24" fill="#24343f" font-weight="normal">附單位、適用範圍與必要品質證據；不是每題都要算濃度。</text><path d="M 1570 1880 L 1580 1880 M 1587 1880 L 1597 1880 M 1604 1880 L 1614 1880 M 1621 1880 L 1631 1880 M 1638 1880 L 1648 1880 M 1655 1880 L 1665 1880 M 1672 1880 L 1682 1880 M 1689 1880 L 1699 1880 M 1706 1880 L 1716 1880 M 1723 1880 L 1733 1880 M 1740 1880 L 1750 1880 M 1757 1880 L 1767 1880 M 1774 1880 L 1784 1880 M 1791 1880 L 1801 1880 M 1808 1880 L 1818 1880 M 1825 1880 L 1835 1880 M 1842 1880 L 1852 1880 M 1859 1880 L 1869 1880 M 1875 1880 L 1875 1870 M 1875 1863 L 1875 1853 M 1875 1846 L 1875 1836 M 1875 1829 L 1875 1819 M 1875 1812 L 1875 1802 M 1875 1795 L 1875 1785 M 1875 1778 L 1875 1768 M 1875 1761 L 1875 1751 M 1875 1744 L 1875 1734 M 1875 1727 L 1875 1717 M 1875 1710 L 1875 1700 M 1875 1693 L 1875 1683 M 1875 1676 L 1875 1666 M 1875 1659 L 1875 1649 M 1875 1642 L 1875 1632 M 1875 1625 L 1875 1615 M 1875 1608 L 1875 1598 M 1875 1591 L 1875 1581 M 1875 1574 L 1875 1564 M 1875 1557 L 1875 1547 M 1875 1540 L 1875 1530 M 1875 1523 L 1875 1513 M 1875 1506 L 1875 1496 M 1875 1489 L 1875 1479 M 1875 1472 L 1875 1462 M 1875 1455 L 1875 1445 M 1875 1438 L 1875 1428 M 1875 1421 L 1875 1411 M 1875 1404 L 1875 1394 M 1875 1387 L 1875 1377 M 1875 1370 L 1875 1360 M 1875 1353 L 1875 1343 M 1875 1336 L 1875 1326 M 1875 1319 L 1875 1309 M 1875 1302 L 1875 1292 M 1875 1285 L 1875 1275 M 1875 1268 L 1875 1258 M 1875 1251 L 1875 1241 M 1875 1234 L 1875 1224 M 1875 1217 L 1875 1207 M 1875 1200 L 1875 1190 M 1875 1183 L 1875 1173 M 1875 1166 L 1875 1156 M 1875 1149 L 1875 1139 M 1875 1132 L 1875 1122 M 1875 1115 L 1875 1105 M 1875 1098 L 1875 1088 M 1875 1081 L 1875 1071 M 1875 1064 L 1875 1054 M 1875 1047 L 1875 1037 M 1875 1030 L 1875 1020 M 1875 1013 L 1875 1003 M 1875 996 L 1875 986 M 1875 979 L 1875 969 M 1875 962 L 1875 952 M 1875 945 L 1875 935 M 1875 928 L 1875 918 M 1875 911 L 1875 901 M 1875 894 L 1875 884 M 1875 877 L 1875 867 M 1875 860 L 1875 850 M 1875 843 L 1875 833 M 1875 826 L 1875 816 M 1875 809 L 1875 799 M 1875 792 L 1875 782 M 1875 775 L 1875 765 M 1875 758 L 1875 748 M 1875 741 L 1875 731 M 1875 724 L 1875 714 M 1875 707 L 1875 697 M 1875 690 L 1875 680 M 1875 673 L 1875 663 M 1875 656 L 1875 646 M 1875 639 L 1875 629 M 1875 622 L 1875 612 M 1875 605 L 1875 595 M 1875 588 L 1875 578 M 1875 571 L 1875 561 M 1875 554 L 1875 544 M 1875 537 L 1875 527 M 1875 520 L 1875 510 M 1875 503 L 1875 493 M 1875 486 L 1875 480 M 1875 480 L 1865 480 M 1858 480 L 1848 480 M 1841 480 L 1831 480 M 1824 480 L 1814 480 M 1807 480 L 1797 480 M 1790 480 L 1780 480 M 1773 480 L 1763 480 M 1756 480 L 1746 480 M 1739 480 L 1729 480 M 1722 480 L 1712 480 M 1705 480 L 1695 480 M 1688 480 L 1678 480 M 1671 480 L 1661 480 M 1654 480 L 1644 480 M 1637 480 L 1627 480 M 1620 480 L 1610 480 M 1603 480 L 1593 480 M 1586 480 L 1576 480" fill="none" stroke="#b72d4a" stroke-width="3"/><polygon points="1570,480 1585,474 1585,486" fill="#b72d4a"/><text x="1605" y="545" font-size="21" fill="#b72d4a" font-weight="normal">目的／方法不合</text><text x="1605" y="578" font-size="21" fill="#b72d4a" font-weight="normal">→ 回 M01 選路徑</text><path d="M 330 1900 L 320 1900 M 313 1900 L 303 1900 M 296 1900 L 286 1900 M 279 1900 L 269 1900 M 262 1900 L 252 1900 M 245 1900 L 235 1900 M 228 1900 L 218 1900 M 211 1900 L 201 1900 M 194 1900 L 184 1900 M 177 1900 L 167 1900 M 160 1900 L 150 1900 M 143 1900 L 133 1900 M 126 1900 L 116 1900 M 109 1900 L 99 1900 M 92 1900 L 82 1900 M 75 1900 L 65 1900 M 58 1900 L 48 1900 M 41 1900 L 31 1900 M 25 1900 L 25 1