0 L 269 1990 M 262 1990 L 252 1990 M 245 1990 L 235 1990 M 228 1990 L 220 1990 M 220 1990 L 220 1980 M 220 1973 L 220 1963 M 220 1956 L 220 1946 M 220 1939 L 220 1929 M 220 1922 L 220 1912 M 220 1905 L 220 1895 M 220 1888 L 220 1878 M 220 1871 L 220 1861 M 220 1854 L 220 1844 M 220 1837 L 220 1827 M 220 1820 L 220 1810 M 220 1803 L 220 1793 M 220 1786 L 220 1776 M 220 1769 L 220 1759 M 220 1752 L 220 1742 M 220 1735 L 220 1725 M 220 1718 L 220 1708 M 220 1701 L 220 1691 M 220 1684 L 220 1674 M 220 1667 L 220 1657 M 220 1650 L 220 1640 M 220 1633 L 220 1623 M 220 1616 L 220 1606 M 220 1599 L 220 1589 M 220 1582 L 220 1572 M 220 1565 L 220 1555 M 220 1548 L 220 1540 M 220 1540 L 230 1540 M 237 1540 L 247 1540 M 254 1540 L 264 1540 M 271 1540 L 281 1540 M 288 1540 L 298 1540 M 305 1540 L 315 1540 M 322 1540 L 330 1540" fill="none" stroke="#b72d4a" stroke-width="3"/><polygon points="330,1540 315,1546 315,1534" fill="#b72d4a"/><text x="70" y="1780" font-size="20" fill="#b72d4a" font-weight="normal">線、背景、單位不符</text><text x="70" y="1810" font-size="20" fill="#b72d4a" font-weight="normal">→ 回 M03 修讀數</text><text x="50" y="2320" font-size="23" fill="#24343f" font-weight="normal">M04 推論超出證據：留 M04 重查判準；需要新資料才回對應上游站。修正後取得新證據，再到 M04。</text><text x="50" y="2375" font-size="20" fill="#61717a" font-weight="normal">深灰實線＝分析流程／因果；紅色虛線＝條件不符才回查。回查是分析者修正流程。</text><text x="50" y="2415" font-size="20" fill="#61717a" font-weight="normal">原子光譜 v3.0｜與雙檔同源；所有 L 在圖 2 有主要位置。示意不按比例。</text></g></svg>