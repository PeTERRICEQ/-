<svg width="1900" height="3780" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 3780" style="max-width:100%;height:auto" role="img" aria-labelledby="at3_g2_title at3_g2_desc"><title id="at3_g2_title">小循環掛載與能階圖｜六個位置，16 條短鏈</title><desc id="at3_g2_desc">原子光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="at3_g2_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="at3_g2_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="at3_g2_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="3780" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH31  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">小循環掛載與能階圖｜六個位置，16 條短鏈</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">每個模組由主站取輸入，經 2–3 個中介交回主站；平行模組共用位置，不是彼此必須依序發生。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">原子化、作用、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><rect x="50" y="400" width="570" height="1330" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="448" font-size="29" fill="#9e771c" font-weight="bold">A｜檢品先能比較</text><text x="74" y="517" font-size="23" fill="#9e771c" font-weight="normal">主位置：L02、L08、L14</text><rect x="68" y="555" width="534" height="350" rx="12" fill="#fff" stroke="#9e771c" stroke-width="2"/><text x="88" y="596" font-size="27" fill="#9e771c" font-weight="bold">L02｜原子化</text><text x="88" y="637" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M02 出口</text><text x="88" y="679" font-size="22" fill="#24343f" font-weight="normal">輸入：待測元素的溶液、進樣裝置與原子化條件</text><text x="88" y="720.9" font-size="24" fill="#24343f" font-weight="bold">霧化與傳輸液滴→脫溶劑、蒸發／解離→形成氣</text><text x="88" y="755.7" font-size="24" fill="#24343f" font-weight="bold">相自由原子</text><text x="88" y="805.5" font-size="22" fill="#24343f" font-weight="normal">輸出：可供吸收或進一步激發的物種；交 M02 作</text><text x="88" y="837.4" font-size="22" fill="#24343f" font-weight="normal">用步驟</text><rect x="68" y="930" width="534" height="350" rx="12" fill="#fff" stroke="#9e771c" stroke-width="2"/><text x="88" y="971" font-size="27" fill="#9e771c" font-weight="bold">L08｜物理干擾</text><text x="88" y="1012" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M03 出口</text><text x="88" y="1054" font-size="22" fill="#24343f" font-weight="normal">輸入：原瓶濃度相同，但樣品與標準的基質不同</text><text x="88" y="1095.9" font-size="24" fill="#24343f" font-weight="bold">黏度／表面張力等改變→吸入量、霧化或傳輸效</text><text x="88" y="1130.7" font-size="24" fill="#24343f" font-weight="bold">率改變→觀測區接到的分析物量改變</text><text x="88" y="1180.5" font-size="22" fill="#24343f" font-weight="normal">輸出：同濃度仍可能讀不同訊號；M02 先查進樣與</text><text x="88" y="1212.4" font-size="22" fill="#24343f" font-weight="normal">匹配</text><rect x="68" y="1305" width="534" height="350" rx="12" fill="#fff" stroke="#9e771c" stroke-width="2"/><text x="88" y="1346" font-size="27" fill="#9e771c" font-weight="bold">L14｜前處理與空白</text><text x="88" y="1387" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M02 出口</text><text x="88" y="1429" font-size="22" fill="#24343f" font-weight="normal">輸入：M01 已定義的檢品、分析目的與方法要求</text><text x="88" y="1470.9" font-size="24" fill="#24343f" font-weight="bold">取樣、溶解／消化或萃取→控制水、試劑與容器</text><text x="88" y="1505.7" font-size="24" fill="#24343f" font-weight="bold">污染→保留稀釋紀錄並測程序空白</text><text x="88" y="1555.5" font-size="22" fill="#24343f" font-weight="normal">輸出：可比較的測定液；交 M02 測量，空白證據</text><text x="88" y="1587.4" font-size="22" fill="#24343f" font-weight="normal">留 M04 查核</text><rect x="665" y="400" width="570" height="1330" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="689" y="448" font-size="29" fill="#286c68" font-weight="bold">B｜分清吸收與放光</text><text x="689" y="517" font-size="23" fill="#286c68" font-weight="normal">主位置：L01、L03、L04</text><rect x="683" y="555" width="534" height="350" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="703" y="596" font-size="27" fill="#286c68" font-weight="bold">L01｜線狀光譜</text><text x="703" y="637" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M03 出口</text><text x="703" y="679" font-size="22" fill="#24343f" font-weight="normal">輸入：同一元素的氣相原子與選定觀測條件</text><text x="703" y="720.9" font-size="24" fill="#24343f" font-weight="bold">離散電子能階→允許的電子躍遷→各躍遷對應特</text><text x="703" y="755.7" font-size="24" fill="#24343f" font-weight="bold">徵波長</text><text x="703" y="805.5" font-size="22" fill="#24343f" font-weight="normal">輸出：可選用的特徵譜線；交 M03 選線</text><rect x="683" y="930" width="534" height="350" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="703" y="971" font-size="27" fill="#286c68" font-weight="bold">L03｜AES 放光</text><text x="703" y="1012" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M03 出口</text><text x="703" y="1054" font-size="22" fill="#24343f" font-weight="normal">輸入：已送入的檢品與火焰／電漿能量</text><text x="703" y="1095.9" font-size="24" fill="#24343f" font-weight="bold">原子化後獲得激發能→電子升到較高能階→回到</text><text x="703" y="1130.7" font-size="24" fill="#24343f" font-weight="bold">較低能階並放光</text><text x="703" y="1180.5" font-size="22" fill="#24343f" font-weight="normal">輸出：樣品放出的元素相關光；交 M03 讀放射訊</text><text x="703" y="1212.4" font-size="22" fill="#24343f" font-weight="normal">號 S</text><rect x="683" y="1305" width="534" height="350" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="703" y="1346" font-size="27" fill="#286c68" font-weight="bold">L04｜AAS 吸光</text><text x="703" y="1387" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M03 出口</text><text x="703" y="1429" font-size="22" fill="#24343f" font-weight="normal">輸入：元素相配的外來特徵光與樣品原子雲</text><text x="703" y="1470.9" font-size="24" fill="#24343f" font-weight="bold">燈光穿過樣品原子雲→匹配躍遷吸收光→透射光</text><text x="703" y="1505.7" font-size="24" fill="#24343f" font-weight="bold">I 相對 I₀ 減少</text><text x="703" y="1555.5" font-size="22" fill="#24343f" font-weight="normal">輸出：透射比 T，再換成吸光度 A；交 M03</text><rect x="1280" y="400" width="570" height="1330" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1304" y="448" font-size="29" fill="#356844" font-weight="bold">C｜光從哪裡來、往哪裡去</text><text x="1304" y="517" font-size="23" fill="#356844" font-weight="normal">主位置：L05、L06、L07</text><rect x="1298" y="555" width="534" height="350" rx="12" fill="#fff" stroke="#356844" stroke-width="2"/><text x="1318" y="596" font-size="27" fill="#356844" font-weight="bold">L05｜HCL 供光</text><text x="1318" y="637" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M02 出口</text><text x="1318" y="679" font-size="22" fill="#24343f" font-weight="normal">輸入：含目標元素的陰極、低壓 Ne／Ar 與放電電</text><text x="1318" y="710.9" font-size="22" fill="#24343f" font-weight="normal">壓</text><text x="1318" y="752.8" font-size="24" fill="#24343f" font-weight="bold">填充氣放電形成正離子→撞擊陰極並濺射元素原</text><text x="1318" y="787.6" font-size="24" fill="#24343f" font-weight="bold">子→原子受激發後發出特徵線</text><text x="1318" y="837.4" font-size="22" fill="#24343f" font-weight="normal">輸出：典型 AAS 的窄線光源；交 M02 的樣品吸收</text><text x="1318" y="869.3" font-size="22" fill="#24343f" font-weight="normal">步驟</text><rect x="1298" y="930" width="534" height="350" rx="12" fill="#fff" stroke="#356844" stroke-width="2"/><text x="1318" y="971" font-size="27" fill="#356844" font-weight="bold">L06｜斬光與背景</text><text x="1318" y="1012" font-size="22" fill="#24343f" font-weight="normal">M03 入口 → M03 出口</text><text x="1318" y="1054" font-size="22" fill="#24343f" font-weight="normal">輸入：燈的調變光、樣品／火焰放光及參考訊號</text><text x="1318" y="1095.9" font-size="24" fill="#24343f" font-weight="bold">調變或切換已知光路→區分隨燈變化的訊號與未</text><text x="1318" y="1130.7" font-size="24" fill="#24343f" font-weight="bold">調變放光→按配置取得有效讀數</text><text x="1318" y="1180.5" font-size="22" fill="#24343f" font-weight="normal">輸出：處理後的光讀數；交 M03，必要時再做背景</text><text x="1318" y="1212.4" font-size="22" fill="#24343f" font-weight="normal">吸收校正</text><rect x="1298" y="1305" width="534" height="350" rx="12" fill="#fff" stroke="#356844" stroke-width="2"/><text x="1318" y="1346" font-size="27" fill="#356844" font-weight="bold">L07｜鈉能階方向</text><text x="1318" y="1387" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M04 出口</text><text x="1318" y="1429" font-size="22" fill="#24343f" font-weight="normal">輸入：題本固定輸入：3s 較低、3p 較高；黃色線</text><text x="1318" y="1460.9" font-size="22" fill="#24343f" font-weight="normal">約 589 nm</text><text x="1318" y="1502.8" font-size="24" fill="#24343f" font-weight="bold">先讀題目是吸能或放光→放光時由高能階往低能</text><text x="1318" y="1537.6" font-size="24" fill="#24343f" font-weight="bold">階→配對 3p→3s</text><text x="1318" y="1587.4" font-size="22" fill="#24343f" font-weight="normal">輸出：鈉黃光題的躍遷方向；交 M04 選答案</text><rect x="50" y="1775" width="570" height="1330" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="74" y="1823" font-size="29" fill="#685185" font-weight="bold">D｜原子與譜線受什麼干擾</text><text x="74" y="1892" font-size="23" fill="#685185" font-weight="normal">主位置：L09、L10、L11</text><rect x="68" y="1930" width="534" height="350" rx="12" fill="#fff" stroke="#685185" stroke-width="2"/><text x="88" y="1971" font-size="27" fill="#685185" font-weight="bold">L09｜化學干擾</text><text x="88" y="2012" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M03 出口</text><text x="88" y="2054" font-size="22" fill="#24343f" font-weight="normal">輸入：觀測區的元素與共存成分、火焰條件</text><text x="88" y="2095.9" font-size="24" fill="#24343f" font-weight="bold">形成難解離物種→可供量測的自由原子較少→原</text><text x="88" y="2130.7" font-size="24" fill="#24343f" font-weight="bold">子線訊號受到影響</text><text x="88" y="2180.5" font-size="22" fill="#24343f" font-weight="normal">輸出：受化學型態影響的原子線；交 M03 讀數，</text><text x="88" y="2212.4" font-size="22" fill="#24343f" font-weight="normal">異常時回 M02</text><rect x="68" y="2305" width="534" height="350" rx="12" fill="#fff" stroke="#685185" stroke-width="2"/><text x="88" y="2346" font-size="27" fill="#685185" font-weight="bold">L10｜離子化干擾</text><text x="88" y="2387" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M03 出口</text><text x="88" y="2429" font-size="22" fill="#24343f" font-weight="normal">輸入：中性原子、離子與電子，在指定溫度與觀測</text><text x="88" y="2460.9" font-size="22" fill="#24343f" font-weight="normal">線下</text><text x="88" y="2502.8" font-size="24" fill="#24343f" font-weight="bold">離子化平衡改變→中性／離子人口重新分配→所</text><text x="88" y="2537.6" font-size="24" fill="#24343f" font-weight="bold">選原子線或離子線改變</text><text x="88" y="2587.4" font-size="22" fill="#24343f" font-weight="normal">輸出：改變的原子／離子線；交 M03 讀數，異常</text><text x="88" y="2619.3" font-size="22" fill="#24343f" font-weight="normal">時回 M02</text><rect x="68" y="2680" width="534" height="350" rx="12" fill="#fff" stroke="#685185" stroke-width="2"/><text x="88" y="2721" font-size="27" fill="#685185" font-weight="bold">L11｜光譜干擾</text><text x="88" y="2762" font-size="22" fill="#24343f" font-weight="normal">M03 入口 → M04 出口</text><text x="88" y="2804" font-size="22" fill="#24343f" font-weight="normal">輸入：目標譜線、共存譜線、背景及光學解析能力</text><text x="88" y="2845.9" font-size="24" fill="#24343f" font-weight="bold">其他線重疊或背景改變→偵測窗混入非目標光／</text><text x="88" y="2880.7" font-size="24" fill="#24343f" font-weight="bold">衰減→淨讀數產生偏差</text><text x="88" y="2930.5" font-size="22" fill="#24343f" font-weight="normal">輸出：須換線或處理背景的讀數；交 M04 判品質</text><rect x="665" y="1775" width="570" height="1330" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="689" y="1823" font-size="29" fill="#326991" font-weight="bold">E｜按目的選方法</text><text x="689" y="1892" font-size="23" fill="#326991" font-weight="normal">主位置：L12、L15</text><rect x="683" y="1930" width="534" height="350" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="703" y="1971" font-size="27" fill="#326991" font-weight="bold">L12｜ICP-OES</text><text x="703" y="2012" font-size="22" fill="#24343f" font-weight="normal">M02 入口 → M03 出口</text><text x="703" y="2054" font-size="22" fill="#24343f" font-weight="normal">輸入：合適檢品、Ar 氣、RF 能量與電漿裝置</text><text x="703" y="2095.9" font-size="24" fill="#24343f" font-weight="bold">RF 耦合 Ar 電漿→原子化並激發原子／離子→</text><text x="703" y="2130.7" font-size="24" fill="#24343f" font-weight="bold">分光與光學偵測多條線</text><text x="703" y="2180.5" font-size="22" fill="#24343f" font-weight="normal">輸出：各元素的光學放射訊號；交 M03，再各自校</text><text x="703" y="2212.4" font-size="22" fill="#24343f" font-weight="normal">正</text><rect x="683" y="2305" width="534" height="350" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="703" y="2346" font-size="27" fill="#326991" font-weight="bold">L15｜方法選擇</text><text x="703" y="2387" font-size="22" fill="#24343f" font-weight="normal">M01 入口 → M02 出口</text><text x="703" y="2429" font-size="22" fill="#24343f" font-weight="normal">輸入：元素、目的、基質、所需範圍及可用配置</text><text x="703" y="2470.9" font-size="24" fill="#24343f" font-weight="bold">先辨是元素含量或結構問題→選合適吸收／放射</text><text x="703" y="2505.7" font-size="24" fill="#24343f" font-weight="bold">配置→確認範圍與基質能處理</text><text x="703" y="2555.5" font-size="22" fill="#24343f" font-weight="normal">輸出：有理由的方法路徑；交 M02 執行，再由</text><text x="703" y="2587.4" font-size="22" fill="#24343f" font-weight="normal">M04 核對結論</text><text x="693" y="2745" font-size="25" fill="#326991" font-weight="normal">L12 在 M02 改能量來源；L15 在 M01 選方</text><text x="693" y="2781.25" font-size="25" fill="#326991" font-weight="normal">法。用配置與目的辨家族，不以名稱直接排永</text><text x="693" y="2817.5" font-size="25" fill="#326991" font-weight="normal">久名次。</text><rect x="1280" y="1775" width="570" height="1330" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="1304" y="1823" font-size="29" fill="#b72d4a" font-weight="bold">F｜把訊號變可信含量</text><text x="1304" y="1892" font-size="23" fill="#b72d4a" font-weight="normal">主位置：L13、L16</text><rect x="1298" y="1930" width="534" height="350" rx="12" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1318" y="1971" font-size="27" fill="#b72d4a" font-weight="bold">L13｜校正與回算</text><text x="1318" y="2012" font-size="22" fill="#24343f" font-weight="normal">M03 入口 → M04 出口</text><text x="1318" y="2054" font-size="22" fill="#24343f" font-weight="normal">輸入：有效訊號、標準模型、稀釋紀錄與適用範圍</text><text x="1318" y="2095.9" font-size="24" fill="#24343f" font-weight="bold">檢查 S＝mc＋b 的條件→先扣截距並除斜率→按</text><text x="1318" y="2130.7" font-size="24" fill="#24343f" font-weight="bold">體積守恆回推原液</text><text x="1318" y="2180.5" font-size="22" fill="#24343f" font-weight="normal">輸出：有單位且在範圍內的原液含量；交 M04 查</text><text x="1318" y="2212.4" font-size="22" fill="#24343f" font-weight="normal">核</text><rect x="1298" y="2305" width="534" height="350" rx="12" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1318" y="2346" font-size="27" fill="#b72d4a" font-weight="bold">L16｜品質閉合</text><text x="1318" y="2387" font-size="22" fill="#24343f" font-weight="normal">M04 入口 → M01／M02／M03／M04 出口</text><text x="1318" y="2429" font-size="22" fill="#24343f" font-weight="normal">輸入：含量結果、空白、校正、回收與重複性等證</text><text x="1318" y="2460.9" font-size="22" fill="#24343f" font-weight="normal">據</text><text x="1318" y="2502.8" font-size="24" fill="#24343f" font-weight="bold">對照預先設定的品質要求→按異常定位真正原因</text><text x="1318" y="2537.6" font-size="24" fill="#24343f" font-weight="bold">→修正後重測／重處理再判讀</text><text x="1318" y="2587.4" font-size="22" fill="#24343f" font-weight="normal">輸出：合格便交出結論；不符才回 M01、M02、</text><text x="1318" y="2619.3" font-size="22" fill="#24343f" font-weight="normal">M03 或留 M04</text><text x="1308" y="2745" font-size="25" fill="#b72d4a" font-weight="normal">L13 處理數值與單位；L16 判證據是否足夠。</text><text x="1308" y="2781.25" font-size="25" fill="#b72d4a" font-weight="normal">正常結果直接報告，只有不符才回查。</text><text x="50" y="3190" font-size="29" fill="#24343f" font-weight="bold">L07 基本例｜鈉黃色線：先看箭頭方向</text><text x="100" y="3280" font-size="25" fill="#24343f" font-weight="normal">3p｜較高</text><path d="M 270 3270 L 800 3270" fill="none" stroke="#61717a" stroke-width="3"/><text x="100" y="3460" font-size="25" fill="#24343f" font-weight="normal">3s｜較低</text><path d="M 270 3450 L 800 3450" fill="none" stroke="#61717a" stroke-width="3"/><path d="M 380 3450 L 380 3270" fill="none" stroke="#326991" stroke-width="3"/><polygon points="380,3270 386,3285 374,3285" fill="#326991"/><text x="285" y="3370" font-size="24" fill="#326991" font-weight="normal">吸能 ↑</text><path d="M 680 3270 L 680 3450" fill="none" stroke="#9e771c" stroke-width="3"/><polygon points="680,3450 674,3435 686,3435" fill="#9e771c"/><text x="700" y="3380" font-size="24" fill="#9e771c" font-weight="normal">放光 ↓</text><rect x="940" y="3240" width="910" height="285" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="964" y="3284" font-size="27" fill="#356844" font-weight="bold">題本固定輸入＋可推方向</text><text x="964" y="3328" font-size="24" fill="#24343f" font-weight="normal">3s 較低、3p 較高是本題給定的狀態關係。</text><text x="964" y="3375.8" font-size="24" fill="#24343f" font-weight="normal">約 589 nm 黃光：3p → 3s；高低差由光子帶走。</text><text x="964" y="3423.6" font-size="24" fill="#24343f" font-weight="normal">反向 3s → 3p 需吸能，不是本題放光方向。</text><text x="964" y="3471.4" font-size="24" fill="#24343f" font-weight="normal">Na D 雙線約 588.995、589.5924 nm；此圖合併 3p、未按比例。</text><text x="50" y="3590" font-size="23" fill="#24343f" font-weight="normal">能階區：藍箭頭＝向上吸能；金箭頭＝向下放光。上方模組箭頭表示因果與主站交接。</text><text x="50" y="3695" font-size="20" fill="#61717a" font-weight="normal">深灰實線＝分析流程／因果；紅色虛線＝條件不符才回查。回查是分析者修正流程。</text><text x="50" y="3735" font-size="20" fill="#61717a" font-weight="normal">原子光譜 v3.0｜與雙檔同源；所有 L 在圖 2 有主要位置。示意不按比例。</text></g></svg>