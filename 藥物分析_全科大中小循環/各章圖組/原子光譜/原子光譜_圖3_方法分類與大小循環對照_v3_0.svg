<svg width="1900" height="2850" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2850" style="max-width:100%;height:auto" role="img" aria-labelledby="at3_g3_title at3_g3_desc"><title id="at3_g3_title">全章方法分類與大小循環對照｜每種方法走完四站</title><desc id="at3_g3_desc">原子光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="at3_g3_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="at3_g3_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="at3_g3_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="2850" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH31  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">全章方法分類與大小循環對照｜每種方法走完四站</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">前四格是本章方法；ICP-MS 是家族辨識對照，最後一格用來分清目的、原理、配置與部件。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">原子化、作用、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><rect x="50" y="405" width="570" height="1110" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="74" y="450" font-size="27" fill="#286c68" font-weight="bold">Flame AES｜火焰放射</text><text x="74" y="497" font-size="21" fill="#24343f" font-weight="normal">Flame photometry（焰光光度法）</text><rect x="68" y="595" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="631" font-size="25" fill="#286c68" font-weight="bold">M01｜先定問題</text><text x="86" y="671" font-size="23" fill="#24343f" font-weight="normal">元素含量；題本 Na／K 輸注液，傳統常見 Na、</text><text x="86" y="704.35" font-size="23" fill="#24343f" font-weight="normal">K、Li、Ca、Ba。</text><rect x="68" y="810" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="846" font-size="25" fill="#286c68" font-weight="bold">M02｜準備與測量</text><text x="86" y="886" font-size="23" fill="#24343f" font-weight="normal">火焰原子化＋激發；控制送樣、氣體比與觀測區。</text><text x="86" y="919.35" font-size="23" fill="#24343f" font-weight="normal">L02、L03、L07。</text><rect x="68" y="1025" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="1061" font-size="25" fill="#286c68" font-weight="bold">M03｜讀訊號</text><text x="86" y="1101" font-size="23" fill="#24343f" font-weight="normal">選線後量樣品放光 S；單位依儀器，如 a.u.。λ</text><text x="86" y="1134.35" font-size="23" fill="#24343f" font-weight="normal">用 nm，無需 HCL 照樣品量吸收。</text><rect x="68" y="1240" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="1276" font-size="25" fill="#286c68" font-weight="bold">M04｜核對結論</text><text x="86" y="1316" font-size="23" fill="#24343f" font-weight="normal">有效校正→濃度→品質。須查基質、化學、離子化</text><text x="86" y="1349.35" font-size="23" fill="#24343f" font-weight="normal">與光譜干擾。</text><rect x="665" y="405" width="570" height="1110" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="689" y="450" font-size="27" fill="#286c68" font-weight="bold">Flame AAS｜火焰原子吸收</text><text x="689" y="497" font-size="21" fill="#24343f" font-weight="normal">Atomic absorption spectrometry（原子吸收光譜法）</text><rect x="683" y="595" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="701" y="631" font-size="25" fill="#286c68" font-weight="bold">M01｜先定問題</text><text x="701" y="671" font-size="23" fill="#24343f" font-weight="normal">元素含量；題本 Pb／Ni／Zn、Ca／Mg；確認方</text><text x="701" y="704.35" font-size="23" fill="#24343f" font-weight="normal">法適用範圍。</text><rect x="683" y="810" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="701" y="846" font-size="25" fill="#286c68" font-weight="bold">M02｜準備與測量</text><text x="701" y="886" font-size="23" fill="#24343f" font-weight="normal">火焰先原子化，HCL 特徵光穿過樣品原子雲。</text><text x="701" y="919.35" font-size="23" fill="#24343f" font-weight="normal">L02、L04、L05。</text><rect x="683" y="1025" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="701" y="1061" font-size="25" fill="#286c68" font-weight="bold">M03｜讀訊號</text><text x="701" y="1101" font-size="23" fill="#24343f" font-weight="normal">T＝I/I₀，A＝−log₁₀T；皆無因次。查調變與背</text><text x="701" y="1134.35" font-size="23" fill="#24343f" font-weight="normal">景。</text><rect x="683" y="1240" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="701" y="1276" font-size="25" fill="#286c68" font-weight="bold">M04｜核對結論</text><text x="701" y="1316" font-size="23" fill="#24343f" font-weight="normal">校正後算測定液，再回推原液。配對燈源仍須驗</text><text x="701" y="1349.35" font-size="23" fill="#24343f" font-weight="normal">證基質與範圍。</text><rect x="1280" y="405" width="570" height="1110" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="1304" y="450" font-size="27" fill="#326991" font-weight="bold">ICP-OES｜電漿光學放射</text><text x="1304" y="497" font-size="21" fill="#24343f" font-weight="normal">ICP-AES 同屬電漿原子放射</text><rect x="1298" y="595" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="1316" y="631" font-size="25" fill="#326991" font-weight="bold">M01｜先定問題</text><text x="1316" y="671" font-size="23" fill="#24343f" font-weight="normal">多元素含量；代表性檢品＋適合消化／稀釋。</text><rect x="1298" y="810" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="1316" y="846" font-size="25" fill="#326991" font-weight="bold">M02｜準備與測量</text><text x="1316" y="886" font-size="23" fill="#24343f" font-weight="normal">RF（射頻）耦合 Ar 電漿；原子化與激發原子／</text><text x="1316" y="919.35" font-size="23" fill="#24343f" font-weight="normal">離子。題本約 7000°C。L12。</text><rect x="1298" y="1025" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="1316" y="1061" font-size="25" fill="#326991" font-weight="bold">M03｜讀訊號</text><text x="1316" y="1101" font-size="23" fill="#24343f" font-weight="normal">分光後光學偵測多線 S；單位依儀器，分析線 λ</text><text x="1316" y="1134.35" font-size="23" fill="#24343f" font-weight="normal">用 nm。</text><rect x="1298" y="1240" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="1316" y="1276" font-size="25" fill="#326991" font-weight="bold">M04｜核對結論</text><text x="1316" y="1316" font-size="23" fill="#24343f" font-weight="normal">各元素有效校正；查線重疊、背景與基質。高溫</text><text x="1316" y="1349.35" font-size="23" fill="#24343f" font-weight="normal">不等於所有干擾消失。</text><rect x="50" y="1565" width="570" height="1110" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="74" y="1610" font-size="27" fill="#286c68" font-weight="bold">GF-AAS｜石墨爐原子吸收</text><text x="74" y="1657" font-size="21" fill="#24343f" font-weight="normal">Graphite furnace AAS（石墨爐原子吸收）</text><rect x="68" y="1755" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="1791" font-size="25" fill="#286c68" font-weight="bold">M01｜先定問題</text><text x="86" y="1831" font-size="23" fill="#24343f" font-weight="normal">微量元素分析；此章用來辨「原子化不一定燃燒</text><text x="86" y="1864.35" font-size="23" fill="#24343f" font-weight="normal">」。</text><rect x="68" y="1970" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="2006" font-size="25" fill="#286c68" font-weight="bold">M02｜準備與測量</text><text x="86" y="2046" font-size="23" fill="#24343f" font-weight="normal">電熱程序乾燥→灰化→原子化；配合元素與基質條</text><text x="86" y="2079.35" font-size="23" fill="#24343f" font-weight="normal">件。L02、L04。</text><rect x="68" y="2185" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="2221" font-size="25" fill="#286c68" font-weight="bold">M03｜讀訊號</text><text x="86" y="2261" font-size="23" fill="#24343f" font-weight="normal">仍量外來光的吸收 A（無因次）；需合適背景處</text><text x="86" y="2294.35" font-size="23" fill="#24343f" font-weight="normal">理。</text><rect x="68" y="2400" width="534" height="198" rx="12" fill="#fff" stroke="#286c68" stroke-width="2"/><text x="86" y="2436" font-size="25" fill="#286c68" font-weight="bold">M04｜核對結論</text><text x="86" y="2476" font-size="23" fill="#24343f" font-weight="normal">按本配置校正與驗證；不與所有火焰／電漿方法</text><text x="86" y="2509.35" font-size="23" fill="#24343f" font-weight="normal">作永久靈敏度排名。</text><rect x="665" y="1565" width="570" height="1110" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="689" y="1610" font-size="27" fill="#326991" font-weight="bold">ICP-MS｜辨識對照</text><text x="689" y="1657" font-size="21" fill="#24343f" font-weight="normal">Inductively coupled plasma mass spectrometry（</text><text x="689" y="1687.45" font-size="21" fill="#24343f" font-weight="normal">感應耦合電漿質譜）</text><rect x="683" y="1755" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="701" y="1791" font-size="25" fill="#326991" font-weight="bold">M01｜先定問題</text><text x="701" y="1831" font-size="23" fill="#24343f" font-weight="normal">另一類元素分析；此章只辨方法家族。</text><rect x="683" y="1970" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="701" y="2006" font-size="25" fill="#326991" font-weight="bold">M02｜準備與測量</text><text x="701" y="2046" font-size="23" fill="#24343f" font-weight="normal">同樣以 ICP 產生物種；後端擷取離子並作質譜分</text><text x="701" y="2079.35" font-size="23" fill="#24343f" font-weight="normal">離。</text><rect x="683" y="2185" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="701" y="2221" font-size="25" fill="#326991" font-weight="bold">M03｜讀訊號</text><text x="701" y="2261" font-size="23" fill="#24343f" font-weight="normal">讀離子訊號與 m/z（質荷比）；不是光學波長，</text><text x="701" y="2294.35" font-size="23" fill="#24343f" font-weight="normal">不歸入 OES。</text><rect x="683" y="2400" width="534" height="198" rx="12" fill="#fff" stroke="#326991" stroke-width="2"/><text x="701" y="2436" font-size="25" fill="#326991" font-weight="bold">M04｜核對結論</text><text x="701" y="2476" font-size="23" fill="#24343f" font-weight="normal">仍需有效校正與干擾查核；不把 OES 的全部判讀</text><text x="701" y="2509.35" font-size="23" fill="#24343f" font-weight="normal">條件照搬。</text><rect x="1280" y="1565" width="570" height="1110" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="1304" y="1610" font-size="27" fill="#b72d4a" font-weight="bold">分類層級｜哪些可互相比？</text><text x="1304" y="1657" font-size="21" fill="#24343f" font-weight="normal">目的／原理／激發源／部件分層</text><rect x="1298" y="1755" width="534" height="198" rx="12" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1316" y="1791" font-size="25" fill="#b72d4a" font-weight="bold">M01｜先定問題</text><text x="1316" y="1831" font-size="23" fill="#24343f" font-weight="normal">目的：辨元素或定量；題幹決定需要哪種結論。</text><rect x="1298" y="1970" width="534" height="198" rx="12" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1316" y="2006" font-size="25" fill="#b72d4a" font-weight="bold">M02｜準備與測量</text><text x="1316" y="2046" font-size="23" fill="#24343f" font-weight="normal">原理：吸收 AAS／放射 AES。火焰、石墨爐、</text><text x="1316" y="2079.35" font-size="23" fill="#24343f" font-weight="normal">ICP 是作用配置。</text><rect x="1298" y="2185" width="534" height="198" rx="12" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1316" y="2221" font-size="25" fill="#b72d4a" font-weight="bold">M03｜讀訊號</text><text x="1316" y="2261" font-size="23" fill="#24343f" font-weight="normal">HCL＝供光；filter／單色光器＝選線；PMT／</text><text x="1316" y="2294.35" font-size="23" fill="#24343f" font-weight="normal">CCD＝偵測。部件不是獨立方法。</text><rect x="1298" y="2400" width="534" height="198" rx="12" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1316" y="2436" font-size="25" fill="#b72d4a" font-weight="bold">M04｜核對結論</text><text x="1316" y="2476" font-size="23" fill="#24343f" font-weight="normal">傳統焰光清單不是全部 AES 白名單；Mg 屬ⅡA。</text><text x="1316" y="2509.35" font-size="23" fill="#24343f" font-weight="normal">不可跨配置排永久名次。</text><text x="50" y="2765" font-size="20" fill="#61717a" font-weight="normal">深灰實線＝分析流程／因果；紅色虛線＝條件不符才回查。回查是分析者修正流程。</text><text x="50" y="2805" font-size="20" fill="#61717a" font-weight="normal">原子光譜 v3.0｜傳統題本比較需保留語境；不同元素、配置、噪音與範圍不可省略。</text></g></svg>