<text x="50" y="64" font-size="20" font-weight="400" fill="#61717a">PHARMACEUTICAL ANALYSIS / CH22 / SFC &amp; SFE / v3.0</text>
<text x="50" y="120" font-size="38" font-weight="400" fill="#24343f">方法分類｜不同分類軸走同一個四站</text>
