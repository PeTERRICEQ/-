<svg width="1900" height="2790" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2790" style="max-width:100%;height:auto" role="img" aria-labelledby="uv3_g4_title uv3_g4_desc"><title id="uv3_g4_title">UV–Vis｜先辨光路角色，再查操作與性能</title><desc id="uv3_g4_desc">紫外光與可見光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="uv3_g4_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="uv3_g4_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="uv3_g4_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="2790" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH27  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">UV–Vis｜先辨光路角色，再查操作與性能</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">M01 先定 λ、檢品與空白；M02 建立光路；M03 量透射光；M04 查核可靠性。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">型態、波長、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><rect x="50" y="380" width="1800" height="170" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="424" font-size="27" fill="#9e771c" font-weight="bold">L14｜M01 分析 λ → 配燈、槽、溶媒 → 交 M02 有效光</text><text x="74" y="468" font-size="24" fill="#24343f" font-weight="normal">常見 UV：Deuterium（氘燈）；VIS：Tungsten-halogen（鎢鹵素燈）；Xenon（氙燈）可跨區。</text><text x="74" y="515.8" font-size="24" fill="#24343f" font-weight="normal">UV 常用石英；普通玻璃多用 VIS。溶媒在測量波段低吸收；空白不能補回消失的有效光。</text><text x="50" y="630" font-size="27" fill="#9e771c" font-weight="bold">L13｜典型掃描式：先選窄波段再過樣品</text><rect x="50" y="668" width="420" height="190" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="712" font-size="27" fill="#9e771c" font-weight="bold">光源</text><text x="74" y="756" font-size="24" fill="#24343f" font-weight="normal">供應所需波段的光。</text><path d="M 470 762 L 510 762" fill="none" stroke="#326991" stroke-width="3"/><polygon points="510,762 495,768 495,756" fill="#326991"/><rect x="510" y="668" width="420" height="190" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="534" y="712" font-size="27" fill="#9e771c" font-weight="bold">單色光器</text><text x="534" y="756" font-size="24" fill="#24343f" font-weight="normal">選 λ；狹縫決定帶寬。</text><path d="M 930 762 L 970 762" fill="none" stroke="#326991" stroke-width="3"/><polygon points="970,762 955,768 955,756" fill="#326991"/><rect x="970" y="668" width="420" height="190" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="994" y="712" font-size="27" fill="#9e771c" font-weight="bold">檢品／匹配空白</text><text x="994" y="756" font-size="24" fill="#24343f" font-weight="normal">在可比光徑下量透射。</text><path d="M 1390 762 L 1430 762" fill="none" stroke="#326991" stroke-width="3"/><polygon points="1430,762 1415,768 1415,756" fill="#326991"/><rect x="1430" y="668" width="420" height="190" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="1454" y="712" font-size="27" fill="#9e771c" font-weight="bold">光偵測器</text><text x="1454" y="756" font-size="24" fill="#24343f" font-weight="normal">光轉訊號 → I、I₀ → A。</text><text x="50" y="950" font-size="27" fill="#326991" font-weight="bold">L13／L15｜典型 DAD：先過樣品，再分到多個偵測位置</text><rect x="50" y="988" width="420" height="190" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="74" y="1032" font-size="27" fill="#326991" font-weight="bold">寬頻光源</text><text x="74" y="1076" font-size="24" fill="#24343f" font-weight="normal">多波長同時過樣品。</text><path d="M 470 1082 L 510 1082" fill="none" stroke="#326991" stroke-width="3"/><polygon points="510,1082 495,1088 495,1076" fill="#326991"/><rect x="510" y="988" width="420" height="190" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="534" y="1032" font-size="27" fill="#326991" font-weight="bold">樣品／流通池</text><text x="534" y="1076" font-size="24" fill="#24343f" font-weight="normal">HPLC 已先分離成分。</text><path d="M 930 1082 L 970 1082" fill="none" stroke="#326991" stroke-width="3"/><polygon points="970,1082 955,1088 955,1076" fill="#326991"/><rect x="970" y="988" width="420" height="190" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="994" y="1032" font-size="27" fill="#326991" font-weight="bold">分光系統</text><text x="994" y="1076" font-size="24" fill="#24343f" font-weight="normal">把 λ 分到不同位置。</text><path d="M 1390 1082 L 1430 1082" fill="none" stroke="#326991" stroke-width="3"/><polygon points="1430,1082 1415,1088 1415,1076" fill="#326991"/><rect x="1430" y="988" width="420" height="190" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="1454" y="1032" font-size="27" fill="#326991" font-weight="bold">二極體陣列</text><text x="1454" y="1076" font-size="24" fill="#24343f" font-weight="normal">多波長 A(λ,t) → M04。</text><rect x="50" y="1280" width="870" height="300" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="74" y="1324" font-size="27" fill="#685185" font-weight="bold">模式辨識｜單光束</text><text x="74" y="1368" font-size="24" fill="#24343f" font-weight="normal">空白和檢品依序量：先參考 I₀，再檢品 I。</text><text x="74" y="1415.8" font-size="24" fill="#24343f" font-weight="normal">同一光路，不把空白與檢品串成兩段吸收。</text><text x="74" y="1463.6" font-size="24" fill="#24343f" font-weight="normal">要控制時間差中的光源漂移。</text><rect x="950" y="1280" width="900" height="300" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="974" y="1324" font-size="27" fill="#b72d4a" font-weight="bold">模式辨識｜雙光束</text><text x="974" y="1368" font-size="24" fill="#24343f" font-weight="normal">光分成檢品與參考兩路，再比較訊號。</text><text x="974" y="1415.8" font-size="24" fill="#24343f" font-weight="normal">兩槽是並列支路；參考用來補償光源變動。</text><text x="974" y="1463.6" font-size="24" fill="#24343f" font-weight="normal">不能保證未知檢品干擾全部消失。</text><rect x="50" y="1660" width="880" height="285" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="1704" font-size="27" fill="#9e771c" font-weight="bold">L16｜波長準確度</text><text x="74" y="1748" font-size="24" fill="#24343f" font-weight="normal">汞弧燈／題本 5% holmium perchlorate</text><text x="74" y="1795.8" font-size="24" fill="#24343f" font-weight="normal">峰位置不符 → 修正 λ → M02，再量 M03。</text><rect x="970" y="1660" width="880" height="285" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="994" y="1704" font-size="27" fill="#286c68" font-weight="bold">L16｜吸光度準確度</text><text x="994" y="1748" font-size="24" fill="#24343f" font-weight="normal">題本 0.006% w/v potassium dichromate</text><text x="994" y="1795.8" font-size="24" fill="#24343f" font-weight="normal">指定 λ 的 A 不符 → 查光度響應 → M02／M03。</text><rect x="50" y="1990" width="880" height="285" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="74" y="2034" font-size="27" fill="#356844" font-weight="bold">L16｜光譜解析度</text><text x="74" y="2078" font-size="24" fill="#24343f" font-weight="normal">題本 0.02% toluene in hexane</text><text x="74" y="2125.8" font-size="24" fill="#24343f" font-weight="normal">看窄帶峰谷／帶寬；不符 → 查狹縫／帶寬 → M02。</text><rect x="970" y="1990" width="880" height="285" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="994" y="2034" font-size="27" fill="#b72d4a" font-weight="bold">L16｜雜散光</text><text x="994" y="2078" font-size="24" fill="#24343f" font-weight="normal">題本 1.2% KCl</text><text x="994" y="2125.8" font-size="24" fill="#24343f" font-weight="normal">截止區仍有光 → 查漏光 → M02／M03，再測高 A 檢品。</text><rect x="50" y="2350" width="1800" height="290" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="74" y="2394" font-size="27" fill="#b72d4a" font-weight="bold">L20｜操作錯誤 → 回到真正需要修的站</text><text x="74" y="2438" font-size="24" fill="#24343f" font-weight="normal">容槽面向不一致、顆粒或空白不合 → M01；去顆粒後確認回收，不吸附目標物。</text><text x="74" y="2485.8" font-size="24" fill="#24343f" font-weight="normal">pH／反應時間不合 → M02；讀數單位或微分設定不合 → M03。</text><text x="74" y="2533.6" font-size="24" fill="#24343f" font-weight="normal">題本濃度、±1 nm 是題本配對；實作用所選方法的標準、波長與允收值。</text><text x="50" y="2705" font-size="20" fill="#61717a" font-weight="normal">深灰實線＝分析流程／因果；紅色虛線＝條件不符才回查。回查是分析者修正流程。</text><text x="50" y="2745" font-size="20" fill="#61717a" font-weight="normal">藍色箭頭＝量測光的方向（示意）；深灰＝資料／流程。分光元件與偵測器分開。</text></g></svg>