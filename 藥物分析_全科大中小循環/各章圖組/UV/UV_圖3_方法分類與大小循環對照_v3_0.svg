<svg width="1900" height="2840" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2840" style="max-width:100%;height:auto" role="img" aria-labelledby="uv3_g3_title uv3_g3_desc"><title id="uv3_g3_title">UV–Vis｜六種方法沿同一四站比較</title><desc id="uv3_g3_desc">紫外光與可見光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="uv3_g3_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="uv3_g3_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="uv3_g3_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="2840" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH27  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">UV–Vis｜六種方法沿同一四站比較</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">分類名稱用群組呈現；真正的操作與資料沿箭頭前進。燈與容槽是部件，DAD 是偵測配置。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">型態、波長、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><rect x="50" y="390" width="580" height="955" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="74" y="437" font-size="27" fill="#685185" font-weight="bold">直接吸收定量</text><rect x="74" y="477" width="532" height="155" rx="16" fill="#fff" stroke="#685185" stroke-width="2"/><text x="95" y="514" font-size="24" fill="#685185" font-weight="bold">M01｜先定問題</text><text x="95" y="556" font-size="24" fill="#24343f" font-weight="normal">可比檢品、空白、標準</text><path d="M 340 632 L 340 661" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="340,661 334,646 346,646" fill="#61717a"/><rect x="74" y="661" width="532" height="155" rx="16" fill="#fff" stroke="#685185" stroke-width="2"/><text x="95" y="698" font-size="24" fill="#685185" font-weight="bold">M02｜準備與測量</text><text x="95" y="740" font-size="24" fill="#24343f" font-weight="normal">固定物種、λ、b；分子吸收</text><path d="M 340 816 L 340 845" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="340,845 334,830 346,830" fill="#61717a"/><rect x="74" y="845" width="532" height="155" rx="16" fill="#fff" stroke="#685185" stroke-width="2"/><text x="95" y="882" font-size="24" fill="#685185" font-weight="bold">M03｜讀訊號</text><text x="95" y="924" font-size="24" fill="#24343f" font-weight="normal">T → A；指定波長讀值</text><path d="M 340 1000 L 340 1029" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="340,1029 334,1014 346,1014" fill="#61717a"/><rect x="74" y="1029" width="532" height="155" rx="16" fill="#fff" stroke="#685185" stroke-width="2"/><text x="95" y="1066" font-size="24" fill="#685185" font-weight="bold">M04｜核對結論</text><text x="95" y="1108" font-size="24" fill="#24343f" font-weight="normal">校正／係數 → 濃度；補稀釋</text><text x="74" y="1243" font-size="23" fill="#685185" font-weight="normal">掛載：L01、L02、L03、L04</text><text x="74" y="1287" font-size="23" fill="#24343f" font-weight="normal">線性與選擇性；有截距先扣。</text><rect x="660" y="390" width="580" height="955" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="684" y="437" font-size="27" fill="#326991" font-weight="bold">酸鹼光譜求 pKa</text><rect x="684" y="477" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="514" font-size="24" fill="#326991" font-weight="bold">M01｜先定問題</text><text x="705" y="556" font-size="24" fill="#24343f" font-weight="normal">同總濃度酸／鹼型與緩衝液</text><path d="M 950 632 L 950 661" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,661 944,646 956,646" fill="#61717a"/><rect x="684" y="661" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="698" font-size="24" fill="#326991" font-weight="bold">M02｜準備與測量</text><text x="705" y="740" font-size="24" fill="#24343f" font-weight="normal">二態平衡；溫度、介質可比</text><path d="M 950 816 L 950 845" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,845 944,830 956,830" fill="#61717a"/><rect x="684" y="845" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="882" font-size="24" fill="#326991" font-weight="bold">M03｜讀訊號</text><text x="705" y="924" font-size="24" fill="#24343f" font-weight="normal">AH、AB、A；同 λ、b</text><path d="M 950 1000 L 950 1029" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1029 944,1014 956,1014" fill="#61717a"/><rect x="684" y="1029" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="1066" font-size="24" fill="#326991" font-weight="bold">M04｜核對結論</text><text x="705" y="1108" font-size="24" fill="#24343f" font-weight="normal">分率 → 型態比 → pKa</text><text x="684" y="1243" font-size="23" fill="#326991" font-weight="normal">掛載：L11、L12</text><text x="684" y="1287" font-size="23" fill="#24343f" font-weight="normal">依型態命名；避等吸收點與降解。</text><rect x="1270" y="390" width="580" height="955" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1294" y="437" font-size="27" fill="#356844" font-weight="bold">選擇性反應／錯合</text><rect x="1294" y="477" width="532" height="155" rx="16" fill="#fff" stroke="#356844" stroke-width="2"/><text x="1315" y="514" font-size="24" fill="#356844" font-weight="bold">M01｜先定問題</text><text x="1315" y="556" font-size="24" fill="#24343f" font-weight="normal">分析物、試劑與反應空白</text><path d="M 1560 632 L 1560 661" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1560,661 1554,646 1566,646" fill="#61717a"/><rect x="1294" y="661" width="532" height="155" rx="16" fill="#fff" stroke="#356844" stroke-width="2"/><text x="1315" y="698" font-size="24" fill="#356844" font-weight="bold">M02｜準備與測量</text><text x="1315" y="740" font-size="24" fill="#24343f" font-weight="normal">控制產率、介質、反應時間</text><path d="M 1560 816 L 1560 845" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1560,845 1554,830 1566,830" fill="#61717a"/><rect x="1294" y="845" width="532" height="155" rx="16" fill="#fff" stroke="#356844" stroke-width="2"/><text x="1315" y="882" font-size="24" fill="#356844" font-weight="bold">M03｜讀訊號</text><text x="1315" y="924" font-size="24" fill="#24343f" font-weight="normal">產物吸收；題本 Fe²⁺／540 nm</text><path d="M 1560 1000 L 1560 1029" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1560,1029 1554,1014 1566,1014" fill="#61717a"/><rect x="1294" y="1029" width="532" height="155" rx="16" fill="#fff" stroke="#356844" stroke-width="2"/><text x="1315" y="1066" font-size="24" fill="#356844" font-weight="bold">M04｜核對結論</text><text x="1315" y="1108" font-size="24" fill="#24343f" font-weight="normal">以產物校正回算原檢品</text><text x="1294" y="1243" font-size="23" fill="#356844" font-weight="normal">掛載：L19</text><text x="1294" y="1287" font-size="23" fill="#24343f" font-weight="normal">試劑配對須記；產物穩定可比。</text><rect x="50" y="1385" width="580" height="955" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="74" y="1432" font-size="27" fill="#326991" font-weight="bold">差異光譜</text><rect x="74" y="1472" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="95" y="1509" font-size="24" fill="#326991" font-weight="bold">M01｜先定問題</text><text x="95" y="1551" font-size="24" fill="#24343f" font-weight="normal">同量檢品分兩條件</text><path d="M 340 1627 L 340 1656" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="340,1656 334,1641 346,1641" fill="#61717a"/><rect x="74" y="1656" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="95" y="1693" font-size="24" fill="#326991" font-weight="bold">M02｜準備與測量</text><text x="95" y="1735" font-size="24" fill="#24343f" font-weight="normal">目標改變，干擾盡量不變</text><path d="M 340 1811 L 340 1840" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="340,1840 334,1825 346,1825" fill="#61717a"/><rect x="74" y="1840" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="95" y="1877" font-size="24" fill="#326991" font-weight="bold">M03｜讀訊號</text><text x="95" y="1919" font-size="24" fill="#24343f" font-weight="normal">ΔA＝A₁−A₂；無單位</text><path d="M 340 1995 L 340 2024" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="340,2024 334,2009 346,2009" fill="#61717a"/><rect x="74" y="2024" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="95" y="2061" font-size="24" fill="#326991" font-weight="bold">M04｜核對結論</text><text x="95" y="2103" font-size="24" fill="#24343f" font-weight="normal">差值校正 → 目標含量</text><text x="74" y="2238" font-size="23" fill="#326991" font-weight="normal">掛載：L17</text><text x="74" y="2282" font-size="23" fill="#24343f" font-weight="normal">兩份干擾須可比；ΔA 可負。</text><rect x="660" y="1385" width="580" height="955" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="684" y="1432" font-size="27" fill="#326991" font-weight="bold">微分光譜</text><rect x="684" y="1472" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="1509" font-size="24" fill="#326991" font-weight="bold">M01｜先定問題</text><text x="705" y="1551" font-size="24" fill="#24343f" font-weight="normal">可用原譜與處理設定</text><path d="M 950 1627 L 950 1656" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1656 944,1641 956,1641" fill="#61717a"/><rect x="684" y="1656" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="1693" font-size="24" fill="#326991" font-weight="bold">M02｜準備與測量</text><text x="705" y="1735" font-size="24" fill="#24343f" font-weight="normal">先量 A 隨 λ 變化</text><path d="M 950 1811 L 950 1840" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,1840 944,1825 956,1825" fill="#61717a"/><rect x="684" y="1840" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="1877" font-size="24" fill="#326991" font-weight="bold">M03｜讀訊號</text><text x="705" y="1919" font-size="24" fill="#24343f" font-weight="normal">沿 λ 求導數；指定階數</text><path d="M 950 1995 L 950 2024" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="950,2024 944,2009 956,2009" fill="#61717a"/><rect x="684" y="2024" width="532" height="155" rx="16" fill="#fff" stroke="#326991" stroke-width="2"/><text x="705" y="2061" font-size="24" fill="#326991" font-weight="bold">M04｜核對結論</text><text x="705" y="2103" font-size="24" fill="#24343f" font-weight="normal">看峰形／零點；兼顧噪音</text><text x="684" y="2238" font-size="23" fill="#326991" font-weight="normal">掛載：L18</text><text x="684" y="2282" font-size="23" fill="#24343f" font-weight="normal">不改分子；高階口訣限指定峰形。</text><rect x="1270" y="1385" width="580" height="955" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="1294" y="1432" font-size="27" fill="#b72d4a" font-weight="bold">HPLC-DAD</text><rect x="1294" y="1472" width="532" height="155" rx="16" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1315" y="1509" font-size="24" fill="#b72d4a" font-weight="bold">M01｜先定問題</text><text x="1315" y="1551" font-size="24" fill="#24343f" font-weight="normal">適合層析的檢品前處理</text><path d="M 1560 1627 L 1560 1656" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1560,1656 1554,1641 1566,1641" fill="#61717a"/><rect x="1294" y="1656" width="532" height="155" rx="16" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1315" y="1693" font-size="24" fill="#b72d4a" font-weight="bold">M02｜準備與測量</text><text x="1315" y="1735" font-size="24" fill="#24343f" font-weight="normal">HPLC 分離，再以流通池吸收</text><path d="M 1560 1811 L 1560 1840" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1560,1840 1554,1825 1566,1825" fill="#61717a"/><rect x="1294" y="1840" width="532" height="155" rx="16" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1315" y="1877" font-size="24" fill="#b72d4a" font-weight="bold">M03｜讀訊號</text><text x="1315" y="1919" font-size="24" fill="#24343f" font-weight="normal">多波長 A(λ,t)</text><path d="M 1560 1995 L 1560 2024" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1560,2024 1554,2009 1566,2009" fill="#61717a"/><rect x="1294" y="2024" width="532" height="155" rx="16" fill="#fff" stroke="#b72d4a" stroke-width="2"/><text x="1315" y="2061" font-size="24" fill="#b72d4a" font-weight="bold">M04｜核對結論</text><text x="1315" y="2103" font-size="24" fill="#24343f" font-weight="normal">各峰定量、光譜比對與純度查核</text><text x="1294" y="2238" font-size="23" fill="#b72d4a" font-weight="normal">掛載：L13、L15</text><text x="1294" y="2282" font-size="23" fill="#24343f" font-weight="normal">DAD 不分離；峰純度不等於絕對純。</text><rect x="50" y="2440" width="870" height="230" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="2484" font-size="27" fill="#9e771c" font-weight="bold">三種反查入口</text><text x="74" y="2528" font-size="24" fill="#24343f" font-weight="normal">方法 → 上方 P1–P4／四站。</text><text x="74" y="2575.8" font-size="24" fill="#24343f" font-weight="normal">部件與操作 → 圖 4：先定角色。</text><text x="74" y="2623.6" font-size="24" fill="#24343f" font-weight="normal">題幹與讀數 → 圖 5：先問哪個量。</text><rect x="950" y="2440" width="900" height="230" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="974" y="2484" font-size="27" fill="#356844" font-weight="bold">保留結構分類｜L06／L08／L11</text><text x="974" y="2528" font-size="24" fill="#24343f" font-weight="normal">alkanes；benzene／conjugated dienes；carbonyl。</text><text x="974" y="2575.8" font-size="24" fill="#24343f" font-weight="normal">phenol／aniline；esters（水解）；catechol（錯合）。</text><text x="974" y="2623.6" font-size="24" fill="#24343f" font-weight="normal">分類不代表因果；作用條件與讀數才決定答案。</text><text x="50" y="2755" font-size="20" fill="#61717a" font-weight="normal">深灰實線＝分析流程／因果；紅色虛線＝條件不符才回查。回查是分析者修正流程。</text><text x="50" y="2795" font-size="20" fill="#61717a" font-weight="normal">UV–Vis v3.0｜與雙檔同源；所有 L 在圖 2 有主要位置。示意不按比例。</text></g></svg>