","L":["L04","L13","L14","L15"],"p":["極","荷","元"],"s":["樣","選"],"l":["酸鹼線","分配線"],"te":[4,8,19]},{"id":"113-2-31","ch":"萃取","title":"陽離子交換","stem":"利用陽離子交換樹脂對含0.1 M 氯化銨緩衝液之adrenaline 進行固相萃取時，下列敘述 何者錯誤？\n\n(A) 萃取管須先以含Ca2+、Mg2+或 NH⁺離子之緩衝溶液進行平衡\n\n(B) 檢品溶液須以比其pKa 低1 到2 個單位pH 值的緩衝液配製\n\n(C) 萃取管於通過所有檢品溶液後須再以相同緩衝溶液沖洗\n\n(D) 可使用1 M 氯化銨緩衝液沖提出吸附於萃取管內之adrenaline\n\n轉錄說明：A的NH⁺按題本缺字保留，銨離子常規式為NH₄⁺。","ans":"A","L":["L04","L13","L14","L15"],"p":["極","荷","元"],"s":["樣","選"],"l":["酸鹼線","分配線"],"te":[4,8,19]},{"id":"113-2-38","ch":"萃取","title":"逆相三液設計","stem":"用逆相固相萃取管柱進行chlorpromazine 懸劑的樣品前處理，下列填充溶液 （loading solution）、洗液（washing solution）、沖提液（eluting solution）之 配對，何者可得較高的回收率與較少的雜質？\n\n(A) 稀磷酸溶液－稀氨水－稀磷酸之甲醇溶液\n\n(B) 稀磷酸溶液－稀磷酸溶液－稀氨水之甲醇溶液\n\n(C) 稀氨水－稀磷酸溶液－稀氨水之甲醇溶液\n\n(D) 稀氨水－稀氨水－稀磷酸之甲醇溶液","ans":"D","L":["L09","L10","L11","L12"],"p":["極"],"s":["樣","選","算"],"l":["分配線"],"te":[1,8,13,26]},{"id":"113-1-32","ch":"萃取","title":"LLE與SPE比較","stem":"關於液／液相萃取法之敘述，下列何者錯誤？\n\n(A) 利用分配（partition）原理\n\n(B) 所用的溶劑體積一般比固相萃取法少\n\n(C) 所用的溶劑須不互溶\n\n(D) 可能會有乳化（emulsion）現象","ans":"B","L":["L02","L07","L27"],"p":["極"],"s":["樣"],"l":["分配線"],"te":[3,8]},{"id":"113-1-37","ch":"萃取","title":"陽離子管平衡","stem":"以陽離子交換樹脂萃取管進行樣品前處理時，下列何種水溶液最適合做為注入樣品前的 沖洗液？\n\n(A) NaCl\n\n(B) CaCl2\n\n(C) MgBr2\n\n(D) CuSO4","ans":"A","L":["L12","L14"],"p":["極","荷","元"],"s":["樣"],"l":["分配線"],"te":[8,12,19,20]},{"id":"113-1-40","ch":"萃取","title":"LLE製劑取層","stem":"舊代表題入口。\n\n以HPLC 分析hydrocortisone acetate cream，為減少高脂溶性賦形劑對層析管柱的傷 害，並考量回收率與干擾物，下列前處理之萃取流程何者最適當？\n\n(A) 以稀硫酸萃取\n\n(B) 以稀氨水萃取\n\n(C) 以甲醇／己烷分配，取甲醇層\n\n(D) 以甲醇／己烷分配，取己烷層","ans":"C","L":["L01","L05"],"p":["極"],"s":["樣","選","算"],"l":["分配線","空白線"],"te":[1,8,13,14,26]},{"id":"112-2-10","ch":"萃取","title":"強吸附與題答界線","stem":"舊代表題入口。\n\n下列何者最適合降低固相萃取時的不可逆吸附？\n\n(A) 以水沖提\n\n(B) 內標準品之添加\n\n(C) 萃取管長度增加\n\n(D) 進行系列沖提","ans":"D","L":["L10","L26","L27"],"p":["極"],"s":["樣","選","算"],"l":["分配線","標準曲線線"],"te":[8,26]},{"id":"112-2-37","ch":"萃取","title":"SPE一般優點","stem":"相較於液相－液相分配萃取法，下列何者非固相萃取法之優點？\n\n(A) 較易多批次同時進行\n\n(B) 無乳化現象\n\n(C) 使用溶劑量較少\n\n(D) 適用於微量檢品","ans":"","L":["L08","L27"],"p":["極"],"s":["樣"],"l":["分配線"],"te":[3,8]},{"id":"111-2-26","ch":"萃取","title":"SPME模式","stem":"使用固相微萃取法（solid-phase microextraction, SPME）萃取尿液中的ketamine， 再用GC-MS 進行定量，下列 敘述何者錯誤？\n\n(A) SPME 的設計只適用於頂空萃取\n\n(B) 可以加入衍生化步驟增加ketamine 的揮發性\n\n(C) polydimethylsiloxane 為常用的親脂性SPME 吸附材質\n\n(D) SPME 通常搭配熱脫附法進樣於GC-MS","ans":"A","L":["L20","L23"],"p":["極","揮","反"],"s":["樣","算"],"l":["分配線","保留線"],"te":[8,10,16,20]},{"id":"111-2-32","ch":"萃取","title":"活體連續取樣","stem":"舊代表題入口。\n\n於連續監測活體動物腦中dopamine 濃度時，結合下列何種技術最適合？\n\n(A) 超臨界流體萃取\n\n(B) 微透析\n\n(C) 固相萃取\n\n(D) 液相－液相分配","ans":"B","L":["L01","L22"],"p":["極"],"s":["樣","算"],"l":["分配線"],"te":[7,8,23]},{"id":"111-2-39","ch":"萃取","title":"矽膠材料","stem":"下列關於固相萃取（solid-phase extraction, SPE）之敘述，何者錯誤？\n\n(A) 不會有乳化現象發生\n\n(B) 以矽膠為基質的SPE 管柱，對鹼安定\n\n(C) 吸附劑有多種選擇，對分析物的特定官能基具有選擇性留滯\n\n(D) 對大量溶液的微量分析物有濃縮功能","ans":"B","L":["L08","L12","L25"],"p":["骨","極"],"s":["樣","選"],"l":["分配線","空白線"],"te":[1,8]},{"id":"111-1-33","ch":"萃取","title":"SPE／LLE比較","stem":"舊代表題入口。\n\n下列關於固相萃取與液相／液相萃取之比較，何者正確？\n\n(A) 固相萃取較易形成乳化現象\n\n(B) 固相萃取樣品回收率較高\n\n(C) 液相／液相萃取所需使用的溶劑量較大\n\n(D) 液相／液相萃取可選擇的溶劑種類較多","ans":"C","L":["L02","L08","L27"],"p":["極"],"s":["樣","算"],"l":["分配線"],"te":[3,8,26]},{"id":"111-1-34","ch":"萃取","title":"特殊方法與SFE改質","stem":"關於各項萃取法或樣品前處理之敘述，下列何者錯誤？\n\n(A) 皮質類固醇乳膏可用己烷－甲醇進行分配萃取\n\n(B) 生物液體之HPLC 分析可先利用微透析方法去除蛋白質干擾\n\n(C) 固相萃取法不會產生乳化現象\n\n(D) 進行二氧化碳超臨界流體萃取時，常藉由加入己烷以調整溶劑強度","ans":"D","L":["L05","L21","L22"],"p":["量","極"],"s":["樣"],"l":["分配線","空白線"],"te":[3,8,13,14,23]},{"id":"110-2-10","ch":"萃取","title":"SPE缺點","stem":"下列何者是固相萃取之缺點？\n\n(A) 溶劑需求量大\n\n(B) 易出現乳化現象\n\n(C) 可能產生不可逆吸附\n\n(D) 可濃縮檢品","ans":"C","L":["L10","L26","L27"],"p":["極"],"s":["樣","算"],"l":["分配線"],"te":[3,8]},{"id":"110-1-30","ch":"萃取","title":"四步順序","stem":"舊代表題入口。\n\n關於固相萃取的操作程序，下列何者正確？①conditioning ②washing ③eluting ④ sample loading\n\n(A) ②①④③\n\n(B) ④①②③\n\n(C) ①④②③\n\n(D) ④③②①","ans":"C","L":["L09"],"p":["極"],"s":["樣","選"],"l":["分配線"],"te":[8]},{"id":"109-1-32","ch":"萃取","title":"LLE成相","stem":"有關液相／液相萃取法之敘述，下列何者錯誤？\n\n(A) 利用分配（partitioning）原理\n\n(B) 所用的溶劑體積一般比固相萃取法多\n\n(C) 所用的溶劑需能互溶（miscible）\n\n(D) 可能會有乳化（emulsion）現象","ans":"C","L":["L02","L07"],"p":["極"],"s":["樣"],"l":["分配線"],"te":[3,8]},{"id":"109-1-35","ch":"萃取","title":"交換管選擇","stem":"某高極性鹼性小分子藥物溶於酸性溶液中，下列何種固相萃取裝置可提供最高的回收 率？\n\n(A) 陰離子交換萃取管（anion exchange cartridge）\n\n(B) 陽離子交換萃取管（cation exchange cartridge）\n\n(C) 正相萃取管（normal phase cartridge）\n\n(D) 免疫親合萃取管（immunoaffinity cartridge）","ans":"B","L":["L13","L16","L18"],"p":["量","極","荷"],"s":["樣","算"],"l":["酸鹼線","分配線"],"te":[1,8,19,26]},{"id":"109-1-36","ch":"萃取","title":"矽膠與SPE適用性","stem":"關於固相萃取法的敘述，下列何者正確？\n\n(A) 比溶劑萃取法之回收率低\n\n(B) 萃取極性大的物質時只能用silica gel 固相\n\n(C) silica gel 固相在強鹼下不安定\n\n(D) 離子性化合物無法適用","ans":"C","L":["L08","L12","L13","L16"],"p":["極"],"s":["樣","算"],"l":["分配線"],"te":[1,3,8,26]},{"id":"108-2-40","ch":"萃取","title":"有機酸LLE與鹽析","stem":"以有機溶劑萃取水溶液中的有機酸化合物時，下列敘述何者正確？\n\n(A) 水溶液的pH 值須調整至高於此有機酸的pKa 值\n\n(B) 若抽提效率不佳時，可加入適量鹼並少量多次萃取\n\n(C) 於水中加入氯化鈉至飽和濃度，可提高萃取率\n\n(D) 四氫呋喃為適當的有機溶劑","ans":"C","L":["L02","L04","L07","L24"],"p":["極","荷","元"],"s":["樣","算"],"l":["酸鹼線","分配線","標準曲線線"],"te":[3,4,7,8,12]},{"id":"108-1-31","ch":"萃取","title":"四步定義","stem":"固相萃取法的一般操作程序包括conditioning、sample loading、washing、eluting， 下列敘述何者錯誤？\n\n(A) conditioning 為除去樣品雜質及調穩分析環境\n\n(B) sample loading 為將樣品用適當溶劑溶解，並注入管柱\n\n(C) washing 為去除干擾物\n\n(D) eluting 為用適量體積的沖提液將待測物分離","ans":"A","L":["L09","L10"],"p":["極"],"s":["樣","選"],"l":["分配線","空白線","保留線"],"te":[1,3,8,14,20]},{"id":"108-1-37","ch":"萃取","title":"弱酸pH方向","stem":"舊代表題入口。\n\n將水溶液中的弱酸性物質以有機溶劑充分萃取時，應調整水溶液的酸鹼值（pH），該 pH 值與此酸性物質之 pKa 關係為何？\n\n(A) ＝pKa－2\n\n(B) ＝pKa＋2\n\n(C) ＝pKa＋1\n\n(D) ＝pKa","ans":"A","L":["L04","L24"],"p":["極","荷"],"s":["樣","算"],"l":["酸鹼線","分配線"],"te":[3,4,8,12]},{"id":"107-2-33","ch":"萃取","title":"SPE範圍","stem":"有關固相萃取法適用性之敘述，下列何者錯誤？\n\n(A) 適用於微量分析物之濃縮\n\n(B) 只適用於檢品不易經由液相／液相分配萃取者\n\n(C) 某些吸附劑對分析物特定基團具選擇性\n\n(D) 某些吸附劑藉由沖提液之改變，能進行數種待測物之系列性萃取","ans":"B","L":["L08","L10","L27"],"p":["極"],"s":["樣","選"],"l":["分配線"],"te":[8]},{"id":"105-2-36","ch":"萃取","title":"交換器與沖提液配對","stem":"舊代表題入口。\n\n某一小分子藥物極性高且呈鹼性，溶於酸性溶液中時，下列何種固相萃取－沖提液配對 可提供最高的回收率？\n\n(A) anion exchanger－0.2% formic acid\n\n(B) cation exchanger－acetonitrile\n\n(C) cation exchanger－1 M ammonium chloride\n\n(D) anion exchanger－methanol","ans":"C","L":["L13","L15"],"p":["量","極","荷"],"s":["樣","選","算"],"l":["酸鹼線","分配線"],"te":[8,13,19,26]},{"id":"105-2-38","ch":"萃取","title":"SPE定義","stem":"檢體前處理法中，將靜相充填至小管柱，而選擇性的將檢體中成分萃取的方法，稱為下 列何者？\n\n(A) 超臨界萃取\n\n(B) 溶劑萃取\n\n(C) 固相萃取\n\n(D) 過濾分離","ans":"C","L":["L01","L08"],"p":["極"],"s":["樣","選"],"l":["分配線"],"te":[1,3,8,23]},{"id":"104-2-33","ch":"萃取","title":"逆相弱鹼pH","stem":"舊代表題入口。\n\n下列何種清洗液（washing solution）及沖提液的pH 設計，可提高逆相固相萃取管柱 （reverse-phase solid-phase extraction cartridge）對於propranolol（pKa=9.5）的選 擇性？\n\n(A) 清洗液pH 10.0；沖提液pH 10.0\n\n(B) 清洗液pH 10.0；沖提液pH 2.0\n\n(C) 清洗液pH 2.0；沖提液pH 2.0\n\n(D) 清洗液pH 2.0；沖提液pH 10.0","ans":"B","L":["L04","L11","L12"],"p":["極","荷"],"s":["樣","選"],"l":["酸鹼線","分配線"],"te":[1,4,8]},{"id":"104-1-39","ch":"萃取","title":"矽膠材料重複題","stem":"下列關於固相萃取（solid-phase extraction, SPE）之敘述，何者錯誤？\n\n(A) 不會有乳化現象發生\n\n(B) 以矽膠為基質的SPE 管柱，對鹼安定\n\n(C) 吸附劑有多種選擇，對分析物的特定官能基具有選擇性留滯\n\n(D) 對大量溶液的微量分析物有濃縮功能","ans":"B","L":["L08","L12","L25"],"p":["骨","極"],"s":["樣","選"],"l":["分配線","空白線"],"te":[1,8]},{"id":"103-2-33","ch":"萃取","title":"中性固醇SPE","stem":"進行hydrocortisone 錠劑分析，欲避免極性賦形劑之干擾，下列何種型態之固相萃取管 柱 （solid-phase extraction cartridge）最適合用來萃取hydrocortisone？\n\n(A) 逆相\n\n(B) 陽離子交換\n\n(C) 陰離子交換\n\n(D) 正相","ans":"A","L":["L03","L11"],"p":["極","荷"],"s":["樣"],"l":["分配線","空白線"],"te":[1,8,14,19]},{"id":"103-2-36","ch":"萃取","title":"強鹼與基材","stem":"在以矽膠為基材的固相抽提（solid-phase extraction）中，下列何者不適合做為抽提溶 液？\n\n(A) 1 M HOAc\n\n(B) 1 M NaCl\n\n(C) 1 M NH4Cl\n\n(D) 1 M NaOH","ans":"D","L":["L12"],"p":["極","元"],"s":[],"l":[],"te":[1,8]},{"id":"103-1-33","ch":"萃取","title":"二醇親和配對","stem":"以層析法進行糖化血色素（HbA1c）分析測定時，選用何種固定相較適宜？\n\n(A) ODS\n\n(B) Borate gel\n\n(C) Silica gel\n\n(D) Alumina","ans":"B","L":["L17"],"p":["極"],"s":["選"],"l":["分配線"],"te":[1,4]},{"id":"102-2-30","ch":"萃取","title":"逆相弱酸pH","stem":"下列何種清洗液（washing solution）及沖提液的pH 設計，可提高逆相固相萃取管柱 （reverse- phase solid-phase extraction cartridge）對於aspirin 的選擇性？\n\n(A) 清洗液pH 9.5；沖提液pH 9.5\n\n(B) 清洗液pH 9.5；沖提液pH 2.0\n\n(C) 清洗液pH 2.0；沖提液pH 2.0\n\n(D) 清洗液pH 2.0；沖提液pH 9.5","ans":"D","L":["L04","L11","L12"],"p":["極","荷"],"s":["樣","選"],"l":["酸鹼線","分配線"],"te":[1,8]},{"id":"102-1-37","ch":"萃取","title":"逆相沖提與舊用語","stem":"固相萃取之材質為親脂性矽膠時，下列敘述何者錯誤？\n\n(A) 係經由凡德瓦爾力（Van der Waals force）來留滯極性小的化合物\n\n(B) 如具有未完全遮蔽的矽醇基會使胺類成分不易被沖提\n\n(C) 在萃取最後階段是以沖提力強的高極性溶媒來沖提\n\n(D) 其檢品裝載容積遠比styrene divinylbenzene 樹脂為小","ans":"C","L":["L01","L02","L03","L04","L05","L07","L08","L09","L10","L11","L12","L13","L14","L15","L17","L18","L20","L21","L22","L23","L24","L25","L26","L27"],"p":["極"],"s":["樣","選"],"l":["分配線"],"te":[1,3,8]},{"id":"114-1-16","ch":"Raman","title":"114-1-16：Raman與IR比較","stem":"下列關於拉曼光譜法(Raman spectroscopy)與紅外光光譜法(Infrared spectrophotometry)之比較，何者錯誤？\n\n- (A) 紅外光光譜為吸收光光譜，拉曼光譜為放射光光譜\n- (B) 紅外光光譜法較適用於不對稱分子鍵，拉曼光譜法較適用於對稱分子鍵\n- (C) 紅外光光譜以cm⁻¹ 表示，拉曼光譜以nm 表示\n- (D) 兩者皆可應用於測定待測物之官能基","ans":"C","L":["L1","L3","L4"],"p":["骨"],"s":[],"l":["解析度線"],"te":[0]},{"id":"113-1-18","ch":"Raman","title":"113-1-18：散射強弱／FT定量／晶型","stem":"有關拉曼光譜的敘述，下列何者錯誤？\n\n- (A) 各種散射效應的強弱順序為：Rayleigh＞Raman＞Tyndall\n- (B) 一般在中紅外光區吸收較弱的官能基，會有較強的拉曼吸收\n- (C) FT-Raman 技術可應用於藥品之定量分析\n- (D) Raman 技術可應用於固體藥品中多形體的檢測","ans":"A","L":["L3","L5","L9"],"p":["骨","晶"],"s":["算"],"l":["空白線","保留線"],"te":[25,28]},{"id":"112-2-12","ch":"Raman","title":"112-2-12：光路／波長／螢光／包裝","stem":"關於拉曼光譜儀的敘述，下列何者錯誤？\n\n- (A) 檢測光路之垂直設計與螢光光譜儀類似\n- (B) 光源之波長為450～800 nm\n- (C) 無法檢測具螢光之物質\n- (D) 可以穿透包裝進行裸錠檢測","ans":"C","L":["L5","L6","L7"],"p":["色","骨"],"s":["源"],"l":[],"te":[0,15]},{"id":"110-1-20","ch":"Raman","title":"110-1-20：一般應用與定量","stem":"關於拉曼光譜分析應用的敘述，下列何者錯誤？\n\n- (A) 常用於建立藥物的指紋區\n- (B) 可直接檢測製劑中的有效成分\n- (C) 常用於定量分析\n- (D) 可鑑定原料藥晶形","ans":"C","L":["L7","L8","L9"],"p":["骨","晶"],"s":["算"],"l":["保留線"],"te":[25]},{"id":"109-1-24","ch":"Raman","title":"109-1-24：制酸錠成分含量","stem":"下列方法何者可用於直接分析制酸錠中甘胺酸（glycine）和碳酸鈣的含量？\n\n- (A) 紫外光光譜\n- (B) Raman 光譜\n- (C) 串聯式液相層析質譜儀\n- (D) 原子吸收光譜","ans":"B","L":["L7","L9"],"p":["色","骨","元"],"s":["算"],"l":[],"te":[10]},{"id":"108-1-27","ch":"Raman","title":"108-1-27：位移單位與光譜範圍","stem":"下列有關拉曼光譜分析（Raman spectroscopy）之敘述，何者錯誤？\n\n- (A) 可用於具對稱性鍵結之結構分析\n- (B) 單位為cm⁻¹\n- (C) 其光譜範圍相當於遠紅外光譜\n- (D) 提供額外的指紋鑑別資訊，可互補紅外光譜","ans":"C","L":["L3","L4","L6"],"p":["骨"],"s":[],"l":["解析度線"],"te":[0]},{"id":"107-1-02","ch":"Raman","title":"107-1-2：題本放射分類","stem":"下列何者屬於放射（emission）光譜？\n\n- (A) 可見光譜\n- (B) 紫外光光譜\n- (C) 紅外光光譜\n- (D) 拉曼光譜","ans":"D","L":["L1","L2"],"p":["色","骨"],"s":[],"l":[],"te":[]},{"id":"104-1-14","ch":"Raman","title":"104-1-14：四種方法定量比較","stem":"下列光譜法中，何者最不適用於定量分析？\n\n- (A) 質譜法\n- (B) 拉曼光譜法\n- (C) 核磁共振光譜法\n- (D) 原子吸收光譜法","ans":"B","L":["L1","L2","L3","L4","L5","L6","L7","L8","L9"],"p":["骨","元"],"s":["算"],"l":[],"te":[]},{"id":"114-1-30","ch":"層析概論","title":"極高速的質傳項","stem":"一般液相層析法中，移動相在高流速下會造成層析峰變寬現象，下列何因子在極高流速時影響最大？\n\n(A) 漩渦擴散\n\n(B) 縱向擴散\n\n(C) 固定相質量轉移\n\n(D) 移動相質量轉移","ans":"C","L":["L13"],"p":["極"],"s":["源","選"],"l":["分配線"],"te":[2,11]},{"id":"113-2-34","ch":"層析概論","title":"同 tR 比峰寬","stem":"關於層析原理中理論板數（N）及理論板高（H）之敘述，下列何者正確？\n\n(A) N 與H 呈正比\n\n(B) H 越大則管柱效率越高\n\n(C) 移動相的流速越快則 N 越大\n\n(D) 若不同待測物之滯留時間相同，則波峰寬度較小者 N 較大","ans":"D","L":["L08"],"p":["極"],"s":["源","選","算"],"l":["分配線","解析度線"],"te":[1,2,11]},{"id":"113-2-35","ch":"層析概論","title":"C18 的選擇性","stem":"在C18 液相層析分析中，化合物A 與B 之滯留因子（k）分別為kA = 3、kB = 6，其波峰面積分別為12000、15000，則下列敘述何者正確？\n\n(A) 化合物A 之滯留時間較長\n\n(B) 分離因子（α）為2\n\n(C) 化合物B 之濃度較低\n\n(D) 化合物A 之極性較低","ans":"B","L":["L06"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[1,2,7,11]},{"id":"113-1-31","ch":"層析概論","title":"提高板高與解析度","stem":"以高效液相層析法分析acetaminophen 中的不純物時，提高下列參數之數值後，何者無法增加分離解析度 （resolution）？\n\n(A) 理論板數（theoretical plate number）\n\n(B) 理論板高（theoretical plate height）\n\n(C) 選擇性（selectivity factor）\n\n(D) 容積因子（capacity factor）","ans":"B","L":["L10"],"p":["極"],"s":["選","算"],"l":["解析度線"],"te":[2,11]},{"id":"113-1-33","ch":"層析概論","title":"擴充式的固定相項","stem":"在下列Van Deemter equation 中，何種參數與靜相特性關係最大？\n\n［圖］\n\n轉寫原圖：\n\n$$\nH=\\frac{A}{1+C_m/u^{1/2}}+\\frac Bu+C_su+C_mu^{1/2}\n$$\n\n(A) A\n\n(B) B\n\n(C) Cm\n\n(D) Cs","ans":"D","L":["L13"],"p":["極"],"s":["選"],"l":["解析度線"],"te":[11]},{"id":"113-1-34","ch":"層析概論","title":"半高寬解析度式","stem":"下列方程式何者用於計算液相層析圖中二波峰之分離解析度（resolution, Rs）? （t、 W、W(0.5)分別代表：滯留時間、波峰底部寬、波峰半高寬）\n\n(A) Rs=2（t2－t1）/（W2－W1）\n\n(B) Rs= 2（t2＋t1）/（W2－W1）\n\n(C) Rs=1.18（t2＋t1）/（W2(0.5)＋W1(0.5)）\n\n(D) Rs=1.18（t2－t1）/（W2(0.5)＋W1(0.5)）","ans":"D","L":["L07"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"112-2-34","ch":"層析概論","title":"總板數轉 plates/m","stem":"Ketoprofen 於同為25 cm 長之3 支管柱進行分析，在管柱1～3 之滯留時間分別為 10、5 和5 min，波峰寬分別為 1、0.25 和1 min，則下列何者之分離效率（efficiency） > 10000 plates/m？\n\n(A) 僅管柱3\n\n(B) 僅管柱2\n\n(C) 僅管柱1\n\n(D) 管柱1及管柱2","ans":"B","L":["L09"],"p":["極"],"s":["選"],"l":["分配線","解析度線"],"te":[1,2,11]},{"id":"112-2-35","ch":"層析概論","title":"分配常數與保留體積","stem":"下列何者為滯留體積𝑉𝑅（retention volume）之計算公式？（Vs：管柱內靜止相實質體積，𝑉𝑀：管柱內空隙體積，K：分析物在靜止相／移動相之分配係數）\n\n［圖］\n\n下列為同一原圖的可搜尋轉寫：\n\n(A) $V_R=V_M+V_S$\n\n(B) $V_R=V_M+KV_S$\n\n(C) $V_R=KV_M+V_S$\n\n(D) $V_R=KV_M-V_S$","ans":"B","L":["L05"],"p":["極"],"s":["源","選","算"],"l":["分配線"],"te":[1,8]},{"id":"112-1-31","ch":"層析概論","title":"升溫與效率","stem":"下列何者可提高液相層析法之管柱效率？\n\n(A) 增加移動相流速\n\n(B) 增加固定相膜厚\n\n(C) 提高分析的溫度\n\n(D) 增加固定相粒徑","ans":"C","L":["L14"],"p":["極"],"s":["源","選"],"l":["分配線","溫度線"],"te":[1,2,5]},{"id":"112-1-32","ch":"層析概論","title":"解析度判準的反向敘述","stem":"有關層析分離法之敘述，下列何者錯誤？\n\n(A) K'為capacity factor，一般為2～5 較適當\n\n(B) α可定義為K2 /K1\n\n(C) N 一般用來表示理論板數\n\n(D) Rs 一般須小於1.5 才可視為完全分離","ans":"D","L":["L07"],"p":["極"],"s":["選","算"],"l":["解析度線"],"te":[2,11]},{"id":"112-1-33","ch":"層析概論","title":"辨保留與峰形參數","stem":"關於高效液相層析法之理論，下列何者正確？\n\n(A) resolution（Rs）大於1.5 表示波峰的完全分離\n\n(B) asymmetry factor 小於0.5 時，顯示波峰拖尾\n\n(C) separation factor（α）為0 時，表示兩種化合物的滯留時間相同\n\n(D) capacity factor（K'）愈小，表示化合物之滯留時間愈長","ans":"A","L":["L07"],"p":["極"],"s":["選"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"112-1-38","ch":"層析概論","title":"扣 V₀ 再比 α","stem":"某層析分離管進行層析分析所得資料如下：V0 = 1.1 mL，V1 = 5.1 mL，V2 = 9.1 mL （V0 = void volume，V1 = peak 1 之滯留體積，V2 = peak 2 之滯留體積），則 selectivity（α1,2 = K'2 / K'1）為何？\n\n(A) 2.0\n\n(B) 0.5\n\n(C) 4.0\n\n(D) 1.0","ans":"A","L":["L06"],"p":["極"],"s":["選","算"],"l":["分配線"],"te":[2]},{"id":"111-2-34","ch":"層析概論","title":"柱長與 H","stem":"在液相層析中，下列何項參數不受層析管長度影響？\n\n(A) 理論板數\n\n(B) 理論板高（HETP）\n\n(C) 滯留時間\n\n(D) 解析度","ans":"B","L":["L11"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"111-2-35","ch":"層析概論","title":"Dm 競爭效應的爭議","stem":"下列何者是液相層析法中，產生波峰變寬的原因？\n\n(A) 在動相中，待測物的擴散係數愈小\n\n(B) 靜相顆粒愈小，形狀愈規則\n\n(C) 靜相被覆愈薄且均勻\n\n(D) 流速愈慢","ans":"A","L":["L14"],"p":["極"],"s":[],"l":[],"te":[2]},{"id":"111-1-35","ch":"層析概論","title":"單峰效率指標","stem":"下列參數何者之數值愈大，表示其層析分離效率愈佳？\n\n(A) theoretical plate number（N）\n\n(B) height equivalent to a theoretical plate（HETP）\n\n(C) capacity factor（K'）\n\n(D) selectivity（α）","ans":"A","L":["L08"],"p":["極"],"s":["選"],"l":["解析度線"],"te":[2,11,22]},{"id":"110-2-34","ch":"層析概論","title":"兩峰相對保留","stem":"下列層析法參數，何者與不同波峰間之滯留時間有關？\n\n(A) asymmetry factor\n\n(B) separation factor\n\n(C) height equivalent to a theoretical plate\n\n(D) the number of theoretical plates","ans":"B","L":["L06"],"p":["極"],"s":["選"],"l":["分配線","歸一線"],"te":[2,11,22]},{"id":"110-2-35","ch":"層析概論","title":"展寬的多種來源","stem":"下列何者與液相層析管柱之效率（column efficiency）有關？①充填物之顆粒大小 ② 靜相塗覆層厚度 ③靜相塗覆層均勻度 ④分析物之擴散速率\n\n(A) 僅②③\n\n(B) 僅③④\n\n(C) 僅①④\n\n(D) ①②③④","ans":"D","L":["L12"],"p":["極"],"s":["選"],"l":[],"te":[1]},{"id":"110-2-36","ch":"層析概論","title":"慢流與 Dm 條件","stem":"下列何者為液相層析法中使樣品帶變寬的原因？\n\n(A) 固定相顆粒愈小且形狀愈規則\n\n(B) 在移動相中，待測物的擴散係數愈小\n\n(C) 固定相之被覆愈薄且均勻\n\n(D) 流速愈慢","ans":"D","L":["L14"],"p":["極"],"s":["源","樣","選"],"l":["分配線"],"te":[2]},{"id":"110-1-29","ch":"層析概論","title":"膜厚平方效應","stem":"為液相層析中分子在固定相中質量轉移的阻力，若固定相厚度增加為2 倍，則變為幾倍？\n\n缺字登記：題幹中被問量的符號空缺；依解析補讀CS。\n\n［圖］\n\n(A) 2\n\n(B) 4\n\n(C) 0.5\n\n(D) 0.25","ans":"B","L":["L14"],"p":["極"],"s":["選"],"l":[],"te":[]},{"id":"110-1-31","ch":"層析概論","title":"由 A 推 t₀，再求 B","stem":"A、B 混合物以HPLC 進行分析，移動相流速為1.2 mL/min，已知A 之滯留因子 （capacity factor，k'A）為12.0， 滯留時間13.0 min。若B 之滯留因子（k'B）為15.0 時，則其滯留時間約為多少min？\n\n(A) 16\n\n(B) 13\n\n(C) 19\n\n(D) 12","ans":"A","L":["L04"],"p":["極"],"s":["源","選","算"],"l":["分配線"],"te":[2]},{"id":"110-1-34","ch":"層析概論","title":"保留量與含量的界線","stem":"以液相層析法分析含化合物A 與B 之混合檢品，若其滯留因子（k'）分別為k'A = 3、 k'B = 5，下列敘述何者正確？\n\n(A) 化合物A 的滯留時間較長\n\n(B) 化合物B 的滯留體積較大\n\n(C) 化合物B 之含量較多\n\n(D) 化合物B之分子量較大","ans":"B","L":["L04"],"p":["量"],"s":["樣","選","算"],"l":["分配線"],"te":[2]},{"id":"110-1-38","ch":"層析概論","title":"流量與 tR 的反比","stem":"關於層析法中滯留時間（tR）的敘述，下列何者最適當？\n\n(A) 與流速成反比\n\n(B) 與capacity factor（k'）成反比\n\n(C) 與void time（t0）成反比\n\n(D) 與滯留容積（VR）成反比","ans":"A","L":["L11"],"p":["極"],"s":["選"],"l":["分配線"],"te":[2]},{"id":"109-2-26","ch":"層析概論","title":"不同柱長的品質","stem":"有 3 支分離管柱，其長度與理論板數分別為：管柱甲 10 cm、20000；管柱乙 12 cm、30000；管柱丙 15 cm、32000。下列何者分離效率（column efficiency）最佳？\n\n(A) 管柱甲\n\n(B) 管柱乙\n\n(C) 管柱丙\n\n(D) 皆相同","ans":"B","L":["L09"],"p":["極"],"s":["選","算"],"l":["解析度線"],"te":[1,11]},{"id":"109-2-30","ch":"層析概論","title":"方程範圍與進樣量","stem":"根據 Van Deemter equation，下列何者與層析帶加寬無關？\n\n(A) 樣品注射量\n\n(B) 靜相厚度\n\n(C) 靜相顆粒大小\n\n(D) 分析物於移動相之擴散係數","ans":"A","L":["L12"],"p":["極"],"s":["源","樣"],"l":["分配線","解析度線"],"te":[11,20]},{"id":"109-2-36","ch":"層析概論","title":"5% 對稱因子的定義","stem":"層析圖中，某待測物波峰與波峰前段（自波峰頂端到波峰最前緣）在 5%高度處之寬度分別為 0.5 min 與 0.2 min，則其對稱因子（As）為何？\n\n(A) 1.25\n\n(B) 1.5\n\n(C) 2.5\n\n(D) 5","ans":"","L":["L15"],"p":["極"],"s":["算"],"l":["解析度線"],"te":[11]},{"id":"109-1-30","ch":"層析概論","title":"摻偽方法的證據能力","stem":"在分析中藥摻西藥時，下列何種方法不能作為摻偽的確認方法？\n\n(A) 原子放射光譜法\n\n(B) 薄層層析法\n\n(C) 高效液相層析法\n\n(D) 氣相層析法","ans":"A","L":["L16"],"p":["揮"],"s":["選"],"l":[],"te":[]},{"id":"108-2-32","ch":"層析概論","title":"基線峰寬解析度式","stem":"層析圖相鄰二波峰之滯留時間分別為t1 及t2，波峰底部寬分別為W1 及W2，則此二波峰之分離解析度 （resolution, Rs），以下列何式表示最恰當？\n\n(A) Rs = 2(t2-t1)/(W2-W1)\n\n(B) Rs = 2(t2-t1)/(W2+W1)\n\n(C) Rs = 2(t2+t1)/(W2+W1)\n\n(D) Rs = (t2+t1)/2(W2-W1)","ans":"B","L":["L07"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"108-2-39","ch":"層析概論","title":"加長柱的比例","stem":"液相層析管的管柱長度變為2 倍時，下列液相層析參數的變化，最可能為：\n\n(A) capacity factor 變為2 倍\n\n(B) HETP 值變為0.5 倍\n\n(C) 滯留時間變為2 倍\n\n(D) selectivity 變為2 倍","ans":"C","L":["L11"],"p":["極"],"s":["選"],"l":["分配線","解析度線"],"te":[1,2,11]},{"id":"108-1-38","ch":"層析概論","title":"細粒與效率","stem":"下列何者可提升液相層析法的層析管效率？\n\n(A) 降低分析物在靜相中的擴散係數\n\n(B) 降低分析時的溫度\n\n(C) 降低分析物在動相中的擴散係數\n\n(D) 降低靜相粒子的大小","ans":"D","L":["L14"],"p":["極"],"s":[],"l":["溫度線"],"te":[5]},{"id":"107-2-39","ch":"層析概論","title":"兩相的物態","stem":"下列有關層析法之敘述，何者正確？\n\n(A) 靜相可為固體或液體\n\n(B) 動相均為液體\n\n(C) 溫度並不影響HETP 值\n\n(D) HETP 的大小與動相的流速無關","ans":"A","L":["L01"],"p":["極"],"s":[],"l":["解析度線","溫度線"],"te":[2,5,11]},{"id":"107-1-33","ch":"層析概論","title":"Van Deemter 名稱與 H","stem":"下列有關Van Deemter equation，HETP＝A + B/µ + Cµ 之敘述，何者錯誤﹖\n\n(A) A 項為eddy diffusion 與粒徑大小有關\n\n(B) B 項為molecular diffusion 為分子在動相中的擴散速率\n\n(C) C 項為resistance of mass transfer 與固定相之薄膜厚度有關\n\n(D) 一般HETP 值愈大，層析效率愈佳","ans":"D","L":["L13"],"p":["極"],"s":["選"],"l":["解析度線"],"te":[11]},{"id":"107-1-35","ch":"層析概論","title":"Rs=1 的錯誤判準","stem":"下列有關層析分離技術之敘述，何者錯誤？\n\n(A) K' 為capacity factor，一般為1～10 較適當\n\n(B) α 為selectivity factor，可定義為K2 '/ K1 '\n\n(C) Rs 為resolution 解析度，Rs＝1.0 表示完全分離\n\n(D) N 表示理論板數","ans":"C","L":["L07"],"p":["極"],"s":["選","算"],"l":["解析度線"],"te":[2,11]},{"id":"106-2-38","ch":"層析概論","title":"適度升溫的方向","stem":"下列何者可增加層析管柱的分離效率？\n\n(A) 加大靜相的粒子徑\n\n(B) 增加動相的流速\n\n(C) 增加動相的黏度\n\n(D) 適度的增加管柱溫度","ans":"D","L":["L14"],"p":["極"],"s":["選"],"l":["溫度線"],"te":[1,2,5]},{"id":"106-1-31","ch":"層析概論","title":"四柱單位長度品質","stem":"有4 支分離管柱，管柱甲：長10 cm 理論板數18,000；管柱乙：長15 cm 理論板數 30,000；管柱丙：長20 cm 理論板數32,000； 管柱丁：長25 cm 理論板數48,000；則何管柱分離效能最佳？\n\n(A) 管柱甲\n\n(B) 管柱乙\n\n(C) 管柱丙\n\n(D) 管柱丁","ans":"B","L":["L09"],"p":["極"],"s":["選","算"],"l":["解析度線"],"te":[1,11]},{"id":"106-1-35","ch":"層析概論","title":"N 與相對峰寬","stem":"下列何項層析參數和層析峰的寬窄有最直接之關係？\n\n(A) 理論板數（theoretical plates）\n\n(B) 容量因子（capacity factor）\n\n(C) 滯留時間（retention time）\n\n(D) 對稱係數（asymmetry factor）","ans":"A","L":["L08"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"106-1-39","ch":"層析概論","title":"拖尾、α 與 Rs","stem":"下列有關液相層析參數之敘述，何者正確？\n\n(A) peak asymmetry factor 大於1 時，表示產生拖尾現象\n\n(B) 若要完全分離兩個波峰，則兩者的capacity factor 為1.5 以上\n\n(C) 若兩個化合物的滯留時間相同，則兩者的resolution 為1\n\n(D) 若兩個化合物的滯留時間相同，則兩者的selectivity（α）為0","ans":"A","L":["L15"],"p":["極"],"s":["選"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"105-2-14","ch":"層析概論","title":"解析度式選擇","stem":"層析圖中相鄰二波峰之滯留時間分別為t1 及t2，波峰底部寬分別為W1 及W2，二波峰之容積因子分別為k'1 及k'2，則此二波峰之分離解析度（Rs）為下列何者？\n\n(A) Rs＝2(t2 - t1 ) / (W2 + W1 )\n\n(B) Rs＝(t2 - t1 ) / 2 (W2 + W1 )\n\n(C) Rs＝2(W2 - W1 ) / (k'2 - k'1 )\n\n(D) Rs＝(W2 - W1 ) / 2(t2 - t1 )","ans":"A","L":["L07"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"105-2-37","ch":"層析概論","title":"拖尾的候選原因","stem":"以液相層析法分析中性化合物時，波峰產生嚴重的拖尾現象，其可能的原因為下列何者？\n\n(A) 注入的檢品量太少\n\n(B) 層析溫度過高\n\n(C) 化合物的滯留時間太短\n\n(D) 管柱的入口處與充填劑之間有空隙產生","ans":"D","L":["L15"],"p":["極"],"s":["樣","選"],"l":["分配線","解析度線","溫度線"],"te":[1,2,5,11,20]},{"id":"105-1-30","ch":"層析概論","title":"線性速度的單位","stem":"有關Van Deemter 方程式（H = A + B/µ+ Cµ）之參數定義，下列何者正確？\n\n(A) A 為相間質量轉換（mass transfer between phases）\n\n(B) B 為多重移動路徑（multiple flow paths）\n\n(C) C 為縱向擴散（longitudinal diffusion）\n\n(D) µ 為移動相之線性速度","ans":"D","L":["L13"],"p":["極"],"s":["源"],"l":["分配線","標準曲線線","解析度線"],"te":[11]},{"id":"105-1-37","ch":"層析概論","title":"高速展寬指定配對","stem":"一般液相層析法中，移動相在高流速下會造成層析峰變寬（band broadening）現象， 下列何因子受高流速影響最大？\n\n(A) 渦旋擴散（Eddy diffusion）\n\n(B) 縱向擴散（Longitudinal diffusion）\n\n(C) 固定相質量轉移（Stationary phase mass transfer）\n\n(D) 移動相質量轉移（Mobile phase mass transfer）","ans":"C","L":["L13"],"p":["極"],"s":["源","選"],"l":["分配線"],"te":[2,11]},{"id":"104-2-22","ch":"層析概論","title":"LC-ESI 內徑選項","stem":"下列何種內徑的液相層析管柱，在最適當流速下，可直接以電灑法（ESI）游離待測物且可獲得良好之離子化效果？\n\n(A) 0.21 cm\n\n(B) 0.46 cm\n\n(C) 2.54 cm\n\n(D) 10.16 cm","ans":"A","L":["L16"],"p":["荷"],"s":["源","選"],"l":["酸鹼線"],"te":[1,2,9]},{"id":"104-2-40","ch":"層析概論","title":"由 k′ 求總保留時間","stem":"以液相層析法分析含A 與B 化合物之檢品時，to 為1 min，A 與B 兩化合物之k' 值分別為6 與10，則下列何者正確？\n\n(A) 化合物A 與B 之滯留時間分別為6 min 與10 min\n\n(B) 化合物A 與B 之滯留時間分別為7 min 與11 min\n\n(C) 化合物A 與B 之滯留時間分別為10 min 與6 min\n\n(D) 化合物A 與B 之滯留時間分別為11 min 與7 min","ans":"B","L":["L04"],"p":["極"],"s":["樣","選","算"],"l":["分配線"],"te":[2]},{"id":"104-1-30","ch":"層析概論","title":"足夠分離與時間取捨","stem":"於層析分析含兩個成分之待測物時，下列何種結果所對應的分析條件最適合？（解析度：Rs，滯留時間：Rt）\n\n(A) Rs 0.5；Rt 5 minutes\n\n(B) Rs 2.0；Rt 10 minutes\n\n(C) Rs 3.0；Rt 20 minutes\n\n(D) Rs 4.0；Rt 30 minutes","ans":"B","L":["L10"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"103-2-34","ch":"層析概論","title":"膜厚與 Dm 的界線","stem":"下列何種參數會降低層析管的效率？\n\n(A) 適當提升溫度\n\n(B) 固定相顆粒小\n\n(C) 固定相覆蓋厚\n\n(D) 在移動相中擴散率小","ans":"C","L":["L14"],"p":["極"],"s":["源","選"],"l":["分配線","溫度線"],"te":[5]},{"id":"103-2-40","ch":"層析概論","title":"H 定義與管徑歧義","stem":"下列有關層析管柱效率之敘述，何者錯誤？\n\n(A) HETP 是分析物在固定相與移動相間發生一次分配所需理論板數高度\n\n(B) $N=5.54(t_r/W_{1/2})^2$\n\n(C) HETP = L / N，HETP 越小顯示管柱效率越高\n\n(D) 管柱越細，HETP 會加大","ans":"D","L":["L09"],"p":["極"],"s":["源","選","算"],"l":["分配線","解析度線"],"te":[1,11]},{"id":"103-1-38","ch":"層析概論","title":"數值 Rs","stem":"A 與B 兩個化合物，以層析法分離時，其滯留時間分別為5 與8 分鐘，其波峰寬度分別為0.4 及0.8 分鐘，則其解析度（resolution factor）為何？\n\n(A) 2.5\n\n(B) 3\n\n(C) 5\n\n(D) 8","ans":"C","L":["L07"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"102-2-31","ch":"層析概論","title":"由 V₀、F、k′ 求 tR","stem":"若一層析管柱的空隙體積（void volume）為1 mL，移動相流速為1 mL/min，某化合物的容積因子（capacity factor）為8，則此化合物的滯留時間為幾分鐘？\n\n(A) 5\n\n(B) 8\n\n(C) 9\n\n(D) 12","ans":"C","L":["L04"],"p":["極"],"s":["源","選","算"],"l":["分配線"],"te":[1,2]},{"id":"102-2-32","ch":"層析概論","title":"同 W 比總 N","stem":"同一個化合物，使用不同的層析管柱分離時，則下列結果何者之分離效率最高？\n\n(A) 滯留時間為6.0 分鐘，波峰寬度為0.4 分鐘\n\n(B) 滯留時間為7.0 分鐘，波峰寬度為0.4 分鐘\n\n(C) 滯留時間為8.0 分鐘，波峰寬度為0.4 分鐘\n\n(D) 滯留時間為9.0 分鐘，波峰寬度為0.4 分鐘","ans":"D","L":["L08"],"p":["極"],"s":["選"],"l":["分配線","解析度線"],"te":[1,2]},{"id":"102-2-36","ch":"層析概論","title":"改善 H 與增加總 N","stem":"下列何者可提高液相層析法的層析效率（efficiency）？\n\n(A) 固定相用較大的顆粒\n\n(B) 增加流速\n\n(C) 細顆粒擔體（support），薄的固定相包覆（coated）\n\n(D) 使用較長管柱","ans":"C","L":["L14"],"p":["極"],"s":["選"],"l":[],"te":[1,2]},{"id":"102-2-38","ch":"層析概論","title":"體積保留因子式","stem":"層析分析法中，下列何者為容積因子（k' ）之計算公式？（Vo：未滯留物溶出所需容積；Vr：滯留物溶出所需容積）\n\n(A) k' = (Vr -Vo) /Vo\n\n(B) k' = (Vo -Vr) /Vo\n\n(C) k' =Vo / (Vr -Vo)\n\n(D) k' =Vo / (Vo-Vr )","ans":"A","L":["L04"],"p":["極"],"s":["選","算"],"l":["分配線"],"te":[2]},{"id":"102-2-40","ch":"層析概論","title":"由同比例時間反推 F","stem":"以液相層析法分析含A 與B 化合物之檢品，當移動相流速為1 mL/min 時，to 為1 min，A 與B 化合物之k'為6 與10。如A 與B 化合物滯留時間分別為3.5 min 與5.5 min，則移動相流速（mL/min）應為下列何者？\n\n(A) 0.5\n\n(B) 1.0\n\n(C) 1.5\n\n(D) 2.0","ans":"D","L":["L11"],"p":["極"],"s":["源","樣","選"],"l":["分配線"],"te":[2]},{"id":"102-1-32","ch":"層析概論","title":"解析額外採用孔隙率","stem":"在0.46×15 cm 的ODS 分析級層析管柱（空管容量為2.5 mL），溶劑或未滯留化合物以1 mL/min 流速流過此層析管柱空隙體積（void volume）的時間約為幾分鐘？\n\n(A) 0.1\n\n(B) 1.8\n\n(C) 2.5\n\n(D) 5","ans":"B","L":["L03"],"p":["極"],"s":["樣","選"],"l":["分配線"],"te":[1,2,3]},{"id":"102-1-40","ch":"層析概論","title":"先按峰次序求 Rs","stem":"層析圖中相鄰二波峰之滯留時間分別為27.2 min 及26.2 min，此二波峰底部寬皆為0.5 min，則此二波峰之分離解析度（Rs）為：\n\n(A) 1.0\n\n(B) 1.5\n\n(C) 2.0\n\n(D) 2.5","ans":"C","L":["L01","L02","L03","L04","L06","L07","L09","L13","L14","L15","L16"],"p":["極"],"s":["選","算"],"l":["分配線","解析度線"],"te":[2,11]},{"id":"111-2-39","ch":"SFC","title":"SFE","stem":"有關supercritical fluid extraction 的特點，下列何者錯誤？\n\n(A) 溶劑強度可藉調整萃取槽中的壓力而改變\n\n(B) 不適用於不安定化合物的萃取\n\n(C) CO2 為常用萃取溶媒\n\n(D) 萃取速度快","ans":"B","L":["L01","L02","L06","L17"],"p":["極"],"s":["樣"],"l":["分配線"],"te":[3,8,23]},{"id":"110-1-35","ch":"SFC","title":"SFE","stem":"下列何者非二氧化碳應用於超臨界流體萃取法之優點？\n\n(A) 經濟\n\n(B) 不可燃\n\n(C) 高極性\n\n(D) 可用於熱不安定樣品之萃取","ans":"C","L":["L02","L04","L08","L17"],"p":["極","揮"],"s":["樣"],"l":["分配線","保留線"],"te":[8,23]},{"id":"109-2-34","ch":"SFC","title":"SFC","stem":"於超臨界流體層析分析中，下列何者與 selectivity factor 最相關？\n\n(A) 分析之壓力\n\n(B) 加入之有機溶媒\n\n(C) 分析之溫度\n\n(D) 偵測器之種類","ans":"B","L":["L06","L07","L08","L09","L15"],"p":["極"],"s":["樣","選","測"],"l":["溫度線"],"te":[3,5,10,11,23]},{"id":"108-1-34","ch":"SFC","title":"SFE","stem":"下列何者不是超臨界流體萃取法的優點？\n\n(A) 質量傳輸（mass transfer）快，萃取效率高\n\n(B) 適用於熱不安定性化合物的萃取\n\n(C) 可透過調整壓力改變萃取選擇性\n\n(D) 適用的超臨界流體種類多","ans":"D","L":["L04","L05","L06","L17"],"p":["極","揮"],"s":["樣","選"],"l":["分配線","保留線"],"te":[8,11,23]},{"id":"107-2-14","ch":"SFC","title":"SFE","stem":"下列何者為最常用於超臨界流體萃取（supercritical fluid extraction）？\n\n(A) 甲醇\n\n(B) 液態氮\n\n(C) 甲酸\n\n(D) 二氧化碳","ans":"D","L":["L01","L04","L08","L17"],"p":["極"],"s":["樣"],"l":["分配線"],"te":[8,13,23]},{"id":"103-1-34","ch":"SFC","title":"SFC","stem":"超臨界流體層析法中最常用之溶媒為何？\n\n(A) N2O\n\n(B) CO2\n\n(C) NH3\n\n(D) n-Butane","ans":"B","L":["L01","L02","L03","L04","L06","L07","L08","L09","L10","L11","L12","L13","L14","L15","L16","L17","L18","L19","L20"],"p":["極"],"s":["樣","算"],"l":[],"te":[3,23]},{"id":"114-1-15","ch":"折光","title":"114-1-15：最適當；速度比、光源、校正、溫度","stem":"關於中華藥典中對折光率之敘述，下列何者最適當？\n\n- (A) 藥品的折光率，均以白光為光源測定之\n- (B) 儀器一律以蒸餾水校正之\n- (C) 物質之折光率通常指光線在空氣中速度除以在該物質中速度之值\n- (D) 測定折光率時的標準溫度為30°C","ans":"C","L":["L1","L5","L7"],"p":["揮","整"],"s":["源","算"],"l":["溫度線"],"te":[5,15]},{"id":"112-2-11","ch":"折光","title":"112-2-11：錯誤；藥典題光源","stem":"依中華藥典通則規定，有關折光率測定之敘述，下列何者錯誤？\n\n- (A) 應以儀器所附之標準品校正\n- (B) 光源為汞燈\n- (C) 常用之儀器為阿培氏折射計\n- (D) 經校正後測定之正確度可達理論值± 0.0001","ans":"B","L":["L5","L7"],"p":["整"],"s":["源","算"],"l":[],"te":[15]},{"id":"111-2-21","ch":"折光","title":"111-2-21：錯誤；忽略溫度","stem":"中華藥典有關折光率測定之敘述，下列何者錯誤？\n\n- (A) 物質折光率（n）通常係指光線在空氣中與在該物質中之速度比\n- (B) 折光率不受溫度影響\n- (C) 測定時至少量測三次，求其平均值\n- (D) 折光率測定可用於鑑別藥物之純度","ans":"B","L":["L4","L7","L8"],"p":["整"],"s":["算"],"l":["溫度線"],"te":[5]},{"id":"110-2-17","ch":"折光","title":"110-2-17：正確；乙醇水溶液定量","stem":"關於折光率測定之敘述，下列何者正確？\n\n- (A) Laurent half-shadow polarimeter 為折光率測定儀\n- (B) 中華藥典中規定所使用之光源為氘燈\n- (C) 可測量乙醇水溶液中之乙醇濃度\n- (D) 測定波長與折光率大小無關","ans":"C","L":["L5","L8"],"p":["極","整"],"s":["源","算"],"l":[],"te":[0,7,12,15]},{"id":"110-1-11","ch":"折光","title":"110-1-11：錯誤；HPLC 背景是誰","stem":"關於refractive index detector 用於液相層析之敘述，下列何者錯誤？\n\n- (A) 係利用光通過檢品時產生角度偏折現象\n- (B) 須同時檢測固定相之背景值\n- (C) 為各類化合物之通用檢測器\n- (D) 溫度會影響其偵測效果","ans":"B","L":["L9"],"p":["整"],"s":["樣","選","測"],"l":["空白線","溫度線"],"te":[5,10,14]},{"id":"109-2-17","ch":"折光","title":"109-2-17：錯誤；水值溫度配對","stem":"有關折光率測定法之敘述，下列何者錯誤？\n\n- (A) 可用於鑑別藥物之純度\n- (B) 折光率等於光線入射角之正弦與其折射角正弦之比\n- (C) 蒸餾水之折光率在 20℃與 25℃下分別為 1.3325、1.3330\n- (D) 至少量測三次，求其平均值","ans":"C","L":["L2","L4","L7"],"p":["揮","整"],"s":["算"],"l":["溫度線"],"te":[5]},{"id":"108-2-03","ch":"折光","title":"108-2-3：錯誤；水不是1.00","stem":"有關折射率測定法之敘述，下列何者錯誤？\n\n- (A) 各藥品折射率測定值，一般係以鈉光之D 線為光源\n- (B) 一般以蒸餾水校正，蒸餾水之折射率在25℃時為1.00\n- (C) 折射率測定，可作為鑑別或純度檢查用\n- (D) 測量時應將溫度精確調整，測定至少3 次，求其平均值","ans":"B","L":["L4","L5","L7"],"p":["揮","元","整"],"s":["源","算"],"l":["溫度線"],"te":[5,15]},{"id":"106-2-19","ch":"折光","title":"106-2-19：錯誤；不只定性","stem":"有關折光度量測（refractometric measurement）的敘述，下列何者錯誤？\n\n- (A) 阿貝氏折射儀（Abbe refractometer）可更換光源使用\n- (B) 折光度的量測受溫度影響\n- (C) 僅適用於定性分析\n- (D) 適用於醣類分析","ans":"C","L":["L5","L8"],"p":["整"],"s":["源"],"l":["溫度線"],"te":[5,15]},{"id":"104-2-14","ch":"折光","title":"104-2-14：哪個原理不依分析物氧化還原","stem":"下列分析方法中，何者的測定原理與分析物的氧化還原特性無關？\n\n- (A) Refractometry\n- (B) Coulometry\n- (C) Amperometry\n- (D) Iodometry","ans":"A","L":[],"p":["整"],"s":[],"l":[],"te":[]},{"id":"103-2-07","ch":"折光","title":"103-2-7：錯誤；厚度與定量","stem":"下列關於折射率（折光率）測定之敘述，何者錯誤？\n\n- (A) 一般所指折射率是相對折射率\n- (B) 由Snell law 導出n= N sin rc 來計算折射率，式中的r c 是指臨界折射角\n- (C) 折射測定因檢液厚度很難控制，所以不能用於測定濃度\n- (D) 在測定固體檢品時，檢品可塗上monobromophthalene 再沾黏於折射稜鏡","ans":"C","L":["L2","L3","L6","L8"],"p":["整"],"s":["樣","選","算"],"l":[],"te":[7]},{"id":"102-1-11","ch":"折光","title":"102-1-11：錯誤；速度比顛倒","stem":"下列有關折射率（refractive index）之敘述，何者錯誤？\n\n- (A) 通常係指光線在物質中的速度與在空氣中的速度比\n- (B) 係因光線經由第一介質進入密度不同之第二介質時所產生之折射現象\n- (C) 為光線入射角與折射角之正弦比\n- (D) 測定折光率時，溫度會影響測定結果","ans":"A","L":["L1","L2","L3","L4","L5","L6","L7","L8","L9"],"p":["整"],"s":[],"l":["溫度線"],"te":[5]},{"id":"114-1-13","ch":"MS","title":"找出串聯質譜定義的錯句。","stem":"13. 下列關於串聯式質譜儀(tandem MS)之敘述，何者錯誤？\n\n(A) 係將兩台不同的質譜儀，例如ESI-MS 及EI-MS，直接串聯在一起\n\n(B) 可提供更多待測物結構相關的訊息\n\n(C) 可將欲分析的化合物分子片段化三次\n\n(D) 可選擇性將特定分子片段化","ans":"A","L":["L27"],"p":["量"],"s":["源","選"],"l":[],"te":[10]},{"id":"114-1-21","ch":"MS","title":"要能得到準確質量來支援不純物分子式。","stem":"21. 下列質譜儀，何者因不易得到準確質量數， 而不適用於藥物不純物之結構鑑定？\n\n(A) 四極柱質譜儀(quadrupole MS)\n\n(B) 飛行式質譜儀(time of flight MS)\n\n(C) 傅立葉轉換質譜儀(Fourier transform MS)\n\n(D) 磁場式質譜儀(magnetic sector MS)","ans":"A","L":["L20"],"p":["量"],"s":["選","算"],"l":[],"te":[28]},{"id":"114-1-25","ch":"MS","title":"高極性化合物，哪種最容易失去完整分子量資訊。","stem":"25. 對於高極性化合物，下列質譜測定法中何者最不易獲得分子量資訊？\n\n(A) 高速原子撞擊法(FAB)\n\n(B) 電灑游離法(ESI)\n\n(C) 化學游離法(CI)\n\n(D) 電子撞擊法(EI)","ans":"D","L":["L08"],"p":["量","極"],"s":["源","算"],"l":["分配線"],"te":[9]},{"id":"114-1-23","ch":"MS","title":"磁扇形半徑與m/z的比例哪句寫反。","stem":"23.有關磁場式質譜儀（magnetic sector mass spectrometry）之敘述，下列何者錯誤？\n\n(A) 離子的質荷比（m/z）與飛行半徑平方成反比\n\n(B) 能提供準確質量數至小數點第四位，輔助化合物之分子式判定\n\n(C) 隨著新式質譜儀的開發，磁場式質譜儀已較少使用\n\n(D) 加速電壓會影響解析度","ans":"A","L":["L15"],"p":["量"],"s":["源","算"],"l":["歸一線","解析度線"],"te":[11]},{"id":"113-2-17","ch":"MS","title":"常規血中藥物及代謝物濃度定量配置。","stem":"17. 下列何種儀器最常被應用於藥物與代謝物之血中濃度定量分析？\n\n(A) 氣相層析－三段四極柱質譜（gas chromatography-triple quadrupole mass spectrometry）\n\n(B) 液相層析－三段四極柱質譜（liquid chromatography-triple quadrupole mass spectrometry）\n\n(C) 液相層析－磁場式質譜（liquid chromatography-magnetic sector mass spectrometry）\n\n(D) 氣相層析－磁場式質譜（gas chromatography-magnetic sector mass spectrometry）","ans":"B","L":["L30"],"p":["揮"],"s":["選","算"],"l":[],"te":[7]},{"id":"113-2-19","ch":"MS","title":"EI與ESI碎片比較的錯句。","stem":"19. 對於電子撞擊（electron impact, EI）游離法的敘述，下列何者錯誤？\n\n(A) 相對於常壓游離法，EI 游離法更早被應用\n\n(B) 相對於電灑游離法（electrospray ionization, ESI），EI 游離法產生較少的碎裂片段\n\n(C) EI 游離法的原理是利用電子加速撞擊分析物，而使分析物帶電荷\n\n(D) EI 游離法常用的加速電壓為70 eV","ans":"B","L":["L08"],"p":["骨","荷"],"s":["源"],"l":["酸鹼線","保留線"],"te":[9]},{"id":"113-2-22","ch":"MS","title":"ESI本身的常見功能哪句不符。","stem":"22.質譜法使用電灑游離（electrospray ionization）源時，下列敘述何者錯誤？\n\n(A) 進樣毛細管端可施加負電壓以產生帶負電荷的離子\n\n(B) 分析物可能與溶液中的離子結合而增加質荷比\n\n(C) 進樣毛細管端可施加正電壓以產生帶正電荷的離子\n\n(D) 可將分析物裂解為多種離子碎片","ans":"D","L":["L10"],"p":["骨","量","荷"],"s":["源","樣"],"l":["酸鹼線","保留線"],"te":[9,20]},{"id":"113-2-27","ch":"MS","title":"由磁場作用辨分析器。","stem":"27. 如分析物之質荷比（m/z）係分析離子通過磁場而獲得，則此質譜儀分析器為下列何 者？\n\n(A) quadrupole analyzer\n\n(B) time-of-flight analyzer\n\n(C) magnetic analyzer\n\n(D) ion trap analyzer","ans":"C","L":["L15"],"p":["量"],"s":["算"],"l":["歸一線"],"te":[]},{"id":"113-1-17","ch":"MS","title":"給ESI後要較多碎片結構資訊。","stem":"17.電灑游離（ESI）源常與下列何種質量分析器結合而獲得最多分子結構資訊？\n\n(A) 雙聚焦磁場式（double focusing magnetic sector）\n\n(B) 四極柱（quadrupole）\n\n(C) 飛行時間（time of flight）\n\n(D) 三段式四極柱（triple quadrupole）","ans":"D","L":["L27"],"p":["骨"],"s":["源","選"],"l":["保留線"],"te":[9]},{"id":"113-1-24","ch":"MS","title":"抗體／多肽的大分子完整質量比較。","stem":"24.在液相層析－質譜（LC-MS）分析抗體與多肽等大分子藥物品質時，下列何種質譜儀最 適合？（atmospheric pressure chemical ionization, APCI; time of flight , TOF; electrospray ionization, ESI）\n\n(A) APCI/TOF MS\n\n(B) APCI/quadrupole MS\n\n(C) ESI/TOF MS\n\n(D) ESI/quadrupole MS","ans":"C","L":["L33"],"p":["量","荷"],"s":["源","選"],"l":["酸鹼線"],"te":[9,10]},{"id":"113-1-25","ch":"MS","title":"四極柱訊號來源哪句錯。","stem":"25.有關四極柱式分析器（quadrupole analyzer）之敘述，下列何者錯誤？\n\n(A) 利用相互為直角的直流與射頻振動電場\n\n(B) 訊號是由離子撞擊四極柱時所產生\n\n(C) 維護較容易\n\n(D) 無法提供高解析質譜","ans":"B","L":["L17"],"p":["量"],"s":["源","選"],"l":[],"te":[]},{"id":"113-1-36","ch":"MS","title":"無標電荷蛋白質圖，求最接近M的選項。","stem":"36.利用液相層析質譜儀進行某蛋白質之分析得到質譜圖如下，則其分子量最接近下列何 者？\n\n(A) 8000 Da\n\n(B) 12000 Da\n\n(C) 16000 Da\n\n(D) 20000 Da\n\n［圖］\n\n原圖：S04，PDF第9頁；裁取必要圖，沒有重畫峰或化學結構。","ans":"B","L":["L05","L06","L07"],"p":["量","荷"],"s":["算"],"l":[],"te":[]},{"id":"112-2-19","ch":"MS","title":"MALDI配對敘述中較不合的選項。","stem":"19.有關基質輔助雷射脫附游離法（matrix assisted laser desorption ionization, MALDI） 的敘述，下列何者錯誤？\n\n(A) 基質須為可吸收UV 能量的化合物\n\n(B) 適合串聯四極柱質譜儀（quadrupole mass）進行蛋白質研究\n\n(C) 屬於軟性離子源\n\n(D) 可搭配影像技術，應用於藥物的組織分布研究","ans":"B","L":["L12"],"p":["色","量","荷"],"s":["源","選"],"l":["酸鹼線","空白線"],"te":[9,10,15]},{"id":"112-2-22","ch":"MS","title":"源與常規層析介面的錯配。","stem":"22.有關利用游離法進行分析之敘述，下列何者錯誤？\n\n(A) 常壓化學游離（APCI）法適用於低極性藥物分析\n\n(B) 脫附電噴灑游離（DESI）法適用於物質表面研究\n\n(C) 基質輔助雷射脫附游離（MALDI）法適於連結HPLC 進行分析\n\n(D) 電子撞擊（EI）法適於連結GC 進行分析","ans":"C","L":["L12"],"p":["極","揮"],"s":["源"],"l":["分配線","空白線"],"te":[9,15]},{"id":"112-2-23","ch":"MS","title":"EI常用能量固定配對。","stem":"23.下列何者為電子撞擊（electron impact, EI）游離法最常用的加速電壓？\n\n(A) 20 eV\n\n(B) 45 eV\n\n(C) 95 eV\n\n(D) 70 eV","ans":"D","L":["L08"],"p":["量"],"s":["源"],"l":[],"te":[9]},{"id":"112-1-11","ch":"MS","title":"由Ampicillin甲醇圖辨源。","stem":"11.溶於甲醇之ampicillin，進行質譜分析所得圖譜如下，其最可能使用之游離法為何？\n\n(A) 電子撞擊（EI）\n\n(B) 電灑游離（ESI）\n\n(C) 基質輔助雷射脫附（MALDI）\n\n(D) 常壓化學游離（APCI）\n\n［圖］\n\n原圖：S04，PDF第12頁；裁取必要圖，沒有重畫峰或化學結構。","ans":"B","L":["L03","L10","L13"],"p":["量"],"s":["源","算"],"l":["空白線"],"te":[9,13,15]},{"id":"112-1-13","ch":"MS","title":"m/z 86的裂解機制與Lidocaine結構相符。","stem":"13.Lidocaine 之質譜圖如下，其m/z 為86 之質峰最可能是由何種裂解反應獲得？\n\n(A) homolytic α-cleavage\n\n(B) heterolytic cleavage\n\n(C) retro Diels-Alder fragmentation\n\n(D) McLafferty rearrangement\n\n［圖］\n\n原圖：S04，PDF第13頁；裁取必要圖，沒有重畫峰或化學結構。","ans":"A","L":["L24","L25"],"p":["骨","量"],"s":["算"],"l":["歸一線"],"te":[]},{"id":"112-1-21","ch":"MS","title":"image current振盪讀出的分析器辨識。","stem":"21.下列何種質量分析器（mass analyzer）係藉由測量及計算離子反覆振盪所產生的 image current，而獲得準確質荷比？\n\n(A) 軌道阱傅立葉轉換（orbitrap Fourier transform）\n\n(B) 四極柱（quadrupole）\n\n(C) 磁場式（magnetic sector）\n\n(D) 離子阱（ion trap）","ans":"A","L":["L19"],"p":["量"],"s":["選","算"],"l":[],"te":[28]},{"id":"112-1-22","ch":"MS","title":"RF離子阱常用氣體配對。","stem":"22.使用離子阱（ion trap）之質譜儀常用何種氣體進行裂解反應？\n\n(A) 氙\n\n(B) 氦\n\n(C) 氖\n\n(D) 氬","ans":"B","L":["L18"],"p":["量"],"s":["選"],"l":[],"te":[15,27]},{"id":"111-2-11","ch":"MS","title":"一般可逐級做MS³的比較。","stem":"11.利用下列何種質譜分析儀可進行 ic sector）：利用靜電場裝置將離子動能侷限在較小範圍\n\n(B) 四極柱（quadrupole）：利用控制直流電場及無線電波頻率電場以選擇特定質荷比離 子\n\n(C) 飛行時間（time of flight）：利用離子通過相同飛行區域所需時間作為質荷比之計算依 據\n\n(D) 離子阱（ion trap）：利用直流電場將離子留置在阱內","ans":"D","L":["L16","L17","L18","L19"],"p":["量"],"s":["選","算"],"l":[],"te":[]},{"id":"110-2-11","ch":"MS","title":"GC汽化不適合的檢品型別。","stem":"11.GC-MS 不適用於下列何者之分析？\n\n(A) 揮發油之成分\n\n(B) 抗體藥物之不純物\n\n(C) 小分子藥物製程之中間產物\n\n(D) 尿液中之管制藥品及其代謝物","ans":"B","L":["L33"],"p":["量","揮"],"s":["樣"],"l":["保留線"],"te":[10]},{"id":"110-2-25","ch":"MS","title":"同時用靜電與磁場的分析配置。","stem":"25.下列質譜儀分析器中，何者利用靜電及磁場進行分析？\n\n(A) 四極柱式分析器\n\n(B) 飛行時間分析器\n\n(C) 雙聚焦分析器\n\n(D) 扇形磁場分析器","ans":"C","L":["L16"],"p":["量"],"s":["選"],"l":[],"te":[]},{"id":"110-2-26","ch":"MS","title":"四源比較，蛋白質結構研究較合。","stem":"26.質譜分析中，下列何種離子化方式最有助於蛋白質結構解析？\n\n(A) electron impact ionization\n\n(B) negative ion chemical ionization\n\n(C) positive ion chemical ionization\n\n(D) matrix-assisted laser desorption ionization","ans":"D","L":["L12"],"p":["量","荷"],"s":["源"],"l":["酸鹼線","空白線"],"te":[9,15]},{"id":"110-2-27","ch":"MS","title":"完整分子離子奇數名目質量的元素線索。","stem":"27.某化合物經質譜分析其 [M]+為奇數，除含碳、氫、氧之外，最可能含有下列何種元素？\n\n(A) N\n\n(B) S\n\n(C) P\n\n(D) K","ans":"A","L":["L23"],"p":["量","元"],"s":[],"l":[],"te":[]},{"id":"110-2-28","ch":"MS","title":"把LC分離與離子分析順序排正確。","stem":"28.下列LC/MS 分析檢測流程何者正確？①離子化 ②離子分離 ③離子檢測 ④LC 分離\n\n(A) ①②③④\n\n(B) ①③②④\n\n(C) ④①②③\n\n(D) ④②①③","ans":"C","L":["L14"],"p":["荷"],"s":["選"],"l":["酸鹼線"],"te":[9]},{"id":"110-1-23","ch":"MS","title":"單Cl的同位素峰比。","stem":"23.含一個氯原子之化合物，其EIMS 圖譜中之分子離子峰[M]+與[M+2]+之訊號強度比為 何？\n\n(A) 1：1\n\n(B) 2：1\n\n(C) 3：1\n\n(D) 24：1","ans":"C","L":["L21"],"p":["量"],"s":[],"l":["計數線"],"te":[]},{"id":"110-1-24","ch":"MS","title":"質譜軸與樣品範圍的正確敘述。","stem":"24.有關質譜分析的敘述，下列何者正確？\n\n(A) 化學游離法（CI）適用於蛋白質的分子量測定\n\n(B) 測定蛋白質的分子量時，可用電子撞擊離子法（EI）\n\n(C) 常壓下的離子化技術尚未被開發\n\n(D) 質譜圖通常以m/z 為橫軸，各離子的相對強度為縱軸","ans":"D","L":["L01"],"p":["量","荷"],"s":["源","樣","算"],"l":["酸鹼線","歸一線"],"te":[9]},{"id":"110-1-27","ch":"MS","title":"UV-MALDI基質的四選項比較。","stem": 目給方法或零件（ESI、FID、KBr）→ 查 ⑤ 五站零件表：先說它坐哪一站，再問它抓哪一欄性質。","② 題目給一顆藥（含酚、弱鹼、沒有發色基、怕熱）→ 查 ⑥ 性質跨章表：這顆藥缺的那一欄＝不能用的方法。","③ 題目給異常（拖尾、偏低、基線漂、峰重疊）→ 查 ④ 九條線：是哪一站的哪個量變了。"]}</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tex = s => String(s ?? '').replace(/\$([^$]*)\$/g, (m, x) => x.replace(/\\(?:mathrm|text|operatorname|mathbf)\{([^}]*)\}/g, '$1').replace(/\\(times)/g, '×').replace(/\\(le|leq)/g, '≤').replace(/\\(ge|geq)/g, '≥').replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '').replace(/\^/g, '').replace(/_/g, ''));
const T = s => esc(tex(s));
const CH = D.chapters.map(c => c.name);
const CHO = Object.fromEntries(D.chapters.map(c => [c.name, c]));
const PROP = Object.fromEntries(D.props.map(p => [p.k, p]));
const STA = Object.fromEntries(D.stations.map(s => [s.k, s]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('yfqj:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('yfqj:' + k, JSON.stringify(v)); } catch (e) {} }
};

// ── 狀態 ──
const S = {
  view: store.get('view', 'map'), mode: store.get('mode', 'explore'),
  masked: new Set(store.get('masked', [])), hideKnown: store.get('hideKnown', true),
  chSel: store.get('chSel', 'HPLC'), revealed: new Set(), prog: store.get('prog', {}),
  stack: [], focus: null, last: null, sync: '本機', rbOpen: !matchMedia('(max-width:700px)').matches
};
const savePrefs = () => { store.set('view', S.view); store.set('mode', S.mode); store.set('masked', [...S.masked]); store.set('hideKnown', S.hideKnown); store.set('chSel', S.chSel); };

// ── 可遮的單元：先把全部登記，章進度才算得準 ──
const UNITS = new Map();
const hash = s => { let h = 5381; for (const c of s) h = ((h << 5) + h + c.codePointAt(0)) >>> 0; return h.toString(36); };
const reg = (cid, chs) => { if (!UNITS.has(cid)) UNITS.set(cid, { ch: chs.filter(c => CHO[c]) }); return cid; };
const cardCid = c => reg('L|' + c.ch + '|' + c.L, [c.ch]);
const partCid = (ch, k) => reg('P|' + ch + '|' + k, [ch]);
const fragCid = f => reg('F|' + hash(f.t), f.ch);
const redCid = r => reg('R|' + hash(r.t), r.ch);
const nodeCid = n => reg('N|' + hash(n.label + n.t), n.ch ? [n.ch] : []);
const calcCid = c => reg('C|' + c.name, c.ch);
D.cards.forEach(cardCid);
D.chapters.forEach(c => '源樣選測算'.split('').forEach(k => c.parts[k] && partCid(c.name, k)));
D.te.forEach(t => { t.frags.forEach(fragCid); t.reds.forEach(redCid); });
D.lines.forEach(l => l.nodes.forEach(nodeCid));
D.props.forEach(p => [...p.tool, ...p.trap].forEach(fragCid));
D.calc.forEach(calcCid);
const eligible = cid => { const u = UNITS.get(cid); return S.mode === 'review' && !!u && u.ch.some(c => S.masked.has(c)); };
const isMasked = cid => eligible(cid) && !S.revealed.has(cid) && !(S.hideKnown && S.prog[cid] === 1);
const chStats = ch => { let t = 0, k = 0; for (const [cid, u] of UNITS) if (u.ch[0] === ch) { t++; if (S.prog[cid] === 1) k++; } return { t, k }; };

// ── 單元渲染 ──
const UI = new Map();
function unit(cid, coord, body, opt = {}) {
  UI.set(cid, { coord, body, opt });
  return unitHTML(cid);
}
function unitHTML(cid) {
  const { coord, body, opt } = UI.get(cid);
  const p = S.prog[cid];
  const cls = ['u', opt.cls || ''];
  if (eligible(cid) && p === 1) cls.push('known'); else if (eligible(cid) && p === 0) cls.push('notyet');
  if (isMasked(cid)) {
    return `<div class="${cls.join(' ')} m" data-cid="${esc(cid)}"><button class="u-cover" data-act="reveal" data-cid="${esc(cid)}" aria-label="回復這一格：${esc(coord.replace(/<[^>]+>/g, ''))}">${coord}<span class="hint">回復</span></button></div>`;
  }
  const marks = eligible(cid) ? `<div class="marks"><button class="k1 ${p === 1 ? 'on k1' : ''}" data-act="mark" data-v="1" data-cid="${esc(cid)}">✓ 念得出來</button><button class="k0 ${p === 0 ? 'on k0' : ''}" data-act="mark" data-v="0" data-cid="${esc(cid)}">✗ 還不行</button></div>` : '';

function qList(qs, limit = 12) {

const nbrCh = qs => `<div class="nbrs">${chCount(qs).map(([c, n]) => go('ch', c, '', `<span class="nbr">${esc(c)} <span class="mono">${n}</span></span>`)).join('')}</div>`;

  const names = [...S.masked].sort((a, b) => CH.indexOf(a) - CH.indexOf(b));
  const summary = `<div class="rbar-row"><span class="keys"><b>遮住：</b>${names.length ? esc(names.join('、')) : '還沒選章'}</span><button class="small-btn" data-act="rbtoggle" aria-expanded="${S.rbOpen}">${S.rbOpen ? '收起 ▴' : '選章 ▾'}</button></div>`;
  rb.innerHTML = `${summary}${S.rbOpen ? `<div class="rbar-row">${chips}</div>` : ''}<div class="rbar-row">
    ${S.rbOpen ? '<button class="small-btn" data-act="maskall">全部遮住</button><button class="small-btn" data-act="masknone">全部打開</button>' : ''}
    <label class="toggle"><input type="checkbox" id="hk" ${S.hideKnown ? 'checked' : ''}> 念得出來的不再遮</label>
    <button class="small-btn" data-act="next">回復下一格 <kbd>Space</kbd></button>
    <span class="keys">這一頁還遮著 <b class="mono">${left}</b> 格 · 本次回復 <b class="mono">${S.revealed.size}</b> 格 · <kbd>J</kbd> 念得出來 <kbd>K</kbd> 還不行</span></div>`;
}

// ── 整體渲染 ──
function render() {
  UI.clear();
  $('#ver').textContent = D.meta.ver + ' · ' + D.meta.NC + ' 卡 · ' + D.meta.NQ + ' 題';
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  $('#main').innerHTML = S.view === 'te' ? viewTe() : S.view === 'ch' ? viewCh() : viewMap();
  renderFocus();
  renderRbar();
}
function setFocus(f, push = true) {
  if (push && S.focus) S.stack.push(S.focus);
  S.focus = f; renderFocus(); renderRbar();
  if (S.view === 'map') { document.querySelectorAll('.cellbtn.sel').forEach(b => b.classList.remove('sel')); if (f && f.t === 'cell') { const b = document.querySelector(`.cellbtn[data-a="${f.a}"][data-b="${f.b}"]`); b && b.classList.add('sel'); } }
  if (!matchMedia('(max-width:960px)').matches) $('#focus').scrollTop = 0; else $('#side').scrollTop = 0;
}

// ── 進度：雲端（db，自己的私人區）＋本機備份 ──
let DB = null, UID = null; const PENDING = new Set(); const QUEUE = {}; const TIMER = {};
const codeOf = ch => (CHO[ch] || {}).code;
function mark(cid, v) {
  S.prog[cid] = v; store.set('prog', S.prog); PENDING.add(cid);
  const u = UNITS.get(cid); const ch = u && u.ch[0];
  refreshUnit(cid); renderRbar();
  if (DB && UID && ch) { clearTimeout(TIMER[ch]); TIMER[ch] = setTimeout(() => flush(ch), 1200); }
}
function flush(ch) {
  const code = codeOf(ch); if (!code) return;
  const body = {}; const sent = [];
  for (const [cid, u] of UNITS) if (u.ch[0] === ch && cid in S.prog) { body[cid] = S.prog[cid]; sent.push(cid); }
  QUEUE[code] = (QUEUE[code] || Promise.resolve()).then(() => DB.collection('data/users/' + UID).doc(code).set({ k: body, ch }))
    .then(() => sent.forEach(c => PENDING.delete(c)))
    .catch(e => { S.sync = '本機（雲端暫時寫不進去）'; const s = $('#sync'); s && (s.textContent = '進度存在：' + S.sync); });
}
async function initStore() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use('user'); if (!user) return;
    UID = await user.id(); if (!UID) return;
    DB = await window.claude.use('db'); if (!DB) return;
    DB.collection('data/users/' + UID).onSnapshot(snap => {
      let changed = false;
      snap.docs.forEach(d => { const b = d.data(); if (b && b.k) for (const [cid, v] of Object.entries(b.k)) if (!PENDING.has(cid) && S.prog[cid] !== v) { S.prog[cid] = v; changed = true; } });
      if (changed) { store.set('prog', S.prog); render(); }
    }, () => { S.sync = '本機'; });
    S.sync = '你的帳號（換裝置也在）'; const s = $('#sync'); s && (s.textContent = '進度存在：' + S.sync);
  } catch (e) { /* 留在本機 */ }
}

// ── 搜尋 ──
let RES = [], RSEL = 0;
function search(q) {
  q = q.trim().toLowerCase(); const out = [];
  if (!q) return out;
  const hit = s => String(s).toLowerCase().includes(q);
  D.props.forEach(p => (hit(p.name) || hit(p.k)) && out.push({ k: '性質', l: p.name, f: { t: 'prop', a: p.k } }));
  D.lines.forEach((l, i) => hit(l.name) && out.push({ k: '線', l: l.name, f: { t: 'line', a: String(i) } }));
  D.chapters.forEach(c => hit(c.name) && out.push({ k: '章', l: c.name, f: { t: 'ch', a: c.name } }));
  D.te.forEach(t => (hit(t.name) || t.frags.some(f => hit(f.t))) && out.push({ k: 'Te', l: t.name, f: { t: 'te', a: String(t.i) } }));
  D.cards.forEach(c => (hit(c.title) || hit(c.ch + ' ' + c.L) || hit(c.ch + c.L) || hit(c.chain)) && out.push({ k: c.ch + ' ' + c.L, l: c.title, f: { t: 'card', a: c.ch, b: c.L } }));
  return out.slice(0, 30);
}
function renderRes() {
  const r = $('#res'); if (!RES.length) { r.hidden = true; return; }
  r.hidden = false; r.innerHTML = RES.map((x, i) => `<button class="${i === RSEL ? 'sel' : ''}" data-act="pick" data-a="${i}"><span class="kind">${esc(x.k)}</span><span>${T(x.l)}</span></button>`).join('');
}

// ── 事件 ──
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-view],[data-mode]'); if (!b) { if (!e.target.closest('.search')) { $('#res').hidden = true; } return; }
  if (b.dataset.view) { S.view = b.dataset.view; savePrefs(); render(); window.scrollTo(0, 0); return; }
  if (b.dataset.mode) { S.mode = b.dataset.mode; if (S.mode === 'review' && !S.masked.size) S.masked.add(S.view === 'ch' ? S.chSel : 'HPLC'); savePrefs(); render(); return; }
  const a = b.dataset.act, x = b.dataset.a, y = b.dataset.b;
  if (a === 'focus') setFocus({ t: b.dataset.t, a: x, b: y });
  else if (a === 'back') { S.focus = S.stack.pop() || null; setFocus(S.focus, false); }
  else if (a === 'close') { S.focus = null; S.stack = []; setFocus(null, false); }
  else if (a === 'reveal') { S.revealed.add(b.dataset.cid); S.last = b.dataset.cid; refreshUnit(b.dataset.cid, true); renderRbar(); }
  else if (a === 'mark') { S.last = b.dataset.cid; mark(b.dataset.cid, +b.dataset.v); }
  else if (a === 'mask') { S.masked.has(x) ? S.masked.delete(x) : S.masked.add(x); savePrefs(); render(); }
  else if (a === 'maskall') { CH.forEach(c => S.masked.add(c)); savePrefs(); render(); }
  else if (a === 'masknone') { S.masked.clear(); savePrefs(); render(); }
  else if (a === 'next') revealNext();
  else if (a === 'rbtoggle') { S.rbOpen = !S.rbOpen; renderRbar(); }
  else if (a === 'chsel') { S.chSel = x; savePrefs(); render(); }
  else if (a === 'opench') { S.chSel = x; S.view = 'ch'; savePrefs(); render(); window.scrollTo(0, 0); }
  else if (a === 'ans') { const n = b.nextElementSibling; if (n) { n.hidden = !n.hidden; b.textContent = n.hidden ? (b.closest('.q') ? '看題本答案' : '看答案') : '收起'; } }
  else if (a === 'more') { const box = document.getElementById(x); if (box) { box.insertAdjacentHTML('beforeend', (QMORE[x] || []).map(qHTML).join('')); b.remove(); } }
  else if (a === 'pick') { const r = RES[+x]; if (r) { setFocus(r.f); $('#res').hidden = true; $('#q').value = ''; RES = []; } }
});
document.addEventListener('change', e => { if (e.target.id === 'hk') { S.hideKnown = e.target.checked; savePrefs(); render(); } });
function revealNext() {
  const el = document.querySelector('#main .u.m') || document.querySelector('#focus .u.m'); if (!el) return;
  const cid = el.dataset.cid; S.revealed.add(cid); S.last = cid; refreshUnit(cid, true); renderRbar();
  const n = document.querySelector(`.u[data-cid="${CSS.escape(cid)}"]`); n && n.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
const qi = $('#q');
qi.addEventListener('input', () => { RES = search(qi.value); RSEL = 0; renderRes(); });
qi.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { RSEL = Math.min(RSEL + 1, RES.length - 1); renderRes(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { RSEL = Math.max(RSEL - 1, 0); renderRes(); e.preventDefault(); }
  else if (e.key === 'Enter' && RES[RSEL]) { setFocus(RES[RSEL].f); $('#res').hidden = true; qi.value = ''; RES = []; qi.blur(); }
  else if (e.key === 'Escape') { qi.value = ''; RES = []; renderRes(); qi.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { qi.focus(); e.preventDefault(); }
  else if (e.key === ' ' && S.mode === 'review') { revealNext(); e.preventDefault(); }
  else if ((e.key === 'j' || e.key === 'J') && S.last && eligible(S.last)) mark(S.last, 1);
  else if ((e.key === 'k' || e.key === 'K') && S.last && eligible(S.last)) mark(S.last, 0);
  else if (e.key === 'Escape' && S.focus) { S.focus = null; S.stack = []; setFocus(null, false); }
  else if (e.key === '1' || e.key === '2' || e.key === '3') { S.view = ['map', 'te', 'ch'][+e.key - 1]; savePrefs(); render(); }
  else if (e.key === 'm') { S.mode = S.mode === 'review' ? 'explore' : 'review'; if (S.mode === 'review' && !S.masked.size) S.masked.add(S.chSel); savePrefs(); render(); }
});
addEventListener('resize', () => $('#side').classList.toggle('open', !!S.focus && matchMedia('(max-width:960px)').matches));

render();
initStore();
})();
</script>
