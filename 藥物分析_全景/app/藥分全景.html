<title>藥分全景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 暗色優先：bare :root＝深墨；亮色＝總論 SVG 的米白紙 */
:root{
  --bg:#12161b;--bg2:#171c22;--panel:#1b2128;--card:#20272f;--ink:#e8e3d4;--ink2:#b9b4a6;--mute:#8d969c;
  --line:#2c343d;--line2:#3a444e;--acc:#e0b85c;--acc-ink:#1b1608;--hl:#e0b85c33;--ok:#7fb98f;--bad:#e3808f;
  --dash:#8d969c;--shadow:0 10px 30px #0007;--img:invert(.9) hue-rotate(180deg);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f8f6ee;--bg2:#f1eee2;--panel:#fffdf7;--card:#fffdf7;--ink:#202b32;--ink2:#46525a;--mute:#6b767d;
  --line:#ddd7c6;--line2:#c9c2ae;--acc:#9b782b;--acc-ink:#fff;--hl:#f3d98a66;--ok:#326345;--bad:#a82940;
  --dash:#8a8f86;--shadow:0 10px 30px #3a32201f;--img:none;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f8f6ee;--bg2:#f1eee2;--panel:#fffdf7;--card:#fffdf7;--ink:#202b32;--ink2:#46525a;--mute:#6b767d;
  --line:#ddd7c6;--line2:#c9c2ae;--acc:#9b782b;--acc-ink:#fff;--hl:#f3d98a66;--ok:#326345;--bad:#a82940;
  --dash:#8a8f86;--shadow:0 10px 30px #3a32201f;--img:none;
  color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.serif{font-family:"Noto Serif TC","Songti TC",serif}
.mono,code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC",serif;text-wrap:balance;margin:0;line-height:1.35}
/* 頂列：返回＋座標列＋工具 */
#scrim{display:none;position:fixed;inset:0;background:#0006;z-index:35}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:45;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px;padding:8px 16px;max-width:1500px;margin:0 auto}
.back{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:18px;line-height:1}
.back:disabled{opacity:.35;cursor:default}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;font-size:14px}
.crumb::-webkit-scrollbar{display:none}
.crumb a{text-decoration:none;padding:3px 7px;border-radius:6px;color:var(--ink2)}
.crumb a:hover{background:var(--hl);color:var(--ink)}
.crumb a:last-child{color:var(--ink);font-weight:700}
.crumb .sep{color:var(--mute);padding:0 1px}
.crumb a[data-f]{box-shadow:inset 0 -2px 0 var(--fc)}
.tools{flex:none;display:flex;gap:6px}
.tb{height:34px;min-width:34px;padding:0 9px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:13px;white-space:nowrap}
.tb[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.lens{display:flex;gap:4px;padding:0 16px 8px;max-width:1500px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.lens a{flex:none;text-decoration:none;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
.lens a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lens kbd{font-size:10.5px;opacity:.6;margin-left:4px;background:transparent;color:inherit;border-color:currentColor}
/* 版面：舞台＋焦點欄 */
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr) var(--fw,440px);gap:22px;align-items:start}
.stage{min-width:0;padding-block:18px 80px}
.focus{position:sticky;top:calc(var(--toph,92px) + 10px);max-height:calc(100vh - var(--toph,92px) - 20px);overflow:auto;margin-top:18px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:18px 18px 24px;min-width:0}
.focus .x{display:none}
@media (max-width:699px){.grip{display:none}}
body.read .wrap{grid-template-columns:minmax(0,1fr)}
body.read .focus{display:none}
@media (max-width:699px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .focus{position:static;max-height:none;margin:0 0 60px}
  body.sheet .focus{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;margin:0;max-height:82vh;border-radius:16px 16px 0 0;
    box-shadow:var(--shadow);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
  body.sheet .focus .x{display:flex;position:sticky;top:-18px;margin:-18px -18px 10px;padding:8px 12px;background:var(--panel);
    border-bottom:1px solid var(--line);justify-content:space-between;align-items:center;z-index:2}
  body.sheet #scrim{display:block}
  .top-in{padding-inline:12px}.tb .lbl{display:none}
}
/* iPad 直放（mini 744、Pro 11 834、Pro 12.9 1024）：焦點欄固定在右側，不蓋住地圖 */
@media (min-width:700px) and (max-width:1099px){
  .wrap{grid-template-columns:minmax(0,1fr) var(--fw,340px);gap:14px;padding-inline:14px}
  .focus{padding:14px 14px 20px}
  .focus h2{font-size:19px}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shapes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .twin{grid-template-columns:minmax(0,1fr)}
  .lines{columns:1}
  .tb .lbl{display:none}
}
/* 觸控：按鈕與連結至少 40px 高 */
/* 說明欄收起：沒有開卡、題、M 站等內容時，右欄不佔位置 */
body.noguide .wrap{grid-template-columns:minmax(0,1fr)}
body.noguide .focus{display:none}
.fhide{float:right;margin:-4px -4px 0 8px}
/* 焦點欄寬度：左緣把手（背景畫的，不跟著捲動）可拖曳；上方三段切換 */
.grip{position:sticky;top:45%;float:left;width:22px;height:64px;margin:0 -22px 0 -18px;touch-action:none;cursor:col-resize;z-index:3;display:grid;place-items:center}
.grip::before{content:"";width:5px;height:44px;border-radius:3px;background:var(--line2)}
.grip:hover::before,body.resizing .grip::before{background:var(--acc)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.wctl{display:flex;gap:3px;align-items:center;justify-content:flex-end;margin:-6px -4px 8px 0;font-size:12px;color:var(--mute)}
.wctl button{font:inherit;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--ink2)}
.wctl button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (pointer:coarse){.wctl button{padding:6px 12px}}
@media (max-width:699px){.wctl{display:none}}
/* 平板與手機：只看圖、沒開卡時，焦點欄收起，圖用滿寬 */
@media (max-width:1099px){body.figonly .wrap{grid-template-columns:minmax(0,1fr)} body.figonly .focus{display:none}}
@media (pointer:coarse){
  .back,.tb{height:42px;min-width:42px}
  .crumb a{padding:9px 8px}
  .lens a{padding:7px 13px}
  .chip{padding:5px 11px}
  .lrow .fs a{padding:4px 9px;font-size:13px}
  .filt button{padding:6px 12px}
  .flist a{padding:8px 0}
  .figtabs a{padding:7px 12px}
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
/* 共用 */
.kicker{font-size:12px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.muted{color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);
  background:var(--card);text-decoration:none;white-space:nowrap;line-height:1.6}
a.chip:hover{border-color:var(--ink2)}
.bd{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:6px;font:700 13px/1 "Noto Serif TC",serif;
  background:var(--ink);color:var(--bg)}
.bd.dim{background:transparent;color:var(--mute);border:1px dashed var(--line2)}
.md-tag{font:600 11px/1.6 "IBM Plex Mono",monospace;padding:0 6px;border-radius:5px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.how{font-size:12px;padding:0 7px;border-radius:5px;white-space:nowrap}
.how.h1{background:var(--hl)}.how.h2{border:1px solid var(--line2)}.how.h3{border:1px dashed var(--dash);color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
  cursor:pointer;text-decoration:none;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sec{margin-top:26px}
.sec>h3{font-size:17px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.sec>h3 .muted{font:400 13px "Noto Sans TC",sans-serif}
.arrow{text-align:center;color:var(--mute);font-size:18px;line-height:1;margin:6px 0}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;background:var(--ok)}.bar i.k{background:var(--bad)}
.sel{outline:2px solid var(--acc);outline-offset:2px;background:var(--hl)!important}
.pulse{animation:pulse 1.2s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--acc)}100%{box-shadow:0 0 0 14px transparent}}
/* L0 大循環 */
.mother{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--ft,var(--panel));--ft:var(--t-ans);--fc:var(--f-ans)}
.mother h1{font-size:26px}
.mother p{margin:.5em 0 0;max-width:72ch}
.layer{border:1.5px solid var(--fc);border-radius:16px;padding:14px 16px 16px;background:var(--bg2)}
.layer>.lh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.layer>.lh b{font:700 18px "Noto Serif TC",serif;color:var(--fc)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ftile{border:1.5px solid var(--fc);background:var(--ft);border-radius:12px;padding:10px 12px;text-decoration:none;display:block;min-width:0}
.ftile:hover{box-shadow:var(--shadow)}
.ftile h3{font-size:17px;color:var(--fc)}
.ftile p{margin:2px 0 8px;font-size:13px;color:var(--ink2)}
.ftile .row a{font-size:12.5px}
.shapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shape{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 10px;text-decoration:none;font-size:13.5px;font-weight:600;display:block}
.shape span{display:block;font-weight:400;color:var(--mute);font-size:12px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.badges a{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:13px;padding:5px 8px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.twin{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.lines{columns:2;column-gap:18px;font-size:13.5px}
.lines a{display:block;text-decoration:none;padding:2px 0;break-inside:avoid}
.lines a b{font-family:"IBM Plex Mono",monospace;color:var(--mute);margin-right:6px}
/* L1 場域帶 */
.fhead{border-left:6px solid var(--fc);padding:4px 0 4px 14px}
.fhead h1{font-size:28px;color:var(--fc)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:16px}
.chcard{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--fc);border-radius:14px;padding:12px 14px;background:var(--card);text-decoration:none;min-width:0}
.chcard.shadow{border-style:dashed;background:transparent}
.chcard h3{font-size:18px}
.chcard .mid{font:700 14px "Noto Serif TC",serif;color:var(--fc)}
.chcard .core{font-size:12.5px;color:var(--ink2);line-height:1.55}
.chcard .stat{display:flex;gap:10px;font-size:12px;color:var(--mute)}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.mini i{display:block;height:100%}
.heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.heat th:first-child{width:230px}
.heat th{font-weight:500;color:var(--mute);text-align:left;white-space:nowrap;padding:2px 6px}
.heat td{text-align:center;border-radius:6px;padding:4px 2px;min-width:34px}
.heat td a{display:block;text-decoration:none}
.scroll{overflow-x:auto}
/* L2 章：M 主幹 */
.chead{border:1.5px solid var(--fc);border-radius:16px;padding:16px 18px;background:var(--ft)}
.chead h1{font-size:28px}
.chead .mid{font:700 18px "Noto Serif TC",serif;color:var(--fc)}
.chead .core{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:13.5px;margin-top:6px;color:var(--ink)}
.spine{position:relative;margin-top:18px;padding-left:28px}
.spine::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--fc);opacity:.55}
.st{position:relative;margin-bottom:16px}
.st::before{content:"";position:absolute;left:-24px;top:7px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--fc)}
.st>.sh{display:flex;gap:10px;align-items:baseline;text-decoration:none}
.st>.sh .code{font:600 13px "IBM Plex Mono",monospace;color:var(--fc);flex:none}
.st>.sh .desc{font-size:14px;color:var(--ink2)}
.ls{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lrow{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:7px 10px;min-width:0}
.lrow>a{display:flex;align-items:center;gap:8px;text-decoration:none}
.lrow>a .n{font:600 13px "IBM Plex Mono",monospace;color:var(--mute);flex:none;min-width:30px}
.lrow>a .t{flex:1;min-width:0;font-weight:600}
.lrow>a .q{font:12px "IBM Plex Mono",monospace;color:var(--mute);flex:none}
.lrow .fs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0 30px}
.lrow .fs a{font-size:12px;text-decoration:none;padding:0 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.state-J{box-shadow:inset 3px 0 0 var(--ok)}.state-K{box-shadow:inset 3px 0 0 var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:5px}
.fgrid a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card);display:flex;gap:6px;min-width:0}
.fgrid a .n{font:600 12px "IBM Plex Mono",monospace;color:var(--mute);flex:none}
.fgrid a span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlist{display:flex;flex-direction:column;gap:4px}
.qrow{display:flex;gap:8px;align-items:flex-start;text-decoration:none;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13.5px;min-width:0}
.qrow.re{border-style:dashed;background:transparent}
.qrow .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qrow .src{font:11.5px "IBM Plex Mono",monospace;color:var(--mute);flex:none}
.filt{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.filt button{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);background:transparent;cursor:pointer}
.filt button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* 焦點欄內容 */
.fk{font-size:12px;color:var(--mute);margin-bottom:4px}
.focus h2{font-size:21px;margin-bottom:6px}
.body{font-size:14.5px;line-height:1.8;overflow-wrap:anywhere}
.body p{margin:.55em 0}
.body ul,.body ol{padding-left:1.3em;margin:.4em 0}
.body table{border-collapse:collapse;font-size:13px;margin:.6em 0;width:max-content;max-width:none}
.body .tw{overflow-x:auto;max-width:100%}
.body th,.body td{border:1px solid var(--line2);padding:3px 7px;vertical-align:top}
.body th{background:var(--bg2)}
.body blockquote{margin:.6em 0;padding:6px 12px;border-left:3px solid var(--line2);background:var(--bg2);border-radius:0 8px 8px 0}
.body a.j{color:var(--acc);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.body img{filter:var(--img);max-width:100%}
.body code{font-size:.9em}
.body pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg2);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.7}
.also{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bg2);font-size:13.5px}
.also p{margin:4px 0}
.also a{color:var(--acc);text-decoration:none;white-space:nowrap}
.also a:hover{text-decoration:underline}
.also b{font-weight:700}
.flist{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column}
.flist li{border-top:1px dotted var(--line2)}
.flist li:first-child{border-top:0}
.flist a{display:block;padding:5px 0;color:var(--acc);text-decoration:none;white-space:normal}
.flist .ev{font-size:11.5px;color:var(--mute);margin-left:6px}
.reveal{margin-top:12px}
.opts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.opt{display:flex;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);min-width:0}
.opt b{font-family:"IBM Plex Mono",monospace;flex:none}
.opt img,.stem img{filter:var(--img);max-width:100%;height:auto;display:block;margin:4px 0;max-height:170px;width:auto}
.stem img{max-height:260px}
.opt.ans{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.recard{border:1.5px dashed var(--dash);border-radius:12px;padding:10px 12px;margin-top:10px}
.recard .lab{font-size:12px;color:var(--mute);letter-spacing:.06em}
.recard dt{font-weight:700;font-size:13px;margin-top:6px}
.recard dd{margin:0;font-size:14px}
.cover{position:relative;border:1.5px dashed var(--line2);border-radius:12px;padding:30px 14px;text-align:center;color:var(--mute);cursor:pointer;margin-top:10px}
.jk{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.jk .btn.j{border-color:var(--ok)}.jk .btn.k{border-color:var(--bad)}
.rvbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--hl);margin-bottom:12px;font-size:13px}
.rvbar .bar{flex:1}
.guide ol{padding-left:1.2em;margin:.4em 0}
.guide li{margin:.25em 0}
kbd{font:600 11.5px "IBM Plex Mono",monospace;padding:0 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:var(--card)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0}
.statgrid div{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card)}
.statgrid b{display:block;font:600 18px "IBM Plex Mono",monospace}
.statgrid span{font-size:12px;color:var(--mute)}
/* 我的筆記 */
.note{border:1px solid var(--line2);border-radius:12px;padding:8px 12px 10px;margin:0 0 14px;background:var(--card)}
.note.empty{border-style:dashed;background:transparent;padding:4px 10px}
.note .nh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.note .nh b{color:var(--ink);font-size:13.5px}
.note .nh .sp{flex:1}
.note .nh button{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;color:var(--ink)}

"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const SS={get(k,d){try{const v=sessionStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const APP="藥分全景";
/* ───────── 狀態 ───────── */
const S={idx:null,qs:[],Q:{},chData:{},chWait:{},route:null,stageKey:"",sel:{},review:LS.get("pan.review",false),
  stack:SS.get("pan.stack",[]),hideGuide:LS.get("pan.hideGuide",false),fw:LS.get("pan.fw","std"),pos:SS.get("pan.pos",{}),prog:{v:1,at:0,m:{}},qfilt:{},revealed:false};
let IDX,CH={},CHN={},FLD={},BADGE={},BCODE={},BDEC={},LINE_OF={},QBYCARD={},QBYCH={},LBYID={},CHORD=[];
const CIRC="①②③④⑤";
/* ───────── 舊版進度（藥分全景 v1：每張 L 0／1）→ J／K ───────── */
function migrateOld(obj){let n=0;if(!obj||typeof obj!=="object")return 0;
  for(const [cid,v] of Object.entries(obj)){const m=/^L\|(.+?)\|(.+)$/.exec(cid);if(!m)continue;const c=CHN[m[1]];if(!c)continue;
    const l=c.L.find(x=>x.tag===m[2]);if(!l)continue;const key="c:"+c.key+"."+l.id;if(S.prog.m[key])continue;
    if(v===1){S.prog.m[key]="J"+today();n++}else if(v===0){S.prog.m[key]="K20000101";n++}}
  return n}
/* ───────── 進度：雲端 db（每人一份）→ 退回本機 ───────── */
const Prog={db:null,ref:null,timer:null,busy:false,dirty:false,
  load(){const p=LS.get("pan.prog",null);if(p&&p.m)S.prog=p;
    if(!LS.get("pan.mig",false)){let old=null;try{old=JSON.parse(localStorage.getItem("yfqj:prog")||"null")}catch(e){}

  async cloud(){
    try{
      if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!db||!user)return;
      const id=await user.id(); if(!id)return;
      this.ref=db.doc("data/users/"+id+"/progress");
      const snap=await this.ref.get();
      let d=snap.exists?(snap.data()||{}):{};
      if(snap.exists){const m=d.m||{};
        S.prog.m=(d.at||0)>=(S.prog.at||0)?Object.assign({},S.prog.m,m):Object.assign({},m,S.prog.m);
        S.prog.at=Math.max(d.at||0,S.prog.at||0);LS.set("pan.prog",S.prog);paintProgress()}
      this.db=db;toast("進度與筆記已連上你的帳號");
      let need=!snap.exists&&Object.keys(S.prog.m).length;
      // 舊版把每章進度存在 data/users/<id>/c01…c20：只搬一次
      if(!d.mig){try{const old=await db.collection("data/users/"+id).get();let n=0;
        old.docs.forEach(x=>{if(/^c\d\d$/.test(x.id)){const b=x.data();if(b&&b.k)n+=migrateOld(b.k)}});

  async flush(){if(!this.ref)return;if(this.busy){this.dirty=true;return}

};
/* ───────── 我的筆記：每一格一份，存在帳號私人空間，各裝置即時同步 ───────── */
const Notes={col:null,map:LS.get("pan.notes",{}),tm:{},busy:{},dirty:{},editing:null,first:true,
  init(db,uid){try{this.col=db.doc("data/users/"+uid+"/meta").collection("notes");
    this.col.onSnapshot(sn=>{const ids=[];
      sn.docChanges().forEach(ch=>{const id=ch.doc.id;if(this.dirty[id]||this.busy[id])return;
        if(ch.type==="removed"){if(this.map[id]){delete this.map[id];ids.push(id)}return}
        const d=ch.doc.data()||{},cur=this.map[id];
        if(!cur||(d.at||0)>(cur.at||0)||(d.at===cur.at&&d.t!==cur.t)){this.map[id]={t:d.t||"",at:d.at||0,label:d.label||"",h:d.h||""};ids.push(id)}});
      if(this.first){this.first=false;const have=new Set(sn.docs.map(x=>x.id));
        Object.keys(this.map).forEach(id=>{if(!have.has(id)){this.dirty[id]=true;this.flush(id)}})}
      LS.set("pan.notes",this.map);if(ids.length)notesChanged(ids);noteStatus()},()=>{this.col=null;noteStatus()});
    noteStatus()}catch(e){this.col=null}},
  get(id){return this.map[id]},
  set(id,t,label,h){if(t.trim())this.map[id]={t,at:Date.now(),label,h};else delete this.map[id];
    LS.set("pan.notes",this.map);this.dirty[id]=true;clearTimeout(this.tm[id]);this.tm[id]=setTimeout(()=>this.flush(id),900);noteStatus("儲存中…")},
  async flush(id){clearTimeout(this.tm[id]);if(!this.col){this.dirty[id]=false;noteStatus();return}

    catch(e){toast(e&&e.code==="quota_exceeded"?"雲端空間已滿，筆記先存在這台裝置":"筆記暫時沒同步，已存在這台裝置");this.dirty[id]=true}

  if(k==="gt"){const C=chNameRe();re=C.re;target=m=>{const h=C.al[m[1]];if(!h)return null;if(h==="g.gt."+g)return null;
      if(m[3]&&h.startsWith("c.")){const c=h.slice(2),L=Lof(c,+m[3]);if(L)return "k."+c+"."+L.id}return h}}
  else{const c=CH[k];re=/\b(L\d{1,2}|NAT\d{2}|M0\d)\b|(第[1-4]站)/g;
    target=m=>{if(m[2])return c.M.length>=+m[2][1]?`m.${k}.${+m[2][1]-1}`:null;
      const t=m[1];if(t[0]==="L"||t[0]==="N"){const L=Lof(k,+t.replace(/\D/g,""));return L?`g.${k}.${g}.${L.id}`:null}
      const i=c.M.findIndex(x=>x.code===t);return i>=0?`m.${k}.${i}`:null}}
  nodes.forEach(n=>{const p=n.parentNode;if(!p||!/^(text|tspan|textPath)$/i.test(p.nodeName))return;const s=n.nodeValue;re.lastIndex=0;
    const frag=document.createDocumentFragment();let last=0,m,hit=false;
    while((m=re.exec(s))){const h=target(m);if(!h)continue;hit=true;if(m.index>last)frag.append(s.slice(last,m.index));
      const t=document.createElementNS(SVGNS,"tspan");t.setAttribute("class","svl");t.setAttribute("data-h",h);t.textContent=m[0];frag.append(t);last=m.index+m[0].length}
    if(!hit)return;if(last<s.length)frag.append(s.slice(last));p.replaceChild(frag,n)})}

function startReview(k){if(!S.review)setReview(true);const nx=reviewQueue(k).find(h=>due(keyOf(h)));if(nx)go(nx);else toast("本章今天沒有要複習的卡")}
const FW={std:"標準",wide:"寬",xwide:"很寬"};
function wrapW(){return Math.min(1500,innerWidth)-(innerWidth<1100?28:32)}
function fwPx(m){const W=wrapW();if(m==="wide")return Math.round(W*.5);if(m==="xwide")return Math.round(W*.66);return typeof m==="number"?m:null}
function applyFW(){const root=document.documentElement;let px=fwPx(S.fw);
  if(px==null||innerWidth<700){root.style.removeProperty("--fw");return}
  px=Math.max(280,Math.min(px,wrapW()-280));root.style.setProperty("--fw",px+"px")}
function setFW(m,quiet){S.fw=m;LS.set("pan.fw",m);applyFW();$$(".wctl button").forEach(b=>b.classList.toggle("on",b.dataset.w===String(m)));if(!quiet)toast("說明欄寬度："+(FW[m]||Math.round(m)+"px"))}
function wctl(){return `<div class="wctl">寬度 ${Object.entries(FW).map(([k,t])=>`<button data-act="fw" data-w="${k}" class="${S.fw===k?"on":""}">${t}</button>`).join("")}</div>`}
function paintFocus(){let h=focus(S.route);if(!h){$("#focus").innerHTML="";return}
  const nb=noteBlock();let head="";if(h.startsWith('<div class="x">')){const i=h.indexOf("</div>")+6;head=h.slice(0,i);h=h.slice(i)}
  $("#focus").innerHTML=head+`<div class="grip" title="拖曳調整寬度；點一下切換 標準／寬／很寬"></div>`+wctl()+nb+h;
  const ta=$("#nta");if(ta)bindNoteTA(ta);paintNoteMarks();paintProgress()}
(()=>{const f=$("#focus");let drag=null;
  const near=e=>{if(innerWidth<700)return false;if(e.target.closest&&e.target.closest(".grip"))return true;const r=f.getBoundingClientRect();return e.pointerType==="mouse"&&e.clientX-r.left<12&&e.clientX>=r.left-4};
  f.addEventListener("pointermove",e=>{if(!drag)f.style.cursor=near(e)?"col-resize":""});
  f.addEventListener("pointerdown",e=>{if(!near(e))return;e.preventDefault();drag={x:e.clientX,w:f.getBoundingClientRect().width,moved:false};
    f.setPointerCapture(e.pointerId);document.body.classList.add("resizing")});
  f.addEventListener("pointermove",e=>{if(!drag)return;const dx=drag.x-e.clientX;if(Math.abs(dx)>3)drag.moved=true;
    if(drag.moved){S.fw=Math.round(drag.w+dx);applyFW()}});
  const end=()=>{if(!drag)return;document.body.classList.remove("resizing");
    if(drag.moved)setFW(S.fw,true);else{const o=["std","wide","xwide"],i=o.indexOf(S.fw);setFW(o[(i+1)%3])}drag=null};
  f.addEventListener("pointerup",end);f.addEventListener("pointercancel",end)})();
addEventListener("resize",applyFW);
addEventListener("pagehide",()=>Notes.flushAll());document.addEventListener("visibilitychange",()=>{if(document.hidden)Notes.flushAll()});
function setGuide(show){S.hideGuide=!show;LS.set("pan.hideGuide",S.hideGuide);$("#bPanel").setAttribute("aria-pressed",String(show));
  const r=S.route;document.body.classList.toggle("noguide",S.hideGuide&&!r.sheet&&!r.read);toast(show?"說明欄打開":"說明欄收起；開卡或題目時仍會出現")}
function setReview(v){S.review=v;LS.set("pan.review",v);$("#bReview").setAttribute("aria-pressed",String(v));
  paintFocus();paintProgress();toast(v?"複習模式：Space 翻開，J／K 標記":"複習模式關閉")}
function step(d){const r=S.route;
  if(r.g&&!r.a){const fs=IDX.figs[r.gch],i=fs.indexOf(figOf(r.gch,r.g)),nx=fs[i+d];if(nx)go("g."+r.gch+"."+nx[0]);return}
  if(r.read){const n=chSeq(r.ch).length,i=r.i+d;if(i>=0&&i<n)go("r."+r.ch+"."+i);return}
  if(r.a){const seq=chSeq(r.ch).filter(x=>x.t==="c"),i=seq.findIndex(x=>x.a===r.a);const nx=seq[i+d];if(nx)go((r.g?"g."+r.ch+"."+r.g+".":"k."+r.ch+".")+nx.a);return}
  if(r.q){const l=(QBYCH[r.ch]||[]),i=l.indexOf(r.q),nx=l[i+d];if(nx)go("q."+nx)}}
let toastT;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1600)}
/* ───────── 搜尋 ───────── */
let SIDX=null;
function buildSearch(){SIDX=[];const P=(k,t,c,h)=>SIDX.push({k,t,c,h,l:t.toLowerCase()});
  IDX.fields.forEach(f=>P("帳",f.name,f.desc,"f."+f.key));
  IDX.chapters.forEach(c=>{P("章",c.name+" "+(c.mid||""),FLD[c.field].name,"c."+c.key);
    c.M.forEach((m,i)=>P("M",m.code+" "+m.desc,c.name,"m."+c.key+"."+i));
    c.L.forEach(l=>P("L",`${Lt(l)} ${l.name}`,c.name,"k."+c.key+"."+l.id));
    (c.fp||[]).forEach((t,i)=>P("五格",CIRC[i]+" "+t,c.name,"fp."+c.key+"."+(i+1)))});
  IDX.badges.forEach(([g,n])=>P("性質",g+" "+n,IDX.props[g].read,"mx."+BCODE[g]));
  IDX.four.forEach((s,i)=>P("站",s.code+" "+s.name,"四站","s."+(i+1)));
  IDX.lines.forEach(l=>P("線",l.name,l.rule,"l."+l.n));
  Object.entries(IDX.figs||{}).forEach(([k,fs])=>fs.forEach(f=>P("圖",(k==="gt"?"全科｜":CH[k].name+"｜")+f[1],f[5],"g."+k+"."+f[0])));
  IDX.te.forEach((r,i)=>P("Te",r.w,r.ch.map(c=>CH[c]?.name).join("、"),"te."+i));
  S.qs.forEach(q=>P("題",(q.s||q.t)+" ｜ "+Object.values(q.o).join(" ／ "),q.src[0][0]+" "+q.src[0][1],"q."+q.id))}
function openSearch(){if(!SIDX)buildSearch();if($(".sbox"))return;
  const box=document.createElement("div");box.className="sbox";
  box.innerHTML=`<div class="in" role="dialog" aria-label="搜尋"><input id="sq" placeholder="方法、零件、L、章、性質… （含大寫時分大小寫：NO ≠ no）" autocomplete="off"><div class="sres" id="sres"><p class="muted" style="padding:8px 10px">輸入關鍵字；↑↓ 選擇，Enter 前往，Esc 關閉。</p></div></div>`;
  document.body.appendChild(box);const inp=$("#sq");inp.focus();let sel=0,res=[];
  const draw=()=>{const q=inp.value.trim();if(!q){$("#sres").innerHTML="";return}
    const cs=/[A-Z]/.test(q),ql=q.toLowerCase();
    res=SIDX.map(e=>{const hay=cs?e.t:e.l,nd=cs?q:ql,i=hay.indexOf(nd);if(i<0)return null;
      const kr={"章":0,"帳":0,"圖":1,"L":1,"Te":1,"性質":1,"線":2,"站":2,"M":3,"五格":4,"題":6}[e.k]??5;
      return [kr*100+(i===0?0:i<4?20:50)+Math.min(e.t.length,40)/4,e]}).filter(Boolean)
      .concat(Object.entries(Notes.map).filter(([k,n])=>(cs?n.t:n.t.toLowerCase()).includes(cs?q:ql)).map(([k,n])=>[50,{k:"筆記",t:n.t.replace(/\s+/g," ").slice(0,60),c:n.label||k,h:n.h||k}]))
      .sort((a,b)=>a[0]-b[0]).slice(0,60).map(x=>x[1]);
    sel=0;$("#sres").innerHTML=res.length?res.map((e,i)=>`<a href="#${e.h}" class="${i===sel?"on":""}"><span class="k">${e.k}</span><span class="t">${esc(e.t)}</span><span class="c">${esc(e.c)}</span></a>`).join(""):`<p class="muted" style="padding:8px 10px">找不到「${esc(q)}」。</p>`};
  const close=()=>box.remove();
  inp.addEventListener("input",draw);
  inp.addEventListener("keydown",e=>{const a=$$("#sres a");
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(a.length-1,sel+(e.key==="ArrowDown"?1:-1)));a.forEach((x,i)=>x.classList.toggle("on",i===sel));a[sel]?.scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"){e.preventDefault();if(res[sel]){close();go(res[sel].h)}}
    else if(e.key==="Escape"){e.preventDefault();close()}});
  box.addEventListener("click",e=>{if(e.target===box)close();else if(e.target.closest("a"))close()})}
/* ───────── 鍵盤 ───────── */
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select,[contenteditable]")||e.metaKey||e.ctrlKey||e.altKey)return;
  if($(".sbox"))return;
  const k=e.key;
  if(k==="/"){e.preventDefault();openSearch()}
  else if(k==="Backspace"){e.preventDefault();back()}
  else if(k==="Escape"){if(S.route.sheet||S.route.read){e.preventDefault();back()}}
  else if(k==="1")go("home");else if(k==="2")go("mx");else if(k==="3")go("fp");else if(k==="4")go("te");else if(k==="5")go("notes");
  else if(k==="e"||k==="E"){if(noteKey(S.route)&&$("#noteblk")){e.preventDefault();startEdit()}}
  else if(k==="m"||k==="M")setReview(!S.review);
  else if(k==="h"||k==="H")setGuide(S.hideGuide);
  else if(k==="["||k==="]"){const o=["std","wide","xwide"];let i=o.indexOf(S.fw);if(i<0)i=0;i=Math.max(0,Math.min(2,i+(k==="]"?1:-1)));setFW(o[i])}
  else if(k===" "){if(S.route.q||(S.route.a&&S.review)){e.preventDefault();reveal()}}
  else if((k==="j"||k==="J")&&S.review&&curItem()){markAndNext("J")}
  else if((k==="k"||k==="K")&&S.review&&curItem()){markAndNext("K")}
  else if(k==="ArrowRight"&&(S.route.read||S.route.a||S.route.q||S.route.g)){e.preventDefault();step(1)}
  else if(k==="ArrowLeft"&&(S.route.read||S.route.a||S.route.q||S.route.g)){e.preventDefault();step(-1)}
});
$("#back").addEventListener("click",back);
const setTop=()=>document.documentElement.style.setProperty("--toph",$(".top").offsetHeight+"px");
addEventListener("resize",setTop);setTop();applyFW();
$("#scrim").addEventListener("click",back);
$("#bSearch").addEventListener("click",openSearch);
$("#bReview").addEventListener("click",()=>setReview(!S.review));
$("#bPanel").addEventListener("click",()=>setGuide(S.hideGuide));
$("#bPanel").setAttribute("aria-pressed",String(!S.hideGuide));
$("#bTheme").addEventListener("click",()=>{const r=document.documentElement;
  const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  r.dataset.theme=cur==="dark"?"light":"dark";LS.set("pan.theme",r.dataset.theme)});
(()=>{const t=LS.get("pan.theme",null);if(t)document.documentElement.dataset.theme=t})();
$("#bReview").setAttribute("aria-pressed",String(S.review));
/* ───────── 啟動 ───────── */
(async()=>{
  try{[IDX,S.qs]=await Promise.all([getJSON("data/index.json"),getJSON("data/q.json")])}
  catch(e){$("#stage").innerHTML=`<p>資料載入失敗：${esc(e.message)}。請重新整理頁面。</p>`;return}
  build();Prog.load();
  window.addEventListener("hashchange",onHash);
  if(!S.stack.length||S.stack[S.stack.length-1]!==(location.hash.replace(/^#/,"")||"home"))S.stack=[location.hash.replace(/^#/,"")||"home"];
  S.cur=S.stack[S.stack.length-1];
  await render(true);
  Prog.cloud().then(()=>{const n=$("#cloudnote");if(n&&Prog.ref)n.textContent="進度存在你的帳號（雲端）。"});
})();
</script>
