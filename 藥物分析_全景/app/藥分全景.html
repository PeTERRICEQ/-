<title>藥分全景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* 版面：上方固定座標列；左邊是地圖／Te／章節三種視圖，右邊是焦點欄（窄螢幕變成全螢幕抽屜）。
   顏色：冷白紙＋深藏青墨水；遮罩用斜線網點；會＝綠、還不行＝琥珀。 */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --sunk:#eef2f6; --ink:#17243a; --muted:#5f6c7d; --line:#d6dde6;
  --accent:#1f4f8a; --accent-ink:#ffffff; --good:#1f7a4d; --warn:#b26a00; --red:#b3262e;
  --hatch:#c9d3df; --shadow:0 1px 2px rgba(23,36,58,.06),0 4px 14px rgba(23,36,58,.06);
  --f-display:'Noto Serif TC','Noto Sans TC',serif; --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --sunk:#1b2430; --ink:#dfe6ee; --muted:#93a0b0; --line:#2a3646;
  --accent:#8db3e8; --accent-ink:#0e131a; --good:#5cc08d; --warn:#e2a948; --red:#f08a8f; --hatch:#2c3846;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --sunk:#1b2430; --ink:#dfe6ee; --muted:#93a0b0; --line:#2a3646;
  --accent:#8db3e8; --accent-ink:#0e131a; --good:#5cc08d; --warn:#e2a948; --red:#f08a8f; --hatch:#2c3846;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.red{color:var(--red)}

/* 上方列 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.02em;margin-right:4px;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.seg.mode button[aria-pressed="true"][data-mode="review"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;font-size:14px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:30}
.results button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;border-bottom:1px solid var(--line)}
.results button:hover,.results button.sel{background:var(--sunk)}
.results .kind{font-size:11px;color:var(--muted);min-width:3.2em}

/* 複習列 */
.rbar{border-top:1px dashed var(--line);padding:8px 16px 10px;display:grid;gap:8px}
.rbar-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.ledger{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ledger>b{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .bar{width:28px;height:4px;border-radius:2px;background:var(--hatch);overflow:hidden;display:inline-block}
.chip .bar i{display:block;height:100%;background:var(--good)}
.chip[aria-pressed="true"] .bar{background:color-mix(in srgb,var(--bg) 35%,transparent)}
.small-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:13px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.keys{font-size:12px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}

/* 主版面 */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:18px;padding-block:16px 40px;padding-inline:16px;max-width:1440px;margin:0 auto}
@media (max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}}
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
.side{min-width:0}
.side-in{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 18px;box-shadow:var(--shadow)}
@media (max-width:960px){
  .side{display:none}
  .side.open{display:block;position:fixed;inset:0;z-index:40;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto}
  .side.open .side-in{position:static;max-height:none}
}
h2.sec{font-family:var(--f-display);font-weight:900;font-size:19px;margin:0;display:flex;align-items:baseline;gap:10px;text-wrap:balance}
h2.sec small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}

/* 徽章與站 */
.bd{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:5px;color:#fff;font-weight:700;font-size:13px;flex:none}
.st{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--ink);font-weight:700;font-size:12px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.link{border:0;background:transparent;padding:0;text-align:left}
.link:hover .ul,.ul:hover{text-decoration:underline;text-underline-offset:3px}
.lchip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--sunk);border-radius:5px;padding:0 6px;white-space:nowrap}

/* 地圖格 */
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px}
table.grid th{font-weight:500;font-size:13px;text-align:left;white-space:nowrap}
table.grid thead th{text-align:center}
table.grid th .link{display:inline-flex;align-items:center;gap:6px}
.cellbtn{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:13px;background:var(--surface)}
.cellbtn.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend .sw{width:60px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--surface),var(--accent));border:1px solid var(--line)}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.linebtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;display:grid;gap:2px}
.linebtn b{font-size:14px}.linebtn span{font-size:12px;color:var(--muted)}
.ledgers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ledgerbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.ledgerbox h4{margin:0 0 4px;font-size:14px}
.ledgerbox .tags{gap:5px}

/* 遮罩單元 */
.u{position:relative;border-radius:8px}
.u-cover{width:100%;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;border:1px dashed var(--muted);border-radius:8px;padding:6px 10px;text-align:left;
  background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--hatch) 6px 8px);min-height:36px}
.u-cover .coord{font-size:12.5px;font-weight:700;background:var(--surface);border-radius:4px;padding:0 6px;white-space:nowrap}
.u-cover .hint{margin-left:auto;font-size:12px;color:var(--muted);background:var(--surface);border-radius:4px;padding:0 6px;white-space:nowrap}
.u.flash{animation:flash .9s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.u.flash{animation:none}}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.marks button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 10px;font-size:13px}
.marks button.on.k1{background:var(--good);border-color:var(--good);color:#fff}
.marks button.on.k0{background:var(--warn);border-color:var(--warn);color:#fff}
.u.known>.u-body{box-shadow:inset 3px 0 0 var(--good);padding-left:8px}
.u.notyet>.u-body{box-shadow:inset 3px 0 0 var(--warn);padding-left:8px}

/* Te 列 */
.wave h3{font-size:15px;margin:6px 0 8px}
.terow{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:grid;gap:8px}
.terow+.terow{margin-top:8px}
.terow-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.terow-h .name{font-weight:700;font-size:15.5px}
.terow-h .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.frags{display:grid;gap:4px}
.frag{font-size:14px}
.reds{display:grid;gap:4px}
.rt{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:4px;padding:0 6px;margin-right:4px;white-space:nowrap}
.rt-a{background:#b3262e}.rt-b{background:#c2540c}.rt-c{background:#7a3415}
.cite{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* L 卡 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:grid;gap:6px;align-content:start}
.card-h{display:flex;gap:8px;align-items:baseline}
.card-h .lid{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--accent);flex:none}
.card-h .t{font-weight:700;font-size:15px;text-wrap:balance}
.ask{font-size:13.5px;color:var(--muted)}
.chain{font-weight:500;background:var(--sunk);border-radius:7px;padding:6px 9px;font-size:14.5px}
.kv{font-size:14px}.kv b{font-size:12px;color:var(--muted);margin-right:4px;font-weight:700}
details.why summary{font-size:12.5px;color:var(--muted);cursor:pointer}
details.why p{font-size:13.5px;margin:4px 0 0}
.selfq{font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.selfq .a{margin-top:4px;color:var(--good)}

/* 焦點欄 */
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fhead .back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 9px}
.fhead .close{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 9px}
.ftitle{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0 0 2px;text-wrap:balance}
.fsec{margin-top:14px}
.fsec>h4{font-size:12.5px;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:700}
.nbrs{display:flex;flex-wrap:wrap;gap:5px}
.nbr{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:2px 9px;font-size:13px;display:inline-flex;gap:5px;align-items:center}
.chain2{display:grid;gap:4px}
.node{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:start;font-size:14px}
.node .lab{font-family:var(--f-mono);font-size:12px;color:var(--accent);white-space:nowrap;padding-top:2px}
.ti{background:var(--sunk);border-radius:8px;padding:6px 9px;font-size:14px}
.q{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.q+.q{margin-top:6px}
.q-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.q-stem{white-space:pre-wrap;font-size:13.5px;margin-top:4px;max-height:15em;overflow:auto}
.q-ans{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.parts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.parts{grid-template-columns:minmax(0,1fr)}}
.part{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--surface);display:grid;gap:4px;font-size:13.5px}
.part .ph{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ways{margin:0;padding-left:1.2em;font-size:14px}
.ways li{margin:3px 0}
.syncnote{font-size:12px;color:var(--muted)}
.chsel{display:flex;flex-wrap:wrap;gap:6px 12px}
.empty{color:var(--muted);font-size:14px}
</style>

<header class="top" id="top">
  <div class="top-in">
    <div class="brand">藥分全景<small id="ver"></small></div>
    <div class="seg" role="group" aria-label="視圖">
      <button id="v-map" data-view="map">地圖</button><button id="v-te" data-view="te">Te 作戰</button><button id="v-ch" data-view="ch">章節 L</button>
    </div>
    <div class="seg mode" role="group" aria-label="模式">
      <button id="m-ex" data-mode="explore">探索</button><button id="m-rv" data-mode="review">複習</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="找考點、L、章、性質…（按 / ）" autocomplete="off" aria-label="搜尋"><div class="results" id="res" hidden></div></div>
  </div>
  <div class="rbar" id="rbar" hidden></div>
</header>

<div class="wrap">
  <main class="main" id="main"></main>
  <aside class="side" id="side"><div class="side-in" id="focus"></div></aside>

光譜概論","L":"L1","title":"波長、頻率與傳播速度","ask":"同一介質中 λ 變為 3 倍，ν 變多少？","chain":"固定速度 → 波長變長 → 每秒波數變少 → 頻率降低。","why":"一秒走過的距離固定，每個波若占更長距離，一秒只能通過較少個波。先固定速度，才有波長與頻率反向的關係。","ex":"同一介質中，波長由 250 nm 變成 500 nm，是兩倍；頻率便為原本的一半。","trap":"固定傳播速度；換介質不可硬套反比。","q":"同一介質中 λ 變為 3 倍，ν 變多少？","ans":"情境：同樣速度前進的一串波，波與波間隔拉長，固定位置每秒收到的波會變少。\n\n先固定傳播速度，再看「一個波多長」與「每秒過幾個」：\n\n$$\\text{每秒走的距離}=\\text{每秒波數}\\times\\text{每個波長度}$$\n$$v=\\nu\\lambda;\\qquad \\text{真空中 }c=\\nu\\lambda_0$$\n\n所以速度固定時，$\\nu=v/\\lambda$。λ ×2 → ν ÷2，不是兩者一起增加。\n\n若光進入另一介質，頻率保持，由傳播速度與波長改變；不能把所有介質的 λ 都直接塞入 $E=hc/\\lambda$。本章一般波段題用真空／近似空氣波長。\n\n小檢查：同介質 λ 從 250 變 500 nm，ν 變為原本一半。回 Ni 重建","p":["色"],"s":["算"],"l":[]},{"ch":"光譜概論","L":"L2","title":"波數是波長的倒數","ask":"波數由 40,000 降為 20,000 cm⁻¹，波長方向與數值？","chain":"每公分波數 → 取倒數得 cm → 換成 nm → 判波段。","why":"波數是在固定長度內排得下幾個波，不是在一秒內振動幾次。取倒數才是每個波的長度；波數以 cm⁻¹ 給定，倒數所得就是 cm。","ex":"40,000 cm⁻¹ 的倒數是 2.5×10⁻⁵ cm，再乘 10⁷ nm/cm 得 250 nm；詳見 C1。","trap":"先使波數與波長的長度單位對應。","q":"波數由 40,000 降為 20,000 cm⁻¹，波長方向與數值？","ans":"情境：一公分塞得進更多完整的波，每個波占的長度就更短。\n\n$$\\tilde\\nu=\\frac1\\lambda;\\qquad\\tilde\\nu[\\mathrm{cm^{-1}}]=\\frac1{\\lambda[\\mathrm{cm}]}$$\n\n`cm⁻¹` 是長度的倒數，因此先用 cm 取倒數，再轉 nm。捷徑中 $10^7$ 來自 1 cm＝10⁷ nm，不是另有一個物理常數。\n\n波數 ↑ → 波長 ↓ → 在相同傳播條件下頻率與每光子能量 ↑。\n\n小檢查：20,000 cm⁻¹ 的波長是 40,000 cm⁻¹ 的兩倍。回 Ni 重建","p":["色"],"s":[],"l":[]},{"ch":"光譜概論","L":"L3","title":"每光子能量與總光量","ask":"同頻率的燈變亮兩倍，每顆光子的 E 是否變兩倍？","chain":"頻率 → 乘 h → 每光子能量；同頻加亮 → 光子數增加。","why":"每顆光子的能量由頻率決定。同頻率照得更亮，通常是單位時間的光子數增加，不能因此把每顆光子的能量加大。","ex":"500 nm 變為 250 nm，在相同傳播條件下頻率和每光子能量均為兩倍；只加亮則每顆 E 不變。","trap":"E=hν；hc/λ 中 λ 須為真空波長。","q":"同頻率的燈變亮兩倍，每顆光子的 E 是否變兩倍？","ans":"情境：同色的光變亮，與把光改成更短波長，是兩種改變。\n\n$$E=h\\nu;\\qquad E=\\frac{hc}{\\lambda_0}$$\n\n| 改哪一項 | 每光子能量 | 總光量的意思 |\n|---|---|---|\n| 同頻率，加大光強 | hν 不變 | 同時間／同面積可有更多光子 |\n| 頻率增加 | 每光子能量增加 | 不能只由頻率決定整束總能量 |\n| 照射更久、條件固定 | 每光子能量不變 | 累積收到的光子數可增加 |\n\n母式中的 h 是常數；$\\nu\\lambda$ 的單位是速度，所以不能等於 h。題本常用 $h\\approx6.62\\times10^{-34}\\ \\mathrm{J\\cdot s}$，更常見近似為 6.626。\n\n小檢查：220 與 500 nm，220 nm 每光子能量較高；不必乘出 h、c。回 Ni 重建","p":["色"],"s":["源"],"l":[]},{"ch":"光譜概論","L":"L4","title":"能階差與允許躍遷","ask":"電子、振動、轉動皆遞減的選項，就必然是題本答案嗎？","chain":"能量配合能階差＋允許條件 → 可吸收 → 出現特徵。","why":"物質不是遇到更強的能量就把所有較小的運動一起開啟。先問光子能量是否配合一個可達能階差，再問這個變化能否與輻射有效作用。","ex":"UV 題常連到電子躍遷，IR 題連到振動；精確的教學尺度 100：1：0.01 是題本固定輸入，不能只靠「電子較大」算出。","trap":"能量配合還不夠；需有允許的交互作用。","q":"電子、振動、轉動皆遞減的選項，就必然是題本答案嗎？","ans":"情境：光照過分子，不是只要能量更大就一定吸收；它要能與物質可發生的變化配合。\n\n單光子吸收的入門鏈：能量配合兩態之差 → 該躍遷允許 → 有吸收機會 → 出現相應光譜特徵。Selection rule（選擇定則）限制哪些轉換可有效發生；本章先記「配合＋允許」，不展開量子數。\n\n| 變化 | 中文意義 | 常見波段與本章用途 |\n|---|---|---|\n| Electronic transition（電子躍遷） | 電子態改變 | UV-Vis 等 |\n| Vibrational transition（振動躍遷） | 鍵的振動能階改變 | IR；NIR 常是泛音／組合頻 |\n| Rotational transition（轉動躍遷） | 分子轉動能階改變 | 微波；氣相振動－轉動譜等 |\n\n必背 F04：題本採 $E_e:E_v:E_r\\approx100:1:0.01$。它描述典型尺度","p":["色"],"s":[],"l":[]},{"ch":"光譜概論","L":"L5","title":"吸收如何成為讀數","ask":"UV-Vis、IR、AAS 都看吸收，三者的被測對象一樣嗎？","chain":"外部光通過檢品 → 比較透射與參考 → T → A。","why":"先有光照入，才能問檢品使哪些頻率的透射光減少。與參考比較得透光率 T，再換成吸光度 A；光少了也可能是散射等原因，要先把參考與光路做好。","ex":"參考光量 100、透射 10（相同讀數單位），T=10/100=0.10；題給 log₁₀0.10=−1，A=1。這是自編讀數示意。","trap":"參考相容；先排除散射、反射等損失。","q":"UV-Vis、IR、AAS 都看吸收，三者的被測對象一樣嗎？","ans":"情境：拿同一束光比較空白與含檢品的光路，檢品在特定波長少透過一些光。\n\n入射／參考光 → 檢品特定吸收 → 透射光降低 → 比較比例 → 吸收相關訊號。\n\n$$T=I/I_0;\\qquad A=-\\log_{10}T$$\n\n此處只需懂：T 下降，A 上升。$I_0$ 是適當參考，$I$ 是透射光讀數；定量如何連到濃度留 UV 章。\n\n同族但對象不同：UV-Vis 問分子電子態；IR 問分子振動；AAS 問原子對特徵光的吸收。三者都需要可被吸收的入射光，但不能共用同一種燈就解釋全部。\n\n光變少也可能是散射、反射、髒污或光源漂移；先有空白與合適條件，才把它解讀為分析物吸收。回 Ni 重建","p":["色","骨","元"],"s":["樣"],"l":[]},{"ch":"光譜概論","L":"L6","title":"激發後的放射","ask":"AAS 已經有火焰，為何典型配置還要中空陰極燈？","chain":"供給能量 → 激發 → 回到較低能態 → 偵測放光。","why":"放射是先把能量交給物質，再收它放出的光。螢光一般由外部光激發；AES 可由火焰或電漿供能。兩者都放光，但第一步的能量來源不同。","ex":"112-1 第 16 題在 IR、UV、AES、螢光中問不需激發光源，選 AES；火焰／電漿仍提供能量。","trap":"無外部激發燈，不等於無能量輸入。","q":"AAS 已經有火焰，為何典型配置還要中空陰極燈？","ans":"共同鏈：能量輸入 → 形成高能態 → 回到較低能態 → 放出光子 → 量波長／強度。\n\n| 方法 | 第一步能量哪裡來 | 量什麼 | 不能省掉的條件 |\n|---|---|---|---|\n| Fluorescence（螢光） | 外部光激發 | 分子放射訊號 | 能吸收不等於一定強發光；有非輻射與淬熄途徑 |\n| AES（原子放射） | 火焰／電漿等 | 元素特徵放射 | 不用外部激發燈，但仍需要激發能量 |\n\n題本 112-1-16 四選項：IR、UV、AES、螢光，選 AES。不要把「不需激發光源」擴成「沒有激發」。\n\n相對 AAS：AAS 的火焰可用來原子化，再量外部光的吸收；AES 量的是受激後的放光。回 Ni 重建","p":["元"],"s":["源","算"],"l":[]},{"ch":"光譜概論","L":"L7","title":"Raman 的能量交換","ask":"題本把 Raman 選為 emission，就能說其一般物理機制是螢光嗎？","chain":"雷射與物質作用 → 非彈性散射 → 讀位移 → 振動資訊。","why":"一小部分散射光與分子交換能量，回來的頻率便不同。要讀的是相對於雷射的差，不是把樣品當成普通螢光放射體。","ex":"光子把部分能量留給分子，散射光能量較低，是 Stokes；若從分子取走能量，光子較高，是 anti-Stokes。","trap":"振動須改變極化率；背景與照射不得誤判。","q":"題本把 Raman 選為 emission，就能說其一般物理機制是螢光嗎？","ans":"情境：同一支雷射照樣品，收回的少部分散射光頻率與入射光不同。\n\n入射雷射 → 與物質交換能量的散射 → 讀頻率差 → 推知振動等能量差。這是 Inelastic scattering（非彈性散射），不同於先吸收成真實電子激發態再螢光放射（S2）。\n\n光子把能量交給分子時，散射光能量下降，稱 Stokes（斯托克斯）支線；反方向能量交換另有 anti-Stokes（反斯托克斯）。本章只需知道「讀位移」，不需多背光路。\n\nRaman 與 IR 都能給振動資訊，但所需的性質變化不同；Raman 看 Polarizability（極化率）變化，IR 看 Dipole moment（偶極矩）變化。「Raman 常補足某些對稱振動資訊」不等於全部對稱鍵必有峰。\n\n> [!note] 兩題分開存檔\n> 107-1-2：題本答案 D Raman，其解析歸在 emission（放射）；本章物理分類仍列散射。","p":["色","骨"],"s":["源"],"l":["空白線"]},{"ch":"光譜概論","L":"L8","title":"NIR 的泛音與組合頻","ask":"能直接測裸錠，是否表示不用校正也能知道全部含量？","chain":"振動泛音／組合頻 → NIR 譜帶 → 取樣讀數 → 模型輸入。","why":"近紅外常收多個互相重疊的振動相關譜帶。它能在合適配置下直接看固體錠劑，但從整段反應算含量仍需要代表性參考樣本及校正。","ex":"裸錠水分、成分與均勻度可成為模型目的；一次量到的區域與深度取決於實際配置，不能保證量到整顆各處。","trap":"散射、粒徑與厚度會影響；仍需有效模型。","q":"能直接測裸錠，是否表示不用校正也能知道全部含量？","ans":"情境：想直接比較一顆錠劑的水分或批次差異，先看它在近紅外的整段反應。\n\n振動泛音／組合頻吸收 → 多個重疊的近紅外譜帶 → 參考樣本與校正 → 成分／物性判斷。Overtone（泛音）與 Combination band（組合頻帶）是常見機制；常涉及 O–H、N–H、C–H 振動。\n\nNIR 可用於裸錠、顆粒、水分、均勻度與多成分分析，實際穿透和讀數受散射、粒徑、厚度等影響。「可直接分析」仍需要合適配置與模型，不是免校正、也不保證整顆錠劑各處皆量到。\n\n小檢查：裸錠含量比較出現偏差，可能不只含量改變，也可能是粒徑或量測條件改變。回 Ni 重建","p":["骨"],"s":["算"],"l":[]},{"ch":"光譜概論","L":"L9","title":"NMR 的核自旋訊號","ask":"最多結構資訊是否等於所需量最少、偵測極限最低？","chain":"磁場建立核能階差 → 射頻激發 → 核訊號 → 核環境線索。","why":"NMR 從原子核在磁場中的反應取得訊號，再用化學位移、耦合等看局部環境與相互關係。所以問異構物／立體結構時，常比只看少數電子吸收帶有更多資訊。","ex":"在 NMR、螢光、IR、UV 四選項中，NMR 用射頻，波長最長；500 MHz 例子卻為 0.6 m，不是全都 >10⁹ nm。","trap":"頻率依核種與磁場；固態與溶液資訊有別。","q":"最多結構資訊是否等於所需量最少、偵測極限最低？","ans":"情境：兩個異構物分子式相同，想知道原子的局部環境與相互關係。\n\n靜磁場 → 可觀察核的能階分裂 → 射頻激發 → 偵測核訊號 → 從化學位移、耦合等建構結構線索。這不是電子、鍵振動或整個分子轉動三者之一。\n\nNMR 使用 Radiofrequency（射頻）。例如 500 MHz 的真空波長：$3\\times10^8/(5\\times10^8)=0.6\\ \\mathrm m$，即 $6\\times10^8$ nm；因此不能把「全部 NMR 都 >10⁹ nm」當硬界線。\n\n在本題 NMR／螢光／IR／UV 中，NMR 的波長仍最長。更多結構資訊不等於偵測極限最低；所需量、核種、磁場、探頭與量測時間等共同影響實際表現。\n\n固態 NMR 可比較固態環境；本題溶液 DOSY 依擴散差異區分訊號，不能直接重現溶解前晶格。回 Ni 重建","p":["骨"],"s":["源","算"],"l":["雜訊地板"]},{"ch":"光譜概論","L":"L10","title":"MS 與 LC-MS 的資訊","ask":"m/z=某個數字，就能不看電荷與加合物直接當中性分子量嗎？","chain":"形成離子 → 按 m/z 分析 → 偵測；LC 可先分離混合物。","why":"MS 要先把檢品轉成可分析的離子，再看質荷比。混合物若先經 LC 分離，不同成分能較分開取得質譜資訊；這正適合本題的微量雜質辨識目的。","ex":"102-2 第 13 題選 LC-MS：LC 幫忙分離，MS 提供離子質荷比及其他線索；RI 沒有同樣的質譜資訊。","trap":"識別電荷、加合物與碎片；勿當中性質量直讀。","q":"m/z=某個數字，就能不看電荷與加合物直接當中性分子量嗎？","ans":"MS 主鏈：檢品形成離子 → 質量分析器區分 m/z → 偵測離子 → 質量／結構線索。LC-MS 支鏈：混合物先經 Liquid chromatography（液相色層分析）分離 → 分開取得質譜資訊 → 協助辨識微量成分。\n\nElectron ionization（電子游離，EI）只是其中一種離子化方式；Electrospray ionization（電噴灑游離，ESI）等用不同機制。也存在使用光／雷射的離子源，因此不能背「MS 絕對無光、全用電子束」（S6）。\n\n質譜不是中性分子直接貼上質量標籤：要看電荷數、加合物、分子離子與碎片；本章先知道限制，不展開細算。\n\n本題 102-2-13 的微量不純物選 LC-MS。LC-MS-MS 增加串聯質譜資訊，但常規溶液進樣已不保留原晶格；107-1-26 問多形性時選它為不能直接分析者。回 Ni 重建","p":["量","荷"],"s":["選","算"],"l":["歸一線","保留線"]},{"ch":"光譜概論","L":"L11","title":"訊號斜率、噪音與偵測","ask":"ppb、pg、mol/L 能直接放在同一大小軸排名嗎？","chain":"量的變化 → 訊號變化；對照背景變異 → 評估可辨識量。","why":"同樣增加一點濃度，讀數變多少是在問靈敏度；低量能否可靠看出來，還要看背景變異。所需檢品量與重複一致程度則是另外兩件事。","ex":"其他條件及噪音相同，斜率由 m 變 2m，同濃度差產生兩倍訊號差，較有利辨識；這不是完整 LOD 數值公式。","trap":"分清靈敏度、偵測極限、檢品量與精密度。","q":"ppb、pg、mol/L 能直接放在同一大小軸排名嗎？","ans":"情境：甲儀器濃度稍增就有很大讀數變化；乙儀器背景很穩定。哪一台更能看出極少量成分？不能只看訊號大不大。\n\n在線性 Calibration curve（校正曲線）的示意中：\n\n$$y=a+mC;\\qquad m=\\Delta y/\\Delta C$$\n\n| 概念 | 真正問的事 | 不等於什麼 |\n|---|---|---|\n| Sensitivity（靈敏度） | 濃度／量改一點，讀數改多少；此模型為 m | 所需檢品量的倒數 |\n| Limit of detection（偵測極限，LOD） | 在方法和背景變異下，何種低量能被可靠辨識 | 只由斜率決定的萬用常數 |\n| 所需檢品量 | 此配置與目的要投入多少檢品 | 偵測極限本身；不等於實際被偵測到的量 |\n| Precision（精密度） | 重複量測彼此接近程度 | 結構解析能力、儀器價格或靈敏度 |\n\nS1 支持這些概念的區分。噪","p":["色"],"s":[],"l":["空白線","雜訊地板"]},{"ch":"光譜概論","L":"L12","title":"晶型資訊的保留與流失","ask":"ATR 可測晶型，理由是否是它完全不施壓？","chain":"問原晶型 → 查前處理是否保留固態 → 選可辨識配置。","why":"同成分可以有不同的固態排列。若要問原晶型，不能先把原排列完全消掉再期待儀器找回它；先選保留相關資訊的製樣與可辨識方法，後續才有足夠資料判讀。","ex":"先保留固體，再以可區分兩參考晶型的 IR 比較，是相符方案；完全溶解後的本題 DOSY 能看溶液擴散，卻不直接看原晶格。","trap":"量測後仍須在 M04 比對；有壓力不等於必轉晶。","q":"ATR 可測晶型，理由是否是它完全不施壓？","ans":"情境：相同成分可能以不同固態排列存在。要分辨 Polymorphism（多形性），分析方法須保留並對這些差異有反應。\n\n原晶體 → 前處理後仍保有相關固態資訊 → 適當量測得到差異 → 與參考比較 → 晶型判讀。若先完全溶解，原晶格排列通常已不再直接存在；只量溶液成分或離子資訊不能重建它。\n\n| 方法／配置 | 本章判斷 | 必要條件與易錯 |\n|---|---|---|\n| XRD | 可直接比較繞射特徵 | 看晶格差異與參考圖樣 |\n| Raman、合適 IR／NIR | 可用來比較固態特徵 | 要能區分、保留樣品狀態；NIR 常需模型 |\n| solid-state NMR | 可比較固態環境 | 固態二字不可省略 |\n| 本題 DOSY／diffusion spectroscopy | 113-1-11 選 A，不能直接判原晶型 | 本題為溶液擴散分析 |\n| 常規 LC-MS-M","p":["晶"],"s":["樣","選"],"l":["分配線","保留線"]},{"ch":"UV","L":"L01","title":"先分清參考光與透射光","ask":"I₀＝200、I＝20，T 是多少？","chain":"空白給 I₀ → 檢品給 I → T＝I／I₀ → 得到通過比例","why":"先量空白，再量檢品，才能比較「檢品額外讓多少光通不過」。Transmittance（透射率）T 的分子是通過檢品的光 I，分母是參考光 I₀。T＝0.10 就是有 10% 通過。","ex":"I₀＝100、I＝10：T＝10／100＝0.10＝10%。檢品變混濁時，散射也會讓直達偵測器的光減少，所以光少不一定全是藥物吸收。","trap":"同波長、光徑且空白可比。只有反射、散射等損失可忽略或已處理，1−T 才能當作吸收分率。","q":"I₀＝200、I＝20，T 是多少？能直接說藥物吸收了 90% 嗎？","ans":"T＝0.10＝10%。若散射、反射等可忽略，才可說吸收 90%；混濁檢品不能直接這樣歸因。","p":["色"],"s":["樣","算"],"l":["空白線"]},{"ch":"UV","L":"L02","title":"把相乘的穿透比例改成可相加的 A","ask":"T＝1%，A 是多少？","chain":"T＝10⁻¹ → A＝−log₁₀T＝1 → 光每少十倍，A 多 1","why":"Absorbance（吸光度）A 是把通過比例轉成方便相加的刻度。光剩 1／10，A＝1；剩 1／100，A＝2。對數在這裡只做一件事：把「十倍、百倍」換成「1、2」。","ex":"兩層都讓一半光通過：總 T＝1／2×1／2＝1／4；總 A＝−log(1／4)＝兩層 A 的和。若只做入門題，記住 10%、1%、0.1% 對應 A＝1、2、3 即可。","trap":"A 與 T 無單位；式中的 log 是以 10 為底。T＝1% 必須代 0.01，不能代 1。","q":"T＝1%，A 是多少？A＝3 時，通過的是 0.1% 還是 99.9%？","ans":"A＝2。A＝3 時 T＝10⁻³＝0.1%；99.9% 是理想吸收百分比。","p":["色"],"s":["算"],"l":[]},{"ch":"UV","L":"L03","title":"Beer 定律：有效條件下以 A 反推濃度","ask":"固定濃度，把光徑從 1 cm 改成 2 cm，A 與 T 怎麼變？","chain":"同條件下濃度增加 → 吸收增多 → A 成比例增加 → 回算 c","why":"Beer–Lambert law（比爾－朗伯定律）說：在可用條件內，分子越多、光走得越長，吸光度越大。分子吸光能力用 ε 表示，走過的距離是 b，濃度是 c，因此 A＝εbc。固定 ε、b，A 就能當作濃度的尺。","ex":"標準品濃度 10 μg/mL、A＝0.50；檢品 A＝0.40。同條件、零截距時，檢品濃度＝10×0.40／0.50＝8 μg/mL。","trap":"須固定波長、溶媒、化學型態與光徑，並在有效校正範圍內。校正曲線若 A＝kc+d，要先扣 d。有解離並非必然不能定量；比例固定就仍可校正。","q":"固定濃度，把光徑從 1 cm 改成 2 cm，A 與 T 怎麼變？","ans":"A 變兩倍；T 變平方。原本 A＝1、T＝0.1，改後 A＝2、T＝0.01。","p":["色"],"s":["算"],"l":["酸鹼線","標準曲線線"]},{"ch":"UV","L":"L04","title":"三種濃度尺度決定三種係數","ask":"E¹%＝200、A＝0.40、b＝1 cm，濃度是多少 mg/100 mL？","chain":"先認 ε／a／E¹% → 選 mol/L／g/L／g/100 mL → 移項 → 得濃度","why":"同一瓶溶液可以用「幾莫耳」「幾公克」表示。尺的單位改了，係數也要改：Molar absorptivity（莫耳吸光係數）ε 配 mol/L；Mass absorptivity（質量吸光係數）a 配 g/L；Specific absorptivity（比吸光度）E¹% 配 g/100 mL 的數值。","ex":"E¹%＝500、b＝1 cm、A＝0.45。濃度＝0.45／500＝0.0009 g/100 mL＝0.9 mg/100 mL，不能跳成 0.9 g/100 mL。","trap":"E¹% 是 1% w/v、1 cm 的吸光度值；代入 b 的 cm 數值。1 mg/100 mL＝0.001 g/100 mL＝0.001% w/v，絕不是 1%。","q":"E¹%＝200、A＝0.40、b＝1 cm，濃度是多少 mg/100 mL？","ans":"0.40／200＝0.002 g/100 mL；乘 1000 得 2 mg/100 mL。","p":["色"],"s":["算"],"l":["歸一線"]},{"ch":"UV","L":"L05","title":"光子能量接到電子躍遷","ask":"波長增加兩倍，單一光子能量如何變？","chain":"波長越短 → 每光子能量越高 → 匹配能階差 → 出現吸收帶","why":"分子裡的電子不能隨便停在任意能量。光子的能量剛好能讓電子升到另一個允許狀態時，光可被吸收，這叫 Electronic transition（電子躍遷）。本章先抓比例：每光子能量 E＝hc₀／λ，所以波長與能量成反比。","ex":"150 nm 與 300 nm 比較：150 nm 的波長是另一個的一半，每光子能量就是兩倍。不要把每光子能量和整束光的亮度混為一談。","trap":"UV–Vis 的主要作用是電子激發；振動與溶媒也影響帶形。題本 100：1：0.01 是電子／振動／轉動的量級比較。","q":"波長增加兩倍，單一光子能量如何變？UV 和 IR 主要分別看哪種能量變化？","ans":"每光子能量減為一半。UV–Vis 主要看電子躍遷；IR 主要看分子振動。","p":["色"],"s":[],"l":[]},{"ch":"UV","L":"L06","title":"四種躍遷：用結構和能量一起判","ask":"150 nm 典型題選哪種躍遷？","chain":"找 σ／π／n 電子 → 確認可用躍遷 → 比對波長 → 選最合適答案","why":"σ 是單鍵的成鍵電子，π 是雙鍵或芳香系統的電子，n 是孤對電子；星號 * 表示反鍵結軌域。先看結構有什麼電子，再看波長和強弱，不要只用一個數字猜。四種名稱與典型配對見下表，屬國考必要固定輸入。","ex":"Ephedrine 有 benzene 吸收系統，題目約 250 nm 判 π→π*。它的側鏈 N、O 有孤對電子，仍不能因此把苯環那條帶改判 n→π*。","trap":"典型能量序 σ→σ* ＞ n→σ* ＞ π→π* ＞ n→π* 是教材模型，跨所有分子並非固定排序；波段也會重疊。","q":"150 nm 典型題選哪種躍遷？有苯環、約 250 nm 的藥物就一定是 n→π* 嗎？","ans":"150 nm 題本選 σ→σ*。不一定；本章 Ephedrine 例是 π→π*，須配合結構。","p":["色"],"s":[],"l":["解析度線"]},{"ch":"UV","L":"L07","title":"峰在哪裡和峰多高是兩把尺","ask":"321 nm 比 217 nm 長，為什麼本題的 ε 反而很小？","chain":"讀 λ 判位置 → 讀 ε 判響應強弱 → 合併結構線索 → 判躍遷","why":"波長回答「需要多少能量」，ε 回答「這個躍遷有多容易吸光」。能量較低不等於較容易發生。最短讀法是把數據拆兩欄，再合回結構證據。","ex":"CH₃CH=CHCHO：217 nm、ε＝16000 是較強短波帶；321 nm、ε＝20 是較弱長波帶。題本分別判 π→π*、n→π*。","trap":"ε 大代表在相同 b、c 下有較大的 A；微量分析還要看背景與噪音。不是每一條 π→π* 帶都很強，也不能按長波＝強峰。","q":"321 nm 比 217 nm 長，為什麼本題的 ε 反而很小？","ans":"λ 與 ε 對應不同問題；較低能量的 n→π* 常較不易發生，所以可呈長波弱帶。","p":["色"],"s":[],"l":["空白線","歸一線"]},{"ch":"UV","L":"L08","title":"發色基與助色基：看連接，不只找原子","ask":"兩個分子都有 OH，為什麼不一定都有相同助色效應？","chain":"找發色系統 → 看基團能否直接參與共軛 → 判助色作用 → 預測譜變","why":"Chromophore（發色基）是造成所討論吸收的結構部分。Auxochrome（助色基）在本章常指直接接在芳香系統、能以孤對電子調整吸收的基團。要看「接在哪裡」，不能只看有沒有 N、O。","ex":"Phenylephrine 的 phenol 與 Procaine 的 aniline 直接連到環，會調節芳香吸收；Ephedrine 的側鏈 OH／胺隔著飽和碳，不能照搬相同的芳香助色效應。","trap":"課內典型：benzene、carbonyl、nitro、carboxyl 可作發色系統；直接連環的 OH、NH₂、ethers 可作助色基。這是角色分類，非宣稱這些基團在任何波長都不吸光。","q":"兩個分子都有 OH，為什麼不一定都有相同助色效應？","ans":"須看 OH 是否與同一吸收 π 系統直接相連、能否有效共軛。側鏈 OH 與環上 OH 不同。","p":["色"],"s":[],"l":[]},{"ch":"UV","L":"L09","title":"共軛改能階，但不保證每個峰都紅移增色","ask":"同系列的四個共軛雙鍵與三個比，題本哪個 λ 較長？","chain":"有效共軛延伸 → 相應能階差常縮小 → λ 常變長 → 另讀強度","why":"Conjugation（共軛）是相鄰軌域能共同參與的結構，不是單純數雙鍵。對可比較的多烯系列，共軛延伸通常讓相應吸收移向長波。強度須另讀 ε 或 E¹%，不能用波長一項包辦。","ex":"題本 n＝3、4、5、6 的多烯對應 275、310、342、380 nm。化合物標號 3 的 n＝4，因此是 310 nm；標號不等於雙鍵數。","trap":"比較同系列、對應譜帶與相同介質。Benzoic acid／Cinnamic acid 題本表值限指定帶，不用「所有共軛增加都每峰紅移增色」解釋。","q":"同系列的四個共軛雙鍵與三個比，題本哪個 λ 較長？兩物質 λ 相同能否推出 ε 相同？","ans":"四個通常較長。λ 相同不能推出 ε 相同，位置與強度要分開。","p":["色","骨"],"s":[],"l":[]},{"ch":"UV","L":"L10","title":"位移與增減色分兩欄","ask":"只知道 292 nm 的 A 從 0.4 到 1.5，能同時宣布紅移嗎？","chain":"λ 增／減 → 紅移／藍移；強度增／減 → 增色／減色 → 分別命名","why":"Bathochromic shift（紅移）與 Hypsochromic shift（藍移）只管波長；Hyperchromic effect（增色效應）與 Hypochromic effect（減色效應）只管吸收強度。先圈題目提供哪一欄，再選名稱。","ex":"273→292 nm：波長變長，紅移。相同濃度、光徑下，吸收強度也增加：再加增色。若只給固定 292 nm 的 A 增加，沒有峰位置資料，就只判增色。","trap":"濃度增加使 A 增大，不足以證明 ε 本身增色。題本 A＝110、182 保留原字，僅用相對強弱，非一般儀器可靠量測範圍。","q":"只知道 292 nm 的 A 從 0.4 到 1.5，能同時宣布紅移嗎？","ans":"不能。可判同條件吸收增強；要判紅移，還需 λmax 前後位置。","p":["色"],"s":[],"l":["分配線","歸一線"]},{"ch":"UV","L":"L11","title":"pH 改物種，物種改共軛","ask":"Aspirin 在 NaOH 中變譜，可以全當作同一分子的可逆酸鹼平衡嗎？","chain":"pH 改變 → 質子化型態改變 → 共軛／吸光能力改變 → λ、A 可改變","why":"先問「哪個位置拿到或放掉 H⁺」。Phenylephrine 的環上 OH 在鹼中去質子化，題本常見紅移、增色；Procaine 的芳香 NH₂ 在強酸中質子化，孤對電子較不能參與芳香系統，題本吸收較弱。","ex":"Procaine pH 1 與 9 的題目：先看芳香胺，強酸使其助色能力下降；本題 pH 9 較強。末端脂肪胺是否帶電，不能直接取代芳香胺的光譜角色。","trap":"同濃度、光徑與對照波段；排除未控制降解。Aspirin 在鹼中可能發生 esters 水解，已改物質身分，須另控時間。","q":"Aspirin 在 NaOH 中變譜，可以全當作同一分子的可逆酸鹼平衡嗎？","ans":"不可以；還須考慮水解產物。先確認分析物身分與反應條件，再用酸鹼模型。","p":["色","荷","元"],"s":[],"l":["酸鹼線"]},{"ch":"UV","L":"L12","title":"pKa：先認酸型鹼型，再求混合比例","ask":"AH＝1.2、AB＝0.2、A＝0.7，pH＝8。pKa 是多少？","chain":"A 在兩端間的位置 → 鹼型分率 → 酸／鹼型比例 → pKa","why":"先用一把尺想：酸型讀 AH，鹼型讀 AB；混合 A 在兩端之間的位置告诉你各佔多少。H 是共軛酸型、B 是共軛鹼型，不代表吸光度大或小。先學「剛好在中點＝兩型各半」，再用 C5 的完整公式。","ex":"AH＝0.2、AB＝1.2、A＝0.7，刚好在中點；H、B 各半，所以 pH＝pKa。若 pH＝9.5，pKa＝9.5。","trap":"單一二態平衡、同總濃度、同 λ／b、介質可比、無降解。兩型吸收差須足夠；不要選 Isosbestic point（等吸收點）。AH 可大於 AB。","q":"AH＝1.2、AB＝0.2、A＝0.7，pH＝8。pKa 是多少？","ans":"A 仍是兩端中點，兩型各半，pKa＝8。端點大小調換不改變型態命名。","p":["荷"],"s":["算"],"l":["酸鹼線"]},{"ch":"UV","L":"L13","title":"沿透射光路判儀器","ask":"DAD 的典型同時多波長光路，樣品與分光器誰在前？","chain":"供光 → 選波長／樣品吸收 → 偵測透射光 → 換成 T、A","why":"UV–Vis 吸收法看「穿過樣品後還剩多少光」。Scanning spectrophotometer（掃描式分光光度計）典型先用 Monochromator（單色光器）選窄波段，再過樣品；陣列式則可先過樣品，再把不同波長分到不同二極體。","ex":"看到 lamp→monochromator→sample cuvette→detector，先辨透射吸收。題本把相對方向寫 180°；意思是收光在透射方向，而非每個鏡片都必須排成一直線。","trap":"不把分光元件當偵測器。Fluorescence（螢光）常以側向收光避開入射光；Raman（拉曼）配置多樣，不一律強定 90°。","q":"DAD 的典型同時多波長光路，樣品與分光器誰在前？","ans":"寬頻光先過樣品，再經分光系統到二極體陣列。典型掃描式先選 λ 再過樣品。","p":["色"],"s":["樣","測"],"l":[]},{"ch":"UV","L":"L14","title":"光源、容槽與溶媒先通過選波長關卡","ask":"為什麼「空白扣掉溶媒」不代表任何高吸收溶媒都可以用？","chain":"光源有光＋容槽透光＋溶媒低背景 → 有效光足夠 → 才能量檢品","why":"分析波長先決定，才選燈、容槽、溶媒。常見配對是 Deuterium lamp（氘燈）供 UV、Tungsten-halogen lamp（鎢鹵素燈）供可見光。UV 常用石英容槽，普通玻璃多用於可見光。","ex":"測 250 nm 時，普通玻璃或在該處吸收很強的溶媒可能先吃掉光。空白可校背景，卻不能把幾乎消失的有效光變回來。","trap":"Xenon lamp（氙燈）可用於跨 UV／VIS 的儀器，不能背成只有 UV。容槽是否可用看實際透光窗；1 cm 是題本常用值，並非所有容槽固定值。","q":"為什麼「空白扣掉溶媒」不代表任何高吸收溶媒都可以用？","ans":"溶媒若已讓有效光太少，讀數噪音與動態範圍會出問題；數學扣背景不能補回信號。","p":["色"],"s":["源","樣"],"l":["空白線"]},{"ch":"UV","L":"L15","title":"DAD：時間、波長、吸光度接成資料","ask":"HPLC-DAD 的「峰純度通過」，能否保證沒有任何雜質？","chain":"每時刻取得多波長 A → 比較峰前／頂／後 → 判差異 → 輔助純度與定量","why":"Diode array detector（光二極體陣列偵測器；DAD）讓一個時間點有整段吸收光譜。配合 HPLC 分離，可以選擇各成分適合波長定量，也能比較同一層析峰中不同時間的光譜。","ex":"峰前、峰頂、峰後的光譜不同，提示可能有共流出或其他變動；若光譜看起來一樣，也可能是雜質光譜太相似或信號太弱。","trap":"Peak purity（峰純度）查核屬光譜證據，不能證明化學純度 100%。DAD 不負責實體分離，HPLC 才把成分沿時間分開。[S06]","q":"HPLC-DAD 的「峰純度通過」，能否保證沒有任何雜質？","ans":"不能。光譜相似、完全共流出、很低濃度或不吸 UV 的成分仍可漏過；需要其他適當證據。","p":["色"],"s":["測","算"],"l":[]},{"ch":"UV","L":"L16","title":"四項性能查核：橫軸、縱軸、分辨、雜散光","ask":"橫軸峰位置不對，用 potassium dichromate 的吸光度查核可以取代波長校正嗎？","chain":"先認查核目標 → 選正確參考標準 → 修正設定／性能 → 重測","why":"四種問題對應四把尺：波長準確看峰在哪；Photometric accuracy（光度準確度）看 A 對不對；Spectral resolution（光譜解析度）看窄帶能否分清；Stray light（雜散光）看不該來的光是否混进來。","ex":"題本波長配汞弧燈或 5% holmium perchlorate；A 配 0.006% potassium dichromate；解析度配 0.02% toluene in hexane；雜散光配 1.2% KCl。配對須記，原理見四項表。","trap":"這些濃度與 ±1 nm 屬本次題本配對，不宣稱是所有現行藥典通則。Slit width（狹縫寬度）縮小常改善帶寬，但光量減少，須兼顾噪音。","q":"橫軸峰位置不對，用 potassium dichromate 的吸光度查核可以取代波長校正嗎？","ans":"不能；須先選波長標準。縱軸準確不表示橫軸準確。","p":["色"],"s":["算"],"l":["空白線","解析度線"]},{"ch":"UV","L":"L17","title":"差異光譜：相減消掉相同部分","ask":"題本 NaOH 萃取檢品對什麼參考？","chain":"量 A₁ 與 A₂ → 相減 ΔA → 相同背景抵消 → 留目標差異","why":"Difference spectroscopy（差異光譜法）先用 pH 或其他反應讓目標物改變，而干擾盡量保持相同；再相減。要讓「同樣背景」同時出現在樣品與參考，才有東西可以扣。","ex":"自编：鹼性 A＝0.60、酸性 A＝0.40；兩份均含不變背景 0.20，ΔA＝0.20。若參考只放純酸，少了檢品干擾，不會得到正確抵消。","trap":"題本 Aspirin：NaOH 萃取檢品放樣品槽、HCl 萃取檢品放參考槽。光徑、稀釋、萃取率和反應時間須可比；ΔA 可正可負。","q":"題本 NaOH 萃取檢品對什麼參考？為什麼不能只用純 HCl？","ans":"對 HCl 萃取的等量檢品；純 HCl 沒有相同干擾，不能抵消該背景。","p":["極","元"],"s":["樣"],"l":["分配線","空白線"]},{"ch":"UV","L":"L18","title":"微分光譜：對 λ 取斜率，不是改分子","ask":"一階微分在原峰頂是最大值還是 0？","chain":"沿 λ 看 A 的斜率 → 一階；再看斜率變化 → 二階 → 判峰形","why":"Derivative spectroscopy（微分光譜法）是在原始曲線上做數學處理。沿波長往右走，曲線往上時斜率正，到了光滑峰頂暂時不往上或下，一階斜率就是 0；之後下降，斜率負。這已足夠理解基本題。","ex":"對理想、孤立、對稱的 Gaussian peak（高斯峰），中心的 0–4 階依序為正峰、0、負谷、0、正峰。圖 5 同一條中心線帮助核對，不把一階最大值當原峰頂。","trap":"只對一般光滑非退化極大值保證一階 0、二階負；三／四階口訣須峰形條件。微分會放大噪音，不是改分子，也不保證硬體解析度自動提高。[S05]","q":"一階微分在原峰頂是最大值還是 0？「差異」與「微分」的動作差在哪？","ans":"是 0。差異：兩條件光譜相減；微分：同一條曲線沿 λ 求導數。","p":["色"],"s":[],"l":["解析度線"]},{"ch":"UV","L":"L19","title":"方法選擇：問它能否提供所需資訊","ask":"題目問溶液中藥量、固體晶型、完整結構，UV 對哪項最直接？","chain":"要哪種資訊 → 選方法與條件 → 讀適當訊號 → 做範圍內的結論","why":"本章強項是把有效吸收轉成含量，或比較光譜／化學型態。它能測含量、溶解度、溶離／釋出、分配、適當 pKa 與反應進程。若要完整結構或固體晶型，只看一張溶液 UV 通常證據不足。","ex":"題本 Adrenaline 的 catechol 系統與 Fe²⁺ 形成約 540 nm 吸收的錯合物；相較未如此錯合的 Lidocaine，提高選擇性。固定「試劑／基团／波長」配對須記。","trap":"複雜複方先考慮適當分離、選擇性反應或驗證模型；不能把「不宜單用 UV」變成「一定改用 NIR」。紫外譜比對鑑別也不是唯一證明完整結構。","q":"題目問溶液中藥量、固體晶型、完整結構，UV 對哪項最直接？","ans":"可校正且無干擾時，含量最直接。晶型要保留固態資訊；完整結構須結合 NMR／MS／IR 等證據。","p":["色","晶"],"s":[],"l":["保留線"]},{"ch":"UV","L":"L20","title":"誤差定位：光少了與額外漏光方向相反","ask":"A 偏高是否就證明濃度更高？","chain":"偏差現象 → 列可能原因 → 用條件或另一讀數分辨 → 修正後重測","why":"散射把直達光移走，I 變少，T 變小，表觀 A 常偏高。未被樣品同樣吸收的雜散光把 I 墊高，T 變大，高吸光度讀數常偏低。兩者都叫「散」，方向卻不同。","ex":"自編理想例：真 T＝0.001，额外漏光使讀到約 0.002；測得 A 由 3 降成約 2.7。反過來，懸浮顆粒讓直達光變少時，A 可能偏高。[S03]","trap":"同一個偏高也可能是溶媒揮發濃縮或空白不合，不能單靠 A 反推唯一原因。去顆粒／過滤還須驗證目標物沒有被吸附或損失。","q":"A 偏高是否就證明濃度更高？雜散光常讓高 A 檢品讀高還是讀低？","ans":"不能，尚可能有散射／空白等因素。此模型雜散光使有效 I 增大，A 常讀低。","p":["色"],"s":["算"],"l":["空白線","解析度線","保留線"]},{"ch":"螢光","L":"L01","title":"微量分析與選擇性","ask":"為什麼螢光法常適合量很少的藥物？","chain":"分析物能發光 → 選特定激發／發射波長 → 從較低背景辨訊號 → 用於微量分析。","why":"先分清兩種量法：吸收法看「照進去的光少了多少」；Fluorescence（螢光）看「樣品受光後多發出了多少光」。螢光端避開直達光，又用兩個波長篩選，有利於辨認少量分析物。Sensitivity（靈敏度）著重訊號隨濃度改變的幅度；Detection limit（偵測極限）還看背景與噪音。Selectivity（選擇性）則是能否區分目標與其他成分，三者不能當同義詞。","ex":"Q19 的四個選項中，螢光偵測器最具選擇性：需要分析物在指定條件能吸收激發光，又在選定波段發光。它較挑分析物，並不代表適用物質最多。","trap":"實際空白不是零：溶媒、散射、試劑與儀器都可能有背景。無可測螢光時，應考慮衍生化或其他方法。","q":"閉卷自問：「較具選擇性」能否改寫成「所有藥物都最適合用螢光」？","ans":"不能。選擇性與適用範圍分開；先確認目標有可用訊號。","p":["色"],"s":["選"],"l":["空白線","保留線"]},{"ch":"螢光","L":"L02","title":"結構先過吸收與發光兩關","ask":"會吸光、結構很硬，就一定會發螢光嗎？","chain":"先吸得到光 → 形成激發態 → 部分經發光路徑回落 → 才有可測螢光。","why":"第一關是能在工作波長吸收；第二關是吸收後是否有足夠比例再放出螢光。Chromophore（發色基團）關係到吸收，Rigid structure（剛性結構）常有利於減少扭轉等能量散失。兩項是有用線索，仍不能保證每個分子都很亮。吸收與有效發光是兩個判斷。","ex":"Q08 的 Camphor 有 C=O，含 ketones，骨架也剛硬；題本不選它作直接螢光分析物，應理解為沒有該題可用的有效螢光，不能說它沒有發色基團或完全不剛硬。","trap":"Q21 的「需為剛性骨架」是題本接受的概括。嚴格說是剛性常有利，並非所有發光分子的絕對必要條件。","q":"閉卷自問：Digoxin 有環，是否可以省掉題目要求的脫水與氧化？","ans":"不能。有環不保證原物能直接給出該方法的螢光；題目量的是處理後產物。","p":["色"],"s":[],"l":[]},{"ch":"螢光","L":"L03","title":"選測定路徑與檢品角色","ask":"要量原物、做出來的產物，還是消失的那部分？","chain":"辨分析物 → 選直接／衍生化／差值路徑 → 固定程序 → 指定 F 或 ΔF。","why":"Native fluorescence（天然螢光）量原物，例如 Riboflavin；Derivatization（衍生化）先做出會亮的產物，例如 Thiamine 轉成 Thiochrome；Selective suppression（選擇性熄滅）先量總光，再消去目標的光，用前後差值。分類軸要分清：是否先反應，以及最後用 F 還是 ΔF，是兩個不同問題。","ex":"同樣是 Riboflavin，可以量它原本的光；有雜質背景時，也可依指定方法用還原前後差值。不能只背一個藥永遠屬於一條路。","trap":"Analyte（分析物）是要知道含量的對象；Reagent（試劑）是幫忙反應的物質；Standard（標準品）用來建立對照；Blank（空白）用來查背景。角色不互換。","q":"閉卷自問：Thiamine 先做出 Thiochrome 後，最後報的是誰的含量？","ans":"原檢品的 Thiamine。標準品也經相同反應，才能把產物訊號對回原物量。","p":["反"],"s":["樣"],"l":["空白線","保留線"]},{"ch":"螢光","L":"L04","title":"吸收後的能量帳與波長","ask":"為什麼通常放出的光波長比較長？","chain":"吸收光 → 先散失部分能量 → 再放出較低能量光子 → 發射波長通常較長。","why":"先記一個高中程度關係：同一個光子，波長越長，能量越小。普通螢光中，分子吸收光後，往往先經振動與溶媒鬆弛散失部分能量，再放光，所以通常 λem＞λex。Excitation wavelength（激發波長）是照進去的；Emission wavelength（發射波長）是放出來的。Stokes shift（史托克位移）描述相應吸收／發射帶的位移；本題本用 nm 的峰位差來問。","ex":"自編例：λex＝350 nm、λem＝450 nm，波長差＝450−350＝100 nm；發射光子的能量較小。舊筆記 Ethinyl estradiol 285／310 nm 的差是 25 nm，也不因此錯誤。","trap":"Q10 的 50～150 nm 是「最常出現」的題本選項，不是硬上下限。「通常較長」不能改成所有物理情況永遠較長。","q":"閉卷自問：Q17 寫「激發光比放射光長」，通常情況怎麼判？","ans":"方向反了。一般放射波長較長；先辨 ex／em，再算差值。","p":["色"],"s":[],"l":[]},{"ch":"螢光","L":"L05","title":"量子產率是光子比例","ask":"量子產率是在數什麼？","chain":"數吸收光子 → 數放出螢光光子 → 後者除以前者 → 得到 Φ。","why":"Fluorescence quantum yield（螢光量子產率）Φ，是「每吸收一個光子，平均產生多少螢光光子」。普通一光子螢光用 Φ＝N_F／N_abs，通常介於 0～1。分母是吸收掉的光子，不是照進去的全部光子。它描述發光效率，和儀器最後讀到的 F 是兩種量。","ex":"吸收 100 個光子、放出 80 個螢光光子：Φ＝80／100＝0.8＝80%。若照入 200 個、只吸收 100 個，分母仍用 100。","trap":"Φ＝1 表示光子數比為 100%；不表示吸收的全部能量都變成螢光。光子能量還要看波長。Q16 的「接近100」少了 %，不能當作接近 1。","q":"閉卷自問：Φ＝0.6，要有螢光是否還得等 Φ＞1？","ans":"不用。0.6 已有螢光，表示每吸收光子的螢光光子數比為60%；Q13 的 Φ＞1 才有螢光是錯誤。","p":["色"],"s":[],"l":[]},{"ch":"螢光","L":"L06","title":"螢光與磷光分流","ask":"螢光與磷光，國考先分哪一條路？","chain":"同分子受激 → 留在 S 路可放螢光／轉到 T 路可放磷光 → 比較回落與時間。","why":"先把 S、T 當兩種電子自旋狀態的分類標籤。Singlet state（單重態）不是一顆電子；Triplet state（三重態）不是三顆電子。常見教科書路徑：S₁→S₀ 放螢光；先由 S₁ 經 Intersystem crossing（系間跨越）到 T₁，再由 T₁→S₀ 放 Phosphorescence（磷光）。","ex":"Q14 把「螢光涉及自旋改變、磷光沒有」寫反。考場先對路徑，再比時間：通常螢光較快、磷光較慢。","trap":"系間跨越本身不是放磷光；轉到 T₁ 後還可能不放光。同分子通常磷光光子能量較小；不同分子不能只憑光的名稱排能量。禁阻是機率低，不是零。","q":"閉卷自問：S₁→T₁ 一發生，就一定看得到磷光嗎？","ans":"不一定。它先換到三重態；還須與其他失活路徑競爭，才能發出磷光。","p":["色"],"s":[],"l":[]},{"ch":"螢光","L":"L07","title":"剛性、黏度與溫度","ask":"濃度不變，降溫或增加黏度為何可能更亮？","chain":"減少扭轉／碰撞失活 → 非發光路徑減少 → 發光比例可增加 → F 可增強。","why":"吸收後不只有發光一條出口。Non-radiative deactivation（非輻射失活）可以讓能量經分子運動與環境作用散失。結構更固定、溶媒更黏或一般降溫時，部分扭轉／碰撞失活可減少，讓更多激發事件來得及發光。題本的常見方向是黏度↑、溫度↓，螢光增強。","ex":"Q24 問哪項正確，選「通常低溫時螢光強度會增大」。先說降低部分非發光散失，再選答案，不需先算速率常數。","trap":"固定物種、濃度與工作波長才比較。換溶媒也可能改極性、氫鍵與溶解度；降溫若析出，就不是只改失活。不是每次碰撞都淬熄。","q":"閉卷自問：溫度改了，標準品仍用原溫度校正，能否直接將 F 的增加當濃度增加？","ans":"不能。標準與檢品應匹配溫度；F 也會受發光效率影響。","p":["色"],"s":["算"],"l":["分配線","溫度線","保留線"]},{"ch":"螢光","L":"L08","title":"取代基的題本配對","ask":"取代基配對題，有哪些必須直接記？","chain":"辨苯環取代基 → 核對題本增強組 → 選組合 → 保留骨架與物種條件。","why":"這是必背配對，不能只靠「電子多就亮」推出所有結果。Q15 在所列取代基中，增強組是 OH、NH₂、NHMe，即①②⑥。原表另列 OCH₃、CH₃；減弱組列 F、Cl、Br、COOH。NH₃⁺、NO₂ 也不在該題增強組。","ex":"看到①OH、②NH₂、⑥NHMe，選 B。A 含④COOH，C 含③⑤⑦，D 含④⑤，都不是該題的增強組。","trap":"NH₂ 與質子化的 NH₃⁺ 不同。電子效應、取代位置、母骨架、溶媒與失活途徑都會改發光，不能把芳香取代反應的「活化」直接等同螢光必增強。","q":"閉卷自問：把 NH₂ 改成 NH₃⁺，還可直接沿用同一增強配對嗎？","ans":"不可。化學物種與孤對電子參與方式不同；Q15 就用它誘答。","p":["骨"],"s":["選"],"l":["酸鹼線","分配線"]},{"ch":"螢光","L":"L09","title":"重原子、溶氧與共存淬熄物","ask":"加入別的物質後變暗，先想到哪些原因？","chain":"重原子／氧／共存物影響 → 非發光路徑或可發光物種改變 → F 可下降 → 查干擾。","why":"Quenching（淬熄）是發光因與其他物種作用而減弱。Heavy atom effect（重原子效應）可讓 S／T 態間轉換更容易，因而減少螢光；題本一般方向為 I＞Br＞Cl，氯／溴離子可使訊號下降。溶氧也可淬熄，已知有干擾時依方法以 Nitrogen（氮氣）除氧。","ex":"Q07：Caffeine 存在時，Riboflavin 的螢光是減少；選項「增強」反了。這項配對先記方向，不用捏造唯一微觀機制。","trap":"不能從螢光下降推成磷光必增加；氧也能讓三重態失活。金屬錯合可能增強或減弱，需看特定系統。變暗也可能只是光被吸收遮掉，見 L14。","q":"閉卷自問：「金屬會淬熄」能否否定鋁、鋅螢光錯合分析？","ans":"不能。L18 是特定配體與金屬形成有效發光系統；一般干擾方向不能取代特定方法。","p":["色"],"s":[],"l":["空白線"]},{"ch":"螢光","L":"L10","title":"pH 與溶媒先辨物種","ask":"加酸、加鹼、換溶媒，為何濃度相同也能改訊號？","chain":"pH／溶媒改變 → 物種、吸收或失活改變 → 波長與 F 改變 → 匹配條件再校正。","why":"同一總量可以在溶液中分成不同酸鹼物種；它們的吸收與發光未必相同。pH 也可能改變工作波長的合適程度。溶媒種類會影響極性、氫鍵、溶解度與非發光失活。先問「目前是什麼物種、在什麼條件」，再比 F。","ex":"舊筆記 Ethinyl estradiol 方法以加鹼減弱訊號為例。但 Fluorescein 的二陰離子在鹼性仍可強發光，所以不能背成「解離都變暗」。","trap":"極性↑或氫鍵↑也沒有對所有分子統一的 F 方向。標準與檢品匹配 pH／溶媒，再驗證工作範圍。只有強度變化，不能直接推定含量下降。","q":"閉卷自問：Q24 的「幾乎不受 pH、溶劑影響」怎麼判？","ans":"錯。物種與環境會影響吸收、發光與工作波長；先固定條件才能定量。","p":["荷"],"s":["樣","算"],"l":["酸鹼線","分配線"]},{"ch":"螢光","L":"L11","title":"光路與兩個選波長模組","ask":"兩個單光器各選什麼？90° 避開什麼？","chain":"光源 → 激發端選波長 → 樣品；側向發光 → 發射端選波長 → 偵測器讀 F。","why":"Monochromator（單光器）是選波長模組，常含 Grating（光柵）與狹縫；不能把光柵另列成樣品後的一站。第一個選 λex，第二個選 λem。典型掃描儀常用 Xenon lamp（氙燈）、四面光學透明的 Quartz cuvette（石英容槽）與 Photomultiplier tube（光電倍增管）。","ex":"首例設定 λex＝350、λem＝450 nm：第一端讓 350 nm 光照樣品；側向收光後，第二端選 450 nm 給偵測器。透射激發光沿原方向離開，不是同一條串聯到偵測器。","trap":"90° 主要減少直達入射／透射光干擾，不能消除所有散射。Q01 的 D 用「避免散射干擾」作全稱，題本選它錯；第二單光器、空白與檢品處理仍重要。其他幾何／固定波長設備另有配置。","q":"閉卷自問：把偵測器放 90°，是否就不必量空白？","ans":"仍須量空白。散射、溶媒與試劑光可以進入側向通道。","p":["色"],"s":["源","樣","選","測"],"l":["空白線"]},{"ch":"螢光","L":"L12","title":"散射與螢光訊號辨認","ask":"溶劑或懸浮粒子也有光，怎麼分？","chain":"先量空白 → 比對散射與發光 → 必要時改 λex 比較 → 處理背景 → 再判 F。","why":"Rayleigh scattering（瑞利散射）是彈性散射，波長與激發光相同；Tyndall scattering（廷得耳散射）描述膠體／懸浮微粒的散射；Raman scattering（拉曼散射）會交換振動能量，同一模式主要保持固定波數差，不是固定 nm 差。第一個動作是用同條件空白辨背景。","ex":"若 λex＝350 nm，350 nm 附近的側向峰可能含瑞利散射；把發射端改到 450 nm 可減少這種背景，但與螢光重疊的背景仍需另外處理。","trap":"單一穩定物種的通常螢光發射帶在換激發波長時位置大致不變，強度可變；拉曼峰的波長則跟著改。混合物、光化學變化會使這個簡單判別失效。","q":"閉卷自問：改激發光後，拉曼峰固定的是 nm 差還是 cm⁻¹ 差？","ans":"同一振動模式的波數差，單位 cm⁻¹；不是波長差。","p":["色"],"s":["樣"],"l":["空白線"]},{"ch":"螢光","L":"L13","title":"掃描定義、帶狀與鏡像","ask":"激發譜與發射譜，哪一端固定、哪一端掃描？","chain":"固定發射掃激發／固定激發掃發射 → 記錄 F → 找工作波長與譜形。","why":"Excitation spectrum（激發光譜）：固定 λem，掃 λex；問哪種照入光最能讓樣品在該發射端變亮。Emission spectrum（發射光譜）：固定 λex，掃 λem；問樣品放出的光在哪裡。兩種圖的縱軸通常都是所偵測的螢光讀數 F。","ex":"固定發射 450 nm，依次試 330、350、370 nm 激發，這是激發譜；固定激發 350 nm，再掃 400～550 nm，這是發射譜。","trap":"分子溶液通常呈帶狀；題本接受激發／發射帶近似鏡像，但不是兩峰同位，也不是所有 nm 圖都精確對稱。經響應校正與物種一致時，激發譜形可類似吸收譜；它仍不是直接吸光度。","q":"閉卷自問：換 λex 後發射峰仍在 450 nm，峰高必相同嗎？","ans":"不必。不同激發波長的吸收效率與光源強度可不同；峰位相近不等於 F 相同。","p":["手"],"s":[],"l":["解析度線"]},{"ch":"螢光","L":"L14","title":"低吸收線性與高濃度偏離","ask":"為什麼濃度愈高，不一定愈好測？","chain":"低吸收且條件固定 → F 約隨 c 增加；濃度很高 → 遮光／再吸收或淬熄 → 偏離直線。","why":"先用簡單模型：在驗證過的稀溶液範圍，其他條件相同、空白扣除後，可寫 F_net≈m c。m 是校正斜率，c 是濃度。濃度加倍，淨 F 約加倍。濃度太高時，光進不到有效收光區、發出的光被再吸收，或分子間相互作用增加，都可能讓這個比例失效。","ex":"標準 2 µg/mL 的淨 F＝100，檢品淨 F＝50，且同條件在線性範圍：檢品濃度為標準的一半，即1 µg/mL。不能拿超出校正範圍的1000單位直接套。","trap":"Inner filter effect（內濾效應）是光學衰減；Self-quenching（自我淬熄）是分子相互作用。高濃度可轉平或下降，不代表每次都必下降，也不必代表本徵 Φ 下降。","q":"閉卷自問：Q21 的「均呈直線」為什麼錯？","ans":"正比有低吸收、固定條件與有效校正範圍；不能外推到所有濃度。","p":["色"],"s":["算"],"l":["標準曲線線"]},{"ch":"螢光","L":"L15","title":"Vitamin B₁ 氧化做出訊號","ask":"B₁ 氧化是做出訊號，還是消去訊號？","chain":"Thiamine → 鹼性氧化 → Thiochrome → 量螢光 → 對回 B₁ 含量。","why":"B₁ 先做出可測發光產物；B₂ 原本亮，還原消去目標的光。","ex":"舊筆記配對：Isobutanol（異丁醇）抽取，Ex365／Em440 nm。先辨「B₁→氧化→產物亮」，再記試劑與方法波長，不把整串當沒有角色的口訣。","trap":"Q23 的 D 錯在酸化「因閉環」而失光的說法；不能反過來把形成 Thiochrome 的環化說成熄滅原因。原 Thiamine 也不是完全開鏈。酸鹼對訊號的影響要依方法。","q":"閉卷自問：B₁ 這條與 B₂ 還原差值的方向有何不同？","ans":"B₁ 先做出可測發光產物；B₂ 原本亮，還原消去目標的光。","p":["色","荷"],"s":["算"],"l":["酸鹼線"]},{"ch":"螢光","L":"L16","title":"Vitamin B₂ 還原差值","ask":"B₂ 還原後變暗，為什麼反而有助定量？","chain":"先量總光 → 還原目標使其變暗 → 再量背景 → 前減後並扣空白 → 取得目標 ΔF。","why":"反了。此方法利用原本的螢光被還原消去，Q09 選 B。","ex":"自編：處理前 F＝90，還原後 F＝30，且試劑空白差為0，目標ΔF＝90−30＝60。30 是還原後的殘餘，不能直接拿來報 B₂ 含量。舊稿工作波長 Ex444／Em520 nm。","trap":"Q20 別混 Sodium thiosulfate（硫代硫酸鈉）Na₂S₂O₃。還原不完全、加試劑造成稀釋、雜質也變暗或試劑背景改變，都會使簡單差值失效。","q":"閉卷自問：Q09 寫「還原才具有螢光」，怎麼判？","ans":"反了。此方法利用原本的螢光被還原消去，Q09 選 B。","p":["色"],"s":["算"],"l":["空白線"]},{"ch":"螢光","L":"L17","title":"Digoxin 脫水與氧化","ask":"Digoxin 題目先脫水、氧化，是在準備什麼？","chain":"Digoxin → HCl 脫水 → H₂O₂ 氧化 → 螢光產物 → 回推含量或溶離量。","why":"這是衍生化路徑。題本先用 Hydrochloric acid（鹽酸）脫水，再用 Hydrogen peroxide（過氧化氫）氧化，做出可測螢光的產物。選偵測器時要看「處理後要讀什麼」，而不只看原物的骨架。","ex":"Q18 已說經脫水與氧化，最適合讀螢光，選 B；Q03 的「與鋁離子錯合再分析」是把另一種方法塞進這條路，選 D。舊稿波長 Ex360／Em490 nm。","trap":"Q03 題本引用中華藥典第九版60 min／80%，另引 Watson 所述英國藥典2 h／75%。這是該題的來源與版次疑義，不是本版已核對的現行產品規格。達數值門檻也不等於已完成整批藥典允收判定。","q":"閉卷自問：只見 Digoxin 有剛性環，是否足以推出免反應直接量螢光？","ans":"不夠。依本題指定程序量處理後產物；反應、標準與檢品須匹配。","p":["色"],"s":["算"],"l":[]},{"ch":"螢光","L":"L18","title":"鋁與鋅的螯合訊號","ask":"金屬本身不發光，怎樣以螢光測它？","chain":"金屬＋配位試劑 → 特定發光錯合物 → 量產物 F → 校正金屬量。","why":"不是。Al(III) 是待測物，配體幫忙形成可測產物；用同程序標準建立對照。","ex":"Q02 的鋁衍生化可用於所述透析液分析，選 D；Q26 的 Zn 錯合物比游離 8-Hydroxyquinoline 螢光強，選 D。舊稿 Al 例 Ex392／Em518 nm。","trap":"PDF p2 拼成 8-hydroxyquinolone，p11 與舊筆記為 8-Hydroxyquinoline，本版統一後者。不把所有金屬錯合都背成增強，也不把它與 Digoxin 的氧化路徑混在一起。","q":"閉卷自問：分析 Al(III) 時，8-Hydroxyquinoline 是待測物嗎？","ans":"不是。Al(III) 是待測物，配體幫忙形成可測產物；用同程序標準建立對照。","p":["色","元"],"s":["算"],"l":[]},{"ch":"螢光","L":"L19","title":"蛋白質訊號與環境探針","ask":"蛋白質的 280 nm 與305／350 nm，是同一種讀數嗎？","chain":"先分吸收與發射 → 比環境造成的譜形變化 → 排除干擾 → 支持結合／安定性判讀。","why":"不能。先辨題目問吸收還是發射，再配對讀數。","ex":"Q22 問的是280 nm吸收，直接選 Tyrosine、Tryptophan；Q02 的「不適於肽類定量／安定性」太絕對，合適標記、天然訊號或衍生化方法可以使用。","trap":"單看 F 增減不證明變性或結合；藥物自身發光、內濾、pH與淬熄也可改訊號。舊稿 Tyr305下降／Trp350上升只當特定例，不能外推所有蛋白。","q":"閉卷自問：280 nm 的來源題，能把「Trp 發射350 nm」當成它的答案嗎？","ans":"不能。先辨題目問吸收還是發射，再配對讀數。","p":["量"],"s":[],"l":["標準曲線線","空白線"]},{"ch":"螢光","L":"L20","title":"校正、品質與回查閉合","ask":"怎樣把亮度變成可以相信的含量？","chain":"扣空白 → 用同條件標準校正 → 查有效範圍 → 回推稀釋 → 合格才報結果。","why":"Blank correction（空白校正）先扣背景，Calibration（校正）再把淨訊號對回濃度。相同工作波長、增益、狹縫、溶媒、pH、溫度與反應條件是可比的前提。訊號很漂亮，只代表有讀數，還沒代表含量可信。","ex":"首例空白5、標準105、檢品55：淨訊號為100與50；同條件線性範圍內，檢品濃度為標準的一半。若檢品先稀釋4倍，報原濃度還要乘4。","trap":"F 偏低時依證據回查：檢品／方法回M01，反應與物種回M02，波長／處理與背景回M03，判準回M04。修正後重測／重讀；這是分析者流程，不是分子自行回饋。","q":"閉卷自問：若標準增益改了，是否仍可直接用原斜率回推檢品濃度？","ans":"不能。儀器響應變了，需匹配條件並重新校正或依方法作適當校正。","p":["色"],"s":["樣","算"],"l":["空白線"]},{"ch":"IR","L":"L01","title":"吸收的入口：能量與選擇定則","ask":"振動模式＋入射能量改變時，訊號或結論會怎樣？","chain":"能量吻合＋偶極矩會變 → 允許吸收 → 該波數透射光減少。","why":"吸收需要合適的能量，也需要該振動能和光的電場作用。判斷的是振動中的偶極矩變化，不是分子原本有沒有永久偶極矩。","ex":"CO₂ 的非對稱伸縮可改變偶極矩，因此沒有永久偶極矩也能有 IR 吸收。","trap":"逐個模式判斷；不能把全部對稱分子判成不可測。","q":"閉卷自問｜N₂ 的通常基本伸縮會因為鍵在振動，就有明顯 IR 吸收嗎？","ans":"不會。通常基本伸縮不造成偶極矩變化；能量匹配還不夠。\n\n短鏈：能量吻合＋偶極矩會變 → 允許吸收 → 該波數透射光減少。","p":["骨"],"s":[],"l":["解析度線"]},{"ch":"IR","L":"L02","title":"峰位：力常數與折合質量","ask":"同類模式的 k、折合質量 μᵣ改變時，訊號或結論會怎樣？","chain":"質量變重、k 近似不變 → 振動變慢 → 波數下降。","why":"鍵的回復力使原子往平衡位置返回；較重的原子在相同回復力下動得較慢。鍵較硬則振動較快。","ex":"CH 換成 CD，局部模型估計波數約變為 0.73–0.74 倍；3000 cm⁻¹ 約移至 2200 cm⁻¹。","trap":"局部諧振子近似；多原子耦合與環境可改變實測。","q":"閉卷自問｜質量不變，k 增為四倍，波數會變成幾倍？","ans":"兩倍；波數隨 √k，而非隨 k 成正比。\n\n短鏈：質量變重、k 近似不變 → 振動變慢 → 波數下降。","p":["骨"],"s":[],"l":[]},{"ch":"IR","L":"L03","title":"共軛、醯胺與小環：羰基位移","ask":"羰基種類＋共軛／環張力改變時，訊號或結論會怎樣？","chain":"同類羰基增加共軛 → 有效 k 通常下降 → 波數通常下降。","why":"共軛讓 C=O 的鍵性不再像完全局部的雙鍵，常降低有效力常數。先固定羰基類型再比較；四員 β-lactam 的共振及環境不同，常有較高波數。","ex":"Prednisolone acetate 原圖 1 是 C3 共軛酮、2 是 C20 側鏈酮：選 1660；1710 cm⁻¹。","trap":"1700 不是硬邊界；箭頭 2 不是末端 acetate 的酯羰基。","q":"閉卷自問｜Ampicillin 的 1780 cm⁻¹ 可以指定成全部羰基共用一個峰嗎？","ans":"不能。題目用 β-lactam 高波數羰基定位；側鏈醯胺與酸羰基有不同環境。\n\n短鏈：同類羰基增加共軛 → 有效 k 通常下降 → 波數通常下降。","p":["色","骨"],"s":[],"l":[]},{"ch":"IR","L":"L04","title":"峰強：振動偶極矩導數與濃度","ask":"偶極矩變化、濃度、光徑改變時，訊號或結論會怎樣？","chain":"振動造成的偶極矩變化較大 → 躍遷較容易 → 內在吸收帶較強。","why":"光與振動模式的作用越有效，吸收帶通常越強。實測峰高還混入樣品量、光徑、重疊和帶寬，所以看到高峰不能只歸因於鍵本身。","ex":"Q17 在題給 C–C、C–F、C–H、C–O 的局部比較中選 C–F；這不表示 C–F 的波數最高。","trap":"題本極性排序是局部捷徑；鍵級不能直接排序峰強。","q":"閉卷自問｜ATR 接觸不良使全部峰變低，可以直接說濃度變低嗎？","ans":"不能。接觸變化就可能改變峰高；先固定取樣條件，再比較濃度。\n\n短鏈：振動造成的偶極矩變化較大 → 躍遷較容易 → 內在吸收帶較強。","p":["骨"],"s":["算"],"l":["分配線"]},{"ch":"IR","L":"L05","title":"讀軸：波數、波長、A 與 %T","ask":"座標名稱、單位、T 或 A改變時，訊號或結論會怎樣？","chain":"先辨 %T 或 A → 換成同一讀法 → 讀峰位與吸收方向。","why":"同一吸收在 %T 圖是向下的谷，在 A 圖是向上的峰。波數是每公分的波數，和波長互為倒數；兩種座標不能同方向排序。","ex":"10%T 先寫 T=0.10，再用 A=−log₁₀T 得 A=1；10000 nm 則等於 1000 cm⁻¹。","trap":"T 用小數；A 不是吸收光分率；每次確認實際橫軸。","q":"閉卷自問｜539 nm 和 539 cm⁻¹ 能不能算成同一位置？","ans":"不能。539 nm 是可見綠光；539 cm⁻¹ 約 18.6 µm，屬紅外。\n\n短鏈：先辨 %T 或 A → 換成同一讀法 → 讀峰位與吸收方向。","p":["骨"],"s":["算"],"l":[]},{"ch":"IR","L":"L06","title":"伸縮、彎曲與官能基區","ask":"峰位＋帶形＋題給候選改變時，訊號或結論會怎樣？","chain":"看位置與帶形 → 找基團候選 → 用結構與其他峰核對。","why":"伸縮改鍵長，彎曲改鍵角；它們有不同的回復力，因此常落在不同波數區。經驗範圍是候選入口，還要用結構及其他峰交叉驗證。","ex":"Q04 的 3200–3500 cm⁻¹，候選 H–O、C=O、C=C、C≡N 中選 H–O。","trap":"3300 附近也可能有 N–H 或末端 ≡C–H；單峰不唯一。","q":"閉卷自問｜若 3300 cm⁻¹ 是尖峰，且沒有 O 原子，還能只憑位置指定為 O–H 嗎？","ans":"不能。需考慮 N–H、末端 ≡C–H 等候選，再看結構與其他峰。\n\n短鏈：看位置與帶形 → 找基團候選 → 用結構與其他峰核對。","p":["骨"],"s":[],"l":[]},{"ch":"IR","L":"L07","title":"氫鍵：位置與帶寬一起看","ask":"基團、相態與氫鍵環境改變時，訊號或結論會怎樣？","chain":"氫鍵環境增強／多樣 → O–H 常降低波數且變寬 → 比較位置與帶形。","why":"氫鍵常削弱 O–H 的有效回復力；不同分子處於不同局部環境，許多接近的吸收疊在一起便形成寬帶。","ex":"Aspirin 的酸 O–H 很寬，可延伸至 C–H 區；不能因此說 C–H 消失。","trap":"游離 O–H 可尖；酸 O–H 不能用單一 3500 峰定位。","q":"閉卷自問｜同一 alcohol 從稀非氫鍵溶劑變成凝聚相，O–H 常如何改變？","ans":"常往較低波數移且變寬；先固定基團再比較氫鍵環境。\n\n短鏈：氫鍵環境增強／多樣 → O–H 常降低波數且變寬 → 比較位置與帶形。","p":["骨"],"s":[],"l":[]},{"ch":"IR","L":"L08","title":"指紋比對與結構結論","ask":"檢品／標準的完整可用光譜改變時，訊號或結論會怎樣？","chain":"先控制方法與晶形 → 比較基團及指紋 → 判斷證據是否支持身分。","why":"不同結構及固態環境會改變多個耦合振動。完整可用譜段能提供更多線索；只看共同的 O–H 或 C=O 常不足以區分相近樣品。","ex":"Q05 的檢品與標準不能只比較 2000–4000 cm⁻¹，應包含指紋區。","trap":"普通非手性 IR 不能普遍分辨對映異構物；匹配不等於含量合格。","q":"閉卷自問｜只看到一個 C=O 峰，能不能證明整個藥物結構？","ans":"不能。它支持羰基候選；整體身分需更多峰、指紋及可比參考。\n\n短鏈：先控制方法與晶形 → 比較基團及指紋 → 判斷證據是否支持身分。","p":["骨","晶"],"s":["樣"],"l":["解析度線","保留線"]},{"ch":"IR","L":"L09","title":"穿透製樣：控制厚度、介質與散射","ask":"厚度、介質、顆粒與含水量改變時，訊號或結論會怎樣？","chain":"控制厚度／稀釋與粒徑 → 得到可用透射光 → 減少飽和與散射。","why":"光被吸收或散射到幾乎沒有透射時，強帶的細節便看不清。製樣要控制有效厚度、均勻度和相容性，而不是把檢品放上去就完成。","ex":"同 c，液層由 0.1 增至 0.2 mm，適用 Beer 條件時 A 加倍，T 變為原來的平方。","trap":"鹽窗怕水；mg 與 0.1–0.2 mm 是題本量級，非通用附件規格。","q":"閉卷自問｜1–10 mg 是所有 IR 的偵測極限嗎？","ans":"不是。這是題本常規檢品用量；偵測極限另取決於方法、附件與樣品。\n\n短鏈：控制厚度／稀釋與粒徑 → 得到可用透射光 → 減少飽和與散射。","p":["骨"],"s":["樣"],"l":["標準曲線線"]},{"ch":"IR","L":"L10","title":"多晶形：保留原樣與製樣效應","ask":"原固態＋研磨／壓力／溶劑歷程改變時，訊號或結論會怎樣？","chain":"製樣可能改晶形 → 光譜代表製樣後狀態 → 判斷能否回推原樣。","why":"多晶形的化學身分相同，晶格及氫鍵環境卻可能不同。想比較原晶形，必須確認取樣沒有把原狀態改掉。","ex":"Q15 題本印刷 A、C 雙答案；KBr 與 Mull 是否適用，要看樣品是否保留原固態。","trap":"ATR 常需接觸壓力；溶解通常失去原晶格資訊。","q":"閉卷自問｜溶液譜完全一致，可以直接證明原本兩個粉末晶形相同嗎？","ans":"不能。溶解後原晶格資訊通常已消失；需保留固態的比較證據。\n\n短鏈：製樣可能改晶形 → 光譜代表製樣後狀態 → 判斷能否回推原樣。","p":["晶"],"s":["樣","選"],"l":["分配線","保留線"]},{"ch":"IR","L":"L11","title":"ATR 與 DRIFT：訊號如何形成","ask":"晶體接觸或粉末散射條件改變時，訊號或結論會怎樣？","chain":"選附件 → 倏逝場吸收／漫反射 → 得到附件對應訊號。","why":"ATR 的光主要在晶體內全反射，由倏逝場取樣鄰接表層。DRIFT 則收集粉末中多次散射後離開的光，兩者的強度限制不同。","ex":"固定折射率與角度，ATR 在較低波數的取樣深度常較大；DRIFT 的 R=0.5 對應 F=0.25。","trap":"ATR 查接觸；DRIFT 查粒徑、填裝、S；F 不是 A。","q":"閉卷自問｜把 DRIFT 的 R=0.5 代入 −log₁₀R，能得到 Kubelka–Munk F 嗎？","ans":"不能。F=(1−R)²/(2R)=0.25；−log₁₀0.5 約 0.301，是另一種表示。\n\n短鏈：選附件 → 倏逝場吸收／漫反射 → 得到附件對應訊號。","p":["骨"],"s":[],"l":[]},{"ch":"IR","L":"L12","title":"FT-IR：干涉訊號變成光譜","ask":"兩臂光程差＋偵測器訊號改變時，訊號或結論會怎樣？","chain":"分光與重組 → 記錄干涉圖 → FT 得波數光譜 → 樣品／背景比值。","why":"移動鏡改變往返光程差，讓不同波數的光以不同節律影響訊號。傅立葉轉換把這些成分分開，才得到波數軸的光譜。","ex":"鏡移 x，光程差約改變 2x；兩臂是固定鏡與移動鏡，不是樣品臂與參考品臂。","trap":"背景與樣品各自 FT 後相除；不是干涉圖直接逐點相除。","q":"閉卷自問｜FT-IR 和 ATR 是否必須二選一？","ans":"不必。FT-IR 是光譜取得方式，ATR 是取樣配置；常可組合使用。\n\n短鏈：分光與重組 → 記錄干涉圖 → FT 得波數光譜 → 樣品／背景比值。","p":["骨"],"s":["樣","選","測"],"l":["空白線"]},{"ch":"IR","L":"L13","title":"NIR：弱倍頻、穿透與校正模型","ask":"近紅外訊號＋校正資料及參考值改變時，訊號或結論會怎樣？","chain":"弱倍頻／組合帶與重疊 → 建立校正模型 → 獨立驗證 → 在範圍內預測。","why":"NIR 帶通常較弱且重疊，常需用多個波長建立訊號與參考值的關係。模型學到的關係必須在新樣品及新條件驗證，不能用訓練表現代替。","ex":"已驗證模型可測水分；換新包材後，先確認包材及樣品條件在適用範圍。","trap":"蛋白質含量不等於生物活性；價格題與限制題按題本條件。","q":"閉卷自問｜「倍頻弱約千倍」說的是波数降低千倍嗎？","ans":"不是。說的是吸收帶強度量級；倍頻的頻率／波數反而通常較高。\n\n短鏈：弱倍頻／組合帶與重疊 → 建立校正模型 → 獨立驗證 → 在範圍內預測。","p":["骨"],"s":["算"],"l":["解析度線"]},{"ch":"IR","L":"L14","title":"品質控制：先排假差異再下結論","ask":"初步結論＋接受標準＋原始資料改變時，訊號或結論會怎樣？","chain":"找不符症狀 → 回查實際出錯站 → 修正再測／再讀 → 核對結論。","why":"不同不符有不同修正位置。方法目的不合回 M01；製樣或背景不合回 M02；座標或處理錯回 M03；推論超出證據先回 M04。","ex":"整體峰位偏移先查波數準確度；ATR 全峰變弱先查接觸；只有身分相符，不能宣稱含量合格。","trap":"紅回線是分析者回查；條件合格便正常交出結論。","q":"閉卷自問｜所有不符都要回 M01 重選方法嗎？","ans":"不需要。依原因修正真正出錯的站，再取得或處理必要資料；避免無效重做。\n\n短鏈：找不符症狀 → 回查實際出錯站 → 修正再測／再讀 → 核對結論。","p":["骨"],"s":[],"l":[]},{"ch":"Raman","L":"L1","title":"光子與分子互相交換能量","ask":"Stokes 光子失去能量時，分子如何改變？散射波長朝哪邊走？","chain":"分子得能 → 光子失能 → Stokes 長波；分子失能 → 光子得能 → anti-Stokes 短波。","why":"總能量守恆。光子少掉的能量交給分子；分子交出的能量加到光子。光子能量越低，波長越長。","ex":"雷射波數 20000 cm⁻¹、模式間距 1000 cm⁻¹：Stokes 散射波數 19000，anti-Stokes 為 21000 cm⁻¹。","trap":"同一雷射、同一模式；anti-Stokes 需初始高振動態。","q":"閉卷自問｜Stokes 光子失去能量時，分子如何改變？散射波長朝哪邊走？","ans":"分子得到振動能，光子能量下降；散射波長比雷射長。\n\n短鏈：分子得能 → 光子失能 → Stokes 長波；分子失能 → 光子得能 → anti-Stokes 短波。","p":["骨"],"s":[],"l":[]},{"ch":"Raman","L":"L2","title":"虛擬態不等於螢光的真實激發態","ask":"有誘導偶極，是否每個振動都一定 Raman 活性？","chain":"外加電場 → 誘導偶極 → 散射響應 → 交換振動能時出現 Raman。","why":"光的電場可暫時改變分子的電荷分布。能階圖的虛擬態只是描述散射過程，不是先存人口再等待放光。","ex":"樣品沒有在雷射波長出現明顯電子吸收，仍可能有 Raman；但某振動能否有峰還要檢查 L3。","trap":"一般非共振自發 Raman；共振時另看電子躍遷。","q":"閉卷自問｜有誘導偶極，是否每個振動都一定 Raman 活性？","ans":"不一定；還需該正常振動使極化率改變。虛擬態也不能當成螢光的真實電子激發態。\n\n短鏈：外加電場 → 誘導偶極 → 散射響應 → 交換振動能時出現 Raman。","p":["色","骨"],"s":[],"l":[]},{"ch":"Raman","L":"L3","title":"用極化率與偶極矩分開Raman及IR","ask":"某模式 Raman 有峰，IR 是否必定沒有峰？","chain":"沿振動檢查 α／μ → 判 Raman／IR 活性 → 得到可比較的模式資訊。","why":"IR 問振動是否改變電荷分離；Raman 問振動是否改變外場使電子雲變形的程度。兩個問題不同，所以兩張譜可互補。","ex":"N₂ 的伸縮不產生偶極矩變化，卻可改變極化率：基本振動可 Raman 活性而 IR 不活性。","trap":"基本振動近似；嚴格互斥須反演中心。","q":"閉卷自問｜某模式 Raman 有峰，IR 是否必定沒有峰？","ans":"不一定。具有反演中心時，基本振動才適用 IR／Raman 互斥；互補不是無條件全峰相反。\n\n短鏈：沿振動檢查 α／μ → 判 Raman／IR 活性 → 得到可比較的模式資訊。","p":["骨"],"s":[],"l":[]},{"ch":"Raman","L":"L4","title":"換雷射改變絕對波長，位移仍對準振動","ask":"位移 1000 cm⁻¹ 能否單獨換成散射光 10000 nm？","chain":"先辨量 → 各波長取倒數 → 入射減散射 → 核對振動位移。","why":"同一振動要求固定能量差。改雷射會搬動入射與散射的絕對位置，但兩束光的波數差仍可對準同一模式。","ex":"500 nm 雷射產生約 526.3 nm Stokes；換成 800 nm 時約 869.6 nm。兩次位移均為 +1000 cm⁻¹。","trap":"物態、模式、溫度不變；峰位校正正確。","q":"閉卷自問｜位移 1000 cm⁻¹ 能否單獨換成散射光 10000 nm？","ans":"不能；1000 是兩束光的波數差，還缺雷射的絕對位置。10000 nm 只是把 1000 cm⁻¹ 當絕對波數取倒數的結果。\n\n短鏈：先辨量 → 各波長取倒數 → 入射減散射 → 核對振動位移。","p":["骨"],"s":["源"],"l":["溫度線"]},{"ch":"Raman","L":"L5","title":"先壓低彈性散射，再分辨微弱Raman","ask":"濾片把雷射附近切得更乾淨，可能同時失去什麼？","chain":"強彈性光壓住弱峰 → 匹配抑制濾片 → 取得可用 Raman 譜窗。","why":"很強的雷射同波長散射會占用量測範圍，弱 Raman 容易被遮住。濾掉它有助讀峰，但雷射附近的低頻 Raman 也可能一起被切掉。","ex":"想比較低頻晶格峰，卻使用截止太遠的濾片：沒看到峰，不能直接判樣品沒有該模式。","trap":"確認濾片截止與 Stokes／anti-Stokes 可見側。","q":"閉卷自問｜濾片把雷射附近切得更乾淨，可能同時失去什麼？","ans":"近零位移的低頻 Raman；依濾片配置也可能只留下其中一側。Rayleigh 濾片不保證去掉螢光。\n\n短鏈：強彈性光壓住弱峰 → 匹配抑制濾片 → 取得可用 Raman 譜窗。","p":["骨"],"s":["源"],"l":["解析度線"]},{"ch":"Raman","L":"L6","title":"調雷射波長，是背景與訊號的取捨","ask":"近紅外下峰變弱、背景降更多，量測一定變差嗎？","chain":"改激發 → 背景與 Raman 效率皆改 → 匹配光學／偵測 → 比實際訊噪。","why":"較長波激發可避開許多螢光激發，但非共振 Raman 散射通常也會變弱。訊號弱不等於結果更差，要看背景、雜訊與可用峰一起變多少。","ex":"換近紅外後峰降低，背景降得更多，峰反而可辨。題本接受 450–800 nm，但實際還有 1064 nm 配置。","trap":"固定目的與樣品；避免加熱改樣；重新匹配元件。","q":"閉卷自問｜近紅外下峰變弱、背景降更多，量測一定變差嗎？","ans":"不一定；應比較實際訊噪、光譜品質與樣品穩定性，不只比較峰高。\n\n短鏈：改激發 → 背景與 Raman 效率皆改 → 匹配光學／偵測 → 比實際訊噪。","p":["骨"],"s":["源"],"l":["空白線","溫度線","雜訊地板"]},{"ch":"Raman","L":"L7","title":"取樣與包裝決定你到底量到誰","ask":"一點有有效成分峰，能推出整錠含量均勻嗎？","chain":"辨背景材料／取樣深度 → 選空白與多點計畫 → 取得代表性檢品。","why":"光會先遇包裝，也可能只聚焦在一顆賦形劑粒子。量到某點的訊號只代表那個量測體積，必須先決定如何代表整錠或整批。","ex":"錠劑某點只有賦形劑峰，換點才見有效成分；這不直接證明整錠沒有藥，也不直接證明含量均勻。","trap":"包裝須適用；照射功率／時間不改樣。","q":"閉卷自問｜一點有有效成分峰，能推出整錠含量均勻嗎？","ans":"不能；需要代表性多點或映射與適當驗證。包裝及溶劑也須有背景對照。\n\n短鏈：辨背景材料／取樣深度 → 選空白與多點計畫 → 取得代表性檢品。","p":["骨"],"s":["樣","算"],"l":["空白線"]},{"ch":"Raman","L":"L8","title":"保留固態，才能比較晶型環境","ask":"雷射把樣品改成另一晶型，量到的譜還能代表原樣嗎？","chain":"先查原固態是否保留 → 比峰群與參考 → 區分環境與化學組成 → 支持晶型結論。","why":"晶型是同分子不同晶格排列。溶解會失去原晶格；雷射加熱或製樣也可能改掉要鑑別的固態，所以先確認測到原樣。","ex":"同化合物兩個粉末譜不同，溶解後相同：可支持固態環境差異，但晶型指認還需參考與其他證據。","trap":"同化合物、可比條件；防研磨／壓力／濕氣／加熱改樣。","q":"閉卷自問｜雷射把樣品改成另一晶型，量到的譜還能代表原樣嗎？","ans":"不能。要修正量測條件並重新確認原固態；不是先把變化當原晶型證據。\n\n短鏈：先查原固態是否保留 → 比峰群與參考 → 區分環境與化學組成 → 支持晶型結論。","p":["晶"],"s":["源","樣","選"],"l":["分配線","溫度線","保留線"]},{"ch":"Raman","L":"L9","title":"峰能辨識身分，定量還需要校正與取樣","ask":"同含量樣品換焦點後峰變高，能說含量增加嗎？","chain":"固定條件 → 對照標準響應 → 查適用範圍／驗證 → 才報含量。","why":"峰高不只隨含量改變，光路、焦點、背景與樣品不均勻都會影響。只有把這些條件固定並建立可靠校正，才可把訊號換成含量。","ex":"10% 標準得 20 a.u.、20% 得 40 a.u.；在已驗證線性區間，未知 30 a.u. 內插得 15% w/w。","trap":"功率、聚焦、基質、取樣與處理相符；驗證有效。","q":"閉卷自問｜同含量樣品換焦點後峰變高，能說含量增加嗎？","ans":"不能；焦點是改變的條件，先查取樣與量測。FT 和色散式都不會自動提供有效校正。\n\n短鏈：固定條件 → 對照標準響應 → 查適用範圍／驗證 → 才報含量。","p":["骨"],"s":["樣","算"],"l":["空白線"]},{"ch":"Raman","L":"L10","title":"anti-Stokes較弱，先看振動態人口","ask":"兩側位移絕對值相同，是否代表峰高相同？","chain":"T 升高 → 高振動態人口增加 → anti-Stokes 可出發者變多 → 相對訊號可增加。","why":"anti-Stokes 要從較高振動態出發。一般溫度下這種分子較少，所以訊號常弱；升溫提高人口比例，但峰高還受頻率與儀器響應影響。","ex":"只提高溫度而樣品未變性、激發與響應可比：anti-Stokes 相對 Stokes 通常增加；不能用未校正峰高直接報溫度。","trap":"熱平衡、同模式與可比響應；T 用 K。","q":"閉卷自問｜兩側位移絕對值相同，是否代表峰高相同？","ans":"不代表；初始人口、散射頻率與儀器響應不同。\n\n短鏈：T 升高 → 高振動態人口增加 → anti-Stokes 可出發者變多 → 相對訊號可增加。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L01","title":"NMR 在幫我們回答什麼","ask":"拿到一個藥物，NMR 能告訴我什麼？","chain":"選擇要看的核 → 測它在分子中的環境 → 讀訊號 → 檢查候選結構","why":"Nuclear magnetic resonance（核磁共振，NMR）可協助確認結構，也可在適當條件下測含量。先從 ¹H NMR 學起：¹H 就是常見的氫核，我們要知道分子裡有哪些氫環境。¹³C NMR 則換成看碳環境。普通氫譜提供的是結構線索，不能直接把分子量或完整分子式讀出來。","ex":"題目問「何者不是氫譜直接提供的資訊？」先找分子量、分子式、鹵素種類等選項；位置、面積、分裂與可讀取的 J 才是本章的基本資料。","trap":"測到訊號後，仍要核對其他證據；一個位置不能單獨證明整個結構。","q":"普通 ¹H NMR 可以直接讀出 m/z 嗎？","ans":"不可以。Mass-to-charge ratio（質荷比，m/z）是質譜的讀數。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L02","title":"先數訊號組，不數每條細線","ask":"四重峰有四條線，是不是四種氫？","chain":"比較氫的化學環境 → 同環境先分一組 → 一組可能再裂分 → 記錄組數","why":"Signal count（訊號組數）用來判斷有幾種可分辨的氫環境。先在結構上把環境相同的氫歸為一組，再看它是否被鄰核分裂。快速旋轉、分子對稱性與測量環境都可能讓一些氫等價。第一輪先用簡單、分得開的譜來練。","ex":"Ethyl acetate 的 CH₃C(=O)OCH₂CH₃ 有三組：左側 CH₃、中間 OCH₂、右側 CH₃。OCH₂ 的四條細線仍是一組訊號。對稱的 CH₃COCH₂COCH₃，在題目畫定的 keto 結構中，兩端 CH₃ 等價，合計兩組。","trap":"訊號重疊會少數到組數；OH／NH 的氫也可能因交換而看不見。實際 Acetylacetone 還可能有 keto／enol 互變。","q":"一組四重峰的整組面積對應 2H，應記「四種氫」還是「一種環境、2H」？","ans":"一種環境、2H。裂成幾條與整組代表幾個氫是兩個問題。","p":["骨"],"s":[],"l":["解析度線"]},{"ch":"NMR","L":"L03","title":"位置先告訴我們氫處在什麼環境","ask":"為什麼接近氧的氫，通常出現在較大的 ppm？","chain":"附近基團改變電子環境 → 氫受到的有效磁場改變 → 共振位置改變 → δ 改變","why":"Chemical shift（化學位移，δ）就是訊號在橫軸的位置，單位常用 Parts per million（百萬分之一，ppm）。先記方向：通常左邊 δ 大、右邊 δ 小。Shielding（遮蔽）較強常使 δ 較小；Deshielding（去遮蔽）較強常使 δ 較大。氧、鹵素等附近的吸電子效應，常使相近結構中的氫較去遮蔽。","ex":"同一組 CH₃X 比較：F 吸電子較強，因此 CH₃F 的氫 δ 通常較大；CH₃I 在這組比較中較小。¹H 常見線索：一般飽和碳上的氫約 0–2，接 O 的碳上氫常約 3–4.5，aromatic rings 的氫常約 6–8.5，aldehydes 的氫常約 9–10 ppm。","trap":"這些是辨識區間，不是硬邊界。alkynes 的氫常約 2–3 ppm；不能只憑「π 鍵多」推成 δ 一定大。","q":"訊號往左移，δ 是增加還是減少？通常更遮蔽還是更去遮蔽？","ans":"δ 增加，通常更去遮蔽。","p":["骨"],"s":["算"],"l":["歸一線"]},{"ch":"NMR","L":"L04","title":"面積給氫數比例，峰高不能代替","ask":"積分 2：3：3，究竟代表什麼？","chain":"把同一組所有線的面積加總 → 比較各組面積 → 得到氫數比例 → 核對結構","why":"Integration（積分）是計算整組訊號的面積。在適當測量條件下，各組面積與它們代表的氫數成正比。面積 2：3：3 可支持 2H、3H、3H；若只給比例而沒有總氫數或其他資料，也可能是它的整數倍。寬峰可能較矮但面積不小，所以不能只看峰高。","ex":"Ethyl acetate 的 OCH₂、左側 CH₃、右側 CH₃ 各有 2、3、3 個氫，整組積分就是 2：3：3。OCH₂ 的四條線要全部算進同一組。若題目給面積 4：6：6，先都除以 2，得到最簡比 2：3：3。","trap":"OH／NH 交換、峰重疊、基線不平或恢復不充分，都可能使面積比例不可靠。","q":"四重峰各線的 1：3：3：1，可以直接說它有 8H 嗎？","ans":"不可以。這是同一組內的線比例；整組氫數要由整組面積比較。","p":["骨"],"s":[],"l":["解析度線"]},{"ch":"NMR","L":"L05","title":"鄰近氫使訊號裂分","ask":"為什麼 CH₃CH₂ 的兩端，一端三重峰、一端四重峰？","chain":"找有可見偶合的鄰近氫 → 數同一組鄰居 n → 簡單一級譜用 n＋1 → 得到裂分","why":"Spin-spin coupling（自旋－自旋偶合）使一組訊號裂成多條。先學 First-order spectrum（一級譜）的簡單情況：n 個等價、偶合常數相同的 ¹H 鄰居，產生 n＋1 條線。被觀測的這一組氫有幾個，不是這個 n。Singlet（單峰，s）、Doublet（二重峰，d）、Triplet（三重峰，t）、Quartet（四重峰，q）分別是 1、2、3、4 條。","ex":"看 CH₃：鄰 CH₂ 有 2H，所以 2＋1＝3，得到 t。看 CH₂：鄰 CH₃ 有 3H，所以 3＋1＝4，得到 q。常見線比例：d 是 1：1；t 是 1：2：1；q 是 1：3：3：1；五重峰是 1：4：6：4：1。","trap":"先確認是一組同樣 J 的鄰居；不同組鄰居、複雜譜與快交換 OH／NH 不能直接把所有氫相加。","q":"一組訊號是 triplet，它自己一定有 3H 嗎？","ans":"不一定。三條線在這個簡單模型中表示有 2 個等價氫鄰居；它自己的氫數看積分。","p":["骨"],"s":[],"l":["解析度線"]},{"ch":"NMR","L":"L06","title":"J 是裂線距離，要用 Hz","ask":"270 MHz 的四重峰，鄰線差 0.02 ppm，J 怎麼算？","chain":"選相鄰裂線 → 讀 ppm 差 → 乘工作頻率 MHz → 得到 J 的 Hz","why":"Coupling constant（偶合常數，J）表示偶合作用的大小。對簡單 d、t、q，相鄰裂線的距離就是 J；若圖的橫軸是 ppm，要先換成 Hz。採 ppm 與 MHz 這組單位時：J（Hz）＝相鄰線距（ppm）× 工作頻率（MHz）。整組中心才是該組 δ。","ex":"113-1-12：四線 4.13、4.11、4.09、4.07 ppm。①中心＝(4.13＋4.07)÷2＝4.10 ppm。②鄰線距＝0.02 ppm。③J＝0.02×270＝5.4 Hz。紙筆算成 270×2÷100，選 C。","trap":"四條線的頭尾跨三格：0.06×270＝16.2 Hz 是 3J，不是 J。複雜 dd 的最近線距不一定代表同一個 J。","q":"400 MHz 下，三線在 4.02、4.04、4.06 ppm，J 是多少？","ans":"相鄰線差 0.02 ppm；0.02×400＝8 Hz。不是頭尾的 16 Hz。","p":["骨"],"s":["算"],"l":["歸一線"]},{"ch":"NMR","L":"L07","title":"換高場儀器，哪些變、哪些不變","ask":"換到較高 MHz 的儀器，δ 與 J 都變大嗎？","chain":"磁場提高 → 共振頻率提高 → 同環境頻率差也放大 → δ 的 ppm 比值近似不變","why":"同一核種與化學環境，磁場提高時共振頻率提高。δ 用「相對參考的頻率差」除以工作頻率，兩者一起放大，因此 ppm 座標近似不變。J（Hz）在相同結構與條件下也近似不變；但表示裂線距離的 ppm＝J÷MHz，會變小。","ex":"100 MHz 的 doublet 在 2.10、2.20 ppm。中心 2.15；J＝0.10×100＝10 Hz。換成 500 MHz：中心仍 2.15；兩線全距＝10÷500＝0.02 ppm；各離中心 0.01，所以在 2.14、2.16。原題問中心時選 2.15。","trap":"不同環境中心之間的 Hz 差會隨場增大；不能把「J 的 Hz 不變」擴成「所有 Hz 差都不變」。","q":"同條件下把 300 MHz 換成 600 MHz，δ、J（Hz）、裂線距離（ppm）各如何？","ans":"δ 近似不變；J（Hz）近似不變；裂線距離（ppm）變成一半。","p":["骨"],"s":["算"],"l":["歸一線"]},{"ch":"NMR","L":"L08","title":"把四項資訊合起來認結構","ask":"讀到 4.1 q、2.0 s、1.2 t，如何選出 Ethyl acetate？","chain":"記三組訊號 → 核對 2：3：3 面積 → q／t 接出 CH₂CH₃ → 用位置確定接氧端 → 比對選項","why":"讀圖時先寫表，不必在腦內想像。每組寫四欄：位置、整組面積、裂分、可能片段。再比較哪個候選結構能同時解釋所有欄。只認出一個峰，還不能完成選答案。","ex":"約 4.1 ppm、2H、q：支持接 O 的 CH₂，旁邊有 3H。約 1.2 ppm、3H、t：支持旁邊有 2H 的 CH₃。兩者有相同 J 時，更支持同一 CH₂CH₃ 片段。約 2.0 ppm、3H、s：支持 CH₃C(=O) 片段。合起來符合 CH₃C(=O)OCH₂CH₃。","trap":"「t＋q」是常見片段線索，仍須核對面積、位置與其他峰；不能見到 t、q 就直接選任何含 ethyl 的選項。","q":"同樣有 CH₂CH₃，為何此圖可排除 Ethanol？","ans":"圖中另有約 2 ppm、3H 的單峰，符合另一個 CH₃；Ethanol 的第三組是可交換 OH，不能解釋這個 3H 單峰。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L09","title":"哪些核能測，先看 I 是否為零","ask":"為什麼看 ¹³C，卻不看自然界最多的 ¹²C？","chain":"查核自旋量子數 I → I＝0 沒有一般 NMR 訊號 → I≠0 再選適合的測法","why":"Nuclear spin quantum number（核自旋量子數，I）是原子核本身的性質。先不用想像原子核像球一樣旋轉，只用表判斷。¹H、¹³C、¹⁹F、³¹P、¹⁵N 的 I＝1/2；²H、¹⁴N 的 I＝1；¹²C、¹⁶O、¹⁸O 的 I＝0。¹⁷O 的 I＝5/2，可測但較不常用。","ex":"有磁場時，能階數＝2I＋1。¹H：2×1/2＋1＝2。²H：2×1＋1＝3。場強主要改變能階間距；能階「幾個」由 I 決定。這是必要公式，直接用四則運算即可。","trap":"I＝1 或 3/2 不等於不能測；I≥1 的核常有四極效應，可能較寬或較難測。確切 I 要查核種，不能只看質量數奇偶猜出數值。","q":"¹⁶O、²H、¹⁹F 中，哪個 I＝0？哪個 I＝1？","ans":"¹⁶O 是 0；²H 是 1；¹⁹F 是 1/2。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L10","title":"磁場建立能階差，射頻用來激發","ask":"NMR 是核的變化，還是電子能階躍遷？","chain":"原子核放入磁場 → 核自旋能階分開 → 用適合射頻脈衝作用 → 產生可測響應","why":"Radio frequency（射頻，RF）是 NMR 使用的電磁波段。先把這條鏈與 UV 的電子能階區分。固定核種時，場越強，共振頻率 ν 越高，能階差 ΔE 也越大：ΔE＝hν。300 MHz 通常指 ¹H 的工作頻率；磁場 B₀ 的單位則是 Tesla（特斯拉，T）。","ex":"磁場提高時，ν↑、ΔE↑，一般也有利於訊號與不同環境的 Hz 分離。兩個能階的人數只有微小差異，是 NMR 靈敏度有限的一個原因；先會判斷「場與頻率同方向」，不用先算指數分佈。","trap":"I 決定能階數；B₀ 改變能階間距。Fermi resonance（費米共振）是振動光譜的概念，不是這裡的核磁共振。","q":"提高 B₀，¹H 能階從兩個變成四個嗎？","ans":"不會。仍是兩個；能階間距與共振頻率增大。","p":["骨"],"s":["源"],"l":[]},{"ch":"NMR","L":"L11","title":"先收到時間訊號，FT 才變成峰圖","ask":"脈衝之後收到的資料，為什麼還要做 FT？","chain":"RF 脈衝 → 接收隨時間變化的訊號 FID → 做 FT → 得到頻率／ppm 的峰圖","why":"Free induction decay（自由感應衰減，FID）是脈衝後隨時間記錄的訊號。接收線圈偵測核群的橫向磁化所感應的電訊號。Fourier transform（傅立葉轉換，FT）把這段時間資料整理成各頻率的成分，所以我們才能看不同位置的峰。先理解它做了什麼，不必先推導轉換的數學。","ex":"題目若說「NMR 都使用連續射頻激發」，要留意「都」：現代常用 FT-NMR 的脈衝方式。Continuous wave（連續波，CW）是另一種歷史測量方式。","trap":"FT 是資料轉換，不是把氫變成另一個元素；也不是逐一計算每個核放出的光子。","q":"FID 與轉換後的峰圖，橫軸分別是什麼？","ans":"FID 是時間；轉換後是頻率或換算成 ppm 的 δ。","p":["骨"],"s":["測","算"],"l":["歸一線"]},{"ch":"NMR","L":"L12","title":"TMS、氘代溶媒與重水各有工作","ask":"TMS、D-solvent 與 D₂O 都是用來讓峰消失嗎？","chain":"準備適合溶媒 → 減少溶媒氫背景 → 建立 δ 參考 → 必要時做 D₂O 交換","why":"Tetramethylsilane（四甲基矽烷，TMS）常作化學位移參考，設 δ＝0；不是把樣品背景扣光。Deuterated solvent（氘代溶媒）以 D 取代大量 ¹H，減少強溶媒氫背景；常見 CDCl₃、CD₃OD、DMSO-d₆ 仍可能有殘餘氫。D₂O shake（重水交換測試）可讓可交換 OH／NH 的氫換成 D，使原 ¹H 訊號變弱或消失。","ex":"Paracetamol 加 D₂O 後，OH／NH 對應的訊號可能消失；接在碳上的氫通常保留。題目若問一般溶液樣品量，舊題常以約 10 mg、0.5–1 mL 作量級判斷，標為必背題本案例即可。","trap":"普通 ¹H 量測不直接把 ²H 訊號當同一頻道的內標。OH／NH 峰位不固定在 3–5 ppm，交换是否完全也要看條件。","q":"加 D₂O 後某峰消失，可支持什麼？能因此認定完整結構嗎？","ans":"支持它可能是可交換氫；不能單憑這一步證明完整結構。","p":["骨"],"s":["樣"],"l":["標準曲線線","空白線","歸一線"]},{"ch":"NMR","L":"L13","title":"兩個氫是否等價，用替換表判斷","ask":"一個 CH₂ 上的兩個氫，一定是同一組嗎？","chain":"分別把兩個 H 換成同一標記 → 比較兩個產物 → 判等位關係 → 再判測量環境","why":"先用外部表格做替換法。Homotopic（同位）：兩產物相同。Enantiotopic（對映異位）：兩產物互為鏡像。Diastereotopic（非對映異位）：兩產物是非鏡像異構物。同位氫等價；對映異位氫在一般非手性環境常等價；非對映異位氫通常不等價。","ex":"Acetone 兩側 CH₃ 對稱，題目列為 homotopic。CH₃CH₂CHBr(Cl) 有手性中心，旁邊 CH₂ 的兩 H 可為 diastereotopic；不能因為它們在同一個碳上就合成一組。","trap":"Chemical equivalence（化學等價）只看 δ 相同；Magnetic equivalence（磁等價）還要求對其他相關核的 J 相同。「同位置」不保證磁等價；偶然重疊也不能證明等價。","q":"兩個氫在同一個 CH₂ 上，可以直接判它們等價嗎？","ans":"不能。先看替換產物、手性環境與對稱性。","p":["骨"],"s":[],"l":["解析度線"]},{"ch":"NMR","L":"L14","title":"多組鄰居、F 與 D 要分開處理","ask":"6 個氫加另一個氫，為什麼有時不是八重峰？","chain":"先分鄰居組與 J → 各組分別裂分 → 線數相乘或因重疊合併 → 核對實際條件","why":"若 6 個等價 ¹H 的 J 相同，先裂成 7 條；另一個 ¹H 的 J 不同，再把每條裂成 2 條，最多 7×2＝14 條，稱 Doublet of septet（二重七重峰）。兩個不同 J 的 1H 鄰居可形成 Doublet of doublets（雙二重峰，dd），最多四條；J 很接近時可能看似三條。","ex":"一般式 2nI＋1 用於同一組等價、同 J 的鄰核：¹⁹F 的 I＝1/2，一個 F 可使氫裂成 2 條；D 的 I＝1，一個 D 給 3 条。CDCl₃ 的碳連 1D → 3 條；CD₃OD 的碳連 3D → 7 條。DMSO-d₆ 殘餘 CD₂H 的氫受 2D 偶合 → 5 條。","trap":"Cl／Br／I 通常不造成可解析的氫裂分；「接一個鹵素就 doublet」會錯。D 的線比例也不能照搬 ¹H 的 Pascal 比例。","q":"¹H 頻道看到 CH₃F 的 CH₃ 為 doublet，鄰居是一個 H 嗎？","ans":"不是；這裡是與一個 ¹⁹F 偶合。","p":["骨"],"s":[],"l":["解析度線"]},{"ch":"NMR","L":"L15","title":"J 可以幫忙判斷角度與構形","ask":"Karplus 題應先背整條公式，還是先會看角度趨勢？","chain":"找 H–C–C–H 路徑 → 讀二面角 → 用 ³J 的角度趨勢 → 支持構形判斷","why":"Karplus relation（卡普拉斯關係）描述相鄰氫的三鍵偶合常數 ³J 與 Dihedral angle（二面角）的關係。先記典型趨勢：接近 90°，J 較小；接近 180°，J 較大。角度是 H–C–C–H 四個原子的二面角，不是某一個 C–C–H 鍵角。","ex":"Tranexamic acid 原題兩個相鄰 axial（軸向）氫約 180°，所以選較大的 9–13 Hz。相鄰 axial／equatorial（赤道向）常約 60°，不可直接背成 90°。必背不同案例：benzene 鄰位氫常 7–9 Hz；pyrrole 指定鄰位氫常 2–4 Hz。","trap":"這些數字有骨架與位置條件。不同取代基會影響 J；不能把所有「鄰位」都當成同一範圍。","q":"180° 是 Karplus 題的極小 J 嗎？","ans":"不是。典型曲線中 180° 較大；90° 附近較小。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L16","title":"峰太近時，先別硬套 n＋1","ask":"AB、AX、ABX 的題，應先看哪一件事？","chain":"比較兩組中心的 Hz 差 Δν → 再比較這兩核的 J → 判它們相近或相遠 → 選自旋系統","why":"兩核的中心頻率差若遠大於它們的 J，較接近簡單一級譜；差不多大時，可能出現 Second-order spectrum（二級譜），線距與強度較複雜。AX 表示兩核相遠；AB 表示兩核相近；ABX 可先理解成「一對近、第三個遠」。AMX 是三者較分開的情況。","ex":"112-2-18：7.55 與 7.56 ppm 相差 0.01，在 400 MHz 是 4 Hz；這一對互相的 J＝1.6，4÷1.6＝2.5，並不遠大於 J。6.84 與它們較遠，所以題本選 ABX。只看「三個不同 ppm」就選 AMX 會漏掉相近的一對。","trap":"Δν/J＞10 可作常見一級粗判，不能當絕對分界；也不能拿其他一對的 J 當分母。高場常可放大中心 Hz 分離，使譜較接近一級。","q":"提高場強時，Δν（Hz）增大而 J（Hz）近似不變，通常較利於哪一種近似？","ans":"較利於一級近似；但仍須看整個偶合系統。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L17","title":"碳譜先數碳環境，再看位置","ask":"碳譜有四組主峰，是不是四個碳原子？","chain":"選 ¹³C 測量 → 常做 ¹H 去偶 → 數可分辨碳環境 → 用 δ 分區核對結構","why":"自然界 ¹³C 約 1.1%，不像 ¹H 那麼多，而且訊號較弱。Broadband proton decoupling（質子寬帶去偶）常把碳－氫裂分消去，讓主碳峰較容易數。訊號組數對應可分辨的碳環境；對稱的幾個碳可共用一組，弱峰或重疊也會影響組數。","ex":"¹³C 的分區比氫譜大：一般飽和碳約 0–50，接 O／N 的飽和碳常約 40–90，aromatic rings／alkenes 常約 100–160，esters／carboxylic acids／amides 的 C=O 常約 160–185，aldehydes／ketones 的 C=O 常約 190–220 ppm。題目 Procaine 的酯 C=O 選約 170。","trap":"普通去偶碳譜面積不能直接當碳數；不同碳的恢復與訊號增強不同。碳主峰是單峰也不能證明它沒接氫。","q":"Benzoic acid 與 Benzene 比最大 ¹³C δ，為何前者較大？","ans":"前者多了 carboxylic acid 的 C=O 碳，位置通常大於一般芳環碳。","p":["骨"],"s":[],"l":["解析度線"]},{"ch":"NMR","L":"L18","title":"DEPT 問的是碳直接接幾個氫","ask":"怎麼分 CH、CH₂、CH₃ 與沒有接 H 的碳？","chain":"先看一般 ¹³C 譜 → 比對 DEPT-90 與 DEPT-135 → 判直接附氫數 → 接回候選結構","why":"DEPT（無失真極化轉移增強）用不同測量設定來區分碳的附氫型態。先記表：DEPT-90 只見 CH；DEPT-135 通常 CH、CH₃ 同相，CH₂ 反相；沒有直接接 H 的碳不見。相位方向可以整體翻轉，真正要比較的是同相與反相。","ex":"某碳在一般碳譜有峰，DEPT-90 沒峰，DEPT-135 與 CH／CH₃ 反相：支持 CH₂。某峰在 DEPT-90 可見：支持 CH。113-1-13 的「三級碳」依題本語境指 CH，選 DEPT-90。","trap":"要數的是直接接在碳上的 H，不是它接了幾個碳。aldehydes 的 C=O 直接接 H，合適條件下可見；不能背「所有 C=O 都消失」。","q":"DEPT-135 的正相訊號，可以只憑這張圖區分 CH 與 CH₃ 嗎？","ans":"不可以；再用 DEPT-90 區分，CH 會出現，CH₃ 不出現。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L19","title":"二維光譜用來查誰和誰有關","ask":"COSY、HSQC、HMBC 的名字很多，怎麼選？","chain":"先問要連 H–H 還是 H–C → 再問直接接還是隔多鍵 → 選測法 → 讀交叉峰","why":"2D NMR（二維核磁共振）用 Cross peak（交叉峰）連結兩個訊號。先只學它回答哪個問題：COSY（相關光譜）看互相偶合的 H–H；TOCSY（全相關光譜）把同一偶合網路串起來；HSQC／HMQC 看通常直接相連的 H–C；HMBC（異核多鍵相關）常看隔 2–3 鍵的 H–C。","ex":"題目問「某個氫直接接在哪個碳？」選 HSQC／HMQC。問「隔幾個鍵連到哪個碳，幫忙接骨架？」選 HMBC。問「哪些氫互相偶合？」選 COSY。Aspirin 的原題 COSY 可見三個關聯，包含題本給定的弱長程關係。","trap":"不能把兩張一維譜垂直擺放就當成二維實驗；也不能把 HMBC 缺峰當成必定沒有那條連結。","q":"HSQC 與 HMBC，何者主要查直接 H–C？","ans":"HSQC；HMQC 也常做直接 H–C。HMBC 主要用多鍵相關。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L20","title":"空間靠近與沿鍵偶合要分清","ask":"NOESY 的「有關」，和 COSY 的「有關」相同嗎？","chain":"指定要看空間距離 → 查 NOESY／ROESY 相關 → 配合其他證據 → 判相對立體或構形","why":"NOESY（核 Overhauser 效應光譜）與 ROESY（旋轉座標系 Overhauser 效應光譜）可提供空間接近的線索。它們與 COSY 等沿鍵的偶合相關不同：兩個氫即使在鍵結路徑上相隔較遠，也可能在空間上靠近。先以表格記「沿鍵」與「空間」兩類，就能處理基本分類題。","ex":"110-1-16 問 NOESY 能提供什麼：選相對立體結構。105-2-24 問哪一種不是以鍵結偶合為基礎：選 NOESY，其他 HMBC、COSY、TOCSY 屬沿鍵相關。","trap":"NOESY 不是直接給分子量；一般非手性溶媒中的普通 NMR 也不能單靠對映體相同的譜決定絕對構型。相關仍須留意交換與間接轉移等影響。","q":"「兩氫空間靠近」與「兩氫沿鍵互相偶合」是同一判準嗎？","ans":"不是；選擇測法前先分清問題。","p":["骨"],"s":[],"l":[]},{"ch":"NMR","L":"L21","title":"qNMR 先除氫數，再比物質量","ask":"兩個峰面積一樣大，就代表兩種分子一樣多嗎？","chain":"選各成分不重疊峰 → 面積各除代表氫數 → 比物質量 → 用已知內標換算含量","why":"Quantitative NMR（定量核磁共振，qNMR）用適當條件下的積分測量含量。先做最重要的校正：一個分子若用 2H 的峰來算，面積要除以 2；若內標選 4H 的峰，面積要除以 4。Internal standard（內標準品）的物質量已知，才能把比例接到待測物的物質量。","ex":"待測物面積 12、該峰 2H；內標面積 8、該峰 4H。每氫校正後 12÷2＝6；8÷4＝2；物質量比 6：2＝3：1。若內標 1 μmol，待測物就是 3 μmol；換質量時還要乘各自分子量。","trap":"「可不需待測物本身的同物對照品」不等於「完全不需任何可信參考」。也不能把 NMR 總積分的 100% 當成質量純度 100%。","q":"面積相同，待測峰 2H、內標峰 4H，待測物與內標的物質量比？","ans":"(A÷2)：(A÷4)＝2：1。先除氫數再比。","p":["骨"],"s":["算"],"l":["標準曲線線","解析度線","計數線"]},{"ch":"NMR","L":"L22","title":"DOSY 按擴散差異整理訊號","ask":"DOSY 是把混合物真的分離成幾瓶嗎？","chain":"改變梯度條件 → 量每個峰的訊號衰減 → 算擴散係數 D → 比較混合物成分","why":"Diffusion-ordered spectroscopy（擴散排序光譜，DOSY）把化學位移與 Diffusion coefficient（擴散係數，D）一起呈現。不同成分移動情形不同，訊號衰減可不同，據此整理哪些峰可能屬於同一成分。這是光譜資料中的解析，不是把成分收集成不同純品。","ex":"114-1-12 問錯誤敘述：選「超過五種就無法解析」。沒有所有 DOSY 通用的五種上限；實際難度取決於峰重疊、D 是否太接近、訊號品質與條件。分得開的峰較容易算可靠的 D。","trap":"小分子在相近條件下常擴散較快，但 D 也受黏度、溫度、聚集與形狀影響。Dereplication（去重複研究）是辨認已知成分以避免重複研究，不是把它們實體移除。","q":"兩組峰的 D 很接近，可以保證它們是同一種分子嗎？","ans":"不可以。不同成分也可能有相近 D，需要其他訊號證據。","p":["骨"],"s":["選"],"l":["溫度線"]},{"ch":"NMR","L":"L23","title":"峰圖不可靠，要回查哪一步","ask":"峰太寬、面積不對、訊號太弱，各該查什麼？","chain":"先辨認哪個讀數不可靠 → 查樣品／條件／處理 → 修正後重測 → 才下結論","why":"Field lock（場鎖定）減少磁場隨時間漂移；Shimming（勻場）改善磁場在樣品中的空間均勻度。Relaxation（弛豫）先記兩件事：T₁ 管脈衝後縱向磁化恢復，關係到多久能再量；T₂* 管有效橫向訊號衰減，衰減很快常伴較寬峰。Phase correction（相位校正）與 Baseline correction（基線校正）則影響正確讀峰與面積。","ex":"重複量得太急，各組恢復程度不同，面積比可能失真 → 增加並驗證等待時間。磁場不均造成峰寬 → 改善勻場。若只需提高隨機雜訊下的 S/N，掃描數通常要變成 4 倍，S/N 才約變成 2 倍。","trap":"勻場不能消除所有交換或分子弛豫造成的寬峰；把掃描加很多次，也不會自動修好錯誤基線與定量條件。","q":"lock、TMS、shim 各做什麼？","ans":"lock 穩定場的時間漂移；TMS 定 δ 參考；shim 改善場的空間均勻度。","p":["骨"],"s":["樣"],"l":[]},{"ch":"NMR","L":"L24","title":"把案例與方法範圍接回大循環","ask":"學完整章後，怎麼避免看到熟悉名詞就選錯？","chain":"先辨題目問什麼 → 選適合方法 → 讀對應資料 → 看是否超出方法能支持的結論","why":"結構題走四讀數，再用碳譜或相關譜補證據；含量題走校正積分與內標；混合物擴散題走 DOSY。一般 Solution NMR（溶液核磁共振）與 Solid-state NMR（固態核磁共振）也要分清：把晶體溶解後可能失去晶型堆積資訊，固態 NMR 則可研究晶型。","ex":"Aspirin 看芳香氫、CH₃ 與可交換氫；Paracetamol 用 D₂O 查 OH／NH；Glucose 可用 J 輔助比較指定異頭物構形；Amyl nitrite 的來源案例直接積分本體 CH₂，內標是 Benzyl benzoate，不是先水解再積分。","trap":"固定配對與來源程序標必背；它們不能由一條物理規律全部推出来。舊題的儀器量級與程序按題本理解，不當成所有現代測法的限制。","q":"問藥品多形性時，能一律說 NMR 都不能研究嗎？","ans":"不能。原題的通常溶液測法與固態 NMR 要區分；固態方法可研究晶型差異。","p":["骨"],"s":[],"l":[]},{"ch":"原子光譜","L":"L01","title":"線狀光譜：窄線不等於永不重疊","ask":"兩條線都很窄，是否保證可以分開？","chain":"離散電子能階 → 允許的電子躍遷 → 各躍遷對應特徵波長。","why":"自由原子沒有分子的內部振動、轉動能階，常呈相對窄的電子躍遷線。一個原子可有多個能階差；線寬與儀器解析力仍會限制分辨。","ex":"題本鈉黃色線約 589 nm 是一組特徵線；不代表鈉只會出現一條譜線。兩元素譜線很接近時，即使各自窄，仍可能互相影響。","trap":"「線狀」是原子光譜的常見形態；「不易重疊」是題本相對比較，不能改成絕不重疊。分子 Raman（拉曼）峰也可能很窄。","q":"兩條線都很窄，是否保證可以分開？","ans":"不保證。還要比較波長間距、線寬、儀器解析力與基質背景。","p":["元"],"s":[],"l":["解析度線"]},{"ch":"原子光譜","L":"L02","title":"原子化：先把檢品送到可測的氣相狀態","ask":"改用電熱石墨爐，仍可叫原子吸收嗎？","chain":"霧化與傳輸液滴 → 脫溶劑、蒸發／解離 → 形成氣相自由原子。","why":"溶液中的鹽不能直接當成觀測區內的自由原子。先把材料送入、除去溶劑並解離；原子化、激發、離子化是不同動作。","ex":"同一瓶 2 mg/L 的金屬溶液，霧化器堵住會少送材料；即使液滴送到火焰，形成難解離化合物也會少產生自由原子。兩處要分開查。","trap":"火焰流程是本章主例，不是原子化的唯一做法。石墨爐用電熱、ICP 用電漿；不能把所有原子化叫高溫燃燒。","q":"改用電熱石墨爐，仍可叫原子吸收嗎？","ans":"可以。只要量外來特徵光被樣品原子吸收，仍屬 AAS；原子化裝置換了。","p":["荷","揮","元"],"s":["樣"],"l":["酸鹼線","溫度線","保留線"]},{"ch":"原子光譜","L":"L03","title":"AES：先激發，再量樣品放出的光","ask":"沒有 HCL 的焰光儀，能不能完全不供能就量放光？","chain":"原子化後獲得激發能 → 電子升到較高能階 → 回到較低能階並放光。","why":"先給能量，才有足夠激發態人口放出可量測的光。AES 不需要用 HCL 照樣品來量吸收，但火焰或電漿仍須供能。","ex":"鈉在火焰中受激發，電子由 3p 回到 3s，出現約 589 nm 黃光。波長幫助辨元素；光強配合有效校正才可算含量。","trap":"S 還受送入量、激發態人口與背景影響。單看「火焰更亮」不能唯一推出原瓶濃度更高。","q":"沒有 HCL 的焰光儀，能不能完全不供能就量放光？","ans":"不能。樣品需先取得激發能；沒有外來吸收燈，不等於沒有能量輸入。","p":["元"],"s":["樣"],"l":["空白線","保留線"]},{"ch":"原子光譜","L":"L04","title":"AAS：量燈光減少，不量火焰有多亮","ask":"AAS 裡，樣品應吸收 HCL 的光，還是 HCL 去吸收樣品的光？","chain":"燈光穿過樣品原子雲 → 匹配躍遷吸收光 → 透射光 I 相對 I₀ 減少。","why":"典型 AAS 量的是外來燈光穿過樣品後少了多少。燈內原子負責產生光，樣品原子負責吸收；兩者不是同一群原子。","ex":"同樣有火焰，若前面另有 HCL，光穿過火焰中的樣品原子再到偵測器，判 AAS。只看有火焰，不能區分 AAS 與 AES。","trap":"通常用適合的基態共振線。背景衰減與火焰放光都須依配置處理；不能把任意少光全算成待測元素吸收。","q":"AAS 裡，樣品應吸收 HCL 的光，還是 HCL 去吸收樣品的光？","ans":"樣品氣相原子吸收 HCL 的特徵光。HCL 是供光端；樣品原子雲是吸收端。","p":["元"],"s":["源","樣"],"l":["空白線"]},{"ch":"原子光譜","L":"L05","title":"中空陰極燈：從陰極材料產生特徵線","ask":"看見 HCL 內原子發光，就能把整台儀器判成 AES 嗎？","chain":"填充氣放電形成正離子 → 撞擊陰極並濺射元素原子 → 原子受激發後發出特徵線。","why":"陰極材料決定可供哪些元素的特徵線。填充氣幫助放電，不是待測檢品，也不是火焰燃料。燈內原子發光不等於樣品採 AES。","ex":"測 Zn 的典型 AAS 可選含 Zn 陰極的合適 HCL；低壓填充氣用 Ne／Ar，不把 N₂ 當本題配對。","trap":"多元素 HCL 確實存在，不能說每盞燈絕對只能有一個元素。是否適用仍看線、輸出與方法條件。","q":"看見 HCL 內原子發光，就能把整台儀器判成 AES 嗎？","ans":"不能。要追蹤樣品端：若量樣品吸收燈光，就是 AAS。","p":["元"],"s":["源"],"l":[]},{"ch":"原子光譜","L":"L06","title":"斬光與背景：先分辨加進來的光與被吸掉的光","ask":"用斬光器扣掉火焰放光後，是否保證分子背景吸收也全消失？","chain":"調變或切換已知光路 → 區分隨燈變化的訊號與未調變放光 → 按配置取得有效讀數。","why":"簡化開關模型：開燈讀 I透射＋B，關燈讀 B，相減留下 I透射。這處理加進來的未調變放光；非目標成分把燈光吸掉，是另一類問題。","ex":"火焰自己放光時，可用調變辨出燈的透射成分；分子造成的寬帶吸收，則需合適的 D₂ 或 Zeeman 背景校正。","trap":"真機的 chopper 也可能切換參考／樣品光路。圖 4 為簡化示意，不指定所有機種的斬光器位置。","q":"用斬光器扣掉火焰放光後，是否保證分子背景吸收也全消失？","ans":"不保證。加成放光與非特異吸收的成因不同，須依配置另做並驗證背景校正。","p":["元"],"s":["源"],"l":["空白線","解析度線"]},{"ch":"原子光譜","L":"L07","title":"鈉能階：把上去與下來分開","ask":"3s→3p 能當作鈉放黃色光的方向嗎？","chain":"先讀題目是吸能或放光 → 放光時由高能階往低能階 → 配對 3p → 3s。","why":"電子下來時，能量差由光子帶走；電子上去則必須先獲得能量。3s、3p 是狀態標記，不是兩個空間房間。先用高低和方向即可作答。","ex":"110-2-20 問 589 nm 黃光，選 3p→3s。若把問題改成吸收該光去激發，方向才改為 3s→3p。","trap":"589／589.3 nm 是題本概略說法。Na D 雙線約 588.995、589.5924 nm；入門圖合併 3p、不按能量比例，不要求先學精細結構。","q":"3s→3p 能當作鈉放黃色光的方向嗎？","ans":"不能。它是向上吸能；本題放光應為 3p→3s。","p":["元"],"s":[],"l":[]},{"ch":"原子光譜","L":"L08","title":"物理干擾：同濃度不一定送入同樣多","ask":"C 不變而 Qη 減半，單位時間送入元素質量會怎樣？","chain":"黏度／表面張力等改變 → 吸入量、霧化或傳輸效率改變 → 觀測區接到的分析物量改變。","why":"先問「每分鐘送到多少」。濃度是每體積含量，送入量還受流率 Q 與傳輸比例 η 影響。先保持方法與原子化條件可比，再比較送樣差異。","ex":"題本糖液讀低，可先沿黏度高→吸入／霧化較差→送入較少查；題本乙醇例讀高則作基質影響範例，不能無條件推廣至任何配方。","trap":"乙醇－水組成、表面張力及火焰性質可能一起變；不說「加乙醇必然降低黏度」。方向要以題設與實測條件判。","q":"C 不變而 Qη 減半，單位時間送入元素質量會怎樣？","ans":"在其他條件固定的送樣模型下，CQη 減半；並未表示原瓶元素消失。","p":["元"],"s":["樣","算"],"l":["空白線"]},{"ch":"原子光譜","L":"L09","title":"化學干擾：待測元素被難解離物種留住","ask":"總元素量不變，為什麼自由原子線仍可能讀低？","chain":"形成難解離物種 → 可供量測的自由原子較少 → 原子線訊號受到影響。","why":"元素仍在樣品裡，但被留在不易分解的化合物中。Releasing agent（釋放劑）與干擾成分作用，可幫助待測元素成為自由原子。","ex":"題本把 LaCl₃ 與磷酸根／硫酸根干擾配對；不是把 NaCl 任意代入就能保證相同效果。實際試劑與用量要按方法，標準也須匹配。","trap":"高溫可能減輕一些化學干擾，不能保證全部消失。釋放劑不等於一律先沉澱、過濾後再測。","q":"總元素量不變，為什麼自由原子線仍可能讀低？","ans":"因元素被難解離物種保留，可量測自由原子較少。總量與可測物種人口不同。","p":["荷","元"],"s":[],"l":["酸鹼線","空白線","溫度線"]},{"ch":"原子光譜","L":"L10","title":"離子化干擾：中性原子線與離子線分開","ask":"中性原子變少，能推出元素總量也減少嗎？","chain":"離子化平衡改變 → 中性／離子人口重新分配 → 所選原子線或離子線改變。","why":"M ⇌ M⁺＋e⁻。固定溫度的近似平衡下，更多電子可降低離子／中性比，使中性原子比例增加。須先知道量的是哪種線，不能說所有放光都必定同方向。","ex":"題本配 SrCl₂ 降低 K 游離；此固定配對不證明 Sr 比 K 更易游離。Agilent 的 K 方法使用 Cs 鹽抑制離子化，是實務對照例。","trap":"加入抑制劑時樣品、標準與空白須依方法匹配。改溫度還會影響激發，不能只用平衡一式推所有淨訊號。","q":"中性原子變少，能推出元素總量也減少嗎？","ans":"不能。它可能轉成離子；總元素量、各物種人口與所量訊號須分開。","p":["極","荷","元"],"s":[],"l":["酸鹼線","分配線","空白線","溫度線"]},{"ch":"原子光譜","L":"L11","title":"光譜干擾：原子數沒變，讀到的光也可能變","ask":"某線讀高，必然是待測元素更多嗎？","chain":"其他線重疊或背景改變 → 偵測窗混入非目標光／衰減 → 淨讀數產生偏差。","why":"原子數不變，讀到的光也可改變。別種線加進來可讀高；背景點選錯而過扣可能讀低。這與前面少送原子、難解離或游離分配不同。","ex":"ICP-OES 同一元素兩條線算出的濃度不一致，可先查譜線重疊與背景點；不能立即斷定原樣品含量真的變了。","trap":"正確選線的 filter 是分光工具，不是題本所列干擾本身；選錯波長仍可造成操作誤差。較窄的線不保證零重疊。","q":"某線讀高，必然是待測元素更多嗎？","ans":"不必然。可能共存線重疊、背景處理或污染等，須用替代線、空白與其他證據定位。","p":["元"],"s":[],"l":["空白線","解析度線"]},{"ch":"原子光譜","L":"L12","title":"ICP-OES：換激發源，仍回到光與校正","ask":"看到 ICP 就能說後端一定偵測光嗎？","chain":"RF 耦合 Ar 電漿 → 原子化並激發原子／離子 → 分光與光學偵測多條線。","why":"ICP 換的是能量來源與原子化環境。OES 後端仍量光，因此屬放射；MS 後端分離離子質荷比，另屬質譜。","ex":"114-1-19 問題本 ICP 氣體敘述何者錯誤：說用 H₂ 錯，本題用 Ar。題本約 7000°C 是概略條件，不是整個電漿每點固定同溫。","trap":"多元素與較高溫有實用優勢，仍須查光譜重疊、背景、基質與校正範圍。不能把元素量直接當完整錯合物身分。","q":"看到 ICP 就能說後端一定偵測光嗎？","ans":"不能。ICP-OES 量光，ICP-MS 量離子；要讀完整方法名稱與後端配置。","p":["元"],"s":["源","樣","算"],"l":["空白線","解析度線","溫度線","保留線"]},{"ch":"原子光譜","L":"L13","title":"校正：把有效訊號轉成有單位的濃度","ask":"S＝20c＋10 的 S＝70，可以直接 70/20 嗎？","chain":"檢查 S＝mc＋b 的條件 → 先扣截距並除斜率 → 按體積守恆回推原液。","why":"訊號不是濃度。先用標準建立對應；b≠0 時不能直接用 S 比例。測定液濃度算出後，還需乘回稀釋倍數。","ex":"自編 C2：S＝20c＋10，S＝70；先 (70−10)/20＝3 mg/L，再把 10→50 mL 的五倍稀釋乘回，原液 15 mg/L。","trap":"線性與同條件須已驗證；超範圍先合適稀釋。標準添加有相同樣品量、終體積、等效響應與背景處理等條件，不是加標後直接讀答案。","q":"S＝20c＋10 的 S＝70，可以直接 70/20 嗎？","ans":"不可以。先扣 b＝10，測定液 c＝3 mg/L。原液另依稀釋紀錄回算。","p":["元"],"s":["算"],"l":["標準曲線線","空白線"]},{"ch":"原子光譜","L":"L14","title":"前處理與空白：進樣之前就可能帶入偏差","ask":"樣品與程序空白一起讀高，第一步應直接宣告樣品超標嗎？","chain":"取樣、溶解／消化或萃取 → 控制水、試劑與容器污染 → 保留稀釋紀錄並測程序空白。","why":"原樣品代表性與方法選擇在 M01；具體前處理在 M02。試劑若帶入待測金屬，最後的高讀數不一定來自檢品。程序空白須跟著相關處理走。","ex":"題本蔗糖中 Pb 先用 APDC 錯合，MIBK 為有機溶劑角色。測 Na／K／Ca 的用水則需合格低金屬背景；題本配離子交換處理水。","trap":"前處理依方法，不把 APDC 萃取說成所有元素必做步驟。水的合格與否仍查空白，不以名稱保證無污染。","q":"樣品與程序空白一起讀高，第一步應直接宣告樣品超標嗎？","ans":"不應。先查 M02 的水、試劑、容器與操作污染，再用合格空白及重測證據判斷。","p":["極"],"s":["樣","選"],"l":["分配線","空白線","保留線"]},{"ch":"原子光譜","L":"L15","title":"方法選擇：元素、目的、基質與範圍一起看","ask":"題本說 Zn 不適合傳統焰光，能推出 ICP-OES 絕不能量 Zn 嗎？","chain":"先辨是元素含量或結構問題 → 選合適吸收／放射配置 → 確認範圍與基質能處理。","why":"方法必須回答題設。傳統火焰比較常把 Na／K 配 AES，Pb／Ni／Zn 配 AAS；這是本題選擇路徑，不是整個 AES 家族的永久白名單。","ex":"113-2-7 的 Na／K 輸注液題選 AES。105-1-13 的 Zn「不能 AES」答案依傳統焰光語境記 D；ICP-OES 可分析 Zn，故不可泛化。","trap":"Mg 是ⅡA 鹼土金屬；AAS 不永久比所有 AES 靈敏。Na 題排 NMR 指常用定量方法比較，不是聲稱鈉核不能作 NMR。","q":"題本說 Zn 不適合傳統焰光，能推出 ICP-OES 絕不能量 Zn 嗎？","ans":"不能。需按激發源、元素線、濃度、基質與配置判斷，不能跨整個方法家族外推。","p":["元"],"s":["算"],"l":["空白線"]},{"ch":"原子光譜","L":"L16","title":"品質閉合：把異常接回真正需要修正的站","ask":"只把「化學干擾」改寫成「物理干擾」，算完成品質回線嗎？","chain":"對照預先設定的品質要求 → 按異常定位真正原因 → 修正後重測／重處理再判讀。","why":"回線是分析者的工作流程。必須說出「哪項不符、修哪一站、要什麼新證據」，不能把所有低讀數全送回取樣，也不能只改答案說法。","ex":"同濃度標準與糖液讀值不同：先查 M02 進樣與基質匹配；修正後取得新的校正、回收或重測證據，再回 M04。選錯單位則在 M03 修讀法。","trap":"品質標準由方法與任務預先規定，本章不編造通用合格百分比。推論超出證據時先留 M04 重查判準，必要時才要求上游新資料。","q":"只把「化學干擾」改寫成「物理干擾」，算完成品質回線嗎？","ans":"不算。須修正具體條件並取得新的可用證據，再判定是否合格。","p":["元"],"s":["算"],"l":["空白線"]},{"ch":"折光","L":"L1","title":"速度比決定折射率的方向","ask":"檢品速度變為原先 4/5，空氣速度固定，n 變幾倍？","chain":"固定參考速度 → 檢品速度下降 → 速度比上升 → n 上升。","why":"分母變小，同一個分子除以它，結果就變大。先認清空氣是基準，就不會把速度比倒過來。","ex":"空氣約 3.0×10⁸、檢品 2.0×10⁸ m/s：先約掉單位與 10⁸，3÷2＝1.50。這是速度比的教學例；Abbe 實際以角度讀 n。","trap":"同頻率、同參考基準；空氣與真空不可精確混用。","q":"閉卷自問｜檢品速度變為原先 4/5，空氣速度固定，n 變幾倍？","ans":"n′＝v_air／(4v_sample／5)＝(5／4)n；變為 5/4 倍，且沒有單位。\n\n短鏈：固定參考速度 → 檢品速度下降 → 速度比上升 → n 上升。","p":["整"],"s":["樣"],"l":[]},{"ch":"折光","L":"L2","title":"先定義介質，再寫 Snell 定律","ask":"空氣斜入水時 i、r 哪個大？垂直入射又如何？","chain":"標出兩邊介質 → 寫 Snell 母式 → 依角色移項 → 檢查方向。","why":"同一條定律把各介質的 n 和自己那邊的角配對。換了出發介質，正弦比的外觀也會換；不能只記誰除誰。","ex":"空氣→檢品：n_rel＝sin i／sin r；檢品 n→稜鏡 N：n／N＝sin r／sin i。斜入高 n 介質時，折射光靠近法線。","trap":"平面、靜止界面；正入射 i＝r＝0，不轉彎。","q":"閉卷自問｜空氣斜入水時 i、r 哪個大？垂直入射又如何？","ans":"一般水的 n 高於空氣，所以 r<i；正入射時兩角皆 0，方向不變。正入射應用母式，不能以 0/0 的正弦比求 n。\n\n短鏈：標出兩邊介質 → 寫 Snell 母式 → 依角色移項 → 檢查方向。","p":["整"],"s":[],"l":[]},{"ch":"折光","L":"L3","title":"用極限角把未知 n 變成可讀的邊界","ask":"固定 N 時 n 增加，r_c 如何變？","chain":"檢品入射角趨近 90° → sin i 趨近 1 → 形成極限邊界 → 由角度求 n。","why":"讓入射角走到極限後，母式裡的 sin i 變成 1，剩下已知稜鏡 N 和可讀角度。這就是不用直接量光速的入口。","ex":"N＝1.60、sin r_c＝7/8：n＝(16/10)×(7/8)＝1.40；小於 1.60，符合模型。","trap":"r_c 是正向折射角；θ_c 是反向入射角；θ>θ_c 才全反射。","q":"閉卷自問｜固定 N 時 n 增加，r_c 如何變？","ans":"sin r_c＝n/N 上升；在 0°到90°間 r_c 上升。反向 θ_c 同數值，但光路與角度角色不同。\n\n短鏈：檢品入射角趨近 90° → sin i 趨近 1 → 形成極限邊界 → 由角度求 n。","p":["整"],"s":["樣","算"],"l":[]},{"ch":"折光","L":"L4","title":"溫度改變可假扮成組成改變","ask":"某檢品比標準 n 低，能直接說被水稀釋嗎？","chain":"溫度升高 → 常見液體熱膨脹 → n 通常下降 → 未控溫會誤判成分。","why":"同一瓶液體也可能因溫度而改變整體光學響應。若把它和另一溫度的標準比，就會把條件差異錯算成組成差異。","ex":"題本水值：20 °C 為 1.3330、25 °C 為 1.3325；先判較熱較低，再記四位數。","trap":"限常見液體與適用溫區；水斜率不能套全部檢品。","q":"閉卷自問｜某檢品比標準 n 低，能直接說被水稀釋嗎？","ans":"不能。先查實際樣品／稜鏡溫度及平衡，再查波長、標準與接觸；排除條件差異才談組成。\n\n短鏈：溫度升高 → 常見液體熱膨脹 → n 通常下降 → 未控溫會誤判成分。","p":["整"],"s":["樣"],"l":["溫度線"]},{"ch":"折光","L":"L5","title":"指定波長，才能比較同一種 n","ask":"114-1「均以白光」錯，是否表示任何折射計都不能用白光？","chain":"波長改變 → n 及邊界位置改變 → 選線或補償 → 同條件比較。","why":"白光包含多種波長，各自可有不同 n，邊界因此帶色。合適的補償器處理色散，才可取得指定等效波長的讀值。","ex":"n_D^20：D 是約 589／589.3 nm 的鈉 D 線，20 是 °C。鎢燈是寬頻，不因加上補償器就變成單色燈。","trap":"短波通常 n 較大限正常色散區；RI 光源另依型號。","q":"閉卷自問｜114-1「均以白光」錯，是否表示任何折射計都不能用白光？","ans":"不是。「均」過度概括。合適 Abbe 可用白光加消色差／Amici 補償；報值仍需指定等效波長。\n\n短鏈：波長改變 → n 及邊界位置改變 → 選線或補償 → 同條件比較。","p":["整"],"s":[],"l":[]},{"ch":"折光","L":"L6","title":"完整接觸讓理想公式能實際讀取","ask":"理想式沒有液膜厚度 b，就能隨便滴或據此否定定量嗎？","chain":"氣泡或空隙 → 多出界面與散射 → 邊界失真不穩 → 修接觸後再讀。","why":"理想公式說明有效界面的角度關係；若光先遇到空氣間隙，實際讀到的便未必是預定檢品界面。","ex":"同一檢品邊界忽然模糊，先查清潔、氣泡、覆蓋與平衡。固體用合適接觸液填空隙，不把它當反應試劑或黏膠。","trap":"接觸液 n、表面及相容性需合適；不可溶解或改樣。","q":"閉卷自問｜理想式沒有液膜厚度 b，就能隨便滴或據此否定定量嗎？","ans":"兩者都不能。n＝N sin r_c 沒有吸收光程 b，但仍須完整接觸、無氣泡；有可靠 n–濃度關係即可有條件定量。\n\n短鏈：氣泡或空隙 → 多出界面與散射 → 邊界失真不穩 → 修接觸後再讀。","p":["整"],"s":["算"],"l":["保留線"]},{"ch":"折光","L":"L7","title":"校正管偏差，重複量測看穩定性","ask":"三次很接近是否證明準確？水是否永遠不能校正？","chain":"核對標準 → 查共同偏差 → 看重複離散 → 合格後報平均。","why":"三次都往同一方向偏，平均仍會偏。校正查共同偏差；重複量測看散布，兩件事不能互相取代。","ex":"1.3330、1.3331、1.3329 的偏移相消，平均 1.3330；若三次都多 0.0010，平均也多 0.0010。","trap":"至少三次與 ±0.0001 是題本條件；解析度不等於準確度。","q":"閉卷自問｜三次很接近是否證明準確？水是否永遠不能校正？","ans":"不證明準確，仍可能共同偏差。也不能說水永遠不能校正／調整；依特定儀器程序選標準。\n\n短鏈：核對標準 → 查共同偏差 → 看重複離散 → 合格後報平均。","p":["整"],"s":["算"],"l":["解析度線"]},{"ch":"折光","L":"L8","title":"用已知對應估濃度，不能靠單一 n 指認雜質","ask":"同一 n 若可對應兩個濃度，能單靠 n 選哪一個嗎？","chain":"有可唯一反推的對應 → 比 n → 在有效區間求 C → 核對結論範圍。","why":"折射率能定量，是因已知系統裡有可靠對應；不是每個混合物都能只靠一個 n 解出全部成分。","ex":"已驗證局部線性：10% w/w→1.3500、20%→1.3700；1.3600 在中點，所以 C＝15% w/w。","trap":"不能只用兩點證明線性；同 n 不證明同物質或絕對純。","q":"閉卷自問｜同一 n 若可對應兩個濃度，能單靠 n 選哪一個嗎？","ans":"不能；須有已知濃度區間、第二項量測或其他組成資訊，才能選分支。\n\n短鏈：有可唯一反推的對應 → 比 n → 在有效區間求 C → 核對結論範圍。","p":["整"],"s":["算"],"l":["標準曲線線"]},{"ch":"折光","L":"L9","title":"RI 偵測器比較流出液與移動相","ask":"RI 參考池放固定相嗎？若移動相梯度變化，會怎樣？","chain":"兩池 n 不同 → 光偏折／差動訊號改變 → 出現峰或漂移 → 分清分析物與背景。","why":"偵測器比較的是兩池，不是量分析物純物質 n。梯度改變移動相本身，也會改變兩池差，於是基線可大幅漂移。","ex":"樣品池 1.3332、參考池 1.3330：Δn＝+0.0002。參考池是移動相；固定相留在管柱內。","trap":"常規 RI 宜固定移動相組成；通用不保證每物質都夠靈敏。","q":"閉卷自問｜RI 參考池放固定相嗎？若移動相梯度變化，會怎樣？","ans":"參考池放移動相；固定相在管柱。梯度使溶劑 n 改變，可造成背景漂移，因此常規 RI 一般不建議溶劑組成梯度。\n\n短鏈：兩池 n 不同 → 光偏折／差動訊號改變 → 出現峰或漂移 → 分清分析物與背景。","p":["極","整"],"s":["源","選","測"],"l":["分配線","空白線"]},{"ch":"旋光","L":"L1","title":"起偏—檢偏：把「偏極面的方向」變成可讀的角度","ask":"偏極面被樣品轉開了，但眼睛看不出光的振動方向。要怎麼把「方向」變成一個讀得出來的數字？","chain":"非偏極光 → Polarizer（起偏鏡）只放行一個方向 → 平面偏極光 → 樣品把偏極面轉 $a$ 度 → Analyzer（檢偏鏡）轉到終點（視野最暗或兩半等亮）→ 檢偏鏡轉過的角度就是 Optical rotation（旋光度）$a$，轉的方向給出 (+)／(−)。","why":"1. 一片「只放行一個方向」的元件，對平面偏極光來說像一道柵欄：柵欄方向和光的振動方向一致時全亮；互相垂直時全暗。（課外：這叫 Malus 定律，亮度 $I=I_0\\cos^2\\theta$，$\\theta$ 是兩者夾角。）\n2. 所以先不放樣品，把檢偏鏡轉到全暗，記下這個零點。\n3. 放入樣品後，光的振動方向被轉了 $a$ 度，原本的全暗就不再全暗。\n4. 把檢偏鏡跟著轉，直到再度全暗——它必須轉的角度，正好等於樣品轉的角度 $a$。\n5. 需要順時針轉才回到全暗 → (+) Dextrorotatory（右旋）；逆時針 → (−) Levorotatory（左旋）。","ex":"","trap":"","q":"","ans":"","p":["手","反"],"s":["樣","選"],"l":[]},{"ch":"旋光","L":"L2","title":"半影稜鏡：把「找最暗」改成「比兩半一樣亮」","ask":"L1 要求操作者判斷「什麼時候最暗」。但眼睛很不擅長判斷「最暗」——差 1° 幾乎看不出來。為什麼？又要怎麼補救？","chain":"最暗點附近亮度幾乎不變（平底谷）→ 很難定出終點 → 半影稜鏡讓視野兩半的偏極方向略錯開 → 終點改成「兩半一樣暗」→ 稍微轉偏，一半變亮、一半變暗，對比立刻出現 → 終點變敏銳。","why":"定位：M03 光的準備（位置）→ M05 讀數（功能）。","ex":"","trap":"","q":"","ans":"","p":["反"],"s":["選","算"],"l":[]},{"ch":"旋光","L":"L3","title":"圓雙折射：偏極面為什麼會被轉（課外機理）","ask":"光只是穿過一杯透明溶液，沒有被吸收，偏極面卻轉了。是什麼「推」它轉的？","chain":"平面偏極光＝等量的左旋圓偏光＋右旋圓偏光 → chiral 介質對兩者的折射率不同（$n_\\text{左}\\ne n_\\text{右}$）→ 兩者在介質中速度不同 → 走完同一段路後相位差不同 → 重新合成的直線偏極面轉了一個角度 → 這就是旋光度。這個現象叫 Circular birefringence（圓雙折射）。","why":"1. 兩個大小相同、反方向旋轉的指針相加，合成的結果只在一條直線上來回擺——這就是平面偏極光。\n2. 若一個指
