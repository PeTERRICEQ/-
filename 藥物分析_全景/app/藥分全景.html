","p":["量","荷","揮"],"s":["源","樣"],"l":["分配線"]},{"ch":"MS","L":"L11","title":"APCI與APPI怎樣幫低極性小分子","ask":"APCI一定要加甲烷嗎？","chain":"選可汽化的小分子 → 化學／光子游離 → 比較離子效率。","why":"Atmospheric pressure chemical ionization（常壓化學游離，APCI）先霧化汽化，電暈放電造成溶劑／試劑離子，進而與檢品反應。Atmospheric pressure photoionization（常壓光游離，APPI）用光子直接或經摻雜物促進游離，常用於較低極性小分子。","ex":"題目把APCI與ESI用於抗體比較，先排APCI的汽化與大分子限制；低極性可汽化小分子則可考慮APCI或APPI。","trap":"APCI不是定義為「每次加甲烷」或「必定M+19」。APPI有光子源；所以「質譜完全不用光」不成立。","q":"APCI一定要加甲烷嗎？","ans":"不一定；一般LC–APCI常由流動相溶劑提供試劑離子。","p":["量","極","揮"],"s":["源"],"l":["分配線"]},{"ch":"MS","L":"L12","title":"MALDI先讓基質吸能，再帶出檢品離子","ask":"四個基質：DHB、nicotinic acid、butyric acid、ferulic acid，哪個較不合題本UV-MALDI？","chain":"檢品與基質共結晶 → 雷射脫附游離 → 常見單價完整離子。","why":"Matrix-assisted laser desorption/ionization（基質輔助雷射脫附游離，MALDI）讓基質吸收雷射能量並協助檢品脫附游離。大分子常主要單價，所以常搭配Time-of-flight（飛行時間，TOF）的大m/z範圍。可用於蛋白質、聚合物與組織影像。","ex":"相同12000 Da蛋白質，ESI 12+約在1001，MALDI單價[M+H]⁺約在12001；分析器的範圍需求不同。","trap":"題本多以UV-MALDI、TOF與離線靶板為比較情境；不是只能TOF、只能UV、不能定量或完全不能與LC聯用。常見LC–MALDI是分餾點靶後量測。","q":"四個基質：DHB、nicotinic acid、butyric acid、ferulic acid，哪個較不合題本UV-MALDI？","ans":"butyric acid；題本比較看吸收雷射與基質性質。不能只說「是酸」就可用。","p":["色","晶"],"s":["源","樣"],"l":["空白線"]},{"ch":"MS","L":"L13","title":"FAB、DESI與舊式LC介面各有位置","ask":"一般線上LC與EI是否常直接配合？","chain":"辨檢品／介面 → 選撞擊、噴灑或汽化方式 → 得離子。","why":"Fast atom bombardment（快速原子轟擊，FAB）以快中性原子撞擊液體基質，常用glycerol並可處理非揮發性、極性檢品。Desorption electrospray ionization（脫附電噴灑游離，DESI）以帶電噴灑作用於表面。Thermospray（熱噴灑，TSP）及particle-beam interface（粒子束介面）是歷史LC–MS技術；粒子束可脫溶劑再送EI／CI。","ex":"看到glycerol基質先想FAB；「物質表面研究」辨DESI；舊題APCI＞ESI＞FAB是傳統LC流量比較。","trap":"FAB不是隻適合親脂物；原筆記的1%配方是例子而非通用濃度。舊式介面的固定流量與靈敏度排序不能當所有現代儀器永久排名。","q":"一般線上LC與EI是否常直接配合？","ans":"通常不；液體氣體負荷與EI汽化要求不合。粒子束等歷史介面是例外。","p":["揮"],"s":["源","樣"],"l":["雜訊地板"]},{"ch":"MS","L":"L14","title":"源、分析器、偵測器別互換","ask":"四極柱撞到桿子會形成要量的質譜訊號嗎？","chain":"源產生離子 → 分析器辨 m/z → 讀出系統量強度。","why":"Ion source（離子源）製造離子；mass analyzer（質量分析器）把m/z差轉為軌跡、穩定性、飛行時間或頻率差；detector（偵測器）或image-current readout（影像電流讀出）取得訊號。多數質譜路徑需真空減少非預期碰撞；ESI/APCI源本身可在常壓。","ex":"LC分離 → ESI游離 → QqQ選離子／CID → 偵測器：對應題目④①②③。真空泵在側路支援，不能畫成所有檢品都「先經真空泵」。","trap":"真空減少非預期碰撞；碰撞池則在指定區域刻意加氣。電子倍增器與Faraday cup讀出和Orbitrap影像電流的物理機制不同。","q":"四極柱撞到桿子會形成要量的質譜訊號嗎？","ans":"不是；正常傳輸的離子透過濾器後由讀出系統量測，撞桿多被移除。","p":["量"],"s":["選","測","算"],"l":["歸一線"]},{"ch":"MS","L":"L15","title":"磁場使離子轉彎，半徑平方才是線索","ask":"B、V固定，半徑變3倍，m/z變幾倍？","chain":"加速給動能 → 磁場彎路徑 → m/z ∝ r²。","why":"在理想非相對論模型、相同B與V下，m_phys/(|z|e)=B²r²/(2V)。因此慣用m/z與r²成正比。較大m/z不是半徑較小，也不是與半徑一次方成正比。","ex":"m/z從100變400是4倍，半徑成2倍。B與r固定，V加倍時可透過的m/z減半。","trap":"B是磁通密度（tesla）；若符號H意指磁場強度（A/m），不能不經換算就替代B。高解析與能量／角度散佈、聚焦及狹縫條件有關，不是只看電壓越高越好。","q":"B、V固定，半徑變3倍，m/z變幾倍？","ans":"9倍，因為平方關係。","p":["量"],"s":["算"],"l":["歸一線"]},{"ch":"MS","L":"L16","title":"雙聚焦同時修正兩類散佈","ask":"同時用靜電與磁場，四極柱還是雙聚焦？","chain":"靜電扇形處理能量差 → 磁扇形處理軌跡 → 較窄的質量訊號。","why":"Double focusing（雙聚焦）使用適當配置的靜電與磁扇形，補償能量及角度散佈。單純magnetic sector（磁扇形）和含靜電扇形的雙聚焦裝置要分清。","ex":"題目問「同時利用靜電與磁場」選雙聚焦；問「不同偏移半徑」選磁扇形原理。","trap":"Q26選項A提靜電裝置，應放在雙聚焦磁扇形脈絡理解；不能反推所有磁扇形都必含獨立靜電能量篩選器。","q":"同時用靜電與磁場，四極柱還是雙聚焦？","ans":"雙聚焦；四極柱質量濾器主要用DC＋RF電場。","p":["量"],"s":["選"],"l":[]},{"ch":"MS","L":"L17","title":"四極柱是濾器，透過才去偵測","ask":"四極柱最強的工作是製造離子、分選，或計數？","chain":"DC＋RF設定 → 特定 m/z 軌跡穩定 → 透過濾器。","why":"Quadrupole mass filter（四極質量濾器）利用對向電極的DC（直流）與RF（射頻）電位，使特定範圍m/z的軌跡能穩定透過。改變設定可掃描不同m/z。","ex":"要監測m/z 319，把濾器設定於該視窗；透過的離子交給下游偵測器。","trap":"一般單四極柱多為單位質量解析。Q11的「直流與射頻相互為直角」是舊式簡寫；更正確是合成四極場及x/y穩定性，不是兩種場永久各佔一個方向。","q":"四極柱最強的工作是製造離子、分選，或計數？","ans":"分選。源製造，讀出系統計數／取得訊號。","p":["量"],"s":["選","算"],"l":["歸一線"]},{"ch":"MS","L":"L18","title":"離子阱重複選與碎，不是DC把離子關住","ask":"標準QqQ與可重複選／碎的離子阱，哪個通常適合MS³？","chain":"RF保留離子 → 選離子並激發碰撞 → 再選子離子重複。","why":"Ion trap（離子阱）在RF場中儲存離子，選擇／激發離子後可做CID，再選子離子作下一輪。Helium（氦）常作緩衝與碰撞氣；具體線性阱、三維阱與混合裝置的掃描方式不同。","ex":"M→A→B：第一次裂解得到A、第二次裂解得到B，叫MS³，不是「裂三次」。","trap":"不能用靜態DC作一般RF阱的侷限定義；也不是所有阱都用端蓋DC把離子射出。","q":"標準QqQ與可重複選／碎的離子阱，哪個通常適合MS³？","ans":"離子阱；一般QqQ有一次碰撞區，典型做MS²。特殊混合配置另論。","p":["量"],"s":["選"],"l":["分配線"]},{"ch":"MS","L":"L19","title":"TOF看時間，Orbitrap與FTICR看頻率","ask":"TOF的小離子會比較慢嗎？","chain":"同條件 TOF 時間差／FT 頻率差 → 校正換算 m/z → 讀譜。","why":"TOF讓離子經同一電位差加速後飛行；相同路徑下t∝√(m/z)，小m/z較快。Reflectron（反射器）可補償動能散佈。Orbitrap（軌道阱）用靜電場、軸向振盪與影像電流；FTICR（傅立葉轉換離子迴旋共振）用磁場中的迴旋運動與影像電流。","ex":"100與400的m/z：400離子飛行時間為2倍。看到「反覆振盪、image current」且選項有Orbitrap，可選它；看到「強磁場、迴旋共振」辨FTICR。","trap":"TOF比例須路徑／加速條件相同，且扣除計時偏置。Orbitrap裸分析器不能單靠名稱保證MSⁿ；需配置選離子與碎裂的硬體。","q":"TOF的小離子會比較慢嗎？","ans":"同加速電位差、同路徑下，小m/z較快。","p":["量"],"s":["選","算"],"l":["歸一線"]},{"ch":"MS","L":"L20","title":"解析度與質量誤差，問的是不同能力","ask":"理論400.000、實測400.002，誤差多少？","chain":"先問分得開或量得準 → 分別算 R 或 ppm → 與標準比較。","why":"Resolving power（解析能力）常用R=x/Δx，Δx可依指定峰寬／分離判準。Mass error（質量誤差）用(x_obs−x_ref)/x_ref×10⁶ ppm。峰窄不保證校正正確；小誤差也不保證兩個鄰近離子都分開。","ex":"x=500、Δx=0.01，R=50000；理論500.000、實測500.001，誤差+2 ppm。兩個數描述不同能力。","trap":"比較解析度要同m/z、同定義。不能用「小數點第幾位」作所有機型的固定解析度排名，或用解析度替代檢出靈敏度。","q":"理論400.000、實測400.002，誤差多少？","ans":"+0.002/400×10⁶=+5 ppm；量測偏高。","p":["骨"],"s":["算"],"l":["歸一線","解析度線","雜訊地板"]},{"ch":"MS","L":"L21","title":"一個Cl、Br、S，先用M＋2比例篩候選","ask":"含一個Br的單價離子，M:M＋2？","chain":"辨約 2/z 峰距 → 比 M 與 M＋2 → 篩元素候選。","why":"一個Cl的³⁵Cl:³⁷Cl約3:1；一個Br的⁷⁹Br:⁸¹Br約1:1。S的³⁴S貢獻使M+2相對M常約4.4%左右。這是組成線索，要再與分子式、電荷與其他同位素來源核對。","ex":"283與285強度100:4.5，單價、合適組成情境下最接近一個S；不是Cl的100:33或Br的100:100。","trap":"S的4.2%是自然分率近似，M+2/M用³⁴S/³²S約4.4%。F、I、P本身主要單同位素，仍不代表含它們的整個分子絕無M+2。","q":"含一個Br的單價離子，M:M＋2？","ans":"約1:1，峰距約2。","p":["元"],"s":[],"l":["計數線"]},{"ch":"MS","L":"L22","title":"碳數與多鹵素比例，用機率加回來","ask":"一個¹³C取代¹²C主要長哪個峰？","chain":"列一次重同位素可能 → 加總組合 → 估碳數／峰群。","why":"¹³C自然分率p約1.1%。這裡M+1/M表示兩峰強度比，不是質量除法。只有碳顯著貢獻的近似下，I(M+1)/I(M)=np/(1−p)≈n×1.1%。兩個Cl的組合為(3+1)²=9+6+1；兩個Br為(1+1)²=1+2+1。","ex":"M+1/M=11%，可先估10個碳。兩個Cl峰群是M:M+2:M+4約9:6:1，不是只剩一對3:1。","trap":"其他元素可貢獻M+1／M+2，高碳數需更完整同位素模型。比例為對M，不能把11%直接當0.11個碳。","q":"一個¹³C取代¹²C主要長哪個峰？","ans":"M+1；本題q50選C。同樣加1H是不同離子身分，不能當EI同位素峰來源。","p":["量"],"s":[],"l":["計數線"]},{"ch":"MS","L":"L23","title":"氮規則先回中性名目質量","ask":"EI完整單價分子離子名目m/z 187，可能有0個N嗎？","chain":"扣回質子／加合 → 取中性名目質量 → 看奇偶。","why":"Nitrogen rule（氮規則）適用於常見元素、正常價數的閉殼層中性有機分子：中性名目質量奇數→奇數個N；偶數→零或偶數個N。對EI單價M⁺•，忽略電子質量時保留同樣整數奇偶。","ex":"[M+H]⁺在181，先減1成180；只支援零或偶數N，不是直接說一個N。","trap":"只辨奇偶，不能給確切N數。多價、任意碎片、金屬加合或不符合價數模型的物種不能直接套原版規則。","q":"EI完整單價分子離子名目m/z 187，可能有0個N嗎？","ans":"在上述常見有機價數條件下不合；支援奇數N。","p":["量","荷"],"s":["算"],"l":["酸鹼線","歸一線","保留線"]},{"ch":"MS","L":"L24","title":"峰差是脫失候選，不是唯一結構證明","ask":"Q49只給失28且四選項名目質量都28，能唯一判CO嗎？","chain":"取母子 m/z 差 → 乘 |z| → 列中性脫失候選。","why":"Neutral loss（中性脫失）是母離子失去中性物種。母子電荷相同且關係已確認，脫失質量=|z|×Δ(m/z)。同一張EI譜兩個峰有差值，仍需支援它們是母子，不能把任意峰差都當反應。","ex":"單價180→162差18，支援H₂O候選；2+的600→591差9，若已確認同電荷母子，也支援18 Da脫失。","trap":"28 Da有CO、C₂H₄、N₂、CH₂N等名目候選。Psoralen原圖只有一個carbonyl；不能因186、158、130、102間差28，反推原來有三個carbonyl或保證每一步都是直接CO脫失。","q":"Q49只給失28且四選項名目質量都28，能唯一判CO嗎？","ans":"不能。保留題本A，但缺少結構／精確質量等資料，不教成「28必是CO」。","p":["量"],"s":["算"],"l":["歸一線"]},{"ch":"MS","L":"L25","title":"α斷裂先找異原子旁邊的鍵","ask":"86 Da只憑數字能證明C₅H₁₂N⁺嗎？","chain":"找異原子鄰接位 → α斷裂／電荷保留 → 核對碎片式與質量。","why":"α-cleavage（α斷裂）常由異原子鄰近位的裂解形成可穩定的帶電片段；homolytic cleavage（同質斷裂）每端分配一個鍵電子，heterolytic cleavage（異質斷裂）則兩鍵電子分到一端。不能只看「哪端較大」決定電荷。","ex":"Lidocaine的m/z 86可支援C₅H₁₂N⁺：5×12+12+14=86。其結構的amines鄰接C–C裂解支援題本homolytic α-cleavage；234−86=148對應互補中性自由基質量。","trap":"必須核對原結構與電荷／自由基帳。題本所列α斷裂、異質、逆Diels–Alder和McLafferty不是任意互換的標籤。","q":"86 Da只憑數字能證明C₅H₁₂N⁺嗎？","ans":"不能；86是名目質量相容，需原結構、準確質量或MS/MS支援。","p":["骨","荷"],"s":["選"],"l":["分配線","保留線"]},{"ch":"MS","L":"L26","title":"McLafferty先檢查γ氫和連線方式","ask":"飽和烴只有C、H，符合題本經典McLafferty嗎？","chain":"確認γH可及 → 六員過渡幾何轉H／斷鍵 → 重排離子＋中性烯。","why":"McLafferty rearrangement（麥氏重排）經典影象是carbonyl相關的六員過渡幾何，γH轉移並斷裂β位置的鍵，形成重排離子與中性alkene。先數carbonyl外的α、β、γ，不是把任何三個C硬湊。","ex":"2-Pentanone的丙基側有γH；名目M=86，可示範形成58 Da重排自由基陽離子與28 Da的C₂H₄。Acetone沒有相應γ鏈。","trap":"Amides、esters、ketones可能符合，不保證每一個都符合。題本Alcohols與飽和烴是與經典carbonyl型比較；不能擴大成全學科沒有其他型別重排。","q":"飽和烴只有C、H，符合題本經典McLafferty嗎？","ans":"不符合；缺少所需官能基條件，Q68選C。","p":["骨"],"s":[],"l":["標準曲線線"]},{"ch":"MS","L":"L27","title":"MS/MS是選、碎、再分析","ask":"M→A→B→C共裂幾次，稱MS幾？","chain":"選母離子 → 加能產生子離子 → 再分析子離子。","why":"Tandem mass spectrometry（串聯質譜，MS/MS）在兩個或更多質量分析層次之間引入反應／碎裂。可在不同硬體空間接力，也可在離子阱中按時間重複；不是把EI和ESI兩種源直接串起來。","ex":"MALDI–TOF只是離子源＋分析器，不能僅憑兩個縮寫叫MS/MS。QqQ的Q1選母、q2碰撞、Q3選或掃子，才有典型MS²接力。","trap":"MS²是一次碎裂，MS³兩次，MS⁴三次。可碎三次的MSⁿ配置不代表所有MS/MS裝置都有三次碎裂。","q":"M→A→B→C共裂幾次，稱MS幾？","ans":"裂三次；MS⁴。","p":["量"],"s":[],"l":[]},{"ch":"MS","L":"L28","title":"CID給結構線索，也要看碰撞條件","ask":"CID能否不加任何手性條件就穩定區分一對映象異構物？","chain":"離子碰撞氣體 → 動能部分轉內能 → 產生碎片。","why":"Collision-induced dissociation（碰撞誘導解離，CID）以離子碰撞氣體促進裂解。可增加結構／序列線索及選擇性定量；但一般非手性環境下，單靠CID不直接判別光學異構物的絕對立體構型。","ex":"ESI先保留完整離子，再用CID問它怎樣碎，是源與碰撞區分工。改變碰撞能量、氣體、機型，碎片相對強度可改變。","trap":"題本Q54把資料庫可建置列錯選，保留歷史題意但不能教成CID無法建庫；NIST已有串聯碰撞質譜庫，必須核對機型、能量及離子條件。","q":"CID能否不加任何手性條件就穩定區分一對映象異構物？","ans":"通常不能；需手性分離／反應等額外資訊。","p":["骨","手"],"s":[],"l":["分配線","保留線"]},{"ch":"MS","L":"L29","title":"掃描模式決定你在問哪個母子關係","ask":"想找所有能產生86子離子的母離子，用何模式？","chain":"固定／掃描母子 → 選一種關係 → 取得譜或轉換訊號。","why":"Product-ion scan（子離子掃描）固定母、掃子；precursor-ion scan（母離子掃描）掃母、固定子；neutral-loss scan（中性脫失掃描）兩端保持固定m/z差；SRM（選定反應監測）固定一對母→子，MRM（多重反應監測）監測多對。Full scan掃範圍；SIM只監測選定單離子。","ex":"要知道319母離子會碎出哪些峰：product-ion scan。要定量319→86轉換：SRM；多個待測物各取轉換：MRM。","trap":"MRM提高選擇性，仍可能有共洗出同轉換幹擾。中性脫失掃描差值與中性質量只在已知相同電荷下相連。","q":"想找所有能產生86子離子的母離子，用何模式？","ans":"Precursor-ion scan；掃Q1，Q3固定86。","p":["量"],"s":[],"l":[]},{"ch":"MS","L":"L30","title":"定量用校正與內標，不能只比較峰高","ask":"r=0.6、r=2(C_A/10)+0.2，C_A？","chain":"求分析物／內標響應比 → 代入校正 → 回推濃度及稀釋。","why":"LC把混合物分開；MS讀出選定離子或轉換。Quantitation（定量）需校正關係與品質檢查。Internal standard（內標）可補償部分進樣、回收和基質變動；stable-isotope-labelled internal standard（穩定同位素標記內標，SIL-IS）常能更貼近待測物。","ex":"r=A_A/A_IS=0.50，校正式r=2(C_A/C_IS)，C_IS=20 ng/mL：C_A=5 ng/mL。若樣品量測前稀釋2倍，原濃度10 ng/mL。","trap":"不是一定只能用SIL-IS，也不是必保證完全補償。截距不能擅自忽略；外標法只要已充分驗證也可用。MRM不是沒有基質效應。","q":"r=0.6、r=2(C_A/10)+0.2，C_A？","ans":"先減截距得0.4；除2得0.2，再乘10=2 ng/mL。","p":["量"],"s":["樣","算"],"l":["標準曲線線","空白線"]},{"ch":"MS","L":"L31","title":"訊號低先分原因，再回真正該查的站","ask":"峰低可以直接說濃度低嗎？","chain":"比較品質資料 → 分基質／回收／源／讀數 → 指定修正站。","why":"Matrix effect（基質效應）使同濃度檢品在不同背景產生不同游離響應；可抑制也可增強。低訊號還可能來自低濃度、回收差、源條件、傳輸、偵測器或設定，不能第一眼只判源壞掉。","ex":"萃取後加標溶液響應只有純溶劑標準一半，支援基質抑制；若萃取前加標更低，另需考慮回收。可改善分離／前處理、稀釋或匹配校正後重測。","trap":"這是分析者品質回查，不是分子自動回饋。目的不符回M01，操作失準回M02，軸或電荷誤讀回M03，結構過度推論回M04。","q":"峰低可以直接說濃度低嗎？","ans":"不能；先看校正、內標與基質／回收對照。","p":["量"],"s":["算"],"l":["空白線"]},{"ch":"MS","L":"L32","title":"要測元素，就別拿分子碎片來回答","ask":"ICP–MS能否用完整分子峰判斷蛋白質分子量？","chain":"霧化檢品 → 氬電漿原子化／游離 → 按元素離子 m/z 量測。","why":"Inductively coupled plasma mass spectrometry（感應耦合電漿質譜，ICP–MS）用高溫氬電漿將檢品原子化游離，測元素／同位素。碰撞或反應池可處理部分多原子幹擾；不能把ICP視為只配某一種分析器。","ex":"製劑鉛、砷等元素問題選ICP–MS；想知道完整蛋白質或有機不純物結構，需分子質譜路徑。","trap":"題本約7000°C是電漿教育範圍，不是所有位置的恆定溫度。元素可有等質量與多原子幹擾，分子已拆掉不能恢復完整原分子連線。","q":"ICP–MS能否用完整分子峰判斷蛋白質分子量？","ans":"不能依一般ICP原子化游離後的元素譜直接判斷；分子質譜需另一配置。","p":["骨","量","元"],"s":["源","樣","算"],"l":["歸一線","溫度線","保留線"]},{"ch":"MS","L":"L33","title":"方法最適合誰，要由題目目的決定","ask":"不純物分子式與血中定量，需要相同優先考量嗎？","chain":"先問分子／元素與量測量 → 選源＋分析器 → 核對用途限制。","why":"選源看可汽化性、極性與可帶電性；選分析器看要準確質量、碎片層次或定量速度／選擇性。蛋白質LC常選ESI；要中性質量或分子式候選常考高解析；血中已知藥物定量常考LC–QqQ。","ex":"同為ESI：抗體完整質量比較題可選ESI–TOF；已知藥物血中濃度比較題可選LC–ESI–QqQ；MS³比較題通常選離子阱。","trap":"四選項最適合不等於全世界唯一。舊題「有限預算選四極柱」只作題本歷史比較，不是當前購置價格；0.1%不純物題也不是所有製劑通用法規閾值。","q":"不純物分子式與血中定量，需要相同優先考量嗎？","ans":"不同；前者重準確質量／同位素與結構證據，後者重校正、選擇性、靈敏度及基質控制。","p":["元"],"s":["算"],"l":[]},{"ch":"非水滴定","L":"NAT01","title":"非水滴定法的入場條件","ask":"","chain":"分析物符合下列情形時使用非水滴定法——\n① 弱酸鹼性：$K_a$ 或 $K_b<10^{-6}$；$pK_a$ 或 $pK_b>6$（來源標為考標）\n② 水溶性差\n③ 反應速率慢（來源標記 $K<10^8$）、不易選擇指示劑\n④ 終點不易觀察者","why":"","ex":"","trap":"題幹給 $pK$ 數值就比 6；題幹給水溶解度（如 2.55 mg/L、0.8 µg/mL）那是第二個入場理由，不是裝飾。","q":"","ans":"","p":["荷","反"],"s":["選"],"l":["酸鹼線","保留線","計數線"]},{"ch":"非水滴定","L":"NAT02","title":"酸性溶劑 Protogenic solvent（質子性溶劑）","ask":"","chain":"酸性比水強、供給質子能力很強，適於極弱鹼之滴定（即非水酸滴定）。成員：formic acid、acetic acid、acetic anhydride、propionic acid、sulfonyl chloride。","why":"","ex":"","trap":"冰醋酸與醋酐屬此類，所以它們不能拿來做非水鹼滴定（105-2 #2）。","q":"","ans":"","p":["荷","反"],"s":["樣"],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT03","title":"無質子溶劑 Aprotic solvent（中性溶劑）","ask":"","chain":"呈中性、無法供給或接受質子、誘電率低、偶極矩小、反應慢，常和其他溶劑混合使用。成員：benzene、dioxane、ethyl acetate、CCl₄、cyclohexane、CHCl₃、acetone、acetonitrile、methylenechloride。","why":"","ex":"","trap":"111-1 #4 選項 C「滴定劑之配製可使用無質子溶劑」為正確；dioxane 可取代冰醋酸但有附加條件（見 NAT07）。","q":"","ans":"","p":["荷"],"s":["樣"],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT04","title":"兩性溶劑 Amphiprotic solvent","ask":"","chain":"酸與鹼性都比水弱，具質子自遞作用 autoprotolysis，用於分析較弱酸或鹼性藥物。成員：methanol、ethanol、ethyleneglycol、2-propanol、glycerin、benzylalcohol。","why":"","ex":"","trap":"甲醇屬此類，這是甲醇鈉能以甲醇為介質配製的背景。","q":"","ans":"","p":["荷"],"s":["樣"],"l":["酸鹼線","空白線"]},{"ch":"非水滴定","L":"NAT05","title":"鹼性溶劑 Protophyllic solvent","ask":"","chain":"鹼性比水強、酸性比水弱。分兩級——","why":"","ex":"","trap":"這一類是非水鹼滴定（分析弱酸）的溶劑池；112-2 #1 選 pyridine 即出自此表。","q":"","ans":"","p":["荷"],"s":["樣"],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT06","title":"非水酸滴定的滴定劑","ask":"","chain":"非水滴定法最常用的酸滴定液為 HClO₄ 過氯酸；配製濃度 70.0–72.0%，目的是防止自發性爆炸分解。","why":"","ex":"","trap":"題目問「配 0.1 N 過氯酸用什麼」答 70% 過氯酸水溶液；問「不需要下列何者」答 90% 過氯酸。","q":"","ans":"","p":["荷","反"],"s":["源","算"],"l":["酸鹼線","保留線","計數線"]},{"ch":"非水滴定","L":"NAT07","title":"非水酸滴定的溶劑與加料順序","ask":"","chain":"過氯酸溶於酸性溶液冰醋酸（＝乙酸 CH₃COOH），再加醋酐（乙酐）吸水，此步驟為放熱反應。\n過氯酸未經冰醋酸稀釋不可直接加入醋酸酐。\n若用中性溶液二氧六圜 dioxane 取代冰醋酸，則需先用活化鋁處理。","why":"","ex":"","trap":"113-2 #5 問「強酸滴定液最常與何者搭配」答乙酸；107-2 #18 問溶劑答冰醋酸。","q":"","ans":"","p":["荷","反"],"s":["樣"],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT08","title":"非水酸滴定的一級標準品","ask":"","chain":"標定過氯酸用鄰苯二甲酸氫鉀 KHP＝potassium biphthalate＝$\\mathrm{C_6H_4(CO_2K)CO_2H}$；在非水酸滴定實驗中它扮演一級標準鹼。","why":"","ex":"","trap":"109-2 #5 直接問身分（一級標準鹼）；104-1 #8 用 sodium biphthalate 當陷阱；108-1 #14 用化學式出題。","q":"","ans":"","p":["元","反"],"s":[],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT09","title":"甲醇鈉的身分與製備","ask":"","chain":"非水滴定法最常用的鹼是 CH₃ONa 甲醇鈉。製備方式為金屬鈉溶於甲醇 → 放熱反應 → 冰塊冷卻 → 以苯 benzene 稀釋；若形成膠體可改用甲醇鋰 lithium methoxide。","why":"","ex":"","trap":"113-1 #3 選項 A 就是用「氫氧化鈉之甲醇溶液」當錯誤敘述；111-1 #4 選項 B 用 lithium methoxide 的甲醇溶液當正確敘述。","q":"","ans":"","p":["荷","元","反"],"s":["樣"],"l":["酸鹼線","溫度線","計數線"]},{"ch":"非水滴定","L":"NAT10","title":"甲醇鈉的貯存","ask":"","chain":"應避免水分和 CO₂，否則會干擾甲醇鈉呈白色混濁：\n$$\\mathrm{H_2O}+\\mathrm{CO_2}+\\mathrm{CH_3ONa}\\longrightarrow \\mathrm{CH_3OH}+\\mathrm{Na_2CO_3}$$","why":"","ex":"","trap":"113-1 #3 選項 C、114-1 #4 選項 B 都以此為正確敘述。","q":"","ans":"","p":["元"],"s":[],"l":["空白線"]},{"ch":"非水滴定","L":"NAT11","title":"非水鹼滴定的標定組合","ask":"","chain":"甲醇鈉的一級標準品為 benzoic acid 苯甲酸（置於燒瓶）；指示劑為 thymol blue 瑞香酚藍；溶劑為 DMF。","why":"","ex":"","trap":"114-1 #4 用 KHP 替換苯甲酸當錯誤選項；113-1 #3 選項 D「可用苯甲酸測定其力價」為正確。","q":"","ans":"","p":["反"],"s":["樣","選"],"l":["酸鹼線","歸一線","計數線"]},{"ch":"非水滴定","L":"NAT12","title":"非水鹼滴定的溶劑分級","ask":"","chain":"弱酸性藥物 → 用強鹼溶劑：n-butylamine、ethylenediamine、morpholine","why":"","ex":"","trap":"這一條與指示劑配對（NAT13）合起來就是 104-2 #2 的答案。","q":"","ans":"","p":["荷","反"],"s":["樣"],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT13","title":"兩組指示劑","ask":"","chain":"非水酸滴定（用來分析弱鹼）：結晶紫 crystal violet、孔雀石綠 malachite green、喹吶啶紅 quinaldine red","why":"","ex":"","trap":"這張表在本次來源中出現 6 次，是全章複製率最高的考點。","q":"","ans":"","p":["荷","晶","反"],"s":["選"],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT14","title":"結晶紫的變色","ask":"","chain":"crystal violet 結晶紫的變色為藍 → 綠，來源標示 pH 值範圍 2.0～0.5。","why":"","ex":"","trap":"113-1 #5 選項 D 以「結晶紫為此類滴定的常用指示劑」為正確敘述。","q":"","ans":"","p":["荷","晶"],"s":[],"l":["酸鹼線","計數線"]},{"ch":"非水滴定","L":"NAT15","title":"水分限量與環境條件","ask":"","chain":"水分必須低於 0.05%。原因：\n$$\\mathrm{H_2O}+\\mathrm{HClO_4}\\rightleftharpoons \\mathrm{H_3O^+}+\\mathrm{ClO_4^-}$$\n生成的 $\\mathrm{H_3O^+}$ 會降低滴定終點的靈敏度。\n另外，溫度、濕度需與標定標準溶液時一致。","why":"","ex":"","trap":"溶劑選項出現純水、藥用酒精（含水）時直接排除（107-2 #18）。","q":"","ans":"","p":["反"],"s":["選","算"],"l":["溫度線","計數線","雜訊地板"]},{"ch":"非水滴定","L":"NAT16","title":"鹵離子干擾與乙酸汞","ask":"","chain":"分析物以鹽酸鹽或溴酸鹽存在時（如鹽酸嗎啡、neostigmine bromide），滴定前須先加乙酸汞 mercuric acetate，把氯或溴沉澱掉以避免影響反應：\n$$\\mathrm{Hg(CH_3COO)_2}+2\\mathrm{Cl^-}\\longrightarrow \\mathrm{HgCl_2}+2\\mathrm{CH_3COO^-}$$","why":"","ex":"","trap":"題幹只要出現 hydrochloride、bromide 字樣就要想到它。","q":"","ans":"","p":["反"],"s":[],"l":["空白線","計數線"]},{"ch":"非水滴定","L":"NAT17","title":"適用藥物清單","ask":"","chain":"","why":"","ex":"","trap":"題目給藥名要先判酸鹼性再選邊；中性物質兩邊都不適用。","q":"","ans":"","p":["荷"],"s":[],"l":["酸鹼線"]},{"ch":"水分","L":"L01","title":"水分和乾燥減重是不是同一個量","ask":"水分和乾燥減重是不是同一個量？","chain":"先定要求 → 分清水與全部揮發損失 → 選擇可支持的報告。","why":"Water determination（水分測定）針對水；loss on drying（乾燥減重，LOD）是指定條件下的質量損失。檢品內的水不能直接從總質量獨立秤出，可藉反應、分離或乾燥間接量測。水本身有紅外吸收；本章採三種傳統方法，並不是水沒有可測訊號。","ex":"1.000 g 檢品乾燥後少了 0.030 g：先報 LOD 3.0%；未排除殘留溶劑，不能直接說水分 3.0%。","trap":"只有已驗證其他揮發物、分解或氧化等影響可忽略，該乾燥條件的損失才可用來估水分。","q":"檢品同時有水與 ethanol（乙醇），乾燥少 20 mg，是否全是水？","ans":"不能確定；乙醇也可能揮發，需水專一方法或經驗證的校正。","p":["揮"],"s":["算"],"l":["保留線"]},{"ch":"水分","L":"L02","title":"選方法時除了百分比還要看什麼","ask":"選方法時除了百分比還要看什麼？","chain":"水量與基質 → 比較反應／收集／稱重限制 → 選路徑。","why":"本題庫的三法是 Karl Fischer titration（費氏滴定，KF）、toluene distillation（甲苯蒸餾）與 gravimetric method（重量法）。微量水通常優先考慮 KF；要收集數 mL 水的生藥可考慮蒸餾；只需規定的乾燥減重則按重量法。還要看溶解、萃取、副反應、揮發油與法定方法。","ex":"Q06 給 ≤0.5% 的檢品，在四選項中選 KF；Q04 的顛茄葉題本則按傳統比較選 KF 為最不適合。","trap":"這是各題選項內的比較。現代 KF 可處理生藥與高含水檢品，需合適取樣、前處理與驗證；不可背成「生藥永遠不能用 KF」。","q":"兩個樣品都 1% 水，是否必須用相同方法？","ans":"不一定；質量、基質、樣品代表性與待測目的仍可能不同。","p":["反"],"s":[],"l":["空白線"]},{"ch":"水分","L":"L03","title":"百分比如何變成儀器實際要量的水量","ask":"百分比如何變成儀器實際要量的水量？","chain":"百分比轉小數 → 乘取樣質量 → 核對工作範圍。","why":"Mass fraction（質量分率）是水的質量除以原檢品質量。1% 就是每 100 份中 1 份；相同百分比，取樣多十倍，絕對水量也多十倍。三法可否測得，要看絕對量、解析度及基質，不只看百分比。","ex":"1.00 g 的 1% 檢品含 10 mg 水；100 g 的 1% 生藥含 1 g 水，約 1 mL。","trap":"S03 的 KF 10 µg～數百 mg、甲苯法約 2% 級距及 50～100 g 是題庫慣用範圍，不是所有配置的永久上下限。","q":"100 g、2% 水的生藥約可收集多少 mL 水？","ans":"2 g；取水密度約 1 g/mL，約 2 mL。百分比須先變成 0.02。","p":["反"],"s":[],"l":[]},{"ch":"水分","L":"L04","title":"誰是還原劑，誰又被氧化","ask":"誰是還原劑，誰又被氧化？","chain":"辨氧化數 → 找得失電子 → 區分試劑角色。","why":"Oxidation（氧化）可用氧化數升高判斷，reduction（還原）是降低。SO₂ 中 S 是 +4，反應後含硫產物為 +6，故 SO₂ 被氧化而是還原劑；I₂ 的 I 從 0 變成 I⁻ 的 −1，故碘被還原而是氧化劑。還原劑是還原別人，不是自己被還原。","ex":"Q01 問 SO₂ 的角色，選還原劑；Q05 改問誰被氧化，仍選 SO₂。","trap":"先圈題目問「氧化劑」還是「被氧化」，兩者不是同一個詞。","q":"若問「被還原者」而非「還原劑」，答案是否仍是 SO₂？","ans":"不是；被還原者是 I₂，還原劑才是 SO₂。","p":["反"],"s":[],"l":[]},{"ch":"水分","L":"L05","title":"四種傳統試劑各自做什麼","ask":"四種傳統試劑各自做什麼？","chain":"碘氧化亞硫酸成分 → 鹼緩衝酸度 → 醇參與反應。","why":"傳統配方是 iodine（碘）、sulfur dioxide（二氧化硫）、pyridine（吡啶）與 methanol（甲醇）。碘是計量氧化劑，SO₂ 提供被氧化的硫成分，pyridine 作鹼與緩衝成分，methanol 既作溶劑也參與醇中反應。四個角色不能只縮成「溶劑加催化劑」。","ex":"題目出現 I₂、SO₂、C₅H₅N、CH₃OH，先辨傳統 KF，再答分析物是水。","trap":"原 PDF p1 把 pyridine 配為催化劑，是角色簡化；更準確是鹼與緩衝成分。水是待測物，不是故意加入的四成分之一；試劑背景水需預滴定或校正。","q":"水可否列為配方中故意加入的有效成分？","ans":"不可；它會先消耗試劑。實際痕量背景並非絕對零，須處理。","p":["反"],"s":[],"l":["酸鹼線","空白線","計數線"]},{"ch":"水分","L":"L06","title":"碘和水一比一，最後產物又是什麼","ask":"碘和水一比一，最後產物又是什麼？","chain":"形成烷基亞硫酸根 → 以碘和水氧化 → 形成烷基硫酸鹽。","why":"Stoichiometry（化學計量）回答反應量如何配對。在合適醇中 KF 條件下，1 mol I₂ 對 1 mol H₂O。題本的 I₂+SO₂+H₂O ⇌ 2HI+SO₃ 是氧化還原的簡化骨架；不代表 methanol 中真的以游離 SO₃ 作最終產物。實際需把醇與鹼一起算入。","ex":"傳統 methanol／pyridine 產物記成 C₅H₅N·HSO₄CH₃，可讀成 [C₅H₅NH]⁺[CH₃OSO₃]⁻ 的鹽；Q16 選 B，Q22 選與吡啶、三氧化硫結合的舊寫法。","trap":"1:1 有反應介質與水量條件；非醇介質或過多水會改變化學計量，不能無條件套到任何碘／水混合物。","q":"本題配方中消耗 0.5 mmol I₂，對應多少 mmol 水？","ans":"0.5 mmol；先確認合適 KF 介質與無干擾，兩者莫耳量 1:1。","p":["反"],"s":[],"l":["計數線"]},{"ch":"水分","L":"L07","title":"乙醇、咪唑與碘離子真的永遠不能用嗎","ask":"乙醇、咪唑與碘離子真的永遠不能用嗎？","chain":"辨傳統配方 → 區分可替代成分與產碘方式 → 按題意作答。","why":"傳統四成分題依 iodine、SO₂、pyridine、methanol 作答；現代配方可用 imidazole（咪唑）等鹼，也有 ethanol（乙醇）介質。Coulometric KF（庫侖式費氏法）用 iodide（碘離子）在陽極產生 I₂，不能據傳統題目說它永不使用碘化物。","ex":"Q09 的 C 是完整傳統配方；B、D 的主要錯處是把 SO₂ 換為 sulfuric acid（硫酸），不能只因出現 imidazole 就判錯。","trap":"Q02 題幹很寬，仍保留印刷 A，但加「傳統配方比較」條件；若當作所有 KF，排除 ethanol 的說法不成立。Q18 的 KI 也只在傳統預加碘配方下被排除。","q":"現代無吡啶試劑用了 imidazole，是否必然不是 KF？","ans":"不是；鹼可替換，須看完整反應配方及模式。","p":["反"],"s":[],"l":["分配線"]},{"ch":"水分","L":"L08","title":"反應慢或一直耗碘，要查哪個條件","ask":"反應慢或一直耗碘，要查哪個條件？","chain":"查 pH 與基質 → 辨反應不完全或額外耗碘／產水 → 修正方法。","why":"題庫最佳 pH 答 4～7；實際試劑的有效緩衝範圍依配方，製造商常列約 5～7。太酸可使反應慢，太鹼可能產生副反應。boric acid（硼酸）或相關硼酸鹽在 methanol 中可產水；aldehydes（醛類）、ketones（酮類）與 methanol 的副反應也可能額外產水。","ex":"若基質反應另產 1 mg 水，儀器也會把它算入，結果偏高；若晶格水未釋出，水沒被測到而偏低。","trap":"「KF 不適用硼酸鹽」是傳統直接甲醇條件的警訊；驗證其他介質／分離方法後另論。pH 是控制反應的條件，不是 KF 報告的分析物。","q":"檢品完全未溶解，數字偏低是否證明它很乾？","ans":"不能；先查萃取、溶解或加熱釋水是否完全，再核對低值。","p":["荷","反"],"s":[],"l":["酸鹼線","空白線"]},{"ch":"水分","L":"L09","title":"終點出現的琥珀色表示什麼","ask":"終點出現的琥珀色表示什麼？","chain":"水消耗新加碘 → 水耗盡後碘累積 → 清澈樣品可見琥珀色。","why":"Visual endpoint（目視終點）看持續微量過量碘的顏色。水未用完時碘被反應消耗，水用完後碘可累積而呈琥珀色。儀器以穩定終點條件判定何時停，不是看到任意瞬間顏色就完成。","ex":"Q07 的 D 在無色檢品背景下合理；有色檢品會遮住顏色，可改用電極訊號。","trap":"Dead-stop method（死停終點法）是雙電極電流偵測，不是目視琥珀色的別名；兩者可指向相同的過量碘，但讀的是不同訊號。","q":"看不見變色的深色檢品，能不能使用 dead-stop？","ans":"可以考慮；它讀電流，不靠看顏色，但仍須排除電極與基質干擾。","p":["反"],"s":["樣","選"],"l":[]},{"ch":"水分","L":"L10","title":"為何雙電極電流在終點上升","ask":"為何雙電極電流在終點上升？","chain":"終點後 I₂ 與 I⁻ 共存 → 電極氧化還原可維持 → 電流上升。","why":"Biamperometric indication（雙安培終點偵測）對兩支 platinum（鉑，Pt）電極加小的固定電壓，讀得到的電流。終點前游離 I₂ 很少，電流受限；終點後 I₂／I⁻ 能在兩極互轉，電流上升。它不是單純量溶液整體導電度。","ex":"S03 的示例由 5～10 µA 到 50～150 µA；Q21 選 C。Q07 的「電流迅速降低」錯。","trap":"數值是題庫所用儀器條件的示例，不是每臺儀器固定閾值。1 mA＝1000 µA；微安培與毫安培相差千倍。","q":"電流從 8 µA 升到 80 µA，若選項寫成 mA，是否只差排版？","ans":"不是；mA 大千倍。按本題讀的是 µA，且方向是上升。","p":["反"],"s":["選","算"],"l":[]},{"ch":"水分","L":"L11","title":"為何另一種終點讀到電壓下降","ask":"為何另一種終點讀到電壓下降？","chain":"終點後 I₂ 可用 → 維持指定電流較容易 → 所需電壓下降。","why":"Bipotentiometric indication（雙電位終點偵測；也稱 bivoltametric indication）固定小極化電流，讀兩電極間所需電壓。游離 I₂ 出現後，維持電流所需的極化電壓下降。這和 L10 是不同控制方式；一個固定電壓讀電流，一個固定電流讀電壓。","ex":"Q10 問使電位急降的過量成分，選碘。它仍可用於容量式儀器，不必因此判作庫侖定量。","trap":"所讀是終點指示電壓，不是任何單電極相對參考電極的 Nernst 電位。原筆記把此下降直接標為 Coulometry，分類過度簡化。","q":"固定小電流、終點電壓下降，是否已足以知道水的 mg？","ans":"不足；仍須另有試劑體積與力價，或庫侖產碘總電量。","p":["反"],"s":["源","選","算"],"l":[]},{"ch":"水分","L":"L12","title":"容量式和庫侖式究竟差在哪裡","ask":"容量式和庫侖式究竟差在哪裡？","chain":"加已知力價的碘或電解產碘 → 累積體積或電量 → 換算水量。","why":"Volumetric KF（容量式費氏法）加已標定含碘試劑，以體積 V 與力價 f 求水量。Coulometric KF（庫侖式費氏法）由產生電極電解 iodide，陽極反應是 2I⁻ → I₂+2e⁻；計量總電量 Q。另有偵測電極判終點，產碘電路與指示電路要分開。","ex":"容量式：淨 2 mL×5 mg/mL＝10 mg；庫侖式：n(H₂O)＝Q/(2F_c)，F_c 是 Faraday constant（法拉第常數）。","trap":"庫侖換算須近 100% 產碘電流效率且無干擾。f 的 mg/mL 不是 F_c 的 C/mol；庫侖定量不代表把終點電壓當水量。","q":"讀到 100 mV 的終點電壓，可直接乘力價求水嗎？","ans":"不可以；mV 是終點訊號，容量計量需要 mL，庫侖計量需要 C。","p":["反"],"s":["算"],"l":["空白線","歸一線","計數線"]},{"ch":"水分","L":"L13","title":"空白與背景水要在哪一步扣掉","ask":"空白與背景水要在哪一步扣掉？","chain":"取得同條件背景 → 扣淨消耗量 → 才換算檢品水量。","why":"Blank correction（空白校正）去掉溶劑、裝置或前處理帶入的背景水。容量式簡單模型 V_net＝V_sample−V_blank。Drift（漂移）是背景隨時間進水；若儀器已做背景或漂移校正，不可再扣一次。只滴定萃取液一部分時，最後還須依總量／分取量換回原樣品。","ex":"檢品用 2.20 mL、匹配空白 0.20 mL，淨 2.00 mL；f＝5 mg/mL，水是 10 mg。","trap":"空白必須相同前處理並有適當時間基準；不能把任意一天的空白照抄。分取倍率要有已知總體積與分取體積，未知就不能補出總水量。","q":"儀器已報 net water 10 mg，你再扣 1 mg 空白會如何？","ans":"可能低估；先查結果是否已校正，再決定需不需要扣。","p":["反"],"s":["樣"],"l":["空白線"]},{"ch":"水分","L":"L14","title":"二水合物的 115 mg 為何只有 18 mg 水","ask":"二水合物的 115 mg 為何只有 18 mg 水？","chain":"質量除式量 → 水合物莫耳量 → 乘結晶水數與水式量。","why":"Crystal water（水合晶體中的結晶水）在化學式以 ·kH₂O 表示。sodium tartrate dihydrate（酒石酸鈉二水合物）Na₂C₄H₄O₆·2H₂O 每 1 mol 含 2 mol 水。水合物全部質量包含鹽與水，標定用的是其中的水。題目取式量 230 g/mol，水取 18 g/mol。","ex":"115 mg÷230 mg/mmol＝0.5 mmol 水合物；×2＝1 mmol 水；×18 mg/mmol＝18 mg。","trap":"式量必須對到完整水合物；不能拿無水鹽式量或錯寫的 C₂ 化學式代入。須用合適、狀態可信的標準物與完全釋水條件。","q":"同樣二水合物取 230 mg，理論水是多少 mg？","ans":"36 mg；1 mmol 水合物含 2 mmol 水，2×18＝36。","p":["晶"],"s":["算"],"l":[]},{"ch":"水分","L":"L15","title":"力價為什麼是水的 mg 除以試劑的 mL","ask":"力價為什麼是水的 mg 除以試劑的 mL？","chain":"已知水被滴定 → 每 mL 對應多少水 → 得到實際力價。","why":"Titer（力價，f）是每 mL 試劑對應的水質量。Standardization（標定）用已知水量求 f，而不是假定瓶上標示永遠精準。題庫「新鮮試劑約 5 mg/mL」是配方示例；實際值由合適標準水、二水合物等標定取得。","ex":"Q14 已知水 18 mg，用 10.0 mL：f＝18÷10.0＝1.80 mg/mL，選 C。","trap":"1.80 小於 5 不足以單獨證明試劑變質；可能原配方力價就不同。筆記以 1% 區分水／水合物標定，只保留作舊教材說法，不當通用必然界線。","q":"18 mg 水用 20 mL，力價會變為多少？","ans":"0.90 mg/mL；同水量需要兩倍試劑，每 mL 的能力就剩一半。","p":["反"],"s":["算"],"l":["分配線","歸一線","計數線"]},{"ch":"水分","L":"L16","title":"求出水的 mg 後，百分比的分母是誰","ask":"求出水的 mg 後，百分比的分母是誰？","chain":"水量統一單位 → 除原檢品質量 → 乘 100%。","why":"Water mass percentage（水分質量百分比）是 m_water/m_sample×100%。水是 mg 時，檢品也改成 mg；若萃取後分取，先換回全檢品水量。容量式用 fV_net 求水，庫侖式用電量換水，最後都回到同一定義。","ex":"10 mg 水、1.000 g 檢品：分母 1000 mg，10/1000＝1/100，故 1.0%。","trap":"不要除以乾燥後的質量，除非題目明確要求乾基。題目沒給檢品質量，只能報水的 mg，不能猜百分比。","q":"10 mg 水、2.000 g 檢品，水量沒變，百分比如何變？","ans":"變為 0.50%；分母從 1000 mg 增為 2000 mg，比例減半。","p":["反"],"s":["樣","算"],"l":["保留線"]},{"ch":"水分","L":"L17","title":"水和甲苯為何能在低於 100 度一起蒸出","ask":"水和甲苯為何能在低於 100 度一起蒸出？","chain":"兩相各提供蒸氣 → 蒸氣壓相加達外壓 → 共蒸後冷凝。","why":"Azeotropic distillation（共沸蒸餾）在本章指水與 toluene（甲苯）的非均相共蒸。最低前置是：沸騰需總蒸氣壓等於外壓；兩液相各貢獻蒸氣壓，兩者相加可在水尚未達 100 °C 時達到常壓。蒸出後冷凝分層，收集水。","ex":"Q12 的 A 在常壓水／甲苯系統下合理；Q25 的共沸法與甲苯蒸餾在本題相當。","trap":"不能推成所有共沸物一定比兩純物沸點都低；用 xylene（二甲苯）時也不可硬套同一共沸溫度。沸點受外壓與組成影響。","q":"甲苯沸點高於水，是否因此不可能低於 100 °C 共蒸？","ans":"不是；不互溶兩相的蒸氣壓可相加，不能只看純甲苯沸點。","p":["揮"],"s":["算"],"l":["溫度線"]},{"ch":"水分","L":"L18","title":"蒸氣、凝液和甲苯迴流各走哪裡","ask":"蒸氣、凝液和甲苯迴流各走哪裡？","chain":"A 蒸氣經 D 到 B／C → C 冷凝流至 E → 水留 E、甲苯回 A。","why":"圖4採同一典型接收裝置的標號：A 燒瓶，B 圓筒管／蒸氣與接收部，C reflux condenser（迴流冷凝管），D 連線管，E graduated receiver（刻度接收管）。蒸氣經 D 上到冷凝區，凝液往 E 流；上層甲苯達迴流口後回燒瓶，水累積在下部刻度段。","ex":"冷凝水由冷凝套下口進、上口出，與檢品凝液分屬不同路徑；讀 E，不讀冷凝水管。","trap":"原講義圖把五部件畫成近似串聯，未畫出甲苯迴流，這次重畫。舊稱 B「滯氣管」保留辨識；D 以適當保溫、玻璃依 SOP 清潔乾燥，舊石棉／鉻酸用詞只列來源對照。","q":"水累積下層，為何不把全部甲苯也收滿 E？","ans":"接收裝置的上層甲苯到迴流口後回到燒瓶；下層水被刻度段留住。","p":["揮"],"s":[],"l":["分配線","保留線"]},{"ch":"水分","L":"L19","title":"要讀下層水，為何還要先飽和甲苯與冷卻","ask":"要讀下層水，為何還要先飽和甲苯與冷卻？","chain":"減少溶劑吸水 → 冷卻並讓水滴聚集分層 → 讀下層淨水體積。","why":"水密度約 1 g/mL，甲苯約 0.87 g/mL；不混溶時水在下、甲苯在上。兩者仍有少量互溶，乾燥甲苯可留住部分樣品水，使接收量偏低，所以可預先水飽和，或以方法規定的預蒸餾背景修正。冷卻、靜置、移下壁上水滴後才讀取。","ex":"Q12 的 B 說「上層水」錯；若預蒸餾已有 2.0 mL、加樣後總 5.0 mL，檢品淨水是 3.0 mL。","trap":"已先加入的水不能都算成檢品水；尚有壁上水滴或兩相未分開，不應急著讀終值。","q":"甲苯很乾，接收水可能偏少的原因是什麼？","ans":"有些樣品水溶留在甲苯，未成為下層可讀液體；按方法飽和／背景校正。","p":["反"],"s":["樣","算"],"l":["標準曲線線","溫度線"]},{"ch":"水分","L":"L20","title":"接收 2 到 4 mL 水，如何決定取樣量","ask":"接收 2 到 4 mL 水，如何決定取樣量？","chain":"水分率乘樣重 → 水質量除密度 → 選合適樣重。","why":"蒸餾法先要水量足以讀刻度。題庫以蒸出 2～4 mL 水為取樣目標；約 2% 的生藥取 100 g，理想回收水 2 g，約 2 mL。取量還須能放入裝置、可代表檢品，並符合規定的方法。","ex":"50 g 生藥淨得水 3.0 mL，水密度近 1：3.0 g/50 g×100%＝6.0%。","trap":"50～100 g、約 2% 是 S03 題庫經驗配對；WHO 1998 例法以約 2～3 mL 為目標，兩份來源不能合成唯一全球門檻。","q":"預估 4% 水，要理想得到 2 mL，約取多少 g？","ans":"2 mL 約 2 g 水；2 g÷0.04＝50 g。實際依回收與方法條件調整。","p":["整"],"s":[],"l":[]},{"ch":"水分","L":"L21","title":"重量法如何排除稱量瓶本身的質量","ask":"重量法如何排除稱量瓶本身的質量？","chain":"先求原樣重 → 求乾燥質量差 → 除原樣重。","why":"Tare（皮重）是空容器質量。令 m₀ 為乾燥空瓶，m₁ 為瓶加原檢品，m₂ 為瓶加乾燥後檢品：原檢品 m₁−m₀，損失 m₁−m₂。容器質量在損失中消去，但百分比分母仍須扣空瓶。","ex":"m₀＝20.000 g、m₁＝22.000 g、m₂＝21.940 g：樣品 2.000 g，損失 0.060 g，LOD＝3.0%。","trap":"分母不是瓶加檢品的 22 g，也不是乾樣 1.94 g；這是乾燥減重，未必全是水。","q":"空瓶變重 1 g，其他三個數都同步多 1 g，LOD 是否改變？","ans":"不變；兩次差值不變，容器質量已扣掉。","p":["反"],"s":["算"],"l":["保留線"]},{"ch":"水分","L":"L22","title":"乾燥多久和恆量判準能不能當固定常數","ask":"乾燥多久和恆量判準能不能當固定常數？","chain":"按規定乾燥 → 乾燥器冷卻稱量 → 按該法差值判停。","why":"Constant mass（恆量）表示相鄰規定稱量的差在允許限度內，數值依方法定義。先乾燥、在 desiccator（乾燥器）內冷卻再稱量，避免熱氣流與吸濕影響。舊講義約 10 g、105 °C、5 小時、每隔 1 小時、0.25% 是其生藥操作記錄。","ex":"自編條件若明定「兩次重量差≤原樣重的 0.25%」，原樣 10 g 則允許差≤0.025 g＝25 mg；不能擅改另一個分母。","trap":"本次沒有舊講義所稱統整本頁面或現行中華藥典操作原文；0.25% 分母及其與 0.5 mg/g「恆量」的版次不能確認。WHO 1998 例法用 5 mg 差，故不把任何一個數教成全球通則。","q":"未寫方法定義，能否把 0.25% 一律換成 0.5 mg/g？","ans":"不能；兩者不是相等數字，也可能屬不同規定。須讀指定方法的分母、稱量間隔與限度。","p":["反"],"s":[],"l":["溫度線","保留線"]},{"ch":"水分","L":"L23","title":"結果偏高或偏低，如何回到真正出錯的一站","ask":"結果偏高或偏低，如何回到真正出錯的一站？","chain":"列候選原因 → 用空白／回收／讀數核對 → 修正對應站。","why":"偏高可來自環境進水、產水副反應、還原物耗碘、空白未扣，或 LOD 同時失去其他揮發物；偏低可來自萃取不完全、蒸餾留水、再吸濕後的乾重偏高。相同結果可有多個原因，先以另一項資料區分，再修正。","ex":"KF 高值且空白也高，先查密封、乾燥與背景；高值但空白正常、加標回收異常，再查基質副反應。","trap":"f 在 V 固定下用得過大，會算出較高水量；不能反推所有高值都因 f。真正空白的 mg 或 mL、加標回收與平行差都是證據。","q":"兩種原因都可讓結果偏高，只看一個水分%能不能確定是哪一個？","ans":"不能；須再看空白、標定、回收、萃取或重測資料，才能定位。","p":["反"],"s":["算"],"l":["空白線"]},{"ch":"水分","L":"L24","title":"自動滴定和流動注入是否是同一種方法","ask":"自動滴定和流動注入是否是同一種方法？","chain":"辨回授控制或流動注入 → 追化學／檢測步驟 → 核對應用範圍。","why":"Automatic titration（自動滴定）由終點訊號控制加液速率，仍依原化學反應計量。Flow injection analysis（流動注入分析，FIA）把小段樣品注入載流，經混合、反應與檢測；是較廣的流程技術，不是 KF 的同義詞。峰寬受對流與擴散等分散影響。","ex":"自動 KF 可由電極終點訊號減慢加液；FIA 可接合適光學或其他檢測器，但不因此變成 HPLC 分離。","trap":"舊筆記的 615 nm、藥名與其他自動化應用保留在延伸來源表；缺原方案時不能把 615 nm 當 KF 固定必背波長。","q":"接了 HPLC 常見檢測器的 FIA，是否一定有層析分離？","ans":"沒有這個保證；是否分離要看有沒有合適固定相與分離步驟，不能只看檢測器。","p":["反"],"s":["樣"],"l":["分配線","計數線"]},{"ch":"灰分","L":"L01","title":"先分留下的或減少的","ask":"熾灼殘渣檢查法測的是哪一半？","chain":"選殘渣或減重 → 決定計算分子。","why":"天平都在量質量，但報告的量不同；名稱中的「殘渣」與「減重」先決定方向。","ex":"2 g 檢品最後剩 0.05 g；灰分的分子是 0.05 g，減重的分子才是 1.95 g。","trap":"乾燥減重不需要把樣品燒光；熾灼殘渣也不能直接當揮發物含量。","q":"先自己回答上面的問題，再展開核對","ans":"依規定處理後留下的殘渣；不是直接測走掉的揮發物。","p":["揮"],"s":["算"],"l":["保留線"]},{"ch":"灰分","L":"L02","title":"扣空皿，再找原檢品分母","ask":"32 g 能直接當灰分百分比的分母嗎？","chain":"初重減空皿 → 末重減空皿 → 淨重相除。","why":"皿是承載工具，不能算入藥品；相同皿在相減時消去，分母通常是原檢品淨重。","ex":"空皿 30 g，皿＋檢品 32 g，皿＋灰 30.05 g：0.05÷2×100%=2.5%。","trap":"分母若指定乾燥基準，先依方法換算；不能擅自把酸處理前的總灰分當原檢品。","q":"先自己回答上面的問題，再展開核對","ans":"不能。原檢品是 32−30=2 g。","p":["揮","元"],"s":["樣"],"l":["保留線"]},{"ch":"灰分","L":"L03","title":"百分率不會自動告訴你是哪種金屬","ask":"總灰分合格，能直接宣告砷符合限量嗎？","chain":"核對測量對象 → 對照限度 → 限制結論範圍。","why":"同一個殘渣重量可能來自多種鹽或氧化物；總量沒有元素身分資訊。","ex":"總灰分 2.5% 可以與該品項的灰分限度比；不能推出鉛含量或全部重金屬合格。","trap":"殘渣與損失相加為 100% 只適用同一組未另加物質的質量帳；不同方法不互補。","q":"先自己回答上面的問題，再展開核對","ans":"不能；需要對應的元素／雜質檢驗證據。","p":["揮","元"],"s":[],"l":[]},{"ch":"灰分","L":"L04","title":"總灰分包含藥材本身與外來殘留","ask":"總灰分偏高就一定是摻砂嗎？","chain":"依規定灰化除碳 → 冷卻稱量 → 得總殘留。","why":"藥材內部的無機成分與附著泥沙都可能留下；方法不只秤外來污物。","ex":"原有鈣鹽與外來砂粒可共同增加總灰分。","trap":"未除盡的碳會增加稱得殘留；灰化也可能改變無機鹽，並非所有原物質原封不動留下。","q":"先自己回答上面的問題，再展開核對","ans":"不是。也要查正常礦物組成、未完全灰化、污染與操作。","p":["揮","元"],"s":[],"l":["溫度線","保留線"]},{"ch":"灰分","L":"L05","title":"看受熱後的去向，不只背鹽名","ask":"所有硝酸鹽都不會留下灰，對嗎？","chain":"能分解成氣體且無持久金屬殘留 → 不易留灰。","why":"ammonium nitrate（硝酸銨）不含金屬，受熱可形成氣態產物；與題中的金屬氧化物或鹽比較，較不易留下灰。","ex":"Q04 在 magnesium oxide、calcium sulfate、ammonium nitrate、aluminum phosphate 間選 ammonium nitrate。","trap":"不能把「硝酸根會分解」推成所有金屬硝酸鹽都無灰；金屬部分仍可能留下氧化物等。","q":"先自己回答上面的問題，再展開核對","ans":"不對。要追蹤完整化合物及其分解後的固體。","p":["元"],"s":[],"l":["保留線"]},{"ch":"灰分","L":"L06","title":"過度加熱會改變你正在秤的物質","ask":"Q08 為什麼不選「避免氧化」？","chain":"碳酸鈣轉氧化鈣並放 CO₂ → 固體質量減少。","why":"同一份鈣還在，離開的二氧化碳仍帶走質量，因此灰重會降低。","ex":"CaCO₃ → CaO + CO₂；以 Ca=40、C=12、O=16 算：100份變成56份固體。","trap":"反應取決於條件；550°C 不是一越過就瞬間完全分解的開關，也不是所有樣品都同方向變化。","q":"先自己回答上面的問題，再展開核對","ans":"灰化本來會利用氧化除去有機物；本題關鍵是避免殘渣碳酸鈣再分解。","p":["元"],"s":[],"l":["溫度線","保留線"]},{"ch":"灰分","L":"L07","title":"酸不溶性灰分的分母仍是原檢品","ask":"酸不溶灰20 mg，分母是總灰100 mg還是檢品2000 mg？","chain":"稀鹽酸煮沸 → 過濾洗滌 → 熾灼不溶物。","why":"酸處理使可溶部分離開，收集的固體才是要秤的子集合；方法仍回答每份檢品含多少殘留。","ex":"2 g 檢品總灰 100 mg、酸不溶灰 20 mg：酸不溶灰=1%，不是20%。","trap":"主要反映矽質殘留，不是純二氧化矽專一測定；20% 是酸不溶灰佔總灰的另一個比值。","q":"先自己回答上面的問題，再展開核對","ans":"報告酸不溶性灰分%時用2000 mg。","p":["揮","元"],"s":["樣"],"l":["保留線"]},{"ch":"灰分","L":"L08","title":"賦形劑要連過燃燒與酸溶兩關","ask":"Q02 的C為何錯？","chain":"先看灰化後有無固體 → 再看該固體是否溶於稀酸。","why":"不溶於水不代表熾灼後還存在，更不代表留下的物質不溶於酸。","ex":"純 starch（澱粉）可燃；calcium carbonate（碳酸鈣）遇酸可溶並放出CO₂，不能都算成酸不溶灰。","trap":"talc（滑石粉）、titanium dioxide（二氧化鈦）可能貢獻酸不溶殘留；仍要看條件與實際配方。","q":"先自己回答上面的問題，再展開核對","ans":"不能把所有濃縮中藥一律豁免；是否檢驗及限度依對應規範，不能用舊解析的「所有不溶粉都留灰」硬證明。","p":["揮"],"s":["算"],"l":["保留線"]},{"ch":"灰分","L":"L09","title":"過濾洗滌是分離，不是裝飾步驟","ask":"洗滌不足時，稱到的是否必定全是不溶物？","chain":"保留不溶物 → 洗去可溶物 → 定量轉回合適坩堝。","why":"未洗淨的可溶鹽乾後也會稱到；轉移損失則把真正不溶物弄丟。","ex":"濾紙自帶灰會使結果偏高；轉移時掉失固體通常使酸不溶灰偏低。","trap":"用方法指定的無灰濾紙或相容裝置；Gooch crucible（古氏坩堝）不等於任何燒結玻璃都可進高溫爐。","q":"先自己回答上面的問題，再展開核對","ans":"不是；可溶鹽夾帶會讓酸不溶性灰分偏高。","p":["元"],"s":["樣","選","算"],"l":["分配線","溫度線"]},{"ch":"灰分","L":"L10","title":"硫酸參與建立規定的殘渣形態","ask":"Q06 C 的目的說法錯在哪？","chain":"按程序加硫酸、緩慢炭化及熾灼 → 形成方法定義的殘留。","why":"硫酸可使部分無機成分轉為較穩定的硫酸鹽；不是讓鹵化物「碳化消失」。","ex":"加酸後形成的硫酸鹽包含試劑引入的部分，所以結果不能直接當原本金屬的質量。","trap":"不是所有硫酸鹽在所有溫度都不揮發；也不是只在最後才加一次硫酸。","q":"先自己回答上面的問題，再展開核對","ans":"把形成規定殘渣的作用，說成使鹵化物碳化消失。","p":["揮"],"s":[],"l":["溫度線","保留線"]},{"ch":"灰分","L":"L11","title":"坩堝與升溫要配合方法","ask":"瓷坩堝是否一定不適用熾灼殘渣？","chain":"選相容坩堝並預處理 → 緩慢炭化 → 控溫熾灼。","why":"器材若反應或自身變重會干擾；急烈燃燒、飛濺則可能造成分析物機械損失。","ex":"熾灼殘渣法可用合適的石英、鉑或瓷坩堝；題本Q03要求過程中不產生火焰。","trap":"「沒有火焰」是方法操作要求，不是爐子不能發熱；合適材質仍要依檢品與條文判定。","q":"先自己回答上面的問題，再展開核對","ans":"不是；Q03 B為可用，官方補充方法也列porcelain為例。","p":["揮"],"s":["樣"],"l":["溫度線","保留線"]},{"ch":"灰分","L":"L12","title":"先辨版本，再配溫度","ask":"舊題800±25°C可否直接改題幹成600±50°C？","chain":"舊題數值保留 → 對照補充版本 → 各用各的條件。","why":"不同年代條文或不同藥典的方法窗口不能交叉拼接。","ex":"Q07的800±25°C配熾灼殘渣；題本更新註記與JP XVIII補充為600±50°C。","trap":"600落在550–650內，不能僅因未寫±50就斷言「600°C錯」；Q06 A寫一般而非只能，也不可偷換字義。","q":"先自己回答上面的問題，再展開核對","ans":"不可。保留原題、印刷答案及更新註；歷史條文未讀到者列待覈對。","p":["元"],"s":["選"],"l":["分配線","溫度線"]},{"ch":"灰分","L":"L13","title":"礦物藥也可能失去自身的一部分","ask":"LOI=5%可否直接寫成水分=5%？","chain":"依個論熾灼 → 扣前後質量 → 求減少百分率。","why":"減少可能來自水、結晶或結構中的成分、分解氣體及雜質；不能全部當外來污染。","ex":"Kaolin（白陶土）是同一名稱的中英文；舊筆記列的白陶土與Kaolin不應算兩種藥。","trap":"個論決定溫度、時間與終點；不能把LOD的1小時、0.25%直接搬到所有LOI。","q":"先自己回答上面的問題，再展開核對","ans":"不可。熾灼可失去多種成分，氧化增重也可能影響淨變化。","p":["揮"],"s":["算"],"l":["溫度線","保留線","雜訊地板"]},{"ch":"灰分","L":"L14","title":"乾燥減重不是水分專一測定","ask":"Q01 B為何能成立而不代表水專一？","chain":"規定條件下乾燥 → 量前後差 → 報告總減失。","why":"水之外的可揮發成分也可能離開；方法通常不會直接辨認每一種揮發物。","ex":"若乾燥失去水40 mg及其他揮發物10 mg，總減重50 mg，不能全報成水。","trap":"「任何種類揮發性物質」需接上「在規定測試條件下」；不是所有溫度都會完全測到所有揮發物。","q":"先自己回答上面的問題，再展開核對","ans":"其涵蓋水與其他在測試條件下減失的揮發性成分。","p":["揮"],"s":["算"],"l":["溫度線","保留線"]},{"ch":"灰分","L":"L15","title":"恆量允許差先乘原檢品克數","ask":"0.25 mg/g能替代0.5 mg/g嗎？","chain":"每g允許0.5mg × 原檢品g數 → 與Δm比較。","why":"門檻隨檢品量縮放；不是任何份量都允許0.5mg，也不是要求零差。","ex":"按題本Q01解析，2 g檢品允許差≤1 mg；剛好1 mg可通過這項判準。","trap":"此為題本引用的恆量條文；加熱間隔為再乾燥1h或再熾灼15min。不能覆蓋特定方法另訂終點。","q":"先自己回答上面的問題，再展開核對","ans":"不能；Q01就是把此數字改錯。","p":["元"],"s":["樣"],"l":["溫度線","保留線"]},{"ch":"灰分","L":"L16","title":"0.25%要用乾燥後殘重作基準","ask":"同用2g原檢品，為何兩判準不一定相差5倍？","chain":"殘重×0.25% → 與Δm作嚴格小於比較。","why":"0.25%=1/400，可紙筆四等分再除100；基準是殘重，不是任意拿原檢品量。","ex":"殘重1.8 g=1800 mg，門檻4.5 mg；差4 mg合格，差4.5 mg不滿足「<」。","trap":"題本舊3001解析的規則，非所有現行方法通則。0.5mg/g與%都可換算，但基準不能換掉。","q":"先自己回答上面的問題，再展開核對","ans":"另一條用乾燥後殘重；例如剩1.8g時是4.5mg對1mg，比例為4.5。","p":["元"],"s":["樣","算"],"l":["保留線"]},{"ch":"灰分","L":"L17","title":"放冷、防吸濕，才得到可比稱量","ask":"乾燥器只是讓它慢慢冷，與測量無關嗎？","chain":"乾燥器內放冷至室溫 → 及時稱量 → 比較讀數。","why":"熱容器使對流與浮力效應不穩；冷卻時吸濕則增加末次質量。","ex":"同一計算中若末重因吸濕高2 mg，灰分偏高、減重偏低。","trap":"乾燥劑要維持有效；熱秤誤差不一概斷言方向。稱量瓶依方法蓋妥，坩堝亦依程序操作。","q":"先自己回答上面的問題，再展開核對","ans":"不是。它同時幫助控制冷卻時的水氣幹擾。","p":["元"],"s":[],"l":["保留線"]},{"ch":"灰分","L":"L18","title":"品質不符時，回到真正出錯的一站","ask":"結果穩定但未洗淨的酸不溶灰可靠嗎？","chain":"先辨方法／操作／讀數／推論問題 → 定點回查。","why":"恆量只證明規定間隔下變動夠小；穩定污染或錯的殘渣也可能達恆量。","ex":"灰分>100%先查扣皿、加試劑與氧化增重；不能只用「分子分母顛倒」解釋。","trap":"偏差方向必須附條件；不因數字漂亮就跳過空白、污染、損失與方法適用性。","q":"先自己回答上面的問題，再展開核對","ans":"不可靠；回M02修正洗滌，再量M03，最後到M04重判。","p":["元"],"s":[],"l":["空白線"]}],"qs":[{"id":"114-1-37","ch":"CE","title":"找出非理想CZE展寬來源","stem":"下列何者非毛細管電泳帶加寬的原因？\n\n(A) longitudinal diffusion\n\n(B) Joule heating\n\n(C) injection plug length\n\n(D) mass transfer","ans":"","L":["L13"],"p":["荷"],"s":["樣"],"l":["溫度線"],"te":[11,20]},{"id":"113-2-37","ch":"CE","title":"四個pH中EOF最大","stem":"毛細管電泳系統中，在何種pH 值之緩衝液下，其電滲透流（EOF）最大？\n\n(A) 2\n\n(B) 4\n\n(C) 6\n\n(D) 8","ans":"","L":["L11"],"p":["荷"],"s":["選"],"l":["酸鹼線"],"te":[4]},{"id":"113-1-29","ch":"CE","title":"辨「無法」提高EOF","stem":"下列何者無法提高使用二氧化矽毛細管（fused-silica capillary）於電泳操作時之電滲流 （electro- osmotic flow）？\n\n(A) 將電泳液從酸性提高到中性\n\n(B) 提高背景電解質之濃度\n\n(C) 提高電場\n\n(D) 提高系統溫度","ans":"","L":["L11"],"p":["極","荷"],"s":["選","算"],"l":["酸鹼線","空白線","溫度線"],"te":[1,5,7,14]},{"id":"112-2-29","ch":"CE","title":"依原圖官能基判1、2、3到達順序","stem":"利用正電壓模式之毛細管區帶電泳法分析atenolol（1，下圖1）及其不純物blocker acid（2，下圖2）和 diol（3，下圖3），背景電解質pH = 9.7，其遷移之先後順序何者 正確？\n\n(A) 1 2 3\n\n(B) 3 1 2\n\n(C) 3 2 1\n\n(D) 1 3 2\n\n［圖］\n\n原圖位置：題本第2頁題幹旁三結構，字樣與連接照錄。","ans":"","L":["L09"],"p":["骨","荷"],"s":["源"],"l":["空白線"],"te":[14]},{"id":"112-1-37","ch":"CE","title":"陰極端的峰先後","stem":"以毛細管區帶電泳法（CZE）分析分子量相同但電荷不同之三種待測物（①帶正電荷 ② 不帶電荷 ③帶負 電荷），如檢測器置於陰極端，則待測物在電泳圖出現之先後順序為何？\n\n(A) ①②③\n\n(B) ②①③\n\n(C) ③②①\n\n(D) ①③②","ans":"","L":["L06"],"p":["量","荷"],"s":["測","算"],"l":[],"te":[]},{"id":"111-2-33","ch":"CE","title":"中性Steroids四選一的添加機制","stem":"以毛細管電泳分析法分析中性類固醇混合物時，下列何種分離條件最適合？\n\n(A) 5 mM pH 8.0 磷酸緩衝溶液\n\n(B) 5 mM pH 7.5 磷酸緩衝溶液，內含0.05 mM sodium dodecyl sulphate\n\n(C) 5 mM pH 8.0 硼酸緩衝溶液，內含0.01 mM β-cyclodextrin\n\n(D) 5 mM pH 7.5 硼酸緩衝溶液，內含10%甲醇","ans":"","L":["L28"],"p":["荷","手"],"s":["選","算"],"l":["酸鹼線"],"te":[4,13,18]},{"id":"111-1-38","ch":"CE","title":"EOF最無關的直接量","stem":"下列何者與毛細管電泳分析法之電滲透流（EOF）最無關？\n\n(A) 背景溶液之導電度\n\n(B) 背景溶液之pH 值\n\n(C) 毛細管之內徑\n\n(D) 外加電場之強度","ans":"","L":["L05"],"p":["荷"],"s":["選"],"l":["空白線"],"te":[14]},{"id":"110-2-30","ch":"CE","title":"R/S分離添加物","stem":"添加下列何種試劑可以提高(R)-(+)- and (S)-(–)-mepivacaine 在毛細管電泳中的分離效 果？\n\n(A) β-cyclodextrin\n\n(B) sodium dodecyl sulfate\n\n(C) methanol\n\n(D) pyromellitic acid","ans":"","L":["L18"],"p":["手"],"s":["選"],"l":[],"te":[13,18]},{" "te":[4]},{"id":"104-1-38","ch":"CE","title":"EOF「錯誤」項","stem":"毛細管電泳法中，電滲透流（EOF）會影響分析結果，下列敘述何者錯誤？\n\n(A) EOF 使各分析物之波峰較窄\n\n(B) EOF 會隨緩衝液pH 值提高而增大\n\n(C) 緩衝液濃度增加，EOF 也增大\n\n(D) 中性物質的移動速度和EOF 相同","ans":"","L":["L11"],"p":["荷"],"s":["選","算"],"l":["酸鹼線"],"te":[4,7]},{"id":"103-2-31","ch":"CE","title":"HPLC/CE比較的正確項","stem":"有關高壓液相層析法（HPLC）及毛細管電泳法（CE）之比較，下列何者正確？\n\n(A) HPLC 之解析度較佳\n\n(B) CE 之理論板數較大\n\n(C) HPLC 之再現性較差\n\n(D) CE 分離僅用電壓","ans":"","L":["L27"],"p":["荷"],"s":["源","選","算"],"l":["解析度線"],"te":[11]},{"id":"103-2-32","ch":"CE","title":"CE敘述「錯誤」項","stem":"下列有關毛細管電泳法之敘述，何者錯誤？\n\n(A) 毛細管內徑越大，散熱越佳\n\n(B) 毛細管區帶電泳法（capillary zone electrophoresis）使用勻相緩衝溶液及固定電場\n\n(C) 毛細管中黏度越大，離子待測物之電泳移動力越小\n\n(D) 中性分子可用毛細管微膠電動層析法（micellar electrokinetic chromatography）分 離","ans":"","L":["L14"],"p":["荷"],"s":["樣"],"l":["酸鹼線"],"te":[4]},{"id":"103-2-38","ch":"CE","title":"何條件常使EOF小","stem":"毛細管電泳分析法中，何種因素最可能使電滲透流（electro-osmotic flow, EOF）變 小？\n\n(A) 緩衝溶液之pH 值降低\n\n(B) 緩衝溶液之濃度降低\n\n(C) 操作電壓加大\n\n(D) 注入較多樣品於毛細管中","ans":"","L":["L11"],"p":["荷"],"s":["源","樣","選","算"],"l":["酸鹼線"],"te":[4,7,20]},{"id":"103-1-30","ch":"CE","title":"CE家族敘述「錯誤」項","stem":"關於毛細管電泳法之敘述，下列何者錯誤？\n\n(A) 無法將中性物質分離\n\n(B) 可用於蛋白質或核酸等的分離\n\n(C) 可用紫外光或螢光檢測器偵測\n\n(D) 在熔矽（fused silica）毛細管於pH 7 下進行電泳時，EOF 係由陽極流向陰極","ans":"","L":["L28"],"p":["色","量","極","荷"],"s":["選","測"],"l":[],"te":[1,10]},{"id":"103-1-31","ch":"CE","title":"外壁材質與反向極性敘述","stem":"有關毛細管電泳法之敘述，下列何者錯誤？\n\n(A) 為減少毛細管之脆度，其外圍包覆polystyrene\n\n(B) 使用未處理之熔矽毛細管時，緩衝溶液之pH 會影響解離程度\n\n(C) 電解質之濃度越高，電滲透流（EOF）越小\n\n(D) 給予負電壓時，在未處理之熔矽毛細管中，其移動速率為陰離子＞中性溶質＞陽離子","ans":"","L":["L26"],"p":["極","荷"],"s":["源","選","算"],"l":["酸鹼線","分配線"],"te":[4,7]},{"id":"103-1-40","ch":"CE","title":"MEKC「錯誤」相角色","stem":"下列關於微胞電動層析法（MEKC）的敘述，何者錯誤？\n\n(A) 主要用於中性物質的分離\n\n(B) 微胞的作用類似於HPLC 的移動相\n\n(C) 所用的界面活性劑可以是陽離子、陰離子或中性\n\n(D) 分析物與陽離子微胞交互作用，其遷移速率會增加","ans":"","L":["L17"],"p":["極","荷"],"s":["源","選"],"l":["分配線"],"te":[]},{"id":"102-2-38","ch":"CE","title":"平面流主要機制","stem":"下列何者為高效毛細管電泳以平面流（flat flow）前進之主要因素 \n- (B) 藥品主成分含量測定\n- (C) pKa 測定\n- (D) 官能基鑑定","ans":"D","L":["L19"],"p":["色","骨","荷"],"s":["算"],"l":["酸鹼線"],"te":[4]},{"id":"111-2-18","ch":"UV","title":"phenylephrine 鹼性差異","stem":"以 UV 分析相同濃度的 phenylephrine 時，在 0.1 M HCl 及 0.1 M NaOH 中測得之最大 吸收處的波長分別為 273、 292 nm，吸光值（A）分別為 110、182。在鹼性溶液中造成 之差異係因下列何種現象產生？ \n\n- (A) hyperchromic and bathochromic shifts\n- (B) hypochromic and hypsochromic shifts\n- (C) hyperchromic and hypsochromic shifts\n- (D) hypochromic and bathochromic shifts","ans":"A","L":["L10"],"p":["色","荷","元"],"s":["算"],"l":["酸鹼線"],"te":[0,6,7]},{"id":"111-1-11","ch":"UV","title":"warfarin 含量比值","stem":"取一顆標稱含量為 20.0 mg 之 warfarin sodium 錠劑，配成之檢品溶液稀釋 10 倍至最 終體積 100 mL，在 307 nm 測 量溶液之吸收值為 0.760，溶液之吸光係數（A：1%, 1 cm）為 400。錠劑實際含量與標稱含量的比值為何？ \n\n- (A) 1.05\n- (B) 1.01\n- (C) 0.98\n- (D) 0.95","ans":"D","L":["L04"],"p":["色"],"s":["樣","算"],"l":["歸一線"],"te":[6]},{"id":"111-1-20","ch":"UV","title":"methoxamine 含量 w/v","stem":"Methoxamine HCl 在 290 nm 之 A (1%，1 cm) 值為 150。取 1 mL 的此藥品注射 液以水稀釋 500 倍，在 290 nm 以紫外光譜儀測定，其吸收值為 0.45。該注射液中 methoxamine HCl 的含量為多少 w/v？\n\n- (A) 1.50%\n- (B) 0.15%\n- (C) 0.30%\n- (D) 3.00%","ans":"A","L":["L04"],"p":["色"],"s":["樣","算"],"l":["歸一線"],"te":[6]},{"id":"111-1-21","ch":"UV","title":"phenylephrine pKa","stem":"於 292 nm 波長下測定相同濃度的 phenylephrine，在 0.1 M NaOH 及 0.1 M HCl 中 所測得之吸光值分別為 1.11 及 0.01。在 pH 7.9 時所測得的吸光值為 0.11，則此藥物的 pKa 值為多少？ \n\n- (A) 6.9\n- (B) 7.9\n- (C) 8.9\n- (D) 9.9","ans":"C","L":["L12"],"p":["色","荷","元"],"s":["算"],"l":["酸鹼線"],"te":[0,4,6,7]},{"id":"111-1-24","ch":"UV","title":"UV 操作敘述（選錯誤）","stem":"有關紫外光／可見光光譜法之敘述，下列何者錯誤？ \n\n- (A) 檢品容槽應以固定面向置入儀器\n- (B) 檢品溶於有機溶媒進行測定時，應防止溶媒揮發\n- (C) 檢品溶液內含懸浮顆粒時將導致吸光值減少\n- (D) 檢品溶液使用之溶媒，在測定波段應儘量不具吸光性","ans":"C","L":["L20"],"p":["色","揮"],"s":["樣"],"l":["保留線"],"te":[3,6,24]},{"id":"110-2-16","ch":"UV","title":"ephedrine 250 nm 躍遷","stem":"在紫外光光譜中，中藥麻黃主成分 ephedrine 的最大吸收波長約為 250 nm，其來自於 下列何種電子能階躍升？ \n\n- (A) n→π*\n- (B) π→π*\n- (C) σ→π*\n- (D) σ→σ*","ans":"B","L":["L06"],"p":["色"],"s":[],"l":[] ["L22"],"p":["色","極","揮","整"],"s":["選","測"],"l":["分配線","雜訊地板"],"te":[10,17]},{"id":"114-1-29","ch":"HPLC","title":"衍生化的目的","stem":"高效液相層析分析時如需進行衍生化,下列考量何者錯誤?\n\n(A) 衍生化須同時具有高產率與穩定性佳的特點,分析方法的回收率與精確度才會理想\n\n(B) 如果欲檢測缺乏發色團的化合物,可以試圖導入醣分子以提高水溶性,加速分析時間\n\n(C) 極性大的胺基醣苷類抗生素衍生化後,可以用正相的矽膠層析管進行分析\n\n(D) 如果有其他適當的偵檢器可以使用,衍生化通常不會被選擇用於分析","ans":"B","L":["L18"],"p":["色","極","反"],"s":["樣","算"],"l":["分配線","保留線"],"te":[1,16,26]},{"id":"113-2-29","ch":"HPLC","title":"手性與離子對","stem":"以HPLC 分析光學異構物時,下列何者最不適用?\n\n(A) 使用Pirkle type 管柱\n\n(B) 使用cyclodextrin 管柱\n\n(C) 使用C18 管柱,在移動相中添加serine\n\n(D) 使用C18 管柱,在移動相中添加cetrimide","ans":"D","L":["L17"],"p":["極","荷","手"],"s":["源","選"],"l":["分配線"],"te":[1,18,19]},{"id":"113-2-32","ch":"HPLC","title":"固定相的適用性","stem":"關於HPLC 固定相的敘述,下列何者錯誤?\n\n(A) C18 無法用於鹼性化合物之分析\n\n(B) 苯基矽烷矽膠具選擇性分析芳香環化合物的特性\n\n(C) 胺丙烷基矽膠可用於界面活性劑的分析\n\n(D) 四級銨鹽常為強陰離子交換樹脂的作用基團","ans":"A","L":["L08"],"p":["骨","極","荷"],"s":["選"],"l":["酸鹼線","分配線"],"te":[1,19]},{"id":"113-2-33","ch":"HPLC","title":"RP水醇比例","stem":"以C18 管柱分析C6H5CH2NH2 時,以水及甲醇為移動相,在下列何種體積比例(水: 甲醇)下沖提,其滯留時間最短?\n\n(A) 1:5\n\n(B) 1:3\n\n(C) 1:2\n\n(D) 1:1","ans":"A","L":["L11"],"p":["極"],"s":["源","選"],"l":["分配線"],"te":[1,2,12,13]},{"id":"113-2-40","ch":"HPLC","title":"內標的適用範圍","stem":"有關HPLC 含量測定之內標(internal standard),下列敘述何者錯誤?\n\n(A) 加入內標是為了消除注入量及檢測器的誤差\n\n(B) 內標宜與分析物結構近似\n\n(C) 內標的濃度,宜與分析物相近\n\n(D) 內標一旦確定,可一體適用於不同檢品分析","ans":"D","L":["L23"],"p":["極"],"s":["樣","測","算"],"l":["標準曲線線"],"te":[7,20,26]},{"id":"113-1-28","ch":"HPLC","title":"pKa區間與變動","stem":"以逆相層析法同時分析bupivacaine（pKa 8.1）、pentycaine（pKa 8.1）、prilocaine（pKa 7.9）及procaine（pKa 9.0），若將移動相的pH值從8降低為7，對於下列何者的滯留時間影響最小？\n\n(A) bupivacaine\n\n(B) pentycaine\n\n(C) prilocaine\n\n(D) procaine","ans":"D","L":["L10"],"p":["極","荷"],"s":["源","選"],"l":["酸鹼線","分配線"],"te":[1,2,4]},{"id":"113-1-35","ch":"HPLC","title":"HILIC原圖峰D","stem":"以HILIC 層析管(性質類似正相管柱)分析下列五種胺基酸,其層析圖(如下)中波峰 D 是何種胺基酸?\n\n［圖］\n\n(A) serine\n\n(B) tyrosine\n\n(C) threonine\n\n(D) phenylalanine","ans":"A","L":["L16"],"p":["極"],"s":["選"],"l":["分配線"],"te":[1]},{"id":"113-1-38","ch":"HPLC","title":"離子對與解離","stem":"下列何者不適合以離子對-層析分離法(ion-pairing chromatography)進行分析定 量? ①CH3CH2CH2CH2NH2 ②CH3CH2CH2COOH ③CH3CH2CH2CH2OH ④ (CH3CH2)4N+Br-\n\n(A) ①\n\n(B) ②\n\n(C) ③\n\n(D) ④","ans":"C","L":["L14"],"p":["荷"],"s":["選"],"l":["酸鹼線"],"te":[19]},{"id":"112-2-27","ch":"HPLC","title":"C18同族次序","stem":"以高效液相層析法分析 amylbenzene、propylbenzene 及toluene 的混合物,若以 C18 管柱為固定相,甲醇和水的 混合溶液為移動相,則下列敘述何者錯誤?\n\n(A) 增加移動相中的甲醇含量會降低此三者的capacity factor(K')\n\n(B) 提升層析管柱的溫度,會使capacity factor(K')降低\n\n(C) 移動相中加入0.1% 的乙酸,此三者的capacity factor(K')幾乎不變\n\n(D) 滯留時間由長到短依序為 toluene、propylbenzene、amylbenzene","ans":"D","L":["L06"],"p":["極"],"s":["源","選","算"],"l":["分配線","溫度線"],"te":[1,2,5,13,21]},{"id":"112-2-28","ch":"HPLC","title":"HILIC多重作用","stem":"下列有關親水性交互反應層析法(hydrophilic interaction liquid chromatography, HILIC)之敘述,何者正確?\n\n(A) 其分離機制與逆相層析類似\n\n(B) 極性較高的化合物較不易滯留\n\n(C) 移動相的水含量愈多,化合物愈慢被沖提出來\n\n(D) 強酸性或強鹼性化合物皆有可能發生離子交換的反應","ans":"D","L":["L16"],"p":["極","荷"],"s":["源","選","算"],"l":["酸鹼線","分配線"],"te":[1,19]},{"id":"112-2-32","ch":"HPLC","title":"粒徑與內徑","stem":"對於高效液相層析法(HPLC)的描述,下列何者錯誤?\n\n(A) 固定相充填劑的粒徑愈小,分離效果愈佳\n\n(B) 層析管柱長度變為2 倍,則滯留時間約變為2 倍\n\n(C) 流速相同時,減小層析管柱內徑可提高分離效果\n\n(D) 固定相粒徑愈大,分離的最佳線性流速(linear velocity)愈低","ans":"C","L":["L24"],"p":["極"],"s":["選"],"l":["分配線","標準曲線線"],"te":[1,2]},{"id":"112-2-36","ch":"HPLC","title":"無發色基偵測","stem":"下列何者可用於檢測不具發色基(chromophore)的分析物?\n\n(A) diode array detector\n\n(B) fluorescence detector\n\n(C) evaporative light scattering detector\n\n(D) UV/Vis detector","ans":"C","L":["L22"],"p":["色","揮"],"s":["測"],"l":[],"te":[10]},{"id":"112-2-38","ch":"HPLC","title":"離子對保留方向","stem":"以逆相層析分析具離子化特性之待測物,於動相中加入離子對試劑時,下列敘述何者錯 誤?\n\n(A) 可增加解析度\n\n(B) 以靜電力形成離子對\n\n(C) 離子對試劑的低極性端與固定相,以凡得瓦力相互作用\n\n(D) 分析物的滯留時間變短","ans":"D","L":["L14"],"p":["極","荷"],"s":["選","算"],"l":["酸鹼線","分配線","解析度線"],"te":[1,2,9,11,19]},{"id":"112-2-39","ch":"HPLC","title":"檢量範圍","stem":"某抗生素之最低抑菌濃度(MIC)為10 μg/mL,當血中濃度高於50 μg/mL 時有肝毒 性之疑慮。若欲使用HPLC 監測其療效濃度時,下列測試濃度範圍何者最恰當?\n\n(A) 0.01~10000 μg/mL\n\n(B) 0.1~1000 μg/mL\n\n(C) 1~100 μg/mL\n\n(D) 20~50 μg/mL","ans":"C","L":["L23"],"p":["極"],"s":["算"],"l":[],"te":[7]},{"id":"112-2-40","ch":"HPLC","title":"陽交換與pH","stem":"用陽離子交換層析法分析選項之胺基酸時,若將動相的pH 值緩緩提升,則最後沖提出 者為何?\n\n(A) glutamic acid(C5H9NO4)\n\n(B) leucine(C6H13NO2)\n\n(C) threonine(C4H9NO3)\n\n(D) lysine(C6H14N2O2)","ans":"D","L":["L13"],"p":["極","荷"],"s":["選","算"],"l":["分配線"],"te":[19]},{"id":"112-1-34","ch":"HPLC","title":"冠醚條件","stem":"使用高效液相層析法時,下列何者無法達到分離鏡像異構物的目的?\n\n(A) 移動相中加入對掌性修飾劑\n\n(B) 以對掌性試劑衍生化分析物\n\n(C) 將cyclodextrin 修飾至固定相上\n\n(D) 將crown ether 修飾至C18 管柱上","ans":"D","L":["L17"],"p":["極","手","反"],"s":["源","樣","選"],"l":["分配線","保留線"],"te":[1,16,18]},{"id":"112-1-39","ch":"HPLC","title":"常用RP基團","stem":"下列逆相液相層析固定相之修飾基團,何者最常用?\n\n(A) CN\n\n(B) diol\n\n(C) n-octadecyl\n\n(D) NH2","ans":"C","L":["L08"],"p":["極"],"s":["選"],"l":["分配線"],"te":[1]},{"id":"112-1-40","ch":"HPLC","title":"IEC基團與命名","stem":"有關離子交換層析的敘述,下列何者錯誤?\n\n(A) 固定相係styrene 和divinylbenzene 之聚合物\n\n(B) divinylbenzene 之含量與交聯程度有關\n\n(C) 含磺酸根官能基者屬於陽離子交換型\n\n(D) 含羧酸根官能基者屬於陰離子交換型","ans":"D","L":["L13"],"p":["骨","荷"],"s":["選","算"],"l":[],"te":[19]},{"id":"111-2-27","ch":"HPLC","title":"UPLC粒徑","stem":"相較於HPLC,利用UPLC(ultra-high-performance liquid chromatography)進行 acetaminophen 的不純物分析時,下列敘述何者錯誤?\n\n(A) UPLC 管柱充填物之粒徑較大\n\n(B) 同管柱長度下,UPLC 有較大的理論板數\n\n(C) UPLC 系統需要較大的幫浦壓力\n\n(D) UPLC 具更高的工作效率","ans":"A","L":["L24"],"p":["極"],"s":["源","選","算"],"l":["解析度線"],"te":[1,11]},{"id":"111-2-30","ch":"HPLC","title":"NP混合比例","stem":"在矽膠層析中,以二氯甲烷(A)與正己烷(B)混合溶媒為移動相,在下列何種體積比 例(A:B)下,移動相之極性最大?\n\n(A) 10:1\n\n(B) 2:1\n\n(C) 1:2\n\n(D) 1:10","ans":"A","L":["L11"],"p":["極"],"s":["源","樣"],"l":["分配線"],"te":[1,3]},{"id":"111-2-31","ch":"HPLC","title":"弱酸與正電試劑","stem":"C6H5CH2COOH 如以離子對-逆相層析分離法進行分析定量時,移動相加入下列何者, 其滯留時間最長?\n\n(A) C7H15SO3 -\n\n(B) (CH3)4N+\n\n(C) (C4H9)4N+\n\n(D) Cl-","ans":"C","L":["L14"],"p":["極","荷"],"s":["源","選","算"],"l":["酸鹼線","分配線"],"te":[1,2,19]},{"id":"111-2-36","ch":"HPLC","title":"RP保留最長","stem":"以C18 管柱層析分析檢品,水(A)及甲醇(B)混合液為移動相,下列何種體積比例 (A:B),其檢品之滯留時間(retention time)最長?\n\n(A) 2:1\n\n(B) 1:1\n\n(C) 1:2\n\n(D) 1:3","ans":"A","L":["L11"],"p":["極"],"s":["源","樣","選"],"l":["分配線"],"te":[1,2,12,13]},{"id":"111-1-30","ch":"HPLC","title":"aspirin酸鹼方向","stem":"以C18 管柱進行aspirin(pKa = 3.5)的高效液相層析分析時,下列何者正確?\n\n(A) C18 管柱為正相的固定相\n\n(B) 紫外光檢測器的光源通常為氙燈\n\n(C) 以0.05 M 乙酸/乙腈(85:15)為移動相,若pH 值由3 提高至5,則滯留時間縮短\n\n(D) 提高移動相中乙腈的比例時,滯留時間延長","ans":"C","L":["L09"],"p":["色","極","荷"],"s":["源","選","測"],"l":["酸鹼線","分配線"],"te":[1,2,4,10,15,21]},{"id":"111-1-36","ch":"HPLC","title":"位置異構物原理","stem":"下列何種層析原理最適於分離chlorophenol 之三種異構物(o-、m-、p-)?\n\n(A) partition\n\n(B) adsorption\n\n(C) ion-exchange\n\n(D) size exclusion","ans":"B","L":["L07"],"p":["量"],"s":["選"],"l":[],"te":[19]},{"id":"111-1-39","ch":"HPLC","title":"正逆相切換溶劑","stem":"NH2 管柱可用在正相及逆相分離,下列何者為正逆相切換時最適用的沖提液?\n\n(A) ethyl acetate\n\n(B) dimethylformamide\n\n(C) water\n\n(D) ethanol","ans":"D","L":["L04"],"p":["極"],"s":["樣","選"],"l":["分配線"],"te":[1,3]},{"id":"111-1-29","ch":"HPLC","title":"聚合物相容性","stem":"關於HPLC 層析管柱的敘述,下列何者錯誤?\n\n(A) 利用封端(endcapped)方法,可增加充填物對高pH 溶液的穩定性\n\n(B) 相較於矽石,以有機聚合物為核心的充填物在高pH 下有更好的穩定性\n\n(C) 相較於矽石,以有機聚合物為核心的充填物對高親脂性移動相有更好的穩定性\n\n(D) 將矽石顆粒表面的羥基置換成烷基可增加其穩定性","ans":"C","L":["L08"],"p":["極"],"s":["源","選"],"l":["分配線"],"te":[1]},{"id":"111-1-31","ch":"HPLC","title":"未衍生化醣","stem":"使用高效液相層析法分析未經衍生化的醣類分子時,最適合使用下列何種檢測器?\n\n(A) 火焰離子化檢測器(flame ionization detector)\n\n(B) 電子捕捉檢測器(electron capture detector)\n\n(C) 蒸發光散射檢測器(evaporative light scattering detector)\n\n(D) 螢光偵測器(fluorescence detector)","ans":"C","L":["L22"],"p":["色","荷","揮","元","反"],"s":["源","樣","測"],"l":["酸鹼線","保留線"],"te":[10,16]},{"id":"111-1-32","ch":"HPLC","title":"UV的通用性","stem":"關於HPLC 檢測器的敘述,下列何者錯誤?\n\n(A) 紫外光檢測器(UV)為高靈敏之通用型檢測器\n\n(B) 蒸發光散射檢測器(ELSD)可用於醣類的分析\n\n(C) 電化學檢測器(ECD)常運用於選擇性的生物檢品分析\n\n(D) 螢光檢測器之光源通常為氙燈","ans":"A","L":["L19"],"p":["色"],"s":["源","樣","選","測"],"l":[],"te":[10,15]},{"id":"111-1-40","ch":"HPLC","title":"三點模型","stem":"以HPLC 分析鏡像異構物時,鏡像異構物一般必須與具掌性(chiral)之靜相至少有幾點 接觸方具良好分離效 果?\n\n(A) 1\n\n(B) 2\n\n(C) 3\n\n(D) 4","ans":"C","L":["L17"],"p":["手"],"s":["選"],"l":[],"te":[18]},{"id":"110-2-29","ch":"HPLC","title":"玻尿酸分離","stem":"玻尿酸(hyaluronic acid)為多醣類化合物,其分離純化以下列何者最適當?\n\n(A) 正相液相層析法\n\n(B) 離子交換層析法\n\n(C) 逆相液相層析法\n\n(D) 分子篩層析法","ans":"D","L":["L15"],"p":["量","極","荷"],"s":["選"],"l":["分配線"],"te":[1,19]},{"id":"110-2-31","ch":"HPLC","title":"低極性與C18","stem":"以相同之移動相進行逆相液相層析分析低極性檢品時,檢品滯留時間最長之層析管為 何?\n\n(A) C18 管柱\n\n(B) C8 管柱\n\n(C) cyano 管柱\n\n(D) diol 管柱","ans":"A","L":["L06"],"p":["極"],"s":["源","樣","選"],"l":["分配線"],"te":[1,2]},{"id":"110-2-32","ch":"HPLC","title":"偵測器選擇性排序","stem":"下列HPLC 所使用之檢測器,其偵測化合物之選擇性由高至低排序,何者正確?①紫外 光檢測器(UV) ② 電化學檢測器(ECD) ③蒸發光散射檢測器(ELSD) ④折射率檢測 器(RID)\n\n(A) ②①③④\n\n(B) ①②③④\n\n(C) ②④①③\n\n(D) ①②④③","ans":"A","L":["L20"],"p":["色","整"],"s":["選","測"],"l":[],"te":[10]},{"id":"110-2-38","ch":"HPLC","title":"弱酸適用pH","stem":"某弱酸性藥物之pKa=4,用逆相高效液相層析分析時,最適當之動相pH 值為何?\n\n(A) 8\n\n(B) 3\n\n(C) 6\n\n(D) 7","ans":"B","L":["L09"],"p":["極","荷"],"s":["算"],"l":["酸鹼線","分配線"],"te":[1,4]},{"id":"110-2-39","ch":"HPLC","title":"NP沖提序","stem":"在正相液相層析中,下列何者為溶劑沖提能力由大至小之順序?\n\n(A) 甲醇、乙酸乙酯、二氯甲烷、正己烷\n\n(B) 乙酸乙酯、二氯甲烷、甲醇、正己烷\n\n(C) 乙酸乙酯、甲醇、二氯甲烷、正己烷\n\n(D) 甲醇、乙酸乙酯、正己烷、二氯甲烷","ans":"A","L":["L11"],"p":["極"],"s":["樣","選"],"l":["分配線"],"te":[1,3,13,21]},{"id":"110-1-26","ch":"HPLC","title":"B2螢光配對","stem":"利用HPLC 定量飲料中之維生素B2(riboflavin)含量時,下列何種偵測器有最好的選 擇性?\n\n(A) UV detector\n\n(B) fluorescence detector\n\n(C) evaporative light-scattering detector\n\n(D) refractive index detector","ans":"B","L":["L20"],"p":["色","揮","整"],"s":["測","算"],"l":[],"te":[10]},{"id":"110-1-28","ch":"HPLC","title":"多模式辨識","stem":"關於高效液相層析法之應用,下列何者正確?\n\n(A) 使用粒徑篩析(size-exclusion)層析法時,苯丙胺酸的滯留時間比膠原蛋白短\n\n(B) 相較於苯甲酸,苯甲醛更不易滯留在矽膠管柱上\n\n(C) 氧化鋁通常用作離子交換充填劑的基礎材料\n\n(D) 使用逆相管柱分離時,benzene 比amylbenzene 的滯留時間更長","ans":"B","L":["L05"],"p":["量","極","荷"],"s":["選"],"l":["分配線"],"te":[1,2,19,22]},{"id":"110-1-32","ch":"HPLC","title":"強RP移動相","stem":"採用C18 管柱分析betamethasone 時,下列移動相何者可使分析物的滯留時間最短?\n\n(A) methanol-water(30:70)\n\n(B) methanol-water(20:80)\n\n(C) acetonitrile-water(30:70)\n\n(D) acetonitrile-water(70:30)","ans":"D","L":["L11"],"p":["極"],"s":["源","選"],"l":["分配線"],"te":[1,2,13]},{"id":"110-1-33","ch":"HPLC","title":"五類固醇原圖","stem":"下圖5 個皮質類固醇化合物利用C18 層析管,以甲醇/水(75:25)為移動相沖提, 則下列何者的滯留時間排第3 位?\n\n［圖］\n\n(A) betamethasone\n\n(B) betamethasone 21-valerate\n\n(C) betamethasone 17-valerate\n\n(D) betamethasone 17,21-dipropionate","ans":"C","L":["L07"],"p":["極"],"s":["源","選"],"l":["分配線"],"te":[1,2,12,13]},{"id":"109-2-27","ch":"HPLC","title":"RP常用溶劑","stem":"以 C18 HPLC 分析 prednisolone 和 betamethasone 時,下列移動相溶劑何者不適 用?\n\n(A) 甲醇(methanol)\n\n(B) 乙腈(acetonitrile)\n\n(C) 氯仿(chloroform)\n\n(D) 四氫呋喃(tetrahydrofuran)","ans":"C","L":["L04"],"p":["極"],"s":["源","樣"],"l":["分配線"],"te":[1,3,13]},{"id":"109-2-28","ch":"HPLC","title":"ibuprofen影響最大","stem":"下列 pH 值變動,何者對 ibuprofen(pKa 4.4)在逆相層析法的滯留時間有最大的影 響?\n\n(A) pH 2 → pH 3\n\n(B) pH 4 → pH 5\n\n(C) pH 6 → pH 7\n\n(D) pH 8 → pH 9","ans":"B","L":["L10"],"p":["極","荷"],"s":["選"],"l":["酸鹼線","分配線"],"te":[1,2,4]},{"id":"109-2-29","ch":"HPLC","title":"時間調整反向題","stem":"利用逆相層析建立 diclofenac 的不純物分析方法時,下列何者無法減少分析時間?\n\n(A) 增加移動相流速\n\n(B) 增加移動相中有機溶劑之比例\n\n(C) 增加移動相中水相之比例\n\n(D) 增加移動相之梯度變化速度(斜率)","ans":"C","L":["L12"],"p":["極"],"s":["源","樣"],"l":["分配線"],"te":[1,2,3]},{"id":"109-2-32","ch":"HPLC","title":"C8/C18題本爭議","stem":"下列有關逆相層析與正相層析之敘述,何者錯誤?\n\n(A) 強陰離子交換樹脂可用於逆相層析\n\n(B) 甲醇可用於正相層析與逆相層析\n\n(C) HILIC 管柱分離效果通常較接近正相層析\n\n(D) 相較於 C18 管柱,高極性樣品在 C8 管柱之滯留時間較短","ans":"D","L":["L08"],"p":["極","荷"],"s":["樣","選"],"l":["分配線"],"te":[1,2,13,19]},{"id":"109-2-38","ch":"HPLC","title":"經典離子對試劑","stem":"下列何者非用於離子對-逆相液相層析之離子對試劑?\n\n(A) sodium heptanesulfonate\n\n(B) ammonium acetate\n\n(C) tetrabutylammonium chloride\n\n(D) sodium decanesulfonate","ans":"B","L":["L14"],"p":["極","荷"],"s":[],"l":["分配線"],"te":[1,19]},{"id":"109-2-39","ch":"HPLC","ti
