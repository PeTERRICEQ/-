針「跑得比較快」，兩者會差出一個相位，合成直線的方向就跟著轉過去；轉過的角度是相位差的一半。\n3. 每種圓偏光走過長度 $l$ 累積的相位是 $\\dfrac{2\\pi n l}{\\lambda}$，所以：","ex":"","trap":"","q":"","ans":"","p":["手","整"],"s":[],"l":[]},{"ch":"旋光","L":"L4","title":"掌性判準：誰會轉、誰的淨值為零","ask":"題目問「可不可以用旋光度測定異丙醇水溶液中異丙醇的含量」「下列何者不具旋光度」。判準是什麼？","chain":"分子與鏡像不能重疊（chiral）→ 對左右圓偏光感受不同（L3）→ 偏極面被轉 → 有訊號；分子與鏡像能重疊（achiral）→ $n_\\text{左}=n_\\text{右}$ → 不轉 → 沒有訊號。","why":"定位：M02 檢品與分析物（也回答 M01「能不能用本法」）。","ex":"","trap":"","q":"","ans":"","p":["手"],"s":["算"],"l":["解析度線"]},{"ch":"旋光","L":"L5","title":"a ∝ l × c：光遇到的分子越多，轉得越多","ask":"同一瓶葡萄糖溶液做三次實驗，讀到的 $a$ 為什麼不一樣？","chain":"$l$ 變長或 $c$ 變大 → 光路上遇到的 chiral 分子數變多 → 每個分子貢獻的一點點轉角累加 → $a$ 等比例變大 → $a$ 不是物質常數。","why":"分子數 ∝（截面積 × 長度 × 濃度），截面積固定，所以 $a\\propto l\\times c$。L3 的 $\\theta\\propto l$ 給出同一結論。","ex":"","trap":"","q":"","ans":"","p":["手"],"s":[],"l":["雜訊地板"]},{"ch":"旋光","L":"L6","title":"歸一化：除掉 l 與 c，剩下的才是物質的指紋","ask":"甲實驗室用 1 dm 管、5 g/100 mL；乙實驗室用 2 dm 管、1 g/100 mL。兩邊讀數不同，要怎麼知道是不是同一個物質？","chain":"$a$ 與 $l$、$c$ 成正比 → 寫成 $a=k\\cdot l\\cdot c'$ → $k$ 只由物質（與固定條件）決定 → 定義 $k$ 為 Specific rotation（比旋光度）$[\\alpha]$ → 換成藥典濃度單位就出現分子的 100。","why":"定位：M06 歸一與判讀。","ex":"","trap":"","q":"","ans":"","p":["骨","手"],"s":["算"],"l":["歸一線"]},{"ch":"旋光","L":"L7","title":"分母以外的條件仍會改變 [α]","ask":"112-2：某化合物測得 $[\\alpha]=-13$，文獻卻是 $+20$，連正負號都不同。最可能是哪裡不同？","chain":"溫度、波長或溶劑改變 → 分子的構形、分子與溶劑的作用、光與分子的交互作用改變 → $n_\\text{左}-n_\\text{右}$ 改變（L3）→ $[\\alpha]$ 改變，甚至變號 → 所以這三者必須寫進表示法。","why":"| 因素 | 為什麼會改 $[\\alpha]$ | 表示法寫在哪 |\n|---|---|---|\n| 波長 | L3 式中 $\\lambda$ 在分母，$n$ 也隨 $\\lambda$ 變；遠離吸收帶時波長越短旋光越大（USP：436 nm 約 2 倍、365 nm 約 3 倍於 589 nm） | 下標 D（鈉光 D 線） |\n| 溫度 | 溫度改變分子構形分布與溶液密度 | 上標（通常 25） |\n| 溶劑 | 溶劑與分子的氫鍵、極性作用改變構形 | 括號內 |\n| 濃度（次要） | 已被除掉，但部分物質 $[\\alpha]$ 隨濃度輕微改變 | 括號內（c＝…） |\n| 管長 | 已被除掉 | 不必寫 |\n| 濕度 | 不是來源列出的因子 | 不寫 |","ex":"","trap":"","q":"","ans":"","p":["手"],"s":["樣"],"l":["歸一線","溫度線"]},{"ch":"旋光","L":"L8","title":"兩套系統：D／L（定義）與 (+)／(−)（量測）沒有對應","ask":"106-2：維生素 C 的 $[\\alpha]_D^{25}=+21$，它的立體結構與光學屬性是 D-(+)、L-(+)、D-(−) 還是 L-(−)？","chain":"D／L 是依結構圖的約定決定的標籤 → 旋轉方向由整個分子與光的交互作用（L3）在實驗條件下決定 → 兩者由不同的東西決定 → 沒有必然對應 → 只能「結構看結構、旋光看量測」。","why":"定位：M05 讀數（(+)／(−) 從這裡產生）；D／L 屬於化學結構的命名，不在光路上。","ex":"","trap":"","q":"","ans":"","p":["手"],"s":[],"l":[]},{"ch":"旋光","L":"L9","title":"鏡像加權：由讀數推出兩個對映體各佔多少","ask":"113-1：純的光學活性化合物混入其鏡像異構物，$[\\alpha]$ 減少 5%，兩者比例是多少？","chain":"混合物的值＝各自純品值 × 所佔比例再相加 → 正負相消 → 混合值／純值＝$f_+-f_-$ → 再用 $f_++f_-=1$ 解出 $f_+$。","why":"定位：M06 歸一與判讀。","ex":"","trap":"","q":"","ans":"","p":["手"],"s":["算"],"l":[]},{"ch":"旋光","L":"L10","title":"可信度：誤差如何進入讀數","ask":"旋光度常常只有零點幾度（110-2 約 0.62°）。一台只準到 0.02° 的儀器、加上人眼判斷終點，讀數可信嗎？要怎麼控制？","chain":"$a$ 很小 → 固定大小的讀數誤差佔比就大 → 儀器必須夠精確（至少 0.02°）＋目視判讀要多次平均（至少五次）＋扣除溶劑空白＋排除氣泡、控溫 → $a$ 才可信 → $[\\alpha]$ 才可信。","why":"定位：M07 可信度條件。","ex":"","trap":"","q":"","ans":"","p":["手","反"],"s":["樣","選"],"l":["空白線"]},{"ch":"萃取","L":"L01","title":"先說要取誰、排除誰，再選方法","ask":"溶液變乾淨，是否已知道藥品含量？","chain":"目的與基質 → 需要的選擇性 → 安排前處理 → 交給後測","why":"Extraction（萃取）把目標成分轉到可收集的另一相；sample preparation（樣品前處理）還包括溶解、過濾、去蛋白與取樣。過濾主要攔不溶粒子；萃取利用不同相的作用差異。萃取所得液仍可能有同相雜質，需以HPLC、GC-MS、滴定或比色等讀出身分與量。","ex":"Hydrocortisone acetate cream先減少油性賦形劑，才送HPLC；活體腦中Dopamine要連續取樣，則考慮微透析。","trap":"看見「微量」就無條件選SPME，或把萃取完成當成含量已知。","q":"溶液變乾淨，是否已知道藥品含量？","ans":"還沒有。含量要有後續測量與校正；乾淨與回收也須有證據。","p":["極"],"s":["樣","選","算"],"l":["分配線","空白線"]},{"ch":"萃取","L":"L02","title":"兩相會交換分子；平衡不是全部搬走","ask":"達平衡後，分子停止穿過界面了嗎？","chain":"兩相接觸 → 分子雙向轉移 → 平衡分布 → 收指定相","why":"Partition（分配）是溶質在相間的分布。平衡時兩邊仍有分子來回移動，只是整體濃度不再改變。LLE（liquid–liquid extraction，液液萃取）需可分離的兩相，不要求每個溶劑分子完全零互溶；互溶到只剩一相時不能用普通分液LLE。","ex":"水與乙醚可分層；THF與水通常混成一相，不是本題LLE的一對液相。","trap":"舊句「分子沒有移動」；把有機溶劑都當成水不溶。","q":"達平衡後，分子停止穿過界面了嗎？","ans":"沒有停止。雙向轉移仍在進行；宏觀分布維持不變。","p":["極"],"s":[],"l":[]},{"ch":"萃取","L":"L03","title":"帶電改變水合，但不是唯一決定因素","ask":"一個帶正電又有長烴鏈的分子，必定完全不被逆相保留嗎？","chain":"質子化改變 → 水合與相作用改變 → 分布傾向改變 → 選保留機制","why":"Ionized form（離子態）通常較易受水穩定；neutral form（中性態）常較容易轉入有機相或疏水表面。但中性分子也可很親水，帶電分子也可有大片疏水骨架。Ether（乙醚）本身有偶極且可接受氫鍵，不能說它只有凡得瓦力。方向由整個分子、相與條件一起決定。","ex":"Cetrimide的永久正電不能以普通酸鹼去掉；Hydrocortisone在本題常用pH範圍主要呈中性，但不是毫無極性。","trap":"「不帶電必定油溶」「逆相只抓中性」「只有pH一個開關」。","q":"一個帶正電又有長烴鏈的分子，必定完全不被逆相保留嗎？","ans":"不能如此推。電荷增加親水性，但疏水骨架及表面作用仍可能保留它。","p":["極","荷"],"s":["選"],"l":["酸鹼線","分配線"]},{"ch":"萃取","L":"L04","title":"pH要和pKa比較，不只看酸鹼標籤","ask":"弱鹼在pH=pKa−2，中性B多還是BH⁺多？","chain":"pH−pKa → 10的指數比例 → 主要形態 → 指定相中的去向","why":"Henderson–Hasselbalch equation（酸鹼比例式）給出酸的[A⁻]/[HA]與鹼的[B]/[BH⁺]。pH高於pKa，丟掉H⁺的那一態較多：酸變A⁻，鹼變B。差2代表100:1，主要態為100/101，約99%；這只說形態比例，不能直接當99%萃取率。","ex":"弱酸用有機相萃取，題本選pH=pKa−2；弱酸用陰離子交換保留，則希望pH比pKa高。","trap":"把pH7當所有藥的半解離點；把pKa±2硬套到每題。","q":"弱鹼在pH=pKa−2，中性B多還是BH⁺多？","ans":"[B]/[BH⁺]=1/100，所以BH⁺約99%。要有機相萃取中性B時，方向要反過來。","p":["荷"],"s":[],"l":["酸鹼線"]},{"ch":"萃取","L":"L05","title":"哪一相有藥，與哪一層在上是兩題","ask":"有機萃取劑換成比水重的溶劑，收有機相時一定取上層嗎？","chain":"先判分布 → 再認相身分 → 辨上下位置 → 收正確層","why":"有機相不等於上層：乙醚通常在水上，二氯甲烷與水配對通常在下。甲醇與己烷都是有機溶劑；題本的兩相操作中甲醇富集層在下，不能把下層叫水層，也不能只憑純溶劑密度保證任意混合物分層。","ex":"Hydrocortisone acetate cream的指定己烷／甲醇分配，選收甲醇層，油性基質主要走己烷層。","trap":"只記「收上層」；把兩個有機層硬說成有機相／水相。","q":"有機萃取劑換成比水重的溶劑，收有機相時一定取上層嗎？","ans":"不一定。先認相，再依實際密度辨層，不能用上／下替代相身分。","p":["極"],"s":["樣"],"l":["分配線"]},{"ch":"萃取","L":"L06","title":"換pH可洗基質；與同pH多次萃取不同","ask":"酸性Cyclizine水相洗油後，該丟水相還是乙醚洗液？","chain":"酸化留藥於水 → 有機相洗掉油 → 鹼化轉中性 → 收新有機萃取液","why":"Back-extraction（反萃取）嚴格指把已進某相的溶質再轉到另一相。舊Cyclizine例是酸性水相用乙醚洗雜質，再鹼化用新乙醚萃藥；可教作酸鹼切換清理，不表示藥必然已換邊兩次。Repeated extraction（多次萃取）則常維持同pH，用新份萃取劑逐次搬走殘留藥。","ex":"Cyclizine lactate injection：稀硫酸條件先保留水相，乙醚洗液弃；水相鹼化後用新乙醚，收乙醚相。這是舊笔記指定例，本PDF沒有該完整題。","trap":"把酸洗雜質的乙醚收起；把反萃取當成qⁿ的固定D模型。","q":"酸性Cyclizine水相洗油後，該丟水相還是乙醚洗液？","ans":"保留含帶電藥的水相，丟乙醚洗液；再鹼化水相並以新乙醚萃取目標。","p":["極","荷"],"s":["樣"],"l":["酸鹼線","分配線","空白線"]},{"ch":"萃取","L":"L07","title":"鹽析與破乳化要各自驗證","ask":"加NaCl可提高某題萃取率，是否表示所有乳液都能靠鹽破開？","chain":"界面不清／水中溶解偏高 → 試相容鹽與條件 → 靜置分層並測回收 → 選處理","why":"Emulsion（乳化）是互不相溶液體的細滴被界面活性成分穩定，妨礙分層。Salting out（鹽析）使某些溶質在水中的活度係數上升、溶解度下降，因而偏向另一相。「鹽搶走自由水」只作水合直覺，不能用來計算，也不能保證所有溶質或乳液均同方向。","ex":"108-2 #40選加入NaCl至飽和；酸性目標若反而加鹼變A⁻，往有機相的傾向通常下降。","trap":"以酒精破乳而把兩相混成一相；把飽和鹽當保證100%回收。","q":"加NaCl可提高某題萃取率，是否表示所有乳液都能靠鹽破開？","ans":"不是。需看基質、鹽、溶劑與濃度，確認分層並檢查回收。","p":["極","元"],"s":["樣","算"],"l":["分配線","標準曲線線","保留線"]},{"ch":"萃取","L":"L08","title":"SPE先選抓藥還是抓雜質的模式","ask":"若表面抓的是雜質，能否把上樣流出液一律倒掉？","chain":"選表面作用 → 配上樣條件 → 決定收集段 → 檢查容量與回收","why":"Solid-phase extraction（SPE，固相萃取）把填料置於小管柱或其他裝置，利用疏水、極性、離子交換或親和作用分離。填充床由多孔frit（篩板）支撐，材料可為聚合物等，不是「膠體夾住粉末」的通則。保留藥模式最後收沖提液；流穿模式則上樣流出液就是目標。","ex":"本題本四步SPE多採保留藥模式；若專門用吸附劑攔油脂、讓藥流穿，就要收上樣流出液。","trap":"SPE只能在LLE不適用時用；每種SPE都濃縮或只吸附中性物。","q":"若表面抓的是雜質，能否把上樣流出液一律倒掉？","ans":"不能。那可能是目標檢品；收集段由方法設計決定。","p":["極"],"s":["樣","算"],"l":[]},{"ch":"萃取","L":"L09","title":"四步的先後由任務推出，不由編號背","ask":"為什麼先washing、再loading不合本題的去雜質目的？","chain":"先潤濕平衡 → 上樣保留目標 → 洗基質仍留目標 → 改條件沖提收目標","why":"Conditioning（活化）準備可重現的表面；equilibration（平衡）把溶劑／pH調到能上樣。常見矽膠逆相先以甲醇潤濕，再以水或緩衝液平衡，不能只用強沖提液洗完就直接上水樣。樣品尚未加入時不可能把樣品雜質洗掉；washing（洗滌）才處理上樣帶入的干擾。","ex":"110-1題的①是conditioning、④是sample loading，所以序列①④②③；不是用平日自編1–4去猜選項。","trap":"把conditioning當washing；把舊5–10床體積寫成所有產品規範。","q":"為什麼先washing、再loading不合本題的去雜質目的？","ans":"樣品尚未上樣，沒有那批樣品雜質可洗；先準備表面，再上樣、洗與沖提。","p":["極"],"s":["選"],"l":["分配線","空白線"]},{"ch":"萃取","L":"L10","title":"找失落藥物，要查上樣、洗液、沖提液三段","ask":"藥已在washing廢液中，再用更強eluting能救回它嗎？","chain":"分段收集後測 → 確認流穿或洗失 → 調容量／流速／洗力 → 驗證回收","why":"Breakthrough（穿透）可因容量不足、接觸太短或上樣溶劑太強；wash loss（洗失）是洗液已把目標帶出；elution不足則藥還留在床內。濃縮要載入較大體積、以較小體積收藥且回收足夠，不是管柱小就一定濃縮。","ex":"負壓太大讓溶液急流，改小流速並驗證；洗液出現藥時，先降低洗力，不能只加長沖提時間。","trap":"一律把低峰面積歸咎不可逆吸附；四步所有流出液都倒掉。","q":"藥已在washing廢液中，再用更強eluting能救回它嗎？","ans":"救不回已丟掉的那段。先辨損失位置、保留可疑分段並修正洗滌。","p":["極"],"s":["選","算"],"l":["分配線"]},{"ch":"萃取","L":"L11","title":"逆相以疏水作用保留；pH與有機比例共同決定","ask":"中性Hydrocortisone黏住C18，要靠什麼讓它沖下來？","chain":"降低水中親和／保留 → 溫和洗基質 → 提高有機比例或改形態 → 沖提目標","why":"Reversed-phase SPE（逆相SPE）用低極性表面保留較疏水部分，C18是常見例。對同一弱鹼，上樣／洗時較高pH常增加中性態，沖提時酸化加甲醇可減弱保留；弱酸方向相反。中性Hydrocortisone不能靠普通pH切換，需改溶劑作用。帶電而骨架疏水的藥仍可能被保留。","ex":"Chlorpromazine題：稀氨水load與wash、稀磷酸甲醇elute；Propranolol題wash10.0／elute2.0，pH10並非99%中性。","trap":"逆相「只抓中性」；把低極性沖提硬背成任何非極性溶劑都有效。","q":"中性Hydrocortisone黏住C18，要靠什麼讓它沖下來？","ans":"提高相容有機溶劑的沖提強度等改變相互作用，而非靠普通pH把它變離子。","p":["極"],"s":["選"],"l":["分配線","空白線"]},{"ch":"萃取","L":"L12","title":"pH方向對，仍可能傷到矽膠或藥","ask":"1M NaOH不適合題本矽膠SPE，是因為藥不帶電嗎？","chain":"條件與基材 → 溶解／附加吸附風險 → 選相容操作 → 後測回收","why":"Silica gel（矽膠）在強鹼下可溶解／破壞；1M NaOH是題本不合適的溶液。不是「酸中和矽膠所以任何酸都安全」。Silanol（矽醇基）未完全遮蔽時可對胺類產生額外作用，尤其其帶負電時對帶正電胺造成保留與難沖提；聚合物材料的耐受可能不同。","ex":"Aspirin鹼化有利其離子化並可能促進水解；題本pH選擇只給方向，不能取代藥品穩定性試驗。","trap":"把「強鹼不安定」推成所有填料不能用任何鹼；只顧pH不顧藥水解。","q":"1M NaOH不適合題本矽膠SPE，是因為藥不帶電嗎？","ans":"不是。主要考基材對強鹼不安定，和目標形態是兩件事。","p":["極","荷","元"],"s":["樣","算"],"l":["保留線"]},{"ch":"萃取","L":"L13","title":"離子交換的名字說抓誰；表面電荷與名字相反","ask":"酸性水中的高極性弱鹼，先考慮哪種交換器？","chain":"先定藥電性 → 配相反表面 → 置換對離子 → 選擇性保留","why":"Cation exchange（陽離子交換）交換並保留陽離子，表面固定負電；anion exchange（陰離子交換）保留陰離子，表面固定正電。弱鹼用陽離子交換時pH低於其BH⁺的pKa，使BH⁺多；弱酸用陰離子交換時pH高於pKa，使A⁻多。永久離子可用交換，不必先可酸鹼中和。","ex":"Methicillin的酸性基團在較高pH為陰離子；Adrenaline的胺在較低pH質子化，配陽離子交換。","trap":"把陽離子交換表面畫成正電；把逆相pH設計直接搬過來。","q":"酸性水中的高極性弱鹼，先考慮哪種交換器？","ans":"弱鹼多為BH⁺，考慮固定負電的陽離子交換器；還需相容pH與容量。","p":["極","荷"],"s":["選"],"l":["酸鹼線","分配線"]},{"ch":"萃取","L":"L14","title":"平衡離子是在讓位；不是所有氯鹽都不能用","ask":"NaCl在陽離子與陰離子交換中，分別哪個離子直接競爭位置？","chain":"準備對離子形式 → 配低競爭上樣條件 → 藥置換對離子 → 保留目標","why":"Counterion（對離子）先佔在交換位置，目標進來才交換。對陽離子交換，NaCl提供的Na⁺是題本適當單價對離子；Cl⁻不是此處被交換的那一種。對陰離子交換，Cl⁻才是相關對離子。不能由NaCl名稱就說所有交換管一律不能用。","ex":"113-1 #37在NaCl、CaCl₂、MgBr₂、CuSO₄間選NaCl；113-2 #31含Ca²⁺、Mg²⁺平衡敘述為錯。","trap":"把離子親和性寫成永遠固定順序；把Cl⁻的陰離子管例套到陽離子管。","q":"NaCl在陽離子與陰離子交換中，分別哪個離子直接競爭位置？","ans":"陽離子管看Na⁺；陰離子管看Cl⁻。樹脂固定電荷決定哪種對離子有關。","p":["荷","元"],"s":["選"],"l":["分配線"]},{"ch":"萃取","L":"L15","title":"離子交換沖提可競爭，也可關掉有效電荷","ask":"高pH中的OH⁻若把陰離子交換上的酸性藥沖出，是因酸變中性嗎？","chain":"提高競爭或改電荷 → 減弱有效交換 → 目標釋放 → 收沖提液","why":"加入高濃度同類電荷離子可競爭位置；也可調pH減少可解離藥的電荷。固定負電的陽離子交換上，弱鹼可用較高pH減少BH⁺；固定正電的陰離子交換上，弱酸可用較低pH減少A⁻。弱交換基本身也可關掉電荷，方向另判。「結合強度×濃度」只是直覺，不是可代入的沖提力定律。","ex":"Adrenaline用1M NH₄Cl，靠NH₄⁺競爭；Methicillin題用1M NaCl，靠Cl⁻競爭。鹽太高的沖提液若接MS，需再處理相容性。","trap":"以有機溶劑取代所有離子競爭；以OH⁻沖弱酸誤當讓弱酸中性。","q":"高pH中的OH⁻若把陰離子交換上的酸性藥沖出，是因酸變中性嗎？","ans":"不是。弱酸在高pH更易成A⁻；若沖出，需考慮競爭離子或弱交換基失電等機制，不能混成抑制酸解離。","p":["極","荷"],"s":["選"],"l":["酸鹼線","分配線"]},{"ch":"萃取","L":"L16","title":"正相抓極性作用；材質名稱不唯一決定模式","ask":"Aminopropyl在帶正電條件下抓A⁻，主導選擇性應稱什麼？","chain":"非極性介質上樣 → 極性作用保留 → 改相容溶媒強度 → 沖提極性目標","why":"Normal-phase SPE（正相SPE）常以氫鍵、偶極等作用保留極性溶質，再增加適合的溶媒沖提力。裸矽膠就可作正相，不是一定先修飾才叫極性矽膠。Diol、Aminopropyl是極性鍵結例；Aminopropyl在某些pH也能作弱陰離子交換，所以模式須由條件與主導作用判斷。","ex":"從己烷類介質中取出極性成分可考慮正相；水相中已帶正電的小弱鹼，題本以陽離子交換更合條件。","trap":"極性大只能用矽膠；凡Aminopropyl都只作正相。","q":"Aminopropyl在帶正電條件下抓A⁻，主導選擇性應稱什麼？","ans":"可能是陰離子交換；不能只由修飾基名字判作正相。","p":["極"],"s":["樣","選"],"l":["分配線"]},{"ch":"萃取","L":"L17","title":"Borate gel辨的是可配位二醇，不是蛋白質名字","ask":"Adrenaline能用陽離子交換，也能用硼酸膠，是否矛盾？","chain":"二醇與硼酸位點 → 可逆親和結合 → 改條件釋放 → 糖化／未糖化訊號","why":"Boronate affinity（硼酸親和）利用適當cis-Diol（順式二醇）等與硼酸基形成可逆結合。Catechol（兒茶酚）的鄰二酚亦可提供配位；具體保留受pH與幾何影響。HbA1c屬糖化血紅蛋白，不是血清蛋白；硼酸親和方法可保留其他糖化血紅蛋白，須以方法校正報告HbA1c，不能說只抓一種變體。","ex":"103-1 #33四選項中選Borate gel；Dopamine、Adrenaline均有Catechol，同時也可有酸鹼交換把柄。","trap":"只要任意兩個OH就一定黏；把HbA1c解釋成血清蛋白糖化。","q":"Adrenaline能用陽離子交換，也能用硼酸膠，是否矛盾？","ans":"不矛盾。前者認帶正電胺，後者認鄰二酚結構；條件與把柄不同。","p":["量","荷"],"s":[],"l":[]},{"ch":"萃取","L":"L18","title":"親和認結構；RAM先限大分子，再保留小分子","ask":"RAM讓蛋白過不去孔內，是否代表所有小分子都同樣留下？","chain":"選匹配辨識／排除表面 → 保留目標而排基質 → 洗滌沖提 → 後續分析","why":"Immunoaffinity（免疫親和）以固定抗體辨識匹配抗原，也能用於有合適抗體的小分子；不是小分子一律禁用。Restricted access material（RAM，限制進入材料）常以親水外表面減少蛋白吸附、孔徑限大分子，內部疏水表面保留小分子。它合併尺寸與表面作用，不只是單一篩子。","ex":"題本高極性弱鹼只給電荷線索、未給匹配抗體，所以選陽離子交換；RAM可用於相容生物樣品的線上淨化。","trap":"沒有抗體配對就猜免疫親合；只要分子小就保證RAM留住。","q":"RAM讓蛋白過不去孔內，是否代表所有小分子都同樣留下？","ans":"不代表。小分子還要與孔內表面有足夠作用；選擇性不只有尺寸。","p":["量","極"],"s":["選"],"l":["分配線","空白線"]},{"ch":"萃取","L":"L19","title":"永久離子不必去電荷；可找疏水配對夥伴","ask":"1個單價陽離子和1個單價陰離子配對，電荷消失了嗎？","chain":"加反電荷夥伴 → 形成可萃離子對 → 有機相轉移 → 後測與校正","why":"Ion-pair extraction（離子配對萃取）讓異號離子共同轉移，常藉疏水對離子提升有機相分布。各離子的形式電荷仍在，沒有因配對而把四級銨變成三級胺；淨電荷抵消也不自動保證可溶。Cetrimide氮有四個有機取代基，普通pH不能靠去質子讓它中性。","ex":"舊筆記固定配對Cetrimide＋Bromocresol purple；乙醯化Taurine＋Tetrabutyl ammonium sulphate。配對試劑名稱需記，不能由電性唯一推出。","trap":"永久陽離子只能離子配對、不能SPE；有色染料一定無需空白。","q":"1個單價陽離子和1個單價陰離子配對，電荷消失了嗎？","ans":"形式電荷未消失，整對淨電荷為0；有機相分布仍需夥伴疏水性與方法條件。","p":["極","荷"],"s":["算"],"l":["分配線","空白線"]},{"ch":"萃取","L":"L20","title":"衍生化改共價結構，定量要連反應效率一起算","ask":"標準反應100%、樣品只50%，能直接用標準校正原藥量嗎？","chain":"選性質缺口 → 共價反應生成衍生物 → 合適轉移／偵測 → 匹配標準定量","why":"Derivatization（衍生化）可改極性、揮發性或偵測響應。它與酸鹼形態、非共價離子配對不同，但有些衍生物可水解或反應可逆，不是化學上全都回不去。反應不完全且標準與檢品不一致，會使定量偏差；本附件未附完整產物結構，不推定Adrenaline哪些OH／N全被乙醯化。","ex":"舊筆記Adrenaline注射液＋Acetic anhydride水相乙醯化；111-2 SPME題把Ketamine衍生化作可提高GC處理性的選項。","trap":"看到有OH就任意画完全乙醯化產物；反應收率與萃取回收混為一談。","q":"標準反應100%、樣品只50%，能直接用標準校正原藥量嗎？","ans":"不能直接套用。反應效率不同會造成偏差，需控制或驗證匹配反應與校正。","p":["反"],"s":["樣","算"],"l":["分配線","保留線"]},{"ch":"萃取","L":"L21","title":"SFE用加壓流體取出成分，還須收集與後測","ask":"流體減壓後氣化，是否可直接宣稱藥沒有損失？","chain":"選T／P／組成 → 基質溶解與傳質 → 受控減壓捕集 → 後測量與回收","why":"Supercritical fluid extraction（SFE，超臨界流體萃取）以加壓CO₂等流體溶解／搬運目標。固定溫度且其餘相容時，增壓常提高密度、改善某些溶質溶解；溫度同時改變時不只有此效應。Methanol或Ethanol常用來增強較極性成分的轉移；這是111-1題的常用配對，不能外推其他溶媒在所有SFE中都毫無意義。","ex":"舊Vitamin A／Vitamin E及部分酯類案例；低熱負荷、較少氧接觸是可能優點，不保證無氧、無降解或100%回收。","trap":"CO₂減壓消失就代表分析物全收好；把SFE當SFC的分析分離柱。","q":"流體減壓後氣化，是否可直接宣稱藥沒有損失？","ans":"不能。目標可能沉積、逸散或收集不全；需捕集與回收證據，再以後測定量。","p":["揮"],"s":["樣","算"],"l":["空白線","保留線"]},{"ch":"萃取","L":"L22","title":"微透析量到灌流液；組織游離濃度需回收校正","ask":"把灌流速度改快，還能直接沿用原相對回收嗎？","chain":"游離分子擴散過膜 → 灌流液帶走 → 分時收集後測 → 以相對回收解讀","why":"Microdialysis（微透析）讓可通膜的游離小分子沿濃度差進入灌流液。蛋白結合的複合物通常難通小分子膜，故偏向取游離部分；小分子干擾仍可能通過。流速、膜面積、擴散、吸附與時間皆影響relative recovery（相對回收）。連續收集不等於每一秒即時讀出；植入可影響局部組織。","ex":"題本活體腦中Dopamine連續監測選微透析；如果採得透析液8nM、零目標入口且已校正相對回收0.4，估游離組織濃度20nM。","trap":"把透析液濃度當組織總濃度；說只受分子大小影響、完全不傷組織。","q":"把灌流速度改快，還能直接沿用原相對回收嗎？","ans":"不能。接觸與濃度接近平衡程度可能改變，需在相容新條件校正。","p":["極"],"s":["源","算"],"l":[]},{"ch":"萃取","L":"L23","title":"SPME取一部分到塗層；頂空與直接浸入都可","ask":"將纖維直接浸入尿液，是否就不是SPME？","chain":"直接浸入／頂空 → 分配或吸附至塗層 → 熱／溶劑脫附 → 儀器校正","why":"Solid-phase microextraction（SPME，固相微萃取）常為非耗盡取樣，只帶走分配到塗層的一部分。PDMS（Polydimethylsiloxane）液態樣塗層偏吸收／分配，固體型塗層可偏吸附；不能說抓放化學全與填床SPE完全一樣。DI-SPME直接浸液；HS-SPME頂空需成分能進氣相。GC常熱脫附，LC可用溶劑脫附，不只可接GC-MS。","ex":"尿液Ketamine的SPME–GC-MS題，錯的是「只適用頂空」；改成DI仍需避免基質污染塗層並匹配校正。","trap":"塗層上的量等於樣品總量；體積小表示100%萃取；全流程永不用任何溶劑。","q":"將纖維直接浸入尿液，是否就不是SPME？","ans":"仍是DI-SPME。頂空與直接浸入是兩個取樣模式；量的解讀依塗層分布與校正。","p":["極","揮"],"s":["樣","算"],"l":["分配線"]},{"ch":"萃取","L":"L24","title":"分配比是濃度比；總量還要乘體積","ask":"若Va相同，D或Vo變大，q應變大還變小？","chain":"D與體積 → 各相質量 → 水相殘留比例q → 萃取量與次數","why":"Distribution ratio（分配比）D=cₒ,total/cₐ,total；partition ratio（指定形態分配比）本章寫K=cₒ,neutral/cₐ,neutral。若兩相體積不同，D=4不代表有機相總量是水相4倍。以質量守恆得q=Vₐ/(Vₐ+D Vₒ)，固定D、每次新份等量溶劑，n次殘留qⁿ。","ex":"D=4、Vₐ=100mL、Vₒ=25mL時，兩相量比4×25:100=1:1，單次萃取50%，不是80%。","trap":"把logP或K直接當任意pH的D；同總溶劑量比較卻增加用量。","q":"若Va相同，D或Vo變大，q應變大還變小？","ans":"分母變大，q變小，萃取比例1−q變大；前提是D模型與相態保持相容。","p":["極"],"s":["樣","算"],"l":["分配線"]},{"ch":"萃取","L":"L25","title":"濃縮看濃度；回收看量，兩者可以同時升降","ask":"若回收只有50%，但體積縮成原來1/10，濃度可升幾倍？","chain":"訊號校正成c → cVDF還原量 → 對原有／加標量 → 回收與濃縮分開報","why":"Recovery（回收率）以量比判；concentration factor（濃縮倍數）以相容濃度比判。若初量c₀V₀、回收分率R、終體積Vf，則cf/c₀=R V₀/Vf。加標回收用(m加標後−m原樣)/m加入，不能把原有量也當回收到的加標。LC-MS尚需分辨提取回收與基質響應，單一加標結果不是所有效應都已分開。","ex":"20mL水樣含40µg，收回32µg、定容2mL：回收80%、終濃度16µg/mL、濃縮8倍。","trap":"樣品小瓶濃度高就判回收好；再除回收率補正卻沒有驗證依據。","q":"若回收只有50%，但體積縮成原來1/10，濃度可升幾倍？","ans":"5倍；0.5×10=5。濃縮並不能證明沒有失藥。","p":["極"],"s":["算"],"l":[]},{"ch":"萃取","L":"L26","title":"內標可以抵消匹配損失，不能找回失去的藥","ask":"內標在萃取完成後才加，能補償已發生的不可逆吸附嗎？","chain":"先加匹配內標 → 共同經前處理 → 訊號比校正 → 評估偏差與精密度","why":"Internal standard（內標準品）若與目標各損失同一分率，比值可能維持，能補償某些操作與回收差異；它本身不降低吸附或提高物理回收，也不必直接告訴你絕對損失多少。加入在萃取後，只能補償之後某些進樣／偵測差異，補不了之前失去的藥。","ex":"自編例：校正比A藥/A內標=2×m藥/m內標；共同只剩60%時比值仍合，藥50%、內標100%時比值會偏低。","trap":"任意內標都能補全部損失；以內標結果宣稱回收100%。","q":"內標在萃取完成後才加，能補償已發生的不可逆吸附嗎？","ans":"不能。它沒經歷該損失，無法形成匹配比值補償。","p":["極","整"],"s":["樣","算"],"l":["分配線","標準曲線線"]},{"ch":"萃取","L":"L27","title":"品質不合格才回查；先定位原因再重做","ask":"同一樣品峰變小，第一句能否直接說不可逆吸附？","chain":"異常證據 → 分辨基質／損失／計算 → 修正對應站 → 再驗證後報告","why":"乳化在兩液相操作妨礙分層；SPE則可能穿透、洗失或強吸附。更強或系列沖提可改善尚可解吸的留藥，不保證挽回真正不可逆結合。112-2 #10官方D是考題答案，不能因此把化學上的不可逆重新定義。回收率、純度與靈敏度不同，也不能斷言SPE一定比LLE好。","ex":"讀到小峰，先查校正與各段，不能直接診斷吸附；更強沖提仍無藥要查降解、容器吸附、上樣丟失等。","trap":"SPE沒有乳化就保證無基質干擾；紅回線畫成分子自行循環。","q":"同一樣品峰變小，第一句能否直接說不可逆吸附？","ans":"不能。先用空白、標準、分段回收與條件紀錄定位，才修正相應步驟。","p":["極"],"s":["樣","算"],"l":["空白線","解析度線"]},{"ch":"層析概論","L":"L01","title":"為什麼同時進樣的成分會先後流出？","ask":"為什麼同時進樣的成分會先後流出？","chain":"兩相／可進入體積不同 → 平均遷移速度不同 → 流出時間不同。","why":"移動相 mobile phase 帶樣品往前，固定相 stationary phase 留在原處；分子反覆接觸兩相，作用或可進入路徑的差異累積成不同遷移速度。並不是每種層析都由同一種化學吸附造成。","ex":"共同通過時間 1 min；A 平均多延遲 2 min、B 多延遲 6 min，故在 3、7 min 流出。","trap":"","q":"","ans":"","p":["極"],"s":["樣"],"l":[]},{"ch":"層析概論","L":"L02","title":"峰的位置、面積與寬度各回答什麼？","ask":"峰的位置、面積與寬度各回答什麼？","chain":"辨時間／面積／寬度 → 對應保留／量／展寬 → 只回答有資料的問題。","why":"chromatogram（層析圖）橫軸通常是時間，縱軸是偵測訊號。峰頂位置、整組峰面積和峰寬是不同量；位置晚並不代表量多。","ex":"A、B 面積 12000、15000，能說 B 訊號積分較大；缺少各自 response factor（響應因子）與校正，不能直接說 B 濃度較大。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"層析概論","L":"L03","title":"不用固定相保留，也要走多久？","ask":"不用固定相保留，也要走多久？","chain":"未保留標記／V₀ → t₀=V₀/F → 提供共同基準。","why":"hold-up time（未保留時間）記為 t₀；不與固定相保留也需要時間通過流路。hold-up volume（未保留體積）V₀ 乘／除體積流量即可換成時間。IUPAC 常用 tM、VM；本題本用 t₀、V₀。","ex":"V₀=3 mL、F=1.5 mL/min；3÷1.5=2 min。mL÷(mL/min)=min。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"層析概論","L":"L04","title":"怎樣把額外延遲變成無單位的保留量？","ask":"怎樣把額外延遲變成無單位的保留量？","chain":"總保留扣共同基準 → 除以基準 → k′ 與 tR=t₀(1+k′)。","why":"retention factor（保留／滯留因子）k′ 是「額外延遲占基準多少倍」。capacity factor（容量／容積因子）是題本舊稱；IUPAC 建議 k，本章保留 k′ 方便對題。","ex":"t₀=1 min、tR=7 min：先扣 1 得 6 min，再除 1 min，k′=6。回推 tR=1×(1+6)=7 min。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"層析概論","L":"L05","title":"相間偏好相同，保留因子就相同嗎？","ask":"相間偏好相同，保留因子就相同嗎？","chain":"K=cS/cM → k′=KVS/VM → VR=VM+KVS。","why":"distribution constant（分配常數）K 是濃度比；保留因子是平衡時兩相中分析物「量」的比。量=濃度×體積，所以固定相放得多，也可能保留得久。","ex":"K=6、VS=0.5 mL、VM=2 mL：k′=6×0.5/2=1.5；VR=2+6×0.5=5 mL。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"層析概論","L":"L06","title":"兩個成分的相對保留應怎樣比較？","ask":"兩個成分的相對保留應怎樣比較？","chain":"各扣 t₀／V₀ → 後出保留÷先出保留 → α。","why":"比較的是固定相造成的相對保留，不是兩個總時間直接相除。相體積比相同的線性分配模型中，也可由 K₂/K₁ 得 α。","ex":"V₀=1.1、V₁=5.1、V₂=9.1 mL：8/4=2；不是 9.1/5.1。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":["分配線","歸一線"]},{"ch":"層析概論","L":"L07","title":"峰頂有距離，為什麼還可能重疊？","ask":"峰頂有距離，為什麼還可能重疊？","chain":"峰距÷平均峰寬 → Rs → 核對分離判準。","why":"把兩峰距離和平均寬度比，才知道寬峰是否彼此侵入。增加距離或縮窄峰均可能增加解析度。","ex":"tR=5、8 min，W=0.4、0.8 min：2×3/1.2=5；將小數同乘 10，60/12=5。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":["解析度線"]},{"ch":"層析概論","L":"L08","title":"只看一個峰，怎樣表示相對展寬？","ask":"只看一個峰，怎樣表示相對展寬？","chain":"tR÷同種峰寬 → 平方×係數 → N。","why":"plate（理論板）是模型中的平衡階段，不是真實隔板。N=(tR/σt)²，若切線基線寬 W=4σt，係數就是 16；半高寬約 2.355σt，平方後為 5.54。","ex":"tR=5、W=0.25 min：5÷(1/4)=20；20²=400；16×400=6400。","trap":"","q":"","ans":"","p":["極"],"s":[],"l":["解析度線"]},{"ch":"層析概論","L":"L09","title":"比較總板數，還是每單位長度的品質？","ask":"比較總板數，還是每單位長度的品質？","chain":"辨總效能／柱品質 → H=L/N 或 N/L → 同基準比較。","why":"N 是整支柱的板數；H 是每一理論板平均占的柱長。長柱可有較大總 N，卻不代表每單位長度更有效。","ex":"A：10 cm、20000；B：12 cm、30000。N/L 分別 2000、2500 plates/cm；B 的 H 較小。","trap":"","q":"","ans":"","p":["極"],"s":[],"l":[]},{"ch":"層析概論","L":"L10","title":"增加哪個參數，才對分離有幫助？","ask":"增加哪個參數，才對分離有幫助？","chain":"三因子模型 → 衡量分離收益與時間 → 選合適條件。","why":"N 控制相對峰寬，α 控制相對保留差；k′ 太小易靠近未保留區，過大則增加時間但分離收益趨平。","ex":"只增 N 四倍，其他相同，Rs 約兩倍；α=1 時再增 N 也不產生兩個峰頂距離。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":[]},{"ch":"層析概論","L":"L11","title":"加長管柱與加快流量，改變的是哪個量？","ask":"加長管柱與加快流量，改變的是哪個量？","chain":"體積／時間同比例縮放 → 保留比值核對 → 分開時間與效率。","why":"加長等於增加同樣材料的路程；加快流量是較快走過同樣保留體積。時間與體積可先算，但效率仍要看展寬模型。","ex":"原 tR=7、11 min，改為 3.5、5.5 min；時間都一半，F 由 1 變 2 mL/min。","trap":"","q":"","ans":"","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"層析概論","L":"L12","title":"同一成分的分子，為什麼到達時間不同？","ask":"同一成分的分子，為什麼到達時間不同？","chain":"走路／前後擴散／交換不同步 → 到達時間分散 → 峰變寬。","why":"eddy diffusion（渦旋／多路徑效應）是分子走路不同；longitudinal diffusion（縱向擴散）沿柱軸前後散開；mass-transfer resistance（質量轉移阻力）是跨相／相內交換來不及同步。","ex":"太慢會給縱向擴散更多時間；太快可能來不及平衡。細而均勻的填充可減少路徑差異。","trap":"","q":"","ans":"","p":["極"],"s":[],"l":[]},{"ch":"層析概論","L":"L13","title":"為什麼流速有最佳點，而非越快越好？","ask":"為什麼流速有最佳點，而非越快越好？","chain":"B/u 隨 u 降、Cu 隨 u 升 → H 的最低點 → 選適當 u。","why":"H=A+B/u+Cu 把三種不同步相加。A 在簡式中近似不隨 u 改變，B/u 太慢時大，Cu 太快時大；最佳點是兩種相反效應的平衡。","ex":"自編 B=9 mm²/s、C=4 s：uopt=√(9/4)=3/2 mm/s；用平方驗算，不需微分。","trap":"","q":"","ans":"","p":["元"],"s":[],"l":[]},{"ch":"層析概論","L":"L14","title":"顆粒、膜厚、溫度與擴散怎樣影響展寬？","ask":"顆粒、膜厚、溫度與擴散怎樣影響展寬？","chain":"定位受影響的展寬項 → 判 H 的方向 → 決定 N 與操作。","why":"細粒與均勻填充縮短路徑與交換距離；薄膜縮短擴散距離。適度升溫常降低黏度、加快質傳，但也可改保留與選擇性。Dm 小減少縱向擴散，卻使移動相質傳變慢，總效應不能只看一項。","ex":"df 兩倍、其他不變，CS∝df²/Ds 使 CS 四倍；這不是 N 四倍。","trap":"","q":"","ans":"","p":["極"],"s":[],"l":["溫度線"]},{"ch":"層析概論","L":"L15","title":"峰寬相同，為什麼左右仍可能不對稱？","ask":"峰寬相同，為什麼左右仍可能不對稱？","chain":"先確認量測高度及定義 → 算 5% T 或 10% AF → 判峰形並回查。","why":"本章把題本 5% 因子寫成 T₅=As=W₀.₀₅/(2f)。它比較完整寬與兩倍前半寬；對稱為 1，後側較長為 >1。常見 10% asymmetry factor（不對稱因子）AF₁₀=b₁₀/a₁₀ 是另一量法。","ex":"W₀.₀₅=0.5、f=0.2 min：0.5/(2×0.2)=5/4=1.25，為拖尾。這份資料不能算 AF₁₀。","trap":"","q":"","ans":"","p":["極"],"s":["算"],"l":["解析度線"]},{"ch":"層析概論","L":"L16","title":"分離方法與偵測方法，能支持哪種結論？","ask":"分離方法與偵測方法，能支持哪種結論？","chain":"先定目標 → 選分離與偵測配置 → 比對參考／校正 → 限定結論。","why":"HPLC、GC、TLC 先以不同遷移分離成分；各有相容檢品與讀數。ESI 是 electrospray ionization（電灑游離）介面，MS 是離子讀出，不是新增一段層析固定相。AES 的元素訊號通常不足以確認特定有機西藥分子。","ex":"摻偽題選不能確認的 AES；LC-ESI 題選 0.21 cm=2.1 mm。後者與低流量相容有關，仍須查實際介面、溶劑及系統體積。","trap":"","q":"","ans":"","p":["極"],"s":["選","算"],"l":[]},{"ch":"TLC","L":"L01","title":"溶劑為什麼會走，點樣線為什麼不能浸水","ask":"溶劑為什麼會走，點樣線為什麼不能浸水？","chain":"溶劑潤濕細孔 → 毛細作用使前緣推進 → 成分隨相間作用分開。","why":"表面張力與液體對固體的潤濕，讓溶劑在細小孔隙中前進。吸附主要用來說明分析物與表面作用，不是這題問的移動相推動方式。","ex":"起始線離板底1.5 cm，槽內液面0.5 cm：線在液面上方，可以展開。若液面升到2 cm，應先降低液面。","trap":"本章普通TLC以毛細作用展開；上升是常見配置，另可採下降或水平配置。特殊加壓方法不在本題範圍。","q":"液面淹過點樣線，還能直接量一個可靠Rf嗎？","ans":"不能。檢品可能先溶進槽中，輸入已改變；回M02調液面、重新受控點樣與展開。","p":["極"],"s":["樣"],"l":[]},{"ch":"TLC","L":"L02","title":"Rf 的兩段距離都從哪裡量","ask":"Rf 的兩段距離都從哪裡量？","chain":"斑點中心距離a、前緣距離b → 同單位相除a/b → 得到無單位Rf。","why":"Retardation factor（比移值）是距離比的定義。兩段都由同一條起始線量起；分子量斑點中心，不量上緣或下緣。","ex":"從起始線量，斑點4 cm、前緣8 cm：Rf=4/8=1/2=0.50。","trap":"b>0，距離採同單位；前緣需在乾燥前及時標記。不同條件的Rf不能當固定常數。","q":"起始線離板底1 cm；斑點5 cm、前緣9 cm都以板底為座標，Rf多少？","ans":"a=5−1=4 cm；b=9−1=8 cm；Rf=4/8=0.50。","p":["極"],"s":["算"],"l":["分配線","歸一線","保留線"]},{"ch":"TLC","L":"L03","title":"相同 Rf 能支持什麼，不能直接證明什麼","ask":"相同 Rf 能支持什麼，不能直接證明什麼？","chain":"同條件比位置與訊號 → 檢查是否相符 → 交出限於本試驗的支持結論。","why":"一個位置是一條線索。兩個不同分子可能在同條件停在同位置；一個可見斑點也可能包含兩種成分。","ex":"檢品斑點Rf=0.50，參考品也0.50，顯色相符：支持相符；仍可能有其他成分共同移行。","trap":"須有適當參考品、足夠分離及指定判準。更換溶劑、板、水分或溫度會改Rf。","q":"兩個斑點都Rf=0.54，是否一定是同一個藥？","ans":"不是。只能說在此條件共同移行；可換選擇性、做2D-TLC或取得另一種鑑別證據。","p":["極"],"s":["算"],"l":["分配線","歸一線","溫度線"]},{"ch":"TLC","L":"L04","title":"矽膠上誰跑得短，先比與表面的作用","ask":"矽膠上誰跑得短，先比與表面的作用？","chain":"與極性矽膠作用較強 → 被保留較多 → 移動距離通常較短 → Rf較小。","why":"Normal-phase TLC（正相薄層層析）常用極性矽膠。表面的silanol（矽醇）位置可與分析物氫鍵或其他極性作用；受作用較多時，較少隨溶劑前進。","ex":"題給極性Y>Z>X，矽膠與適當同一溶劑：Rf通常X>Z>Y。","trap":"同一固定相與展開液，並採題給的可比極性簡化。pH、鹽、特定吸附與溶解度可能改變排序。","q":"同板P比Q更受矽膠保留，誰的Rf較小？","ans":"P。與固定相作用較強→受保留較多→跑得短→Rf較小。","p":["極"],"s":["選","算"],"l":["酸鹼線","分配線","保留線"]},{"ch":"TLC","L":"L05","title":"液態石蠟塗層為什麼讓疏水者留得多","ask":"液態石蠟塗層為什麼讓疏水者留得多？","chain":"非極性液態石蠟成為保留相 → 疏水者較偏向此相 → 移動較短 → Rf較小。","why":"Reversed-phase TLC（逆相薄層層析）用較非極性的固定相。這題真正決定方向的是液態石蠟；Kieselguhr是承載材料，不能只看到矽藻土就套正相口號。","ex":"CH19以液態石蠟塗層、乙酸展開：四選項中Stearic acid的Rf最小。","trap":"只在可比較的同系統採疏水性方向。由正相改逆相不保證任意一組化合物全數恰好反序。","q":"同類飽和脂肪酸C18與C12在此非極性系統，通常誰較受保留？","ans":"C18通常較疏水、較偏向非極性固定相，Rf較小；仍須固定其他條件。","p":["極"],"s":["選","算"],"l":["分配線"]},{"ch":"TLC","L":"L06","title":"比較藥物時，先看電荷與可作用的部位","ask":"比較藥物時，先看電荷與可作用的部位？","chain":"先辨電荷／氫鍵部位 → 再看酯化與碳骨架 → 比表面作用 → 預測Rf。","why":"用可見表格記共同部分與差異，不靠腦中想像。胺基酸都有共同主鏈，要比側鏈；題中Serine多OH。類固醇題Hydrocortisone sodium phosphate帶可解離磷酸鹽，通常更受極性系統保留。","ex":"Serine側鏈多一個OH；題指定矽膠與混合展開液時，四胺基酸中它Rf最小。","trap":"看實際解離、可接觸部位與整個分子；官能基不能排成無條件總排名。Hydrocortisone acetate是21位OH酯化，不是舊v2所寫17位。","q":"Hydrocortisone與其acetate在本題矽膠系統，哪個通常跑得高？","ans":"Hydrocortisone acetate通常跑得較高：21位OH酯化後減少一個供氫位置，題條件下較少受矽膠保留；不由此推出所有分子的固定Rf。","p":["骨","荷"],"s":["算"],"l":["酸鹼線","分配線"]},{"ch":"TLC","L":"L07","title":"調溶劑是為了拉開斑點，不是讓所有點跑到頂","ask":"調溶劑是為了拉開斑點，不是讓所有點跑到頂？","chain":"提高適當洗脫力 → 溶劑競爭表面並溶解分析物 → 多數Rf上升 → 再查分離。","why":"溶劑也和矽膠作用，能與分析物競爭表面。混合溶劑還可改選擇性；兩點一起向上但仍重疊，不算解決分離。","ex":"中性分析物在矽膠／Hexane–Ethyl acetate中都停在底部，可試增Ethyl acetate比例，再看斑點是否分開。","trap":"限定常見正相與中性類似物；酸鹼添加劑會同時改解離與表面，不能只看一個極性值。","q":"Rf由0.20、0.22變成0.90、0.92，可以只因變大就宣稱分離變好嗎？","ans":"不能。位置升高不等於兩點更可辨；要看實際間距、斑點寬度與參考。","p":["極"],"s":["樣","選","算"],"l":["酸鹼線","分配線","保留線"]},{"ch":"TLC","L":"L08","title":"加酸或鹼後，為什麼不能只套溶劑極性口號","ask":"加酸或鹼後，為什麼不能只套溶劑極性口號？","chain":"酸鹼可能改解離 → 同時改表面與溶劑作用 → 用受控數據判Rf → 不單因反推。","why":"弱酸失去H後可成陰離子，弱鹼接受H後可成陽離子。電荷會改親水與表面作用；但非水混合液、矽膠表面及酸鹼添加劑的競爭效應都會參與。","ex":"舊表Ibuprofen在Ethyl acetate為100Rf=54，加Methanol與強氨的80:10:10配方為18：真Rf由0.54到0.18。","trap":"上述是舊筆記觀測表，不是本次讀到的原實驗頁。它同時改多個溶劑，不能證明下降完全由解離造成；非水系統也不直接套水溶液pH數值。","q":"只給弱鹼加一種酸，未給固定相與溶劑，能精算或保證Rf下降嗎？","ans":"不能。可預測可能質子化，但Rf需相互作用、表面與配方資料；回M02固定條件重測。","p":["極","荷"],"s":["樣","算"],"l":["酸鹼線","分配線"]},{"ch":"TLC","L":"L09","title":"斑點拖尾或前緣歪，應回查哪項操作","ask":"斑點拖尾或前緣歪，應回查哪項操作？","chain":"控制小量點樣與槽況 → 減少過載、擴散及邊緣差異 → 取得可比斑點。","why":"一次點樣太大或還濕就展開，起始帶會寬；槽內飽和與板活性需按方法控制。不同問題有多個原因，要用參考道、重複測量與操作記錄區分。","ex":"一條檢品道過載拖尾，參考道正常：先降低檢品點樣量、等每次點樣乾燥後再展開，不直接判為新雜質。","trap":"飽和是普通槽常見受控步驟，不是保證Rf固定；水平槽／特殊方法依其設計。板水分也可影響表面活性。","q":"前緣尚未標記就吹乾，應回哪站？","ans":"資料缺失源自M02標記順序；無法恢復時重新展開，取得前緣後才能在M03算Rf。","p":["極"],"s":["樣"],"l":["分配線","標準曲線線","解析度線"]},{"ch":"TLC","L":"L10","title":"254 nm 的暗點與長波螢光是不同讀法","ask":"254 nm 的暗點與長波螢光是不同讀法？","chain":"F254背景發光且被吸光遮弱 → 暗斑；長波激發適合物質 → 螢光亮斑。","why":"UV detection（紫外光偵測）不一定先噴化學試劑。F254是板上螢光指示劑；分析物需有相應吸光能力才能形成暗斑。長波畫面取決於物質的發光特性。","ex":"F254板在254 nm見暗點，是分析物使發光背景變弱；365 nm有亮點，可能是分析物或衍生物發光。","trap":"舊表有360 nm，CH19與常用燈為365 nm；依來源條件，不能說兩個數字完全相同。不同物質亮度不能直接當含量排序。","q":"無色藥物也不吸254 nm，板上沒暗斑能否判斷它不存在？","ans":"不能。偵測路徑不適合；回M02選相應呈色／衍生化或其他有效偵測。","p":["色"],"s":["測"],"l":["空白線"]},{"ch":"TLC","L":"L11","title":"呈色題先找反應對象，再核對指定配對","ask":"呈色題先找反應對象，再核對指定配對？","chain":"選適合定位試劑 → 指定反應／加熱 → 讀色或螢光 → 核對固定配對。","why":"Location reagent（定位試劑）讓分離後的位置變可見。官能基能解釋某類反應為何合理；精確顏色、配方與藥例仍須背已核對表。Ninhydrin通常檢胺基酸、可反應胺與胺糖，不能把每個含N分子都算陽性。","ex":"Aprotinin的TLC鑑別題→Ninhydrin；皮質類固醇白底藍點→Alkaline tetrazolium blue。","trap":"CH19 ninhydrin附圖寫「三級胺黃」，另一舊檔寫「二級胺黃」。本版保留來源差異，通用色彩依分子及配方；不把三級胺黃當定律。","q":"題目寫皮質類固醇＋tetrazolium blue＋紅色，哪個字決定錯？","ans":"「紅色」。此題指定應呈藍色；試劑適用性仍受可反應結構與方法條件限制。","p":["色","反"],"s":["測"],"l":["分配線","溫度線"]},{"ch":"TLC","L":"L12","title":"要回收時，為什麼碘蒸氣通常比反應型呈色劑合適","ask":"要回收時，為什麼碘蒸氣通常比反應型呈色劑合適？","chain":"先避開破壞性反應 → 碘顯色多可褪去 → 定位後回收 → 再查完整性。","why":"Iodine vapour（碘蒸氣）定位常可逆，故比會衍生化或氧化分析物的試劑較利於回收。UV或另取旁道定位也可能適合；需依物質光穩定性選。","ex":"四選項Ninhydrin、Tetrazolium blue、KMnO4、Iodine中，問回收影響最小→Iodine。","trap":"這是題中相對較合適，不保證零反應或100%回收。半製備可用較厚層提高承載，定位後刮取／萃取，仍檢查純度與回收率。","q":"已用強氧化呈色劑把成分反應掉，能把原物質回收當然成立嗎？","ans":"不能；應先按回收目的選定位方式，必要時用另道或另板。","p":["揮","反"],"s":["測","算"],"l":["分配線","保留線"]},{"ch":"TLC","L":"L13","title":"限量比較先比點上去的質量","ask":"限量比較先比點上去的質量？","chain":"質量m=C×V → 比較m標/m檢 → 乘100% → 得名目比較百分比。","why":"斑點反應的是點到板上的量，不是試管標籤單獨的濃度。相同體積可約去V；不同體積必須保留。原圖兩個比較點都標codeine，不是實際雜質標準品。","ex":"Codeine圖：同體積時0.04% w/v比較液對4% w/v檢品，0.04/4×100%=1%。","trap":"同方法、有效可比的反應；不同物質須有方法規範或反應校正。本題名目下限不等於經統計驗證的LOD，也不是測出實際雜質恰為1%。","q":"0.04%比較液點20 μL，4%檢品點10 μL，代表比例多少？","ans":"0.04×20/(4×10)×100%=2%；體積多一倍不能忽略。","p":["極"],"s":["算"],"l":["雜訊地板"]},{"ch":"TLC","L":"L14","title":"位置告訴保留，含量還要校正","ask":"位置告訴保留，含量還要校正？","chain":"Rf定位 → 強度與標準建立關係 → 檢查範圍與重疊 → 求量。","why":"Densitometry（光密度測量）讀吸收或螢光相關訊號，可搭TLC／HPTLC定量；校正、線性範圍、點樣與背景仍需核對。目視大小深淺較常做限定比較。","ex":"同一分析物已有校正式S=2m+1（m為μg），讀S=9→m=(9−1)/2=4 μg；Rf=0.50不參與此含量換算。","trap":"不能跨不同物質直接比顏色深淺當濃度。較深也可能因反應、掃描或背景；溶劑與板條件會改Rf。","q":"A的Rf=0.80、B的Rf=0.20，能說A含量四倍嗎？","ans":"不能。Rf是位置比；含量要量的訊號與有效校正。","p":["極"],"s":["選","算"],"l":["分配線","空白線","解析度線"]},{"ch":"TLC","L":"L15","title":"放射化學純度讀的是活性，不是普通顏色深淺","ask":"放射化學純度讀的是活性，不是普通顏色深淺？","chain":"分離化學形式 → 測各區放射活性 → 目的形式/總活性 → 純度百分比。","why":"Radiochemical purity（放射化學純度）問同一核種有多少活性在所需化學形式。Radio-TLC（放射薄層層析）須接放射偵測或分段計數；一盞UV燈不能直接讀這個百分比。","ex":"目的形式活性95，其他5，同基準：95/(95+5)×100%=95%。數字單位可同為Bq或經校正一致的計數率。","trap":"取用合適分離系統，避免不同形式未分開；校正背景、計數效率與時間。放射核種純度問核種，不是同一概念。","q":"同一核種總活性100，其中游離形式8，目標標記形式92，放射化學純度？","ans":"92%；分子取目標化學形式活性，分母取該核種各形式總活性。","p":["極"],"s":["選"],"l":["空白線"]},{"ch":"TLC","L":"L16","title":"選方法時，先看要保留什麼證據與樣品","ask":"選方法時，先看要保留什麼證據與樣品？","chain":"檢查樣品是否易流失 → 方法是否能分離與偵測 → 選合適配置 → 限定結論。","why":"點樣與乾燥時可能揮發流失，所以必須按分析目的選方法。TLC能做雜質比較，但顏色／位置都不能獨自確認未知分子。","ex":"易揮發麻醉劑的可靠定量，普通開放TLC有損失風險，題中選不適合者TLC；製程雜質題的四選項則TLC有分離優勢。","trap":"CH19 Q21稱精油不適合；這是來源答題口徑。已有HPTLC精油鑑別方法，不可教成所有精油絕對不能TLC。GMP要求合適且經確認的方法，不指定一律TLC。","q":"一題只問四個方法中何者有分離雜質的能力，能推出GMP禁止HPLC嗎？","ans":"不能。選項比較只回答本題；合適且經驗證的其他方法仍可採用。","p":["極"],"s":["樣","選"],"l":["分配線"]},{"ch":"TLC","L":"L17","title":"HPTLC 改善斑點，再用受控讀數做定量","ask":"HPTLC 改善斑點，再用受控讀數做定量？","chain":"粒子與操作更均一 → 斑點較窄且較可重現 → 合適掃描與校正 → 求量。","why":"High-performance TLC（高效能薄層層析）常採較小且較均一粒子。硬體可支持較窄斑點與自動化；實際分離與定量依方法確認。","ex":"要多道重複定量，可選HPTLC＋自動點樣＋Densitometer；仍用各濃度參考品校正。","trap":"舊筆記粒徑2–10 μm屬教材範圍；Merck brochure的特定材料均值5–6 μm，不是全產品唯一值。水平展開依槽型控制蒸氣，不能一概說不需飽和。","q":"粒子小了但檢品與標準共移行且未校正，能宣稱準確定量嗎？","ans":"不能。仍需選擇性、有效校正與合適點樣／偵測；回相應M02、M03。","p":["極"],"s":["算"],"l":["標準曲線線"]},{"ch":"TLC","L":"L18","title":"二維展開如何救第一方向的重疊","ask":"二維展開如何救第一方向的重疊？","chain":"第一次展開並乾燥 → 轉90° → 第二溶劑展開 → 用另一選擇性拉開。","why":"Two-dimensional TLC（二維薄層層析）加一個獨立的分離方向。真正有用的是第二溶劑對兩成分有不同選擇性，不只是轉板。","ex":"兩成分第一方向都Rf=0.50；第二溶劑分別0.20、0.70，有機會分開。","trap":"第二次前須除去第一溶劑，且物質應穩定。用同溶劑的穩定性檢查，宜比正規化Rf_x、Rf_y；實際45°還需兩方向尺度相同。","q":"第二次溶劑對兩成分的Rf仍都0.50，會自動分開嗎？","ans":"不會。第二方向仍共同移行；需另選有效選擇性或其他證據。","p":["極"],"s":["樣","選"],"l":["分配線","解析度線","保留線"]},{"ch":"HPLC","L":"L01","title":"什麼檢品適合走液相分析？","ask":"什麼檢品適合走液相分析？","chain":"可溶且方法條件相容 → 選液相分離與偵測 → 留下可測的檢品。","why":"HPLC 是 high-performance liquid chromatography（高效能液相層析法）。移動相是液體，檢品不必先氣化，常用於不易揮發、受熱可能分解或較大型的成分。仍要能溶解、穩定，並與管柱、偵測器和基質相容。","ex":"PEG 不易直接作常規 GC 分析，又缺乏強 UV 吸收；題目選 HPLC-ELSD。不是先看到「有機物」就選 UV。","trap":"「只要溶於移動相就一定適用」漏掉穩定性、回收與偵測。","q":"肝素不是小分子，可以直接判它不能用 HPLC 嗎？","ans":"不能。LC 有不同模式與偵測法；Q048 題本一律給分，不能拿它證明所有肝素都不能分析。","p":["極"],"s":["樣","選"],"l":["分配線"]},{"ch":"HPLC","L":"L02","title":"幫浦、進樣器與管柱各改變什麼？","ask":"幫浦、進樣器與管柱各改變什麼？","chain":"穩定送液／定量進樣 → 柱內不同保留 → 偵測器隨時間記錄。","why":"流路是儲液瓶 → 去氣泡 → 幫浦 → 進樣器 → 保護柱 → 分析柱 → 所選偵測器 → 廢液；電腦另外收訊號。幫浦常設定體積流量 F，壓力由流路阻力形成。進樣器控制注入量，柱溫箱控制溫度，偵測器設定波長。","ex":"F 從 1 改成 2 mL/min，在保留體積相同的近似下，8 min 的峰變成 4 min；波長不由幫浦調整。","trap":"設定流量不等於同時把壓力獨立鎖成常數。","q":"題目問泵的功能，四個選項為波長、滯留時間、溫度、進樣量，選哪個？","ans":"滯留時間；送液速度影響通過與流出時間。","p":["極"],"s":["源","樣","選","測","算"],"l":["分配線"]},{"ch":"HPLC","L":"L03","title":"峰的位置、面積與寬度各回答什麼？","ask":"峰的位置、面積與寬度各回答什麼？","chain":"時間／面積／寬度分開讀 → 配對保留／量／效率 → 得到有證據的結論。","why":"chromatogram（層析圖）橫軸通常是時間，縱軸依偵測器是吸光度、電流或其他訊號。tR 是流出峰的位置；積分峰面積用於校正定量；寬度用於展寬與解析度。t₀ 是未保留標記通過所需時間。","ex":"A 在 4 min，B 在 8 min：只說 B 較晚流出。若兩者響應不同，即使面積相等也不能直接說濃度相等。","trap":"較晚、較高、較寬的峰都不直接等於含量較高。","q":"未知物與標準品 tR 相同，能獨自證明身分嗎？","ans":"不能。共流出可能存在；同 tR 是比對線索，需要方法的專一性證據。","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"HPLC","L":"L04","title":"溶劑能混合，和能拿來萃取，有何差別？","ask":"溶劑能混合，和能拿來萃取，有何差別？","chain":"均相作移動相／兩相作萃取 → 控制分配與回收 → 取得可進樣溶液。","why":"移動相混合後應保持方法要求的均一組成，緩衝鹽也不能析出。液液萃取則常故意用兩個不互溶的液相，把藥物與油性基質分開。它們不是同一任務。THF、乙腈、甲醇能與水混溶；THF 的氧可接受水的氫鍵。","ex":"hydrocortisone 軟膏題選 MeOH／hexane：甲醇帶出藥物，己烷容納油性基質；仍要做回收試驗，不把藥物損失當成除基質成功。","trap":"DMF 是醯胺，不是醛；乙腈可以接受氫鍵，不是「完全不能氫鍵」。","q":"水／THF 與甲醇／正己烷，哪組一般形成兩相？","ans":"甲醇／正己烷；水／THF 一般可混溶。","p":["極"],"s":["源","樣","算"],"l":["分配線"]},{"ch":"HPLC","L":"L05","title":"在裸矽膠上，誰會比較晚流出？","ask":"在裸矽膠上，誰會比較晚流出？","chain":"矽膠作用較強 → 在表面停留較久 → tR 較長。","why":"normal-phase chromatography（正相）用較極性的固定相、相對低極性的移動相。裸矽膠表面有 silanol（矽醇基 Si–OH），可與分析物形成氫鍵等作用。類似骨架且不發生額外解離時，較能與矽膠作用者常留較久。","ex":"同碳數的丁烷、丁醛、丁酸在題定矽膠條件下：丁酸 > 丁醛 > 丁烷的 tR，對應 Q056 的 c>b>a。","trap":"不能把「正相極性大較晚」搬到 C18 或 SEC。","q":"n-hexanol、benzene、n-hexane 在 Q087 的矽膠題如何排序？","ans":"tR：hexanol > benzene > hexane。醇可與表面強作用；苯的吸附不能只用永久偶極解釋。","p":["極"],"s":[],"l":["分配線"]},{"ch":"HPLC","L":"L06","title":"在 C18 上，誰會比較晚流出？","ask":"在 C18 上，誰會比較晚流出？","chain":"較強疏水保留 → 平均遷移較慢 → tR 較長。","why":"reversed-phase chromatography（逆相）通常用疏水的鍵結固定相及水／有機溶劑。C18 又叫 ODS；octadecyl 是十八碳烷基。固定其他條件，疏水性較大的分析物常保留較久；離子化、表面殘餘基團及特定選擇性會補上其他作用。","ex":"toluene、propylbenzene、amylbenzene 為同族中性物；題定 C18 下，amylbenzene 最晚，toluene 最早。","trap":"水比例提高常延長 RP 保留；別把正相的溶劑方向背過來。","q":"題目已給四蛋白親脂性 I>II>III>IV 且 C18 梯度分離良好，誰最後？","ans":"I；題目已指定可用的疏水性差異與合適方法。","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"HPLC","L":"L07","title":"比較官能基時，要先固定哪些條件？","ask":"比較官能基時，要先固定哪些條件？","chain":"先比可用結構差異 → 判與兩相作用 → 指定條件下排序。","why":"先看是否帶電，再看可形成氫鍵等作用的基團，並同時看疏水骨架。COOH、OH、胺、羰基、醚等可提供不同相互作用；一張官能基表只是近似提示，不是每個完整分子的唯一保留常數。位置異構物還涉及可接近性及氫鍵位置。","ex":"Q096：3-O-benzylmorphine 增加 O–CH₂–phenyl（苄基），題定 C18 最晚；normorphine 去掉 N-methyl，Q061 最早。不是把 benzyl 誤畫成 tolyl。","trap":"「ortho 一定最極性、para 一定最不極性」不能普遍成立。","q":"chlorophenol 三異構物題選 adsorption，代表 RP 分配一定不能分開嗎？","ans":"","p":["骨"],"s":[],"l":["分配線"]},{"ch":"HPLC","L":"L08","title":"矽膠接上 C18 後，為何仍可能拖尾？","ask":"矽膠接上 C18 後，為何仍可能拖尾？","chain":"殘餘表面與帶電分析物作用 → 保留不均／拖尾 → 封端或調整條件。","why":"bonded phase（鍵結相）以共價鍵把基團接在矽膠上；沒有反應完的 Si–OH 仍可能與分析物作用。矽醇基解離為 Si–O⁻ 時，可吸引質子化胺 BH⁺。endcapping（封端）用小型矽烷試劑遮蔽殘餘作用位點，減少部分次級作用。","ex":"C18 可以分析鹼性藥物；看 pH、相穩定性及峰形。拖尾要查表面作用，也查過量進樣或樣品溶劑。","trap":"Si–O⁻ 不是自由 OH⁻；含碳率不是殘餘矽醇基已封端百分率。","q":"aminopropyl、cyano、diol 出現時，能只由名稱宣告全是正相嗎？","ans":"不能。這些極性相可在 NP、RP 或 HILIC 等條件下使用，必須連同移動相判別。","p":["極","荷"],"s":["選","算"],"l":["分配線","解析度線"]},{"ch":"HPLC","L":"L09","title":"酸與鹼改 pH，保留為何常往相反方向？","ask":"酸與鹼改 pH，保留為何常往相反方向？","chain":"pH 改解離比例 → 疏水保留改變 → tR 方向改變。","why":"弱酸 HA 在 pH 上升時較多變 A⁻；弱鹼以 BH⁺ ⇌ B 討論，pH 上升時較多變成中性 B。常規 RP 中中性態通常比離子態保留強，所以酸升 pH 常較快，鹼升 pH 常較慢。","ex":"aspirin pKa 3.5：pH3→5 時酸解離增加，C18 tR 縮短；pentycaine pKa8.1 升 pH 則中性比例增加，不能拿來縮短 tR。","trap":"同一句「升 pH 會較快」不能同時套給酸與鹼。","q":"bupivacaine 從 pH9 改為 pH5，常規 RP 能延長 tR 嗎？","ans":"通常不能；變成較多 BH⁺，常縮短保留。","p":["極","荷"],"s":["選","算"],"l":["酸鹼線","分配線"]},{"ch":"HPLC","L":"L10","title":"pKa 附近的 pH 改變，為何特別值得注意？","ask":"pKa 附近的 pH 改變，為何特別值得注意？","chain":"比較區間與 pKa → 解離比例變化 → 判題定保留變化。","why":"Henderson–Hasselbalch 式把 pH−pKa 變成兩態比。每差 1 個 pH，兩態比差 10 倍；pH=pKa 時各半。接近 pKa 時，中性比例對 pH 變動更敏感，遠離時常已幾乎在同一態。","ex":"ibuprofen pKa4.4：四個一單位區間中，4→5 跨過 pKa，題本選最大影響。procaine pKa9 在 pH8→7 兩端都以 BH⁺ 為主，Q007 選影響最小。","trap":"ACN 加到乙酸緩衝液後的 pH，不能用「中性溶劑稀釋酸」一概推斷。","q":"弱鹼 pKa9，pH8、7 的 B:BH⁺ 各多少？","ans":"1:10、1:100；中性比例是 1/11、1/101。","p":["荷"],"s":["選","算"],"l":["酸鹼線","分配線"]},{"ch":"HPLC","L":"L11","title":"移動相比例，怎樣轉成沖提強度？","ask":"移動相比例，怎樣轉成沖提強度？","chain":"先認強溶劑 → 換成分率 → 比保留方向。","why":"eluotropic power（沖提力）指溶劑在特定固定相上帶出分析物的能力。NP 常增加能競爭矽膠表面的較極性溶劑；RP 常增加有機相比例；HILIC 常增加水比例。它不是只把介電常數或極性指數排大到小。","ex":"水:MeOH＝1:5 的 MeOH 分率5/6，高於1:3的3/4、1:2的2/3、1:1的1/2；題定C18下1:5最快。","trap":"別把 NP 的強溶劑序直接套給 RP；甲醇、乙腈的氫鍵能力也不同。","q":"C18 題：ACN/water 30:70 與70:30，哪個通常較快？","ans":"70:30，ACN 多，RP 沖提較強。","p":["極"],"s":["源","樣","選"],"l":["分配線"]},{"ch":"HPLC","L":"L12","title":"縮短分析時間，和改善分離，是同一件事嗎？","ask":"縮短分析時間，和改善分離，是同一件事嗎？","chain":"改變通過時間或保留 → 讀 tR／峰寬／峰距 → 比時間與分離品質。","why":"isocratic（等度）保持相組成；gradient（梯度）隨時間改變組成。RP 常增加有機相由弱到強沖提。提高流量、使用較短柱或較強沖提常加快，但可能犧牲分離；降低梯度斜率常讓近鄰峰更有機會分開。","ex":"同端點10%→70%有機相，10 min斜率6百分點/min；延至15 min斜率4百分點/min。Q084選延長1.5倍作較慢梯度。","trap":"快並不證明 Rs 合格；梯度越慢也不保證每一組峰都更好。","q":"RP 增加水比例，能否當成一般縮短 diclofenac 分析時間的方法？","ans":"不能；常減弱沖提、延長保留，Q042 的反向選項是水增加。","p":["極"],"s":["選"],"l":["分配線","解析度線"]},{"ch":"HPLC","L":"L13","title":"陽離子交換樹脂為何帶負電？","ask":"陽離子交換樹脂為何帶負電？","chain":"相反電荷吸引 → pH／競爭鹽改作用 → 不同 tR。","why":"ion-exchange chromatography（離子交換）名稱依「被交換的分析物」命名。陽離子交換相帶負電，抓陽離子；陰離子交換相帶正電，抓陰離子。提高沖提液中競爭離子常促使分析物離開；pH 同時影響分析物及弱交換基團。","ex":"–SO₃⁻ 是強陽離子交換；–COO⁻ 也抓陽離子，只是常屬弱陽交換。lysine 在題定升 pH 沖提中較能維持正電，最後出。","trap":"I 大不等於分析物總會被抓更強；原子序不在 I 的定義式內。","q":"陰離子在一般陽交換相會比有可比吸引的陽離子早還是晚？","ans":"通常早；同號／不保留者較早，仍看其他作用。","p":["荷"],"s":["算"],"l":["酸鹼線"]},{"ch":"HPLC","L":"L14","title":"離子對試劑要與誰帶相反電荷？","ask":"離子對試劑要與誰帶相反電荷？","chain":"反號作用／表面吸附 → 增加有效疏水保留 → RP 更能留住離子。","why":"ion-pair chromatography（離子對）常在 RP 加入帶電且有疏水端的試劑。它可與分析物形成對離子作用，也可吸附於固定相造成動態離子交換。入門用「反號電荷＋疏水端」抓題意，實際不必完全等同中性離子對單一機制。","ex":"苯乙酸在能形成陰離子的條件下，用帶正電 tetrabutylammonium；酸性條件的苄胺 BH⁺ 用帶負電 alkylsulfonate。相同試劑類型中較長烷鏈常留更久。","trap":"cationic ion-pair agent 是正電試劑，不是必然拿來抓正電分析物。","q":"四丁基銨可以與丁胺 BH⁺ 作題目的反號配對嗎？","ans":"不適合，兩者同正電；丁酸 A⁻ 才是該選項的對象。","p":["極","荷"],"s":["選"],"l":["分配線"]},{"ch":"HPLC","L":"L15","title":"分子篩的大分子，為何反而先出？","ask":"分子篩的大分子，為何反而先出？","chain":"大者少進孔 → 可走體積較小 → 較早流出。","why":"size-exclusion chromatography（尺寸排斥、分子篩）理想上藉可進入孔隙的體積分離。大分子進不了小孔，較直接走柱外空隙；小分子進孔較多，晚流出。分離的是溶液中的水動力尺寸，分子量對照校正仍受分子形狀影響。","ex":"hyaluronic acid 高分子分布題選 SEC。小胺基酸 phenylalanine 比大 collagen 能進更多孔，不能說小者一定先。","trap":"大分子先出不是因為抓得更強；也不是全化學中只有SEC能有這種先後。","q":"兩個分子都大到完全不能進孔，SEC能保證分開嗎？","ans":"不能；都在排斥極限附近，需換孔徑範圍或其他方法。","p":["量"],"s":["算"],"l":[]},{"ch":"HPLC","L":"L16","title":"HILIC 為何用高有機相，卻留住親水物？","ask":"HILIC 為何用高有機相，卻留住親水物？","chain":"親水層／表面作用 → 親水物較易保留 → 加水常較快沖出。","why":"hydrophilic interaction liquid chromatography（親水性交互作用層析）用親水固定相及富有機的水混合移動相。分析物可分配入表面富水層，也可有吸附或離子交換作用，所以常呈接近正相的親水保留。ZIC-HILIC 只是兩性離子相的一類。","ex":"Q008原圖的短→長為phenylalanine、tyrosine、threonine、serine、arginine；峰D是serine。題定HILIC加水常減少保留，與常規RP方向相反。","trap":"Ascorbic acid不是thiol；GSSG是disulfide，不把三者統稱硫醇。","q":"HILIC可含帶電固定基團，強酸／強鹼分析物是否可能另有離子交換作用？","ans":"可能，這就是Q011選D的原因。","p":["極"],"s":["選","算"],"l":["分配線"]},{"ch":"HPLC","L":"L17","title":"鏡像異構物，靠什麼產生保留差異？","ask":"鏡像異構物，靠什麼產生保留差異？","chain":"與手性環境作用不同 → 自由能／保留不同 → 對映峰分開。","why":"enantiomers（對映、鏡像異構物）在非手性環境多有相同物性。可用手性固定相、手性移動相添加物，或先與手性試劑衍生成非對映異構物。三點作用模型包含氫鍵、π作用與立體限制，是辨識教學模型，不是「三點成面」即證明分離。","ex":"Pirkle、cyclodextrin 是題本配對；cetrimide 是一般陽離子對試劑，並不提供所需手性。Labetalol四種組態是兩對對映體，不是四者互為鏡像。","trap":"Q017 的未限定crown ether不能外推成所有冠醚都不具對掌分離。","q":"要直接分離D/L-alanine，題本Pirkle與裸silica、ODS相比選誰？","ans":"Pirkle；本題原印alanine前缺字，D/L由題意與舊講義補充，不冒充原印。","p":["手"],"s":["選"],"l":["分配線"]},{"ch":"HPLC","L":"L18","title":"衍生化，是把分析物的哪個弱點補起來？","ask":"衍生化，是把分析物的哪個弱點補起來？","chain":"接上合適基團 → 改偵測或保留 → 可辨識的產物訊號。","why":"derivatization（衍生化）是把分析物反應成另一種可分析形式。可導入UV發色基或螢光基、改善分離，或在特定反應下改善穩定性。它增加反應步驟，須核對反應完整度、回收、產物穩定性、空白與過量試劑。","ex":"neomycin與fluorodinitrobenzene反應後可UV偵測；題定silica條件下降低極性、減少過強表面作用，避免拖尾。Q097的「增加管柱作用」錯。","trap":"導入缺乏發色基的醣，不會自動解決無UV訊號。","q":"有合適ELSD能直接測未衍生化醣，是否必須先衍生化？","ans":"","p":["反"],"s":["樣","選"],"l":["分配線","保留線"]},{"ch":"HPLC","L":"L19","title":"UV 和 DAD 怎樣把流出物變成訊號？","ask":"UV 和 DAD 怎樣把流出物變成訊號？","chain":"光吸收隨流出改變 → 吸光度峰／光譜 → 定量或支持比對。","why":"UV/Vis detector 量光吸收。DAD（diode array detector，光二極體陣列）可取得一段波長的吸收資訊，對多種吸光成分及光譜比對有用。量測吸收需要分析物在條件下有足夠發色性；UV不是全通用。","ex":"混合物各有不同吸收波長，Q093選DAD；mannitol沒有可供常規直接UV靈敏測定的強發色基，Q073排UV。","trap":"看得見吸收峰不等於已知道藥物身分；改波長也可能改響應因子。","q":"aspirin題選「UV通常氙燈」為正確敘述嗎？","ans":"題本不選。常見UV來源為氘燈；氙燈常見於螢光激發，仍看產品。","p":["色"],"s":["測","算"],"l":[]},{"ch":"HPLC","L":"L20","title":"螢光選擇性，為何常比單純 UV 高？","ask":"螢光選擇性，為何常比單純 UV 高？","chain":"能被激發且放出螢光 → 選發射光 → 較少背景干擾。","why":"fluorescence detector（螢光偵測）先用激發光，再讀另一波長的發射光。不是所有會吸收的分子都有效放螢光，增加這道條件常帶來較高選擇性。剛性與共軛有利於部分分子，但不能保證每個剛性分子都發螢光。","ex":"Riboflavin（B2）與aflatoxins題本選HPLC-fluorescence；若分析B1，有方法先氧化成thiochrome再測，不能一概說未處理B1就是同樣的天然螢光配對。","trap":"sensitivity是低量能不能辨；selectivity是能否分辨目標與干擾；robustness是小幅條件變動仍穩定。","q":"UV相較FL，本題給robustness、selectivity、sensitivity，選何優勢？","ans":"Q046選robustness較佳；不是UV在所有方法都更靈敏。","p":["色"],"s":["選","算"],"l":["空白線","解析度線","雜訊地板"]},{"ch":"HPLC","L":"L21","title":"電化學、PAD 與電導，讀的是同一種量嗎？","ask":"電化學、PAD 與電導，讀的是同一種量嗎？","chain":"選電位測電流／量離子導電 → 分清機制與訊號 → 選適用偵測。","why":"HPLC的ECD是electrochemical detector（電化學），常量分析物在電極氧化還原形成的電流。PAD是pulsed amperometric detection（脈衝安培偵測），變換電位並量電流，能更新表面、用於醣等。電導偵測量溶液導電，常用於離子層析的無機離子。","ex":"Adrenaline有catechol可氧化，Q095選電化學；氯離子Q060選ion chromatography，常配抑制型電導，不直接指定PAD。","trap":"GC的electron capture detector也縮寫ECD，但它是電子捕捉，與液相電化學不同。","q":"題目問非HPLC檢測器，electron capture和electrochemical如何選？","ans":"排electron capture，它是本題的GC電子捕捉配對。","p":["極"],"s":["測"],"l":[]},{"ch":"HPLC","L":"L22","title":"沒發色基，怎麼選 RI、ELSD 或 CAD？","ask":"沒發色基，怎麼選 RI、ELSD 或 CAD？","chain":"折射差／殘留微粒／粒子電荷 → 訊號 → 適用範圍與校正。","why":"RI比樣品流與參考流折射率，需穩定溫度與組成，梯度易改基線。ELSD霧化流出液、蒸發移動相，再讀殘留粒子散射。CAD也先生成粒子，再以corona discharge（電暈放電）產生帶電氣體，讀粒子電荷的電流。","ex":"未衍生化醣、PEG、非離子界面活性劑題選ELSD；梯度題排RI。UDCA缺乏強常規UV吸收，題本選ELSD。","trap":"「通用」表示不局限發色基，並非所有物質、條件、濃度都相同響應。","q":"分析物比移動相更容易揮發，ELSD可靠保證可測嗎？","ans":"不能，分析物可能一起蒸發，殘留粒子不足。","p":["色","荷","整"],"s":["測","算"],"l":[]},{"ch":"HPLC","L":"L23","title":"峰面積，怎麼變成可信的濃度？","ask":"峰面積，怎麼變成可信的濃度？","chain":"用標準建關係 → 外標面積／內標比值 → 回算濃度及品質。","why":"external standard（外標）以已知濃度建立面積關係，再回算樣品。internal standard（內標）加入固定量的另一個成分，用分析物／內標面積比校正；若注入量等共同乘法誤差同時影響兩者，比值可以抵消。內標須穩定、不反應、可辨別且適用於該檢品。","ex":"乳酸內標題選丙酸；tR宜近但峰不能重疊。若要補償萃取損失，內標要在該步驟前加入且經歷相近回收。","trap":"MIC10、疑慮50µg/mL是題目資料，不當成臨床用藥建議；檢量範圍需涵蓋關鍵區域，非越寬越好。","q":"標準比值1對應10µg/mL，樣品比值2且截距0，原稀釋4倍，原濃度多少？","ans":"測得20µg/mL，乘4＝80µg/mL；前提同內標濃度及已驗證比例關係。","p":["極"],"s":["算"],"l":["標準曲線線"]},{"ch":"HPLC","L":"L24","title":"小粒徑提高效率，為何同時要更高壓？","ask":"小粒徑提高效率，為何同時要更高壓？","chain":"細粒減少路徑／質傳展寬 → H下降 → 同L時N增，但阻力增。","why":"UHPLC是超高效液相的通稱，UPLC是題本常用名稱及商標系統用語。粒徑變小可減少多路徑與質傳展寬，常容許較高線性速度；壓力需求上升。Van Deemter簡式H=A+B/u+Cu，H是板高；總板數N=L/H。","ex":"同L，H由20變10µm，N加倍；若L也減半，N可不變。相同黏度、柱長與線性速度的近似下，dp減半背壓約4倍。","trap":"固定相粒徑≠柱內徑；短柱≠總板數一定增；1.7µm只是歷史例子。","q":"Q101問細粒不直接降低哪種展寬，選B/u所代表的什麼？","ans":"縱向擴散；注意不代表換u後B/u的數值也固定。","p":["極"],"s":["算"],"l":[]},{"ch":"GC","L":"L01","title":"這個檢品能完整氣化嗎？","ask":"凍乾蛋白製劑要測殘留 Ethanol，能不能用頂空 GC？","chain":"可氣化＋耐熱 → 能完整通過 GC → 再選製樣與偵測","why":"載氣只能帶走氣態成分。真正門檻是在方法溫度與時間內，有足夠蒸氣壓，而且分析物能保持需要測的身分。小分子常較容易符合，分子量並沒有一條人人共用的硬界線。","ex":"製劑中的 Ethanol 是揮發性小分子，可用 GC；完整蛋白質通常不適合直接 GC。測蛋白製劑的殘留溶劑，則可取其揮發部分用 GC。","trap":"把「製劑不適合直接 GC 測主成分」擴成「這個製劑任何成分都不能用 GC」。","q":"凍乾蛋白製劑要測殘留 Ethanol，能不能用頂空 GC？","ans":"可以。需要揮發的是 Ethanol；蛋白與多數基質留在瓶內。","p":["量","揮"],"s":["樣"],"l":[]},{"ch":"GC","L":"L02","title":"氣態分子為什麼分批抵達？","ask":"氣相／固體表面的反覆作用叫分配還是吸附？","chain":"分配／吸附程度不同 → 固定相停留不同 → 出峰時間不同","why":"Gas–liquid chromatography（氣液層析）讓分析物在氣相與液態固定相間分配；Gas–solid chromatography（氣固層析）利用固體表面的吸附。鍵結固定相仍是固定在表面的相，不能把 gas–bonded surface 翻成氣體／氣體分配。","ex":"A、B 隨同一股載氣前進，A 平均在固定相停留較久，A 的保留較強，常較晚出峰。","trap":"把固定相視為唯一有物理作用的東西，或把所有 GC 都說成液膜分配。","q":"氣相／固體表面的反覆作用叫分配還是吸附？","ans":"主要是吸附；液膜中的溶入／離開則稱分配。","p":["極","揮"],"s":["選"],"l":["分配線"]},{"ch":"GC","L":"L03","title":"載氣、保留和流速各管什麼？","ask":"等溫且 k 不變，流速增加會讓 tR 變短嗎？","chain":"平衡條件決定 k → 流速決定通過時間 → 同時改變峰寬","why":"Carrier gas（載氣）主要負責輸送。一般非反應性、等溫且固定相不變的近似下，換載氣不靠溶媒競爭改變平衡選擇性。但改流速會改 tM 與 tR，也會改效率；不能說只影響峰寬。H₂ 在特定條件可反應，亦不是絕對惰性。","ex":"等溫且 k=3，tM=2 min 時 tR=(1+3)×2=8 min；平均線性流速加倍、其餘近似成立，tM 變 1 min，tR 約 4 min。","trap":"把「通常不以載氣調平衡選擇性」寫成「載氣與 tR 無關」。","q":"等溫且 k 不變，流速增加會讓 tR 變短嗎？","ans":"會。輸送時間 tM 變短，tR=(1+k)tM 也變短。","p":["揮"],"s":["源","選"],"l":["分配線","解析度線"]},{"ch":"GC","L":"L04","title":"提高柱溫，保留通常怎麼變？","ask":"兩個峰一起提早，能直接說 Rs 增加嗎？","chain":"柱溫升高 → 氣相比例通常增 → k 常下降 → 較早出峰","why":"升溫通常使分析物較容易留在氣相、較少停在固定相，因此保留下降。這是一般 GC 的實用方向，兩個物質下降多少可以不同，所以溫度也會改選擇性。","ex":"同一成分在較高柱溫較早出峰，不代表量變少；量要用適當偵測訊號與校正判斷。","trap":"把較早流出當成含量較低，或把所有物質的保留降幅當相同。","q":"兩個峰一起提早，能直接說 Rs 增加嗎？","ans":"不能。還須看兩中心的距離及峰寬。","p":["揮"],"s":["選"],"l":["分配線"]},{"ch":"GC","L":"L05","title":"沸點跨度大，為什麼常用程式升溫？","ask":"只把升溫速率加倍，早峰解析度一定變好嗎？","chain":"低溫保留早峰 → 逐步升溫帶出晚峰 → 兼顧分離與時間","why":"Isothermal（等溫）容易讓難揮發成分留太久；一開始就高溫又可能擠壓早峰。Temperature programming（程式升溫）先給早峰適當保留，再讓晚峰出來。這是柱爐的溫程，和 PTV 進樣口溫程分開。","ex":"自編：100°C 保持 2 min，10 min 升至 220°C，再保持 3 min；升溫段是 12°C/min，全程 15 min。","trap":"把程式升溫理解成全程高溫，或由兩個峰變窄就斷言一定分離。","q":"只把升溫速率加倍，早峰解析度一定變好嗎？","ans":"不一定。早峰可能更擠；要實測相鄰峰的中心距離與峰寬。","p":["揮"],"s":["選","算"],"l":["分配線","解析度線","溫度線"]},{"ch":"GC","L":"L06","title":"基線隨升溫上升，先查什麼？","ask":"只有樣品、沒有空白，能證明是 bleeding 嗎？","chain":"受熱／氧化等使固定相流失 → 背景增加 → 查空白與柱狀態","why":"Column bleeding（固定相流失）是固定相逸出或分解產物帶來的背景。常見形態是高溫時基線逐漸上升，而非某個分析物的單一尖峰。氧氣、過熱與污染可使問題加重。","ex":"空白與樣品在同一高溫段都抬高基線，先查溫限、氣體純度／漏氣及柱狀態，再決定如何重測。","trap":"看見基線抬高就當成一個含量很大的成分，或說升溫不影響流失。","q":"只有樣品、沒有空白，能證明是 bleeding 嗎？","ans":"不能。先取得空白／溫程對照，排除樣品與其他來源。","p":["揮"],"s":["樣","選"],"l":["空白線","溫度線"]},{"ch":"GC","L":"L07","title":"怎麼選能放大差異的固定相？","ask":"換極性相後，仍要看峰寬嗎？","chain":"換相的交互作用 → 相對保留改變 → 檢查 α 與 Rs","why":"低極性相常讓揮發性與色散作用主導；同系列較高沸點或較大分子常晚。較極性相增加特定偶極、氫鍵等差異，例如 PEG 的氧可接受 Menthol 的氫鍵。所有作用仍共同存在，並不是一支柱只量一個數。","ex":"題目給 BPX-5 上 Menthone=1170、Menthol=1192，相對指數很近；在提供的選柱中，Carbowax 可改變其相對作用，有助拉開差異。","trap":"非極性柱一律依分子量；所有含氧分子都比所有碳氫物晚；分不開一定選最極性相。","q":"換極性相後，仍要看峰寬嗎？","ans":"要。選擇性改變不等於足夠解析度，仍核對 Rs。","p":["極"],"s":["選"],"l":["分配線","歸一線","解析度線"]},{"ch":"GC","L":"L08","title":"I 值是時間，還是相對刻度？","ask":"同物在 BPX-5 與 Carbowax 的 I 必相同嗎？","chain":"正烷類建立刻度 → 比較相對保留 → 大 I 常對應晚峰","why":"Retention index（保留指數）用相鄰正烷類作參考；n 個碳的正烷類定為 100n。指數沒有單位，也不是分子不變的天生常數。Kováts（Kovats）嚴格指等溫、校正後時間的對數內插；線性升溫常用另一套線性指數。","ex":"Carbowax 題定 1206、1480、1686、1578 中，最大為 Menthol 的 1686，因此在該條件下最晚。","trap":"把 I 寫成 min，或把 ΔI 直接代成 Rs。","q":"同物在 BPX-5 與 Carbowax 的 I 必相同嗎？","ans":"不必。固定相改變相對保留；指數要附條件。","p":["揮"],"s":["選"],"l":["分配線","歸一線"]},{"ch":"GC","L":"L09","title":"中空柱少了哪種展寬？","ask":"毛細管柱可以同時標 FSOT 與 WCOT 嗎？","chain":"無填充顆粒多重路徑 → 理想 A≈0 → 仍有擴散與質傳展寬","why":"Packed column（充填管柱）使分子繞過顆粒，路程不等；Eddy diffusion（渦流擴散）就是這類多路徑展寬。Open tubular column（中空管柱）不含填滿截面的顆粒床，所以理想模型沒有這個 A 項；徑向速度與質傳效應仍在。","ex":"WCOT 直接塗液膜；SCOT 內壁先塗支持層再載液相，兩者都中空。FSOT 描述熔融石英材質，可以同時是 WCOT。","trap":"SCOT 當成把整根柱塞滿顆粒，或「毛細管沒有 A」誤成不會展寬。","q":"毛細管柱可以同時標 FSOT 與 WCOT 嗎？","ans":"可以。前者說材質，後者說液膜的位置。","p":["揮"],"s":["選"],"l":[]},{"ch":"GC","L":"L10","title":"為什麼 N₂ 不適合一路催快？","ask":"Dm 變大對 B/u 與氣相質傳係數，方向相同嗎？","chain":"擴散慢 → 氣相質傳跟不上高速 → H 升高 → 峰效率下降","why":"分析物在 H₂、He、N₂ 中的氣相擴散係數通常依次下降。低速時大擴散會增大縱向擴散項 B/u；高速時快擴散有助跟上氣相質傳，使氣相質傳係數較小。固定相質傳不完全由載氣 Dm 決定。","ex":"同一較高線性流速下，常見效率 H₂＞He＞N₂；N₂ 的有效最佳速度較低，離開低點往高速移時容易損失效率。","trap":"B/u 與 Cu 同方向，或 H₂ 的高速度優勢表示低速縱向擴散也最小。","q":"Dm 變大對 B/u 與氣相質傳係數，方向相同嗎？","ans":"不同。B 常變大；氣相質傳係數常變小，兩者在不同速度區主導。","p":["揮"],"s":[],"l":[]},{"ch":"GC","L":"L11","title":"分流進柱的是哪一份？","ask":"分流比從 10:1 變 100:1，理想進柱量變多少？","chain":"濃樣易超載 → 分掉大部分 → 少量進柱 → 峰形可改善","why":"Split injection（分流進樣）在氣化管把蒸氣分成流向管柱與流向排氣的兩份。分流比通常定為排氣流量／柱流量；10:1 理想上進柱比例為 1/(10+1)，並不是把較多那份送進柱。","ex":"100 ng 理想均勻氣化樣品採 49:1 分流，只約 100/50=2 ng 進柱。既然物質變少，不能把分流說成提升偵測器本身靈敏度。","trap":"高濃度一律大體積灌進柱，或無分流等於 100%定量轉移。","q":"分流比從 10:1 變 100:1，理想進柱量變多少？","ans":"比例為 (1/101)/(1/11)=11/101，約原來十分之一。","p":["揮"],"s":["算"],"l":[]},{"ch":"GC","L":"L12","title":"PTV 升溫在進樣口，還是柱爐？","ask":"PTV 與柱爐 temperature programming 可以同時使用嗎？","chain":"先低溫控制注入 → 受控升溫轉移 → 形成較集中樣品帶","why":"Programmable temperature vaporizer（程式控溫氣化進樣口，PTV）改的是進樣口。適當低起始溫度與轉移設定可減少氣化歧視或保留分析物，隨後升溫送進柱。所需聚焦還取決於柱頭／溶劑條件。","ex":"題目問可否分析揮發性複雜樣品：可；問是否使完整蛋白質適合 GC：不會，後續仍需氣化與耐熱。","trap":"把進樣口較溫和等同完整生物製劑不再有揮發性門檻。","q":"PTV 與柱爐 temperature programming 可以同時使用嗎？","ans":"可以；兩者控制不同部位，須各自設計與核對。","p":["揮"],"s":["樣"],"l":["溫度線","保留線"]},{"ch":"GC","L":"L13","title":"隔膜氣洗和分流排氣有何不同？","ask":"Septum purge 的主要目的是決定排掉多少樣品嗎？","chain":"隔膜可能釋出污染 → 少量氣流帶走 → 減少進柱背景","why":"Septum purge（隔膜氣洗）在隔膜附近帶走釋出物，是獨立的背景控制支路。Split vent（分流排氣）控製樣品蒸氣進柱比例，兩條支路不能當成同一作用。","ex":"樣品沒有增加，但更換隔膜後鬼峰改變，回查隔膜、空白和氣洗；不能先算成樣品中的新成分。","trap":"把 purge 當成提高分離選擇性，或所有背景都只能歸因隔膜。","q":"Septum purge 的主要目的是決定排掉多少樣品嗎？","ans":"不是。主要帶走隔膜附近污染；分流排氣才控制分流比例。","p":["揮"],"s":["樣","算"],"l":["空白線"]},{"ch":"GC","L":"L14","title":"頂空取的是哪個容器上方？","ask":"原液濃度相同，改鹽量或瓶內體積，頂空峰必相同嗎？","chain":"瓶內達穩定分配 → 取上方氣體 → 揮發物進 GC","why":"Headspace analysis（頂空分析）取的是樣品瓶上方氣體。多數不揮發基質留在瓶內，降低進樣口污染。所謂「飽和」在題本語境應理解為達到穩定氣液分配，不一定是純物質的飽和蒸氣壓。","ex":"錠劑殘留溶劑經密封瓶加熱與平衡，取上方氣體分析；不是把粉末打到管柱頂端再加熱。","trap":"把 headspace 的 head 看成管柱頭，或讓溫度無上限提高。","q":"原液濃度相同，改鹽量或瓶內體積，頂空峰必相同嗎？","ans":"不必。氣液分配／相比可能改變，需要匹配條件或校正。","p":["極","揮"],"s":["樣","算"],"l":["分配線","溫度線","保留線"]},{"ch":"GC","L":"L15","title":"SPME 與吹氣捕捉如何增加送入的量？","ask":"SPME 是新偵測器，還是送樣前的富集工具？","chain":"先萃取／捕捉濃縮 → 熱脫附 → 較集中送入 GC","why":"Solid-phase microextraction（固相微萃取，SPME）讓分析物分配／吸附到塗層纖維，再熱脫附；可在頂空或直接浸入樣品。Purge-and-trap（吹氣捕捉）以氣流帶出揮發物，再用捕捉阱富集，兩者裝置不同。","ex":"殘留溶劑題的四選一裝置中，SPME 最貼近 GC 的揮發物前處理；PDMS 是常見塗層，還有其他塗層可選。","trap":"所有 SPME 都只能取氣相，或纖維完全吸光樣品。","q":"SPME 是新偵測器，還是送樣前的富集工具？","ans":"前處理／進樣富集工具，仍需 GC 管柱與偵測器。","p":["極","揮"],"s":["樣","測"],"l":["分配線"]},{"ch":"GC","L":"L16","title":"弱鹼進入非極性溶劑前，為何先鹼化？","ask":"同樣溶劑要萃取弱酸 HA，升 pH 還會增加中性態嗎？","chain":"pH 升 → 中性 B 比例升 → 較易進有機相 → 回收可改善","why":"帶電 BH⁺ 較容易留在水相，中性 B 常較能進入 Cyclohexane。先判斷分析物是弱鹼，而不是看到「酸化」就套所有萃取；Dimethylaniline 在此是待測不純物。","ex":"pH=pKa−1 時 B:BH⁺=1:10，中性比例 1/11；pH=pKa+1 時為 10:1，中性比例 10/11。","trap":"把鹼性樣品酸化，卻希望中性物進入非極性萃取液。","q":"同樣溶劑要萃取弱酸 HA，升 pH 還會增加中性態嗎？","ans":"不會。弱酸升 pH 使 A⁻ 增加；酸鹼類型必須先分清。","p":["極","荷"],"s":["樣","算"],"l":["酸鹼線","分配線"]},{"ch":"GC","L":"L17","title":"衍生化到底改了什麼？","ask":"Glycerol 的 TMS 衍生化，TMS 指 NMR 用的 Tetramethylsilane 嗎？","chain":"改官能基／裝偵測特徵 → 揮發／吸附／響應改變 → 核對產物","why":"Derivatization（衍生化）把分析物轉成更適合分離或偵測的產物。遮蔽 alcohols、amines、carboxylic acids 的活性氫常減弱氫鍵／活性點吸附；加含氟標記也可提高某些 ECD 方法響應。效果須依反應與分子核對。","ex":"Glutaraldehyde 可與 PFBHA 形成 oxime 衍生物；題本 C 寫 pentafluorobenzyloxime，嚴格是產物／衍生形式的名稱，不應再稱為實際加的試劑。","trap":"把 TMS 解成 Tetramethylsilane 當矽基化試劑，或把產物名稱與試劑混用。","q":"Glycerol 的 TMS 衍生化，TMS 指 NMR 用的 Tetramethylsilane 嗎？","ans":"不是。此處指 trimethylsilyl／三甲基矽基化，需用可轉移該基團的試劑。","p":["骨","揮","反"],"s":["樣"],"l":["保留線"]},{"ch":"GC","L":"L18","title":"油脂怎麼轉成可分離的甲酯？","ask":"皂化後的羧酸鹽，能直接當作 FAME 注入 GC 嗎？","chain":"選正確甲酯化路徑 → FAME → GC 分離與校正","why":"Fatty acid methyl esters（脂肪酸甲酯，FAME）是常用分析形式。三酸甘油酯可在合適鹼催化甲醇條件進行酯交換；若先皂化則得到脂肪酸鹽，需再用適當酸化／甲酯化步驟。KOH 不會直接產出游離酸。","ex":"只問 Almond oil 的脂肪酸組成或水解後衍生物，用 FAME－GC 是題本指定答案。分析對象是脂肪酸組成，並非必須把完整油脂原樣氣化。","trap":"寫「KOH→游離脂肪酸，再只加甲醇自動變甲酯」而漏化學條件。","q":"皂化後的羧酸鹽，能直接當作 FAME 注入 GC 嗎？","ans":"不能。鹽與甲酯身分不同，需完成適當甲酯化。","p":["揮"],"s":["樣","選","算"],"l":[]},{"ch":"GC","L":"L19","title":"FID 為什麼常測一般有機物？","ask":"火焰燒掉樣品，為什麼仍能算峰面積？","chain":"有機物在火焰中形成帶電物 → 收集離子電流 → 積分與校正","why":"Flame ionization detector（火焰離子化偵測器，FID）以氫氣／空氣火焰產生帶電物，再收集電流。許多有機物反應良好；響應受有效碳結構與異原子影響，不可只數 C–H 鍵。水、CO₂、SO₂ 通常沒有一般有機物的良好響應。","ex":"問題問對 CO₂、SO₂ 靈敏度佳是否正確：錯。問有機物與所有無機物都可測：也錯。","trap":"因為燒掉所以不能定量／規整化，或沒有 C–H 就絕對零響應。","q":"火焰燒掉樣品，為什麼仍能算峰面積？","ans":"電流已被記錄；定量用訊號，不需再回收完整分子。","p":["荷","元"],"s":["源","樣","測","算"],"l":[]},{"ch":"GC","L":"L20","title":"ECD 為什麼是電子電流變小？","ask":"電子被分析物捕捉後，背景電子電流變大還是變小？","chain":"Ni-63 產生電子背景 → 分析物捕捉電子 → 電子電流下降","why":"Electron capture detector（電子捕捉偵測器，ECD）中，Ni-63 的 β 粒子使氣體產生電子，形成穩定背景。易捕捉電子的物質進來後，可供收集的電子減少。儀器可把此變化顯示成向上色譜峰，原始電子電流仍下降。","ex":"題本四個結構中，Hexane 是飽和碳氫物，ECD 反應弱；含鹵素或 nitro compounds 的選項更適合。","trap":"把色譜峰朝上誤認成電子電流增高，或把硝基 NO₂ 寫成腈基 C≡N。","q":"電子被分析物捕捉後，背景電子電流變大還是變小？","ans":"變小。題本問原理時看電子被拿走；色譜軟體的峰方向另說。","p":["揮"],"s":["測"],"l":["空白線"]},{"ch":"GC","L":"L21","title":"TCD 怎麼從熱傳導讀出成分？","ask":"TCD 的訊號來自燃燒嗎？","chain":"混合氣體熱傳導改變 → 熱絲溫度／電阻改變 → 電橋訊號","why":"Thermal conductivity detector（熱傳導偵測器，TCD）比較純載氣與流出混合氣體的熱傳導。以高熱傳導 He 為載氣時，多數分析物降低散熱，使熱絲變熱、電阻上升。方向與載氣／分析物有關，不是每種分析物都帶走更多熱。","ex":"要測常規 FID 不容易測的永久氣體，可考慮適當 TCD 方法；仍要保證與載氣熱傳導差足夠。","trap":"TCD 不挑所以無條件能檢出一切，或以為不破壞即可免響應校正。","q":"TCD 的訊號來自燃燒嗎？","ans":"不是。來自熱傳導引起熱絲溫度與電阻變化，所以一般非破壞。","p":["揮"],"s":["測"],"l":["溫度線","保留線"]},{"ch":"GC","L":"L22","title":"含 N/P 的低量物，為何考慮 NPD？","ask":"含 N 的蛋白質可以直接因為 NPD 而上 GC 嗎？","chain":"熱離子源選擇性響應 N/P → 降低部分背景影響 → 校正低量物","why":"Nitrogen–phosphorus detector（氮磷偵測器，NPD）或 Nitrogen-selective detector（選氮偵測器）以含鹼金屬的熱離子源對 N/P 分子產生選擇性訊號。不是見到有機物就只能選 FID。","ex":"Bupivacaine 含 N，題目限定 TCD、FID、radiochemical、nitrogen-selective 四項，選氮偵測器有較好選擇性。","trap":"把藥物分類背錯，或宣稱 NPD 永遠比 GC-MS 更好。","q":"含 N 的蛋白質可以直接因為 NPD 而上 GC 嗎？","ans":"不行。先過完整氣化門檻，偵測器不能解決非揮發性。","p":["量","揮"],"s":["源","選","測","算"],"l":["空白線"]},{"ch":"GC","L":"L23","title":"要知道身分，該讀質譜還是普通面積？","ask":"只有一個相同 tR 的峰，能證明一定是同一物嗎？","chain":"分離後取得光譜／質譜 → 同條件比對 → 增加鑑別證據","why":"Mass spectrometric detector（質譜偵測器，MSD）給 m/z 與離子相對強度；GC–FT-IR 給波數與吸收。FID/TCD 的時間－峰面積資訊較少；GC-MS 常用 EI library（電子游離質譜庫）協助識別，但配對分數不是唯一身分證據。","ex":"Q052 的選項含 MSD，選 MSD；Q033 只有 FID、TCD、radiochemical、FT-IR，化學結構解析選 FT-IR。這兩題不構成永遠的 MS／IR 排名。","trap":"所有題只要出現 MS 必選 MS，或 GC-MS 能完整量任何高分子。","q":"只有一個相同 tR 的峰，能證明一定是同一物嗎？","ans":"不能。不同物可共流出，需進一步光譜／質譜、標準品或其他專一性證據。","p":["揮"],"s":["選"],"l":[]},{"ch":"GC","L":"L24","title":"內標怎麼補掉共同變動？","ask":"萃取之後才加內標，能自動補掉之前所有萃取損失嗎？","chain":"共同波動 → 面積比抵消一部分 → 依校正算含量","why":"Internal standard（內部標準品，IS）要穩定、原樣不含、峰能分開，且能與分析物經歷想補償的步驟。同樣進樣體積增加 5%，兩者面積一起乘 1.05，面積比便不變；不同回收／響應變化不能保證抵消。","ex":"Ethanol 題本指定 Acetone，舊講義另列 Propan-1-ol；先取得面積比的校正，不能只取 AX/AIS 就當質量百分比。","trap":"待測雜質 Dimethylaniline 被錯當內標；或補不了的誤差也被說成全部消除。","q":"萃取之後才加內標，能自動補掉之前所有萃取損失嗎？","ans":"不能。未共同經歷萃取；要提早加入合適內標並驗證。","p":["極"],"s":["樣","算"],"l":["分配線","標準曲線線"]},{"ch":"GC","L":"L25","title":"面積百分比何時可當組成百分比？","ask":"漏掉一個完全沒訊號的成分，積分總和仍100%，結果可信嗎？","chain":"確認皆測到 → 響應相等或校正 → 規整化 → 定義組成基準","why":"Area normalization（面積規整化）將各峰面積除以合計。要近似質量比例，須完整測到目標組成且有相容響應；一般要用靈敏度／響應因子校正。不見水的 FID 結果即使加總 100%，也不是包含水的整樣百分比。","ex":"兩個面積 80、20，看似 80%／20%；若每單位質量響應是 2、1，校正量為 40、20，比例變 2/3 與 1/3。","trap":"所有面積都能直接當含量，或選通用 TCD 即所有響應相等。","q":"漏掉一個完全沒訊號的成分，積分總和仍100%，結果可信嗎？","ans":"不能當整樣組成。100%只是已測得峰的加總比例。","p":["揮"],"s":["算"],"l":[]},{"ch":"GC","L":"L26","title":"不同天量測，驗的是哪層精密度？","ask":"98、100、102 的平均100且RSD小，便證明樣品真值100嗎？","chain":"同短期／同實驗室變動／跨實驗室 → 定精密度層次 → 查完整流程","why":"Repeatability（重複性）關注短期同條件；Intermediate precision（中間精密度）關注同實驗室的不同天、人員或設備；Reproducibility（再現性）關注跨實驗室。Accuracy（準確度）則看接近真／參考值與否。","ex":"同一溶液重複注射檢查的是進樣與系統重複性；完整方法重複性還需獨立製樣。加標回收是評估準確度的辦法之一，不等於只看 RSD。","trap":"很接近的三次結果一定準確，或一次反複注射替代所有製樣變異。","q":"98、100、102 的平均100且RSD小，便證明樣品真值100嗎？","ans":"不行。重複靠近只顯示精密度；準確度須有參考／加標等證據。","p":["整"],"s":["樣","算"],"l":[]},{"ch":"GC","L":"L27","title":"訊號大、斜率高、檢出限低是同一件事嗎？","ask":"Splitless 讓進柱量增多，是否自動令 FID 每ng 的響應加倍？","chain":"增送入量／適當響應 → 訊噪比可改善 → 仍驗證檢出／定量能力","why":"Sensitivity（靈敏度）嚴格常指校正斜率；Detection limit（檢出限）還受雜訊及基質影響。國考口語常把能測低濃度也叫靈敏度；作答仍須分清偵測器特性、進柱量及最終方法表現。","ex":"同樣 1 ng 進柱得到同樣面積；把樣品由 1 ng 改成 2 ng 可使訊號增大，卻不表示偵測器每 ng 的響應斜率自動改變。","trap":"將題本「降低動相擴散度」不是常規直接策略，擴成所有流速／峰寬與檢出限無關。","q":"Splitless 讓進柱量增多，是否自動令 FID 每ng 的響應加倍？","ans":"不會。進柱量增加與偵測器本身響應是兩件事。","p":["揮"],"s":["測","算"],"l":["解析度線","雜訊地板"]},{"ch":"SFC","L":"L01","title":"先問要萃取，還是要把成分分開測量","ask":"取出農藥殘留的前處理，與報告農藥含量，是同一個步驟嗎？","chain":"目的 → 取出或柱分離 → 選讀數 → 安排後續測量","why":"Supercritical fluid extraction（超臨界流體萃取，SFE）讓目標物離開基質；supercritical fluid chromatography（超臨界流體層析，SFC）利用移動相與固定相作用的差異，使成分先後到達。SFE可選擇性取出部分成分，但萃取器的吸附捕集床不因此自動成為分析分離柱。","ex":"錠劑中的Vitamin E先由SFE取出，再以SFC–UV分離與校正；兩段任務都要交代。","trap":"只看到CO₂或一根管子，就把SFE和SFC當同一方法。","q":"取出農藥殘留的前處理，與報告農藥含量，是同一個步驟嗎？","ans":"不是。取出是SFE的任務；含量還需適合的分離偵測、校正與回收證據。","p":["極"],"s":["樣","選","算"],"l":["分配線"]},{"ch":"SFC","L":"L02","title":"不必氣化，仍然必須溶得進去","ask":"熱敏但在候選SFC移動相中不溶的樣品，能直接做嗎？","chain":"GC氣化受限 → 評估SFC溶解與穩定 → 試分離 → 與LC比較","why":"GC常需完整氣化；SFC可以直接輸送溶在加壓移動相中的非揮發性物質，降低某些樣品的熱負荷。但不揮發只移除一個門檻，沒有移除溶解度、離子性、吸附或析出問題。HPLC也能分析非揮發與熱敏物，並非只能在高溫做。","ex":"可溶的小分子藥物或某些寡聚物可以試SFC；不能由「大分子」三字認定所有蛋白質都適合。","trap":"低溫、高效率就只能選SFC；或全部大分子皆適用。","q":"熱敏但在候選SFC移動相中不溶的樣品，能直接做嗎？","ans":"不能。要調整可相容製樣、移動相與柱，或比較LC等方法；低臨界溫度不會自動解決不溶。","p":["極","揮"],"s":["源","樣","選"],"l":["分配線","溫度線","保留線"]},{"ch":"SFC","L":"L03","title":"純CO₂的兩道門，與混合移動相的界線","ask":"純CO₂ 40°C、50bar算超臨界嗎？混合CO₂–甲醇可用同一判法嗎？","chain":"辨純物或混合物 → 統一單位 → 同時比較T與P → 限定相態結論","why":"Critical point（臨界點）是液–氣共存曲線的終點。純CO₂在適用相區同時超過臨界溫度與壓力，才在超臨界區；超過溫度一條線不夠。接近臨界區，密度對T、P很敏感。加入有機改質劑後，混合物相界會改變；SFC作為方法名稱也包含某些次臨界／緻密CO₂流體操作。","ex":"純CO₂ 40°C、100bar通過兩道門；20°C、100bar沒有通過溫度門。若另有20%甲醇，不能只按純CO₂常數判混合相態。","trap":"把「非純CO₂超臨界」直接說成「SFC一定不能分離」。","q":"純CO₂ 40°C、50bar算超臨界嗎？混合CO₂–甲醇可用同一判法嗎？","ans":"前者不算，壓力低於Pc；混合物不能只用純CO₂常數，需相態與操作證據。","p":["極"],"s":["源"],"l":["分配線","溫度線"]},{"ch":"SFC","L":"L04","title":"為什麼常用CO₂，又為什麼要改質劑","ask":"CO₂的C=O鍵有極性，為什麼整個分子卻沒有永久淨偶極？","chain":"低臨界溫度與可取得 → 常選CO₂ → 極性溶解不足 → 評估改質劑","why":"CO₂易取得、成本相對低且不可燃，臨界溫度約31.1°C，適合在溫和溫度研究某些熱敏樣品。線性O=C=O的兩個C=O鍵偶極互相抵消，永久淨偶極為零；這不代表沒有任何分子間作用。減壓後CO₂容易與收集物分離，回收效果仍看設備與流程。","ex":"Q002把「高極性」列成CO₂優點，恰是錯誤選項；Methanol是常見改質劑，不能因此把它說成最常用主要流體。","trap":"經濟、不可燃被推成所有條件都安全、所有熱敏物都穩定或無條件環保。","q":"CO₂的C=O鍵有極性，為什麼整個分子卻沒有永久淨偶極？","ans":"它是線性對稱分子；兩個等大、反向的鍵偶極互相抵消。這仍不能推出對所有極性物完全零作用。","p":["骨","極"],"s":["樣"],"l":["分配線","溫度線","保留線"]},{"ch":"SFC","L":"L05","title":"較低黏度和較快擴散，分別幫什麼忙","ask":"D較大，是否代表所有流速下H一定較小？","chain":"較低黏度／較大D → 流動與移動相質傳較快 → 評估峰寬 → 測實際效率","why":"黏度（viscosity，η）描述流動阻力；擴散係數（diffusion coefficient，D）描述濃度不均被抹平的速度。移動相中擴散較快可減少部分質傳延遲，但也可能增加縱向擴散。固定相內的質傳、柱外體積與進樣展寬仍存在；不能用一個D大小保證全部峰都窄。","ex":"Q004的A在教材一般比較下成立；實驗若柱外管線太長，仍可能得到寬峰。","trap":"把擴散快說成完全沒有展寬，或把比較基準偷換成氣體。","q":"D較大，是否代表所有流速下H一定較小？","ans":"不是。移動相質傳有利，但縱向擴散及其他展寬項仍要一起看，需測流速–效率關係。","p":["極"],"s":["源"],"l":["分配線","解析度線"]},{"ch":"SFC","L":"L06","title":"壓力先改密度，時間還要看流動條件","ask":"固定t₀時加壓使k下降，tR怎樣？如果t₀也變了呢？","chain":"P上升 → ρ通常上升 → 溶解力常增強 → k常下降","why":"Density（密度，ρ）是每單位體積有多少流體。緻密CO₂的溶解能力常隨密度變大而增強，分析物對移動相的偏好提高，保留因子k常下降。保留時間tR=t₀(1+k)；若t₀也改變，時間方向不能只由k推定。壓力可對不同成分產生不同影響，所以也可能改變α或SFE萃取選擇性。","ex":"若t₀固定2min，k由4降為2，tR由10降為6min；若t₀沒控制，就先量t₀再比較。","trap":"提高BPR設定就等於流速變快；或壓力只能動全部保留、絕不動α。","q":"固定t₀時加壓使k下降，tR怎樣？如果t₀也變了呢？","ans":"固定t₀時tR下降；t₀改變時要用tR=t₀(1+k)合看，不能只憑加壓判。","p":["整"],"s":["樣"],"l":["分配線","保留線"]},{"ch":"SFC","L":"L07","title":"溫度同時改兩邊，不能硬背單向","ask":"沒有T–保留數據，只知道定壓升溫，能斷定α上升嗎？","chain":"T變化 → 密度與分析物平衡同變 → 效應相加 → 讀實際k與α","why":"定壓升溫通常使流體密度下降，可能削弱溶解力；同時分析物的脫附、溶解與分配平衡也改變，某些成分揮發傾向提高。兩組效應不必同向，也不必對每個成分等大。這是競爭效應，不是「升溫必定使流體洗提力增加」的另一條通則。","ex":"兩成分升溫後一個早出、一個晚出，並不違反原理；先算各k與α，再判方法是否改善。","trap":"把GC常見升溫早出模式原封搬到所有SFC條件。","q":"沒有T–保留數據，只知道定壓升溫，能斷定α上升嗎？","ans":"不能。密度與成分平衡一起變，兩者變幅不明；需各成分k資料。","p":["整"],"s":["選"],"l":["分配線","溫度線"]},{"ch":"SFC","L":"L08","title":"改質劑改溶解，也改表面作用","ask":"兩峰加甲醇後都早出，能說α變大嗎？","chain":"改質劑／添加物 → 溶解與表面作用改變 → 各成分k不同幅改變 → 量α與Rs","why":"Modifier（改質劑／修飾劑）常是Methanol等有機溶媒。它可改移動相溶解能力，也可競爭固定相表面位點或藉添加物改變離子狀態，因此不同分析物的保留變幅可能不同。提高比例可能使所有峰提早，但α可能增加、減少或不變；梯度改質也很常用。","ex":"Q003在四選項中，加入有機溶媒最直接對應相對作用改變，題本B；不是宣稱壓力與溫度完全無關。","trap":"極性問題必然只靠甲醇、一定救得回；或者α一定增加。","q":"兩峰加甲醇後都早出，能說α變大嗎？","ans":"不能。要先扣t₀並比較k比值，再看峰寬計算Rs；一起早出不代表相對差增大。","p":["極"],"s":["樣"],"l":["分配線","保留線"]},{"ch":"SFC","L":"L09","title":"選擇因子比的是扣掉路程後的相對保留","ask":"t₀=2、tR1=6、tR2=10min，α多少？","chain":"先扣t₀ → 得額外保留 → 比k2/k1 → 判相對保留","why":"Retention factor（保留因子，k）=(tR−t₀)/t₀，比的是多留下的時間相對於流路時間。Selectivity factor（選擇因子，α）=k2/k1；同一t₀約掉後，α=(tR2−t₀)/(tR1−t₀)。分母若是無保留成分k1=0，這個α就不可用。","ex":"t₀=1、tR1=3、tR2=5min：α=(5−1)/(3−1)=2，不能直接算5/3。","trap":"用原始tR相除，或把梯度下觀察時間比當不變的熱力學α。","q":"t₀=2、tR1=6、tR2=10min，α多少？","ans":"α=(10−2)/(6−2)=8/4=2；無單位。同時k1=2、k2=4。","p":["極"],"s":["選","算"],"l":["分配線","歸一線"]},{"ch":"SFC","L":"L10","title":"峰中心分開，還要檢查峰寬","ask":"改質後α較大、峰卻變寬，可直接說Rs改善嗎？","chain":"中心距與峰寬 → Rs → 核對積分干擾 → 判分離可用性","why":"Resolution（解析度，Rs）=2(tR2−tR1)/(Wb1+Wb2)。中心相距相同而峰較窄，Rs會較大；α只描述相對保留，不包含全部峰寬。常見近似Rs約1.5達基線分離，仍需看不對稱峰、濃度比、方法判準與干擾。","ex":"中心6與10min、兩個基線寬各4min：Rs=1；寬度各降到2min：Rs=2，α可以原樣不動。","trap":"α>1就等於定量沒有共洗脫；把面積當成峰寬。","q":"改質後α較大、峰卻變寬，可直接說Rs改善嗎？","ans":"不能。要讀中心距與相應峰寬；α和Rs不是同一量。","p":["極"],"s":["選"],"l":["空白線","解析度線"]},{"ch":"SFC","L":"L11","title":"柱外形與表面化學，回答不同問題","ask":"同為packed column，是否應有相同α？","chain":"辨柱結構 → 辨表面作用 → 各成分保留與展寬 → 篩選分離","why":"Open-tubular column（開管柱）中固定相在內壁；packed column（填充管柱）含填料。這是外形分類，不能拿來代替「吸附／分配／手性辨識」或矽膠、Diol等表面化學。現代填充柱SFC常需同時篩柱與改質劑；同為填充柱也可有完全不同選擇性。","ex":"兩支同尺寸填充柱，一支Silica、一支Diol，可得到不同順序；同樣的幫浦比例也不能保證相同α。","trap":"把「固定相兩種」直接寫成開管與填充，遺漏真正在接觸分子的表面。","q":"同為packed column，是否應有相同α？","ans":"否。填料表面化學、條件與分析物作用不同；結構名稱沒有決定相對保留。","p":["極"],"s":["選"],"l":["分配線"]},{"ch":"SFC","L":"L12","title":"把CO₂與改質劑穩定送進柱","ask":"泵送10%甲醇，能直接說柱內每100mL有10mL甲醇嗎？","chain":"穩定供液與比例 → 混合／進樣 → 恆溫柱分離 → 保存條件與訊號","why":"SFC常用液態CO₂供應與專用幫浦，另用脫氣後有機改質劑幫浦，先混合再進樣。冷卻供液降低汽化、空穴與輸送不穩的問題；柱爐設定柱溫。幫浦標示的體積流量或百分比是指定供液基準，並非已知柱內實際緻密流體體積或莫耳比。","ex":"設定總供液2.0mL/min、改質劑10%：泵送基準為0.20與1.80mL/min；柱內體積流量還需密度資料。","trap":"把溶液已溶解當作混入CO₂後也一定不析出；把進樣溶媒當成整段移動相。","q":"泵送10%甲醇，能直接說柱內每100mL有10mL甲醇嗎？","ans":"不能。幫浦比例的體積參考條件與柱內壓縮／混合體積不同；需明確定義與物性。","p":["極"],"s":["樣","選","算"],"l":["分配線","保留線"]},{"ch":"SFC","L":"L13","title":"BPR控制出口壓力，不控制每處同一密度","ask":"Pout變高是否就證明流速變快？tR漂移怎樣檢查？","chain":"BPR穩出口P → 影響柱內壓力分布 → 影響密度與保留 → 量重現性","why":"Back-pressure regulator（背壓調節器，BPR）建立並控制出口背壓，讓上游保有適合的加壓移動相。柱內有壓降ΔP=Pin−Pout，不能說沿柱壓力與密度全相同。幫浦送液和BPR控出口是不同角色；固定流量時升背壓通常同時抬高入口壓力，沒有自動讓流速加倍。","ex":"Pout=100bar、ΔP=30bar，Pin=130bar。若相同流動條件下ΔP近似不變、Pout改140bar，Pin約170bar。","trap":"BPR只是安全閥；或所有tR漂移都必定是BPR壞。","q":"Pout變高是否就證明流速變快？tR漂移怎樣檢查？","ans":"不能。另讀流量與t₀；漂移要對照壓力、T、比例、漏液／進樣等紀錄，BPR只是一個候選。","p":["整"],"s":["選"],"l":["分配線"]},{"ch":"SFC","L":"L14","title":"UV先量吸收，峰面積再靠校正變含量","ask":"UV峰面積變兩倍，能直接說檢品含量兩倍嗎？","chain":"柱後吸收訊號 → 時間積分 → 校正濃度 → 判含量","why":"Ultraviolet detector（紫外光偵測器，UV）讀吸收，訊號隨時間形成色譜峰；選波長、背景及基線都會影響可積分性。峰面積不是質量的同義詞，須在適用濃度與條件下對標準校正；同一保留時間也不證明唯一身分。","ex":"Vitamin E相關方法若使用UV，波長與標準要先確認；改質劑梯度可能改基線，需跑空白。","trap":"沒有吸收的分析物仍靠同一UV設定保證可見；峰高直接當含量。","q":"UV峰面積變兩倍，能直接說檢品含量兩倍嗎？","ans":"需先確認進樣量、響應校正、背景與分離都相容；滿足條件才可按校正關係換算。","p":["色"],"s":["樣","算"],"l":[]},{"ch":"SFC","L":"L15","title":"MS需要減壓與離子化，不是高壓管路的終點","ask":"換偵測器能把原本共洗脫兩峰的柱上α變大嗎？","chain":"受控減壓／補液 → 離子化 → m/z與強度 → 合併鑑別或校正","why":"Mass spectrometry（質譜，MS；舊筆記MASS）分析離子質荷比m/z與訊號強度。CO₂減壓後氣化，make-up solvent（補加溶媒）協助把分析物維持在合適介面；基質可造成離子抑制。圖4示範分流配置，並非所有SFC–MS唯一接法。不可把真空MS画成可承受整段高壓的串聯流通池，再把BPR放在MS後。","ex":"UV可先在高壓端讀；小支流經限流／補液送MS。也有BPR減壓後送MS的系統，需按製造商配置。","trap":"有一個相同m/z就證明結構唯一；換MS會改柱前α。","q":"換偵測器能把原本共洗脫兩峰的柱上α變大嗎？","ans":"不能直接改柱上α。MS可能提供不同離子通道以辨認，但柱上分離仍須分開評估。","p":["量","荷","反"],"s":["選","測","算"],"l":["酸鹼線","歸一線"]},{"ch":"SFC","L":"L16","title":"FID可接，但要有相容介面與背景","ask":"為何CO₂低背景不等於加大量甲醇仍然低背景？","chain":"流出物經限流 → 氫／空氣火焰離子化 → 電流峰 → 校正有機物","why":"Flame ionization detector（火焰離子化偵測器，FID）對多數可響應有機物的火焰離子電流敏感。CO₂的碳已高度氧化，FID響應低，純CO₂方法可有低碳背景；大量甲醇卻不能用同一句理由保證沒背景。H₂與空氣供給火焰，角色不同於柱的移動相。","ex":"開管SFC的純CO₂–FID是可理解的歷史配置；改用高比例甲醇就要重查背景、介面與量測範圍。","trap":"HPLC「永遠不能」接FID；或UV、MS、FID全串在同一條高壓線。","q":"為何CO₂低背景不等於加大量甲醇仍然低背景？","ans":"甲醇會對FID產生有機碳響應；需看其比例與介面。一般LC液流直接送FID不相容，特殊去溶媒介面另論。","p":["荷","元"],"s":["源","測","算"],"l":["酸鹼線","空白線"]},{"ch":"SFC","L":"L17","title":"SFE先把成分從基質搬到收集端","ask":"第一段萃取很快，是否證明沒有待測物殘留在基質？","chain":"流體進基質 → 溶解／解吸與傳質 → 減壓或捕集 → 交後續分析","why":"SFE中流體先穿入基質，再溶解可萃成分；成分還要從顆粒內部移出，最後在減壓分離器、溶媒或捕集材料中收集。密度、改質、水分、流量與接觸時間都可能影響回收。流體傳質較快是有利條件，但實際萃取量還可能受基質內擴散與溶解平衡限制。","ex":"Q001的B說不適用於不安定化合物，太絕對；在適合的溫和條件下可萃某些熱敏物，但要實測穩定與回收。","trap":"把萃取快當作已完全取出；把SFE集得混合物當成已完成色譜分離。","q":"第一段萃取很快，是否證明沒有待測物殘留在基質？","ans":"沒有。需後續萃取／加標回收或參考方法等證據；快不是完全的證明。","p":["極"],"s":["樣"],"l":["分配線","空白線","保留線"]},{"ch":"SFC","L":"L18","title":"應用清單要保留，範圍也要保留","ask":"「CO₂能溶疏水有機物」能證明可直接去除所有重金屬嗎？","chain":"辨案例目的 → 檢查化學／基質條件 → 測可萃性與分離 → 限定可支持結論","why":"舊筆記列SFC分析Triton X-100、殺蟲劑、多芳香族化合物、Dimethylpolysiloxane oligomers與非離子界面活性劑，其中有重疊類別。SFE列Vitamin A／Vitamin E及酯類錠劑前處理。另有「淨米去農藥／重金屬、免洗、保留營養」的舊說法，目前來源不足，不能把它寫成純CO₂對所有米樣的既定效果。","ex":"金屬離子本來不易溶於非極性CO₂；原始研究用特定螯合配體與改質劑萃取金屬，不能由此推到米中所有金屬或食用處理結論。","trap":"把SFE維生素萃取直接寫成含量測定，或把舊加工宣稱當驗證完的效果。","q":"「CO₂能溶疏水有機物」能證明可直接去除所有重金屬嗎？","ans":"不能。金屬化學形態、配體、基質與實測萃取條件都要確認，還需處理前後分析證據。","p":["極","元"],"s":["選"],"l":["分配線","空白線"]},{"ch":"SFC","L":"L19","title":"校正、稀釋與回收，三個角色分開算","ask":"c=2μg/mL、V=50mL，另10倍稀釋後才測，原檢品1g，含量多少？","chain":"訊號校正成c → 還原萃取總量 → 除檢品質量 → 查回收與品質","why":"校正先把訊號換成溶液濃度；總量m=c×V×稀釋倍數，檢品含量再除原檢品質量。加標回收率=(加標後測得量−原本測得量)/加標量×100%。本例以等量平行檢品在製樣前加標，使用同一質量基準。回收是方法表現證據，不能未驗證就把每個結果一律除以回收百分比。","ex":"c=4μg/mL、V=25mL、檢品0.50g且無額外稀釋：得100μg、200μg/g。原20、製樣前加10、加標後29μg：回收90%。","trap":"c直接當錠劑含量；或一個90%回收便自動修正所有檢品。","q":"c=2μg/mL、V=50mL，另10倍稀釋後才測，原檢品1g，含量多少？","ans":"總量2×50×10=1000μg；含量1000μg/g。稀釋倍數乘回，回收另查。","p":["極"],"s":["樣","算"],"l":["分配線"]},{"ch":"SFC","L":"L20","title":"看到漂移，先列原因，再用紀錄區分","ask":"tR全穩、檢品面積低，唯一原因是SFE回收差嗎？","chain":"發現異常 → 列候選原因 → 用另一讀數區分 → 修正重測","why":"若tR漂移，壓力／BPR、溫度、流量與t₀、改質比例、漏液、柱狀態都是候選。若時間穩但面積變，還要看進樣量、基線、偵測響應、回收與基質效應。依證據選回M02修條件或M03重核讀數；目的與適用性錯了才回M01。","ex":"壓力平穩但甲醇泵比例不重現，不能只換BPR；標準峰面積也同時飄，就先查共同供液／進樣／偵測因素。","trap":"由「BPR不穩能使tR漂移」反推「tR漂移一定是BPR不穩」。","q":"tR全穩、檢品面積低，唯一原因是SFE回收差嗎？","ans":"不是。需比較標準、加標、基線、進樣與基質效應等，回收差只是候選之一。","p":["極"],"s":["樣","算"],"l":[]},{"ch":"CE","L":"L01","title":"CE 先回答什麼，什麼才算分開","ask":"兩個中性物的自身電泳都為零，普通 CZE 能靠 EOF 分開嗎？","chain":"目的 → 選分離機制 → 不同區帶到達 → 用適合證據判讀","why":"Capillary electrophoresis（毛細管電泳，CE）是一個方法家族。先把混合物拆成可辨的區帶，再用標準比對或校正決定身分、含量。第一輪以 Capillary zone electrophoresis（毛細管區帶電泳，CZE）為起點：同一背景液內，不同有效淌度形成不同到達時間。","ex":"兩個中性物在普通 CZE 都隨 EOF 到達，同一時間的訊號不能證明只有一種物質。","trap":"一個峰就等於一個純物質。","q":"兩個中性物的自身電泳都為零，普通 CZE 能靠 EOF 分開嗎？","ans":"不能；EOF 是共同行進，須另引入相互作用或分配差異。","p":["荷"],"s":["選"],"l":[]},{"ch":"CE","L":"L02","title":"電場會把帶電物推向哪裡","ask":"陰離子自身向陽極，強 EOF 向陰極時能到陰極端嗎？","chain":"電極位置 → 電場由＋到− → 電荷受力 → 自身電泳方向","why":"Electrophoresis（電泳）來自電場對電荷的力。正離子自身往陰極，負離子自身往陽極；這個方向只描述相對於液體的運動，液體本身還可能流動。Electroosmotic flow（電滲流，EOF）是液體的整體位移，不是另一個額外電壓來源。","ex":"左陽極、右陰極：正離子自身向右，負離子自身向左。","trap":"負離子自身向左，就斷言它一定不能到右端。","q":"陰離子自身向陽極，強 EOF 向陰極時能到陰極端嗎？","ans":"可能；要比較兩者相加後的方向。","p":["荷"],"s":["選"],"l":[]},{"ch":"CE","L":"L03","title":"淌度與速度，電壓到底改哪一個","ask":"題目問「無法提高淌度」，增加電壓是否答案？","chain":"同一介質的 μ → 乘電場 E → 速度 v → 遷移時間","why":"Electrophoretic mobility（電泳淌度，μep）是速度除以電場。球形水合離子受電力 qE 與 Stokes drag（斯托克斯阻力）6πηrv 平衡，得 μep=q/(6πηr)。同一電荷、溫度及介質下，增加 E 改 v，不直接改 μ。","ex":"E 加倍而 μ 固定，v 加倍、走同一距離的時間減半。","trap":"提高電壓引起發熱，卻仍把黏度當完全不變。","q":"題目問「無法提高淌度」，增加電壓是否答案？","ans":"是，在固定溫度與介質的題設下；若問速度，增加電場可以提高。","p":["荷"],"s":["源"],"l":["歸一線"]},{"ch":"CE","L":"L04","title":"管壁怎麼讓整桶水一起走","ask":"中性標記也會移動，是因為它獲得正電嗎？","chain":"Silanol 去質子化 → 負表面及電雙層 → 可動反離子受力 → 拖動水","why":"Electric double layer（電雙層）在帶電表面附近形成。未改質 Fused silica 內壁的 Silanol 可解離為 Si–O⁻。擴散層內可動的正反離子朝陰極移動並帶動液體；不是把所有緊貼表面的離子都當成可動。","ex":"常規裸石英、pH 7：電場與 EOF 都由陽極指向陰極。","trap":"把外壁保護塗層和內壁 EOF 塗層混成同一層。","q":"中性標記也會移動，是因為它獲得正電嗎？","ans":"不是；它被整體液流帶著走。","p":["荷"],"s":[],"l":["酸鹼線"]},{"ch":"CE","L":"L05","title":"EOF 的大小與正負號如何寫","ask":"相同 μEOF，管內徑加倍，體積流量是否仍相同？","chain":"表面狀態決定 ζ → μEOF=−εζ/η → 乘 E → EOF 速度","why":"Zeta potential（界達電位，ζ）是滑移面處的電位，不等於表面固定電荷本身。薄電雙層近似中 μEOF=−εζ/η；裸石英 ζ<0，正常 E>0，故 EOF>0。只比較大小可用 |μEOF|∝ε|ζ|/η。","ex":"η 加倍、其餘固定，|μEOF| 減半。","trap":"省掉負號又把負 ζ 當成會使 EOF 朝陽極。","q":"相同 μEOF，管內徑加倍，體積流量是否仍相同？","ans":"不同；Qflow=vEOF×截面積，面積變四倍。淌度與體積流量是不同量。","p":["荷"],"s":["選"],"l":["歸一線"]},{"ch":"CE","L":"L06","title":"把兩個速度相加，誰真的到得了","ask":"EOF +4、陰離子 −6，能算出正的到達時間嗎？","chain":"μEOF＋μep → μapp → vapp → 到達或無法到達","why":"Apparent mobility（表觀淌度）在普通 CZE 為 μapp=μEOF+μep。中性物 μep=0。正常陰極端偵測時，正離子加速、中性跟水、負離子逆水抵消一部分；負離子只有在總速度仍向偵測端時才形成那個到達峰。","ex":"EOF +4、正離子 +2、中性 0、陰離子 −1，總速度依序 +6、+4、+3（相同單位），先後為＋、0、−。","trap":"所有陰離子都能到；或把陰離子 μep 取正值相加。","q":"EOF +4、陰離子 −6，能算出正的到達時間嗎？","ans":"不能；總速度 −2 向反方向。在此固定出口配置下沒有正的到達時間。","p":["荷"],"s":["選"],"l":[]},{"ch":"CE","L":"L07","title":"只切換正負電壓，能直接反轉峰序嗎","ask":"正表面、入口陰極、出口陽極，EOF 強且朝出口，哪類自身電泳與 EOF 同向？","chain":"先標電極 → 畫 EOF 與 EP → 相加 → 再判出口","why":"Reverse polarity（反向極性）只說進出口電極互換。裸石英 EOF 仍往陰極；若陰極被換到進樣端，液流可能遠離原偵測窗。要得到陰、0、陽的到達順序，還需例如正表面使 EOF 指向陽極端，且足夠帶走三者。","ex":"入口陰極、出口陽極且裸石英：EOF 朝入口，中性物不能單靠它到出口。","trap":"負電壓一出現就照抄陰→中→陽。","q":"正表面、入口陰極、出口陽極，EOF 強且朝出口，哪類自身電泳與 EOF 同向？","ans":"陰離子；此限定配置才可得到陰、0、陽的常規順序。","p":["荷"],"s":["源","選"],"l":[]},{"ch":"CE","L":"L08","title":"pH 與 pKa 怎麼翻成有效電荷","ask":"弱鹼在 pH=pKa 時，有正電的比例是多少？","chain":"比較 pH−pKa → 比例 → 帶電分率 → μep 符號","why":"Henderson–Hasselbalch equation（韓德森–哈塞爾巴赫方程）給酸 [A⁻]/[HA]=10^(pH−pKa)，給鹼 [BH⁺]/[B]=10^(pKa−pH)。pH 升高代表較少質子：酸變負，鹼失正。離子化快速交換時有效 μ 是各形態加權平均。","ex":"酸 pKa 5、pH 6：A⁻:HA=10:1；鹼 pKa 8、pH 6：BH⁺:B=100:1。","trap":"「pH 上升，所有電荷都消失」把酸判反。","q":"弱鹼在 pH=pKa 時，有正電的比例是多少？","ans":"1/2；不是全部中性，正電形態仍有一半。","p":["荷"],"s":["算"],"l":["酸鹼線"]},{"ch":"CE","L":"L09","title":"看結構時，哪些基團真的可以判電荷","ask":"Amide 和 Amine 的氮在同一 pH 是否必然帶相同電荷？","chain":"找 Carboxyl／Amine 等 → 核對 pKa → 合併平均電荷 → 定方向","why":"Carboxyl 常可形成 Carboxylate；Amine 是否質子化須比其 BH⁺ 的 pKa。Amide 的氮不能等同普通 Amine。普通 Alcohol 與 Phenol 的酸性不同；有芳香環不代表分子沒有可解離位點。","ex":"Q04 的 blocker acid 也含 Amine；不能忽略它。題設 pH 9.7 下 Carboxyl 的負電貢獻使其較中性 diol 晚到，Atenolol 保留部分正電而較早到。","trap":"所有 NH₂ 都寫成 NH₂⁺；Primary Amine 接 H⁺ 後應為 NH₃⁺。","q":"Amide 和 Amine 的氮在同一 pH 是否必然帶相同電荷？","ans":"否；共振及共軛酸 pKa 不同。原題須保留真正結構，不能只數 N。","p":["荷"],"s":[],"l":["酸鹼線"]},{"ch":"CE","L":"L10","title":"pI 為什麼能聚焦，也能接到明膠","ask":"pH=pI 且 EOF 不為零，蛋白質必然停在原處嗎？","chain":"pH 比 pI → 平均淨電荷 → 自身 EP → 聚焦或相互作用","why":"Isoelectric point（等電點，pI）是平均淨電荷為零的 pH。pH<pI 偏正、pH>pI 偏負，但 pI 不表示所有位點都無電荷；有 EOF 時仍可被液體搬走。保留舊筆記的 Gelatin 跨章例：Type A 酸製程常見 pI 7–9，Type B 鹼製程舊表 4.7–5.0，實際來源可約 4.7–5.2。","ex":"pH 4.5 下 Type A Gelatin 偏正，可與帶負的 Gum arabic 相互作用；是否完成複凝聚還受配比、離子強度與溫度控制。","trap":"把 pI 解作「不受任何流動」；或把 Type B 的機制說成只損失游離 Amine。","q":"pH=pI 且 EOF 不為零，蛋白質必然停在原處嗎？","ans":"不必然；自身電泳近零，但仍可隨 EOF 移動。聚焦階段要抑制整體流動。","p":["量","荷"],"s":["選"],"l":["酸鹼線"]},{"ch":"CE","L":"L11","title":"改 pH 或離子強度時，水和藥要分開看","ask":"哪項通常無法提高常規裸石英 EOF：增電場，降黏度，還是增離子強度？","chain":"pH／離子強度 → 壁 ζ 及分析物電荷 → EOF 與 EP → 合成速度","why":"裸石英常規範圍下提高 pH 通常增加解離與 |EOF|。增加離子強度可壓縮電雙層、改變 ζ，常使 EOF 降低；不是把固定負電荷化學中和，也不是簡單機械阻力增加。pH 同時會改分析物的電荷，所以藥物時間不能只用 EOF 趨勢推斷。","ex":"中性 EOF 標記在其他條件固定時：pH 降低→EOF 常減→tm 常增。弱鹼的 pH 升高則自身正電減少，可能抵消 EOF 增加。","trap":"由「時間變短」倒推一定是 pH 變高。","q":"哪項通常無法提高常規裸石英 EOF：增電場，降黏度，還是增離子強度？","ans":"增離子強度；另兩項分別增強驅動力或降低摩擦。","p":["荷"],"s":["選"],"l":["酸鹼線"]},{"ch":"CE","L":"L12","title":"內壁塗層怎麼抑制或反轉 EOF","ask":"Teflon 是否是一般增加裸石英 EOF 的材料？","chain":"中性遮壁／增黏或正表面 → ζ／η 改變 → EOF 抑制或反轉","why":"Methylcellulose 可增黏並影響表面；中性共價塗層和 Trimethylchlorosilane 改質可減少裸露 Silanol。足夠吸附的 CTAB 等長鏈陽離子界活可使表面轉正，EOF 朝陽極。不是所有陽離子添加量都立刻產生相同反轉。","ex":"內壁正電 ζ>0、E 向陰極，則 μEOF<0；須重畫 EOF 和 EP。","trap":"把「可抑制」和「一定永遠只抑制」當同義；CTAB 可進一步反轉。","q":"Teflon 是否是一般增加裸石英 EOF 的材料？","ans":"不是；原題考減少 Silanol 機制，實際大小仍依材料表面與 BGE。","p":["荷"],"s":["選"],"l":[]},{"ch":"CE","L":"L13","title":"塞狀流為什麼有利，但不保證解析度","ask":"114-1 帶加寬題的 mass transfer 為什麼選 D？","chain":"薄雙層推動液體 → 主體速度近均一 → 減少剪切展寬 → 高效率潛力","why":"Plug-like flow（塞狀流）使管內主體速度接近均勻。比較的拋物線是空圓管壓力流，不能當成每個填充 HPLC 柱內微觀流場的精確圖。理想 CZE 無顆粒多路徑 A、無分配固定相質量轉移 C，仍有 Longitudinal diffusion（縱向擴散）。","ex":"兩種 analyte 的 μeff 完全相同，即使峰極窄、N 很高，也不能因效率高而製造選擇性。","trap":"把 A=C=0 擴大到全 CE；或把 N 大當所有組合 Rs 必大。","q":"114-1 帶加寬題的 mass transfer 為什麼選 D？","ans":"其理想空管 CZE 模型沒有固定相分配轉移項；不是排除所有 CE 中的相互作用動力學。","p":["荷"],"s":["算"],"l":["解析度線"]},{"ch":"CE","L":"L14","title":"焦耳熱怎樣把窄峰弄寬","ask":"降緩沖液濃度能降低熱，但一定提高分離嗎？","chain":"P=IV → 溫度及黏度梯度 → 不同區域速度不同 → 展寬漂移","why":"Joule heating（焦耳熱）把電能變熱。局部黏度隨溫度改變，速度產生差異；擴散也可增加。固定 V、總長與電導率 κ 時，內徑更大使電流與總發熱增加；小管的內表面積／液體體積比為2/r。","ex":"內徑減半、同 V 與 κ：截面積變1/4，I 與總 P 近似變1/4，S/V 變2倍。","trap":"一味提高 V 消除擴散，忽略熱上升；或管徑越大散熱越好。","q":"降緩沖液濃度能降低熱，但一定提高分離嗎？","ans":"不能保證；它也改 EOF、緩沖能力及電分散。需看電流與峰形共同判。","p":["荷"],"s":["選","算"],"l":["溫度線"]},{"ch":"CE","L":"L15","title":"進樣與堆積，何時放大訊號會放寬峰","ask":"若樣品與 BGE 電導率相同，能只靠此 κ 差機制堆積嗎？","chain":"進樣量／偏差 → 初始區帶 → 選 stacking 條件 → 檢查峰寬與訊號","why":"Hydrodynamic injection（水動進樣）用壓力或虹吸搬液；Electrokinetic injection（電動進樣）依各離子的淌度與 EOF 載入，可能偏採快離子。Field-amplified sample stacking（場放大樣品堆積）利用低導電樣品區的較大 E，讓離子進 BGE 後減速集中。","ex":"同一截面電流連續時 κsample<κBGE→Esample>EBGE；帶電分析物到交界減速，區帶變窄。","trap":"樣品越多永遠越好；或電動注入的成分比例永遠等於原樣比例。","q":"若樣品與 BGE 電導率相同，能只靠此 κ 差機制堆積嗎？","ans":"不能；沒有預設的場強差。可能需改用其他濃縮模式。","p":["荷"],"s":["樣"],"l":["解析度線"]},{"ch":"CE","L":"L16","title":"拖尾與前伸，先查導電不匹配和吸附","ask":"拖尾峰是否足以證明只有電分散？","chain":"觀察不對稱 → 列電分散／吸附等原因 → 對照另一條件 → 回查 M02","why":"Electromigration dispersion（電遷移分散）來自樣品區組成改變局部電導率及 E。舊表「背景淌度較大→拖尾；較小→前伸」只能在相應共離子與導電模型下使用。也要區分 Capillary wall adsorption（管壁吸附），它可造成拖尾而無須同樣的導電不匹配。","ex":"減少樣品載量後，三角型不對稱減輕支持過載電分散；換表面塗層才改善，則支持壁吸附。","trap":"看到拖尾就唯一指認 BGE 比分析物快。","q":"拖尾峰是否足以證明只有電分散？","ans":"不足；壁吸附、管端損傷或進樣也可使不對稱。","p":["荷"],"s":[],"l":["解析度線"]},{"ch":"CE","L":"L17","title":"中性物用 MEKC 怎麼分開","ask":"若微胞自己與水完全同速，分配比例差就一定分中性物嗎？","chain":"濃度達成微胞 → 兩種遷移環境 → 不同分配比例 → 不同平均速度","why":"Micellar electrokinetic chromatography（微胞電動層析，MEKC）用微胞作 Pseudostationary phase（假固定相）。須達到 Critical micelle concentration（臨界微胞濃度，CMC）。常規 SDS 陰離子微胞相對水向陽極，強 EOF 仍可把它拖向陰極；結合較多的中性物平均較慢。","ex":"題設 log P 為 C0.5、B1.5、A3.0，常規陰離子微胞且分配隨疏水性增加時，先 C 後 B 後 A。","trap":"把假固定相叫移動相；或純中性微胞與水完全同速仍假定所有中性物可分。","q":"若微胞自己與水完全同速，分配比例差就一定分中性物嗎？","ans":"不一定；沒有兩環境的遷移速度差，單靠平衡分配無法產生此MEKC分離。","p":["極"],"s":["算"],"l":["分配線"]},{"ch":"CE","L":"L18","title":"β-CD 怎樣製造立體選擇性","ask":"題目已給 R/S 與普通緩沖液四選一，哪種添加物提供手性環境？","chain":"手性選擇劑 → 結合平衡不同 → 有效淌度不同 → 兩峰","why":"β-Cyclodextrin 是七個 α-(1→4) 相連的 D-Glucose 單元形成的環狀寡醣，有手性空腔、外側較親水、內部較疏水。原生 β-CD 不是「一定已烷基化」；Dimethyl β-cyclodextrin 是衍生物。手性環境可讓 R/S 形成不同結合狀態，改變有效淌度。","ex":"Mepivacaine 的 R/S 在非手性均一 CZE 中淌度相同；選 β-CD 或其題定衍生物。","trap":"SDS 本身當手性選擇劑；或寫所有 stereoisomers 都是 enantiomers。","q":"題目已給 R/S 與普通緩沖液四選一，哪種添加物提供手性環境？","ans":"β-CD 類選項；實際條件還須確認兩峰分離與回收。","p":["荷","手"],"s":["選"],"l":["歸一線"]},{"ch":"CE","L":"L19","title":"CGE 為什麼常用來篩大小","ask":"可置換聚合物 RNA CGE 能不能用壓力進樣？","chain":"聚合物網目 → 差異阻礙 → 有效遷移不同 → 大小分布","why":"Capillary gel electrophoresis（毛細管膠體電泳，CGE）利用 Polyacrylamide 等固定或可置換 Polymer 篩分介質。DNA 與 SDS 變性蛋白常有相近電荷/質量比，此時小片段通常較容易穿網、較快；原生蛋白還受電荷和形狀影響。","ex":"與 Size-exclusion chromatography（尺寸排阻層析，SEC）對照：SEC 大分子少入孔而先到；CGE 的網目阻礙大者，常小者先。","trap":"CGE 全部只能電動進樣；或任何蛋白一律只按質量排序。","q":"可置換聚合物 RNA CGE 能不能用壓力進樣？","ans":"可以有這種已驗證方法，不能用固定膠的規則排除全部 CGE。","p":["荷"],"s":["樣"],"l":[]},{"ch":"CE","L":"L20","title":"CIEF 為什麼聚在 pH 等於 pI 的位置","ask":"為什麼 CIEF 不能默認需要很強 EOF？","chain":"偏離 pI → 電荷重新出現 → 自身 EP 指回 pI → 區帶聚焦","why":"Capillary isoelectric focusing（毛細管等電聚焦，CIEF）以 Ampholytes 建梯度，陽極端低 pH、陰極端高 pH。位於自身 pI 左邊的低 pH 區時偏正往右；右邊高 pH 時偏負往左，形成物理聚焦。","ex":"pI 7 的蛋白在局部 pH 6 偏正向陰極；在 pH 8 偏負向陽極，最終聚在局部 pH 7。","trap":"將物理聚焦箭頭畫成分析者的紅色回查；或將無須 EOF 解作永遠不可能搬動區帶。","q":"為什麼 CIEF 不能默認需要很強 EOF？","ans":"強整體流可能在聚焦前把區帶搬走；主要驅動是電泳恢復方向。","p":["荷"],"s":["選"],"l":["酸鹼線","標準曲線線"]},{"ch":"CE","L":"L21","title":"ITP 的等速，究竟是哪個量相等","ask":"穩態 ITP 中，是 μ 相同還是 v 相同？","chain":"|μLE|>|μsample|>|μTE| → 各區 E 調整 → 相同界面速度 → 連續堆疊區帶","why":"Isotachophoresis（等速電泳，ITP）用 Leading electrolyte（前導電解質，LE）與 Terminating electrolyte（終止電解質，TE）夾同號樣品。穩態 v_i=|μ_i|E_i 近相等，淌度本身不同；慢淌度區需要更強局部 E。","ex":"區帶向右時，空間從左到右是 TE｜sample｜LE；LE 在最前端。三段都向右同速，而非LE越跑越遠。","trap":"把前導→樣品→終止（依領隊至尾隊）錯誤畫成向右遷移時左→右空間；或把 C 選項的速度不同當穩態本體速度。","q":"穩態 ITP 中，是 μ 相同還是 v 相同？","ans":"v 近相同；μ 不同，以不同局部 E 補償。Q28 原文稱速度不同，作答要讀作不同固有淌度的電解質群。","p":["荷"],"s":[],"l":[]},{"ch":"CE","L":"L22","title":"CEC 和 MEKC 的固定相有何區別","ask":"CEC 可以出現固定相質量轉移展寬嗎？","chain":"真固定相分配 → EOF 驅動液相 → 平均遷移差 → 層析選擇性","why":"Capillary electrochromatography（毛細管電層析，CEC）含真實 stationary phase，可為顆粒填充、monolith（整體柱）或開管固定相。EOF 驅動移動相；中性物因分配不同而分離，帶電物還可有電泳貢獻。","ex":"中性物不能靠CZE自身EP分開時，可選CEC真固定相，或MEKC移動微胞假固定相。","trap":"「CEC 完全沒有固定相」；或叫微胞假固定相就當它固定不動。","q":"CEC 可以出現固定相質量轉移展寬嗎？","ans":"可以；必須考慮真正固定相與動力學。","p":["極","荷"],"s":["選"],"l":["分配線"]},{"ch":"CE","L":"L23","title":"短光徑與偵測器，能看見什麼","ask":"無螢光 analyte 要用 LIF，先需什麼？","chain":"選 UV/LIF 等 → 區帶過窗 → 訊號與噪聲 → 檢出能力","why":"Ultraviolet detection（紫外偵測，UV）與 Diode-array detection（二極體陣列偵測，DAD）需相應吸收。Laser-induced fluorescence（雷射誘導螢光，LIF）需天然螢光或標記。另有 MS 與電化學/電導偵測。管上 UV 光徑常接近內徑，因此濃度靈敏度可能受短光徑限制。","ex":"50 μm=0.005 cm；以1 cm池作同 ε、c 參考，吸光僅1/200。","trap":"N 高便推出 LOD 必低；螢光偵測對所有物質都適用。","q":"無螢光 analyte 要用 LIF，先需什麼？","ans":"可產生相應螢光的標記或改選其他響應合適的偵測器。","p":["色"],"s":["測"],"l":["雜訊地板"]},{"ch":"CE","L":"L24","title":"無發色基，為什麼會出現負波峰","ask":"把軟體極性反相後，峰變正，化學機制是否隨之反轉？","chain":"吸光背景 → analyte 區帶置換部分背景 → 原始吸光下降 → 間接訊號","why":"Indirect UV detection（間接紫外偵測）讓背景離子先吸光，非吸光 analyte 區帶引起其濃度下降。不是分析物像擋光板「遮住」背景；置換/調節背景離子才是機制。原始吸光可成負峰，軟體可將顯示反相。","ex":"Metabisulphite 題選 Tris＋Pyromellitic acid（pH8.0）；吸光背景是後者。舊筆記另列 Ammonium formate 內標與 Sulfate 氧化物。","trap":"陰離子一定負峰；或負峰就代表負濃度。","q":"把軟體極性反相後，峰變正，化學機制是否隨之反轉？","ans":"沒有；只是顯示方向改變，定量仍用對應響應與校正。","p":["色","極"],"s":[],"l":["分配線","空白線"]},{"ch":"CE","L":"L25","title":"時間、峰寬與面積，各證明哪件事","ask":"只有相同 tm 的樣品峰能確證唯一身分嗎？","chain":"讀 tm/面積 → 比對/校正 → 檢查分離與重複性 → 鑑別或含量","why":"Migration time（遷移時間，tm）用於條件匹配比對，單次相同時間不是唯一身分證據。Peak area（峰面積）定量須校正；固定檢測窗的停留時間會影響面積，可按方法用 Corrected area（修正面積）Apeak/tm。要區別峰高、面積、N、選擇性與再現性。","ex":"原始面積120、tm4 min和面積180、tm6 min，A/t 都30；不宜只從180>120斷言含量更高。","trap":"tm變就認為身分換了；或A/t無需校正即可是濃度。","q":"只有相同 tm 的樣品峰能確證唯一身分嗎？","ans":"不能；至少用匹配標準、加標或額外選擇性證據，並排除共遷移。","p":["荷"],"s":["樣","選","算"],"l":["解析度線"]},{"ch":"CE","L":"L26","title":"管長、電極、進樣與訊號鏈如何接","ask":"總長50、有效長40，該用哪個算 E，哪個算 tm？","chain":"電極接 BGE → 管內電場 → 區帶到檢測窗 → 光/電訊號讀出","why":"電場 E=V/Ltot 的長度是兩電極間總管長；tm 的路程是進樣起點到檢測窗 Leff。兩槽BGE、電源、capillary、檢測器與資料系統構成系統。進樣時換樣品槽，分離時恢復BGE；樣品並不經過高壓電源或光源。","ex":"V=20 kV、Ltot50 cm、Leff40 cm：E400 V/cm；後續時間以40 cm除總速度。","trap":"E 用有效長；或 tm 用總長，兩個誤差碰巧抵消仍不是正確方法。","q":"總長50、有效長40，該用哪個算 E，哪個算 tm？","ans":"E 用50；路程用40。","p":["荷"],"s":["樣"],"l":[]},{"ch":"CE","L":"L27","title":"CE 與 HPLC 比較，哪一欄才是本題重點","ask":"高N是否就保證兩種同淌度物質分離？","chain":"分開品質指標 → 對照本題比較 → 找出EOF/進樣因素 → 有條件作答","why":"本題本四道比較題以「CE 高效率、樣品/溶媒少；相較常規HPLC，再現性較難」作答案方向。原因包括進樣微量、表面/EOF漂移與短光徑，但改善控溫、管壁、校正可得到可靠CE。不能說所有CE永遠差或藥典全面排除CE。","ex":"Q37題問採用HPLC的理由，四選一選再現性；這不是宣告其他三項永遠固定勝負。","trap":"凡CE再現性好就判錯，不看比較對象和條件；將電壓與EOF稱兩獨立能源。","q":"高N是否就保證兩種同淌度物質分離？","ans":"否；還要不同有效淌度或選擇性。","p":["荷"],"s":["樣","選"],"l":["歸一線"]},{"ch":"CE","L":"L28","title":"依目的選模式，再核對配方與用途","ask":"配方題選到SDS後，實驗還需確認哪項？","chain":"目的 → 六模式/修飾軸 → 必要添加物 → 實驗品質核對","why":"帶電且有效淌度不同可起於CZE；中性物需要MEKC/CEC的環境差；核酸/蛋白大小看CGE；pI看CIEF；同號微量離子堆疊看ITP。手性選擇劑是修飾軸，間接UV是檢測軸，二者不是與六模式同級的全新分離方式。","ex":"中性 Steroids 條件題原卷選B「5 mM pH7.5 phosphate＋0.05 mM SDS」。官方仍B，但數值疑似不足以支持普通SDS微胞，保留原文並另核實際CMC。","trap":"默改0.05 mM成0.05 M，再稱原題已核對；或無條件把中性藥的CD題選成MEKC。","q":"配方題選到SDS後，實驗還需確認哪項？","ans":"實際溶媒/鹽/溫度下的CMC、微胞與水的速度差及目標兩峰分離。","p":["荷"],"s":[],"l":[]},{"ch":"MS","L":"L01","title":"先讀橫軸、縱軸，才談分子量","ask":"基峰在86、分子離子在234；分子量是否等於86？","chain":"橫軸讀 m/z → 縱軸讀離子強度 → 分開峰位與峰高。","why":"Mass spectrum（質譜圖）的橫軸通常是 mass-to-charge ratio（質荷比，m/z）；縱軸是 abundance（離子豐度／強度），可為原始強度或相對強度。峰的位置和峰的高度回答不同問題。Base peak（基峰）是本張譜最強峰；把它設為100%是常見正規化方法。","ex":"峰在86、相對強度100%：86是位置，100%是這張圖的強度基準。原題Q78的Y軸最高約16000，仍是abundance，不能把16000直接寫成百分比。","trap":"基峰可以是碎片，也可以是完整分子相關離子。最強不等於按定義「最安定」，更不保證濃度最大。","q":"基峰在86、分子離子在234；分子量是否等於86？","ans":"不是。先認離子身分；234若確為單價分子離子，才支援中性名目質量234。","p":["量"],"s":["算"],"l":["歸一線","保留線"]},{"ch":"MS","L":"L02","title":"同一個峰位置，可能代表不同質量","ask":"m/z 300的2+離子，離子質量數值是多少？","chain":"離子質量 ÷ 電荷數 → 得 m/z → 同比值可以重疊。","why":"分析器對離子的反應由質量與電荷的比值決定。以Da表示的離子質量數值除以電荷數的絕對值，得到慣用m/z數值。100 Da、1+與200 Da、2+都在m/z 100。","ex":"看到m/z 500，只知道比值；若是[M+2H]²⁺，中性名目質量是2×500−2=998 Da。","trap":"Da（dalton，道爾頓）是質量單位；z是整數。慣用m/z不是物理式的kg/C；後者要保留基本電荷e與原子質量常數u的換算。","q":"m/z 300的2+離子，離子質量數值是多少？","ans":"300×2=600 Da；若還要中性質量，需知道加上或失去什麼。","p":["量","荷"],"s":["算"],"l":["分配線","歸一線","解析度線"]},{"ch":"MS","L":"L03","title":"先認離子身分，再減回中性質量","ask":"[M−H]⁻在179，M是多少？","chain":"確認 M⁺•／加質子／加合物 → 扣回加入量 → 求中性 M。","why":"Molecular ion（分子離子）由中性分子失去或得到電子而來，原子組成不變；protonated molecule（質子化分子）與adduct ion（加合離子）另外加入質子或其他離子。三者不能都直接叫「分子量峰」。","ex":"單價[M+H]⁺在181：M=181−1=180。單價[M+Na]⁺在203也支援M=203−23=180。","trap":"這裡用名目質量與z=1；精確質量要用質子1.007276 Da、Na⁺22.989218 Da等。加合離子未必都是單價。","q":"[M−H]⁻在179，M是多少？","ans":"M=179+1=180 Da。負電模式先認去質子，不能一律減1。","p":["荷"],"s":["算"],"l":["酸鹼線"]},{"ch":"MS","L":"L04","title":"質量的平均值，不能替代單一同位素峰","ask":"chlorpromazine平均質量318.9，35Cl組成的名目中性質量呢？","chain":"先分名目／同位素／平均 → 選對原子質量 → 加總。","why":"Nominal mass（名目質量）用指定同位素質量數的整數和。Monoisotopic mass（單同位素質量）用指定主要同位素的精確質量和。Average mass（平均質量）按同位素豐度加權。Exact mass（精確質量）是給定同位素組成計算值；accurate mass（準確質量）是量測值。","ex":"CH₃⁷⁹Br名目質量=12+3+79=94；CH₃⁸¹Br=96。題目給的平均原子量相加94.939，不能把低解析圖唯一分子峰改成94.9。","trap":"Exact與accurate不可對調。平均質量可能落在兩個主要同位素峰之間；小數位很多也不自動表示準確。","q":"chlorpromazine平均質量318.9，35Cl組成的名目中性質量呢？","ans":"C₁₇H₁₉³⁵ClN₂S：204+19+35+28+32=318；加H⁺後名目m/z 319。","p":["量"],"s":[],"l":["計數線"]},{"ch":"MS","L":"L05","title":"已知電荷，先乘回去再扣質子","ask":"x=801、z=10、p=1，M？","chain":"m/z × z → 得離子質量 → 扣 z 個質子。","why":"同一中性分子加z個質子得到[M+zH]ᶻ⁺。令峰位置為x、質子質量數值p：x=(M+zp)/z=M/z+p，所以M=z(x−p)。先乘再扣，不是直接M=z×x。","ex":"自編：x=1001、z=12、p取1；M=12×1000=12000 Da。","trap":"只適用於指定質子加合模型；鈉、鉀混合加合與負離子需改寫質量帳。","q":"x=801、z=10、p=1，M？","ans":"10×(801−1)=8000 Da；回代8000/10+1=801。","p":["量","荷"],"s":["算"],"l":["酸鹼線","歸一線"]},{"ch":"MS","L":"L06","title":"未知電荷，用相鄰電荷態解兩式","ask":"x=1020.5、y=942.2，如何先找整數 z？","chain":"小峰 y−p ÷ 峰差 x−y → 得大峰電荷 z → 回代 M。","why":"正離子質子加合時：x=M/z+p，y=M/(z+1)+p。峰差x−y=M/[z(z+1)]，而y−p=M/(z+1)，相除得z=(y−p)/(x−y)。分子取較小峰，算到的是較大峰的電荷。","ex":"x=1101、y=1001、p=1：差100；z=1000/100=10；M=10×1100=11000。小峰為11+，回代11000/11+1=1001。","trap":"須先確定同一分子、相鄰電荷態、同一加合系列。ESI電荷態包絡不等間距；誤用大峰當分子會得到z+1。","q":"x=1020.5、y=942.2，如何先找整數 z？","ans":"差78.3；y−1=941.2。78.3×12=939.6，×13=1017.9，所以大峰約12+；M約12×1019.5=12234 Da。","p":["荷"],"s":[],"l":[]},{"ch":"MS","L":"L07","title":"電荷態峰群與同位素細峰要分開","ask":"¹³C細峰間距約0.25，z約多少？","chain":"先辨同位素細峰 → 用間距估 z → 再辨電荷態包絡。","why":"同一電荷態內，換一個¹²C為¹³C約增加1.00335 Da，因此m/z細峰間距約1.00335/z；不同電荷態的峰位置遵循M/z+p，間距會變。兩種「相鄰」不是同一件事。","ex":"細峰間距約0.50支援2+；若x=500.5為[M+2H]²⁺，名目M≈999。1101與1001相差100則可能是蛋白質相鄰電荷態，不能用1/100算z。","trap":"細峰須解析清楚、來自同一同位素系列；不可把Cl／Br的約2/z間距當作¹³C的1/z。","q":"¹³C細峰間距約0.25，z約多少？","ans":"z≈1/0.25=4；精確估算用1.00335，紙筆可先取1。","p":["量","荷"],"s":["算"],"l":["計數線"]},{"ch":"MS","L":"L08","title":"EI碎片多，先問樣品能否汽化","ask":"EI沒有明顯M峰，是否必然表示儀器壞了？","chain":"可汽化檢品 → 電子游離 M⁺• → 常見豐富碎片。","why":"Electron ionization（電子游離，EI；舊稱電子撞擊）以電子造成游離，常用70 eV作圖譜庫基準。分子離子可能再裂解，故適合碎片與結構線索；要保住完整質量時常選較軟的源。","ex":"GC洗出小分子、題目要查庫鑑別，可先選GC–EI–MS。蛋白質不適合靠一般GC汽化再EI。","trap":"70 eV是電子能量，不是電壓單位。不能把70−游離能的全部差額都當成留在分子裡的能量。EI也可能看得到強分子離子峰。","q":"EI沒有明顯M峰，是否必然表示儀器壞了？","ans":"不是；完整分子離子可能容易裂解。先核對檢品與源條件，必要時改軟游離求M。","p":["骨","揮"],"s":["源","樣"],"l":["保留線"]},{"ch":"MS","L":"L09","title":"CI先造試劑離子，再讓檢品反應","ask":"PICI可能只有一種試劑離子嗎，這是普遍規則嗎？","chain":"試劑氣體游離 → 離子與檢品反應 → 質子化／加合／負離子。","why":"Chemical ionization（化學游離，CI）主要透過試劑離子與檢品反應。Positive-ion CI（正離子化學游離，PICI）可出現[M+H]⁺與其他加合；negative-ion CI（負離子化學游離，NICI）可電子捕捉、去質子等，依檢品與條件不同。","ex":"Psoralen名目M=186：PICI圖的187支援[M+H]⁺，215／227可為試劑加合；NICI原圖主要186並有218，不能一律改成185。","trap":"反應氣體不只形成一種離子。CI一般較EI軟，但產物取決於試劑、質子親和力／電子親和力與操作，不能把所有CI峰都視為M+1。","q":"PICI可能只有一種試劑離子嗎，這是普遍規則嗎？","ans":"不是普遍規則；例如甲烷可形成CH₅⁺、C₂H₅⁺等，所以多種加合或反應可並存。","p":["荷"],"s":["源","樣"],"l":["酸鹼線"]},{"ch":"MS","L":"L10","title":"ESI把溶液帶電微滴送成氣相離子","ask":"抗體、白蛋白或胜肽在LC出口，優先考慮哪個源？","chain":"高電壓造帶電微滴 → 脫溶劑／液滴演變 → 氣相單價或多價離子。","why":"Electrospray ionization（電噴灑游離，ESI）在常壓形成帶電微滴，再經溶劑蒸發與離子形成過程進入氣相。完整離子常得以保留，可分析能游離的大、小分子；多質子化讓蛋白質落在較小m/z範圍。","ex":"50000 Da蛋白質帶50+，p取1時x=50000/50+1=1001。這是同一大分子，不是被打成1001 Da的碎片。","trap":"高極性／可帶電通常較適合；鹽、介面活性劑與共洗出物可幹擾。ESI很軟不等於絕不源內裂解，也不能保證所有蛋白質都自動游離良好。","q":"抗體、白蛋白或胜肽在LC出口，優先考慮哪個源？","ans":"通常ESI；溶液進樣與多價離子能保留大分子資訊。
