<svg width="1900" height="3550" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 3550" style="max-width:100%;height:auto" role="img" aria-labelledby="at3_g4_title at3_g4_desc"><title id="at3_g4_title">儀器與操作考點圖｜光路、送樣、供能分開看</title><desc id="at3_g4_desc">原子光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="at3_g4_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="at3_g4_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="at3_g4_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="3550" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH31  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">儀器與操作考點圖｜光路、送樣、供能分開看</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">HCL（中空陰極燈）供光；PMT（光電倍增管）／CCD（電荷耦合元件）收光。圖為功能示意，非特定機型配置。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">原子化、作用、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><text x="50" y="388" font-size="29" fill="#286c68" font-weight="bold">Flame AES（火焰原子放射）｜光從樣品來</text><rect x="50" y="430" width="405" height="250" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="474" font-size="27" fill="#9e771c" font-weight="bold">檢品→霧化／傳輸</text><text x="74" y="518" font-size="23" fill="#24343f" font-weight="normal">液滴從這裡送入。</text><text x="74" y="564.35" font-size="23" fill="#24343f" font-weight="normal">基質影響流率與效率。</text><rect x="515" y="430" width="405" height="250" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="539" y="474" font-size="27" fill="#286c68" font-weight="bold">火焰：原子化＋激發</text><text x="539" y="518" font-size="23" fill="#24343f" font-weight="normal">火焰提供能量。</text><text x="539" y="564.35" font-size="23" fill="#24343f" font-weight="normal">樣品原子放出特徵光。</text><rect x="980" y="430" width="405" height="250" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1004" y="474" font-size="27" fill="#356844" font-weight="bold">Filter／單色光器</text><text x="1004" y="518" font-size="23" fill="#24343f" font-weight="normal">Filter（濾光器）或</text><text x="1004" y="564.35" font-size="23" fill="#24343f" font-weight="normal">Monochromator（單色光器）選波</text><text x="1004" y="597.7" font-size="23" fill="#24343f" font-weight="normal">長。</text><rect x="1445" y="430" width="405" height="250" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1469" y="474" font-size="27" fill="#356844" font-weight="bold">光學偵測器</text><text x="1469" y="518" font-size="23" fill="#24343f" font-weight="normal">光→電訊號→S。</text><text x="1469" y="564.35" font-size="23" fill="#24343f" font-weight="normal">S 單位依儀器。</text><path d="M 455 555 L 515 555" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="515,555 500,561 500,549" fill="#61717a"/><path d="M 920 555 L 980 555" fill="none" stroke="#326991" stroke-width="3"/><polygon points="980,555 965,561 965,549" fill="#326991"/><path d="M 1385 555 L 1445 555" fill="none" stroke="#326991" stroke-width="3"/><polygon points="1445,555 1430,561 1430,549" fill="#326991"/><rect x="540" y="730" width="450" height="140" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="564" y="774" font-size="27" fill="#9e771c" font-weight="bold">供能支路：燃料＋助燃氣</text><text x="564" y="818" font-size="22" fill="#24343f" font-weight="normal">乙炔／天然氣燃料；空氣／N₂O 助燃。</text><path d="M 745 730 L 745 680" fill="none" stroke="#9e771c" stroke-width="3"/><polygon points="745,680 751,695 739,695" fill="#9e771c"/><text x="50" y="938" font-size="29" fill="#286c68" font-weight="bold">Flame AAS（火焰原子吸收）｜燈光穿過樣品</text><rect x="50" y="980" width="405" height="270" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="74" y="1024" font-size="27" fill="#356844" font-weight="bold">HCL＋光路調變</text><text x="74" y="1068" font-size="23" fill="#24343f" font-weight="normal">HCL 產生元素特徵線。</text><text x="74" y="1114.35" font-size="23" fill="#24343f" font-weight="normal">Chopper（斬光器）依配置調變／</text><text x="74" y="1147.7" font-size="23" fill="#24343f" font-weight="normal">切換。</text><rect x="515" y="980" width="405" height="270" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="539" y="1024" font-size="27" fill="#286c68" font-weight="bold">火焰中樣品原子雲</text><text x="539" y="1068" font-size="23" fill="#24343f" font-weight="normal">原子吸收外來匹配光。</text><text x="539" y="1114.35" font-size="23" fill="#24343f" font-weight="normal">與燈內原子分開。</text><rect x="980" y="980" width="405" height="270" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1004" y="1024" font-size="27" fill="#356844" font-weight="bold">單色光器</text><text x="1004" y="1068" font-size="23" fill="#24343f" font-weight="normal">選適合分析線。</text><text x="1004" y="1114.35" font-size="23" fill="#24343f" font-weight="normal">不是發光或偵測器。</text><rect x="1445" y="980" width="405" height="270" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1469" y="1024" font-size="27" fill="#356844" font-weight="bold">光學偵測器</text><text x="1469" y="1068" font-size="23" fill="#24343f" font-weight="normal">量透射光 I／參考 I₀。</text><text x="1469" y="1114.35" font-size="23" fill="#24343f" font-weight="normal">T→A，另查背景。</text><path d="M 455 1105 L 515 1105" fill="none" stroke="#326991" stroke-width="3"/><polygon points="515,1105 500,1111 500,1099" fill="#326991"/><path d="M 920 1105 L 980 1105" fill="none" stroke="#326991" stroke-width="3"/><polygon points="980,1105 965,1111 965,1099" fill="#326991"/><path d="M 1385 1105 L 1445 1105" fill="none" stroke="#326991" stroke-width="3"/><polygon points="1445,1105 1430,1111 1430,1099" fill="#326991"/><rect x="540" y="1330" width="550" height="165" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="564" y="1374" font-size="27" fill="#9e771c" font-weight="bold">樣品另由下方送入＋原子化供能</text><text x="564" y="1418" font-size="23" fill="#24343f" font-weight="normal">霧化液滴進入火焰；火焰供熱。</text><text x="564" y="1464.35" font-size="23" fill="#24343f" font-weight="normal">樣品進樣線不能接成 HCL 光路的一部分。</text><path d="M 750 1330 L 750 1250" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="750,1250 756,1265 744,1265" fill="#61717a"/><text x="1120" y="1415" font-size="23" fill="#24343f" font-weight="normal">典型吸收光路：燈→原子雲→選線→收光</text><text x="50" y="1603" font-size="29" fill="#326991" font-weight="bold">ICP-OES（感應耦合電漿光學放射）｜電漿激發後量光</text><rect x="50" y="1645" width="405" height="250" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="1689" font-size="27" fill="#9e771c" font-weight="bold">檢品→霧化／傳輸</text><text x="74" y="1733" font-size="23" fill="#24343f" font-weight="normal">依方法消化、稀釋。</text><text x="74" y="1779.35" font-size="23" fill="#24343f" font-weight="normal">樣品量與基質須可比。</text><rect x="515" y="1645" width="405" height="250" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="539" y="1689" font-size="27" fill="#326991" font-weight="bold">Ar plasma（氬電漿）</text><text x="539" y="1733" font-size="23" fill="#24343f" font-weight="normal">原子化＋激發。</text><text x="539" y="1779.35" font-size="23" fill="#24343f" font-weight="normal">原子／離子放出光。</text><rect x="980" y="1645" width="405" height="250" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1004" y="1689" font-size="27" fill="#356844" font-weight="bold">分光系統</text><text x="1004" y="1733" font-size="23" fill="#24343f" font-weight="normal">解析多條分析線。</text><text x="1004" y="1779.35" font-size="23" fill="#24343f" font-weight="normal">查重疊與背景點。</text><rect x="1445" y="1645" width="405" height="250" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1469" y="1689" font-size="27" fill="#356844" font-weight="bold">光學偵測器</text><text x="1469" y="1733" font-size="23" fill="#24343f" font-weight="normal">PMT／CCD 等依配置。</text><text x="1469" y="1779.35" font-size="23" fill="#24343f" font-weight="normal">讀各元素放射 S。</text><path d="M 455 1770 L 515 1770" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="515,1770 500,1776 500,1764" fill="#61717a"/><path d="M 920 1770 L 980 1770" fill="none" stroke="#326991" stroke-width="3"/><polygon points="980,1770 965,1776 965,1764" fill="#326991"/><path d="M 1385 1770 L 1445 1770" fill="none" stroke="#326991" stroke-width="3"/><polygon points="1445,1770 1430,1776 1430,1764" fill="#326991"/><rect x="540" y="1975" width="550" height="150" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="564" y="2019" font-size="27" fill="#326991" font-weight="bold">供能支路：RF coil（射頻線圈）</text><text x="564" y="2063" font-size="23" fill="#24343f" font-weight="normal">耦合能量給 Ar 電漿；題本約 7000°C。</text><text x="564" y="2109.35" font-size="23" fill="#24343f" font-weight="normal">Ar 是工作氣，不是 H₂。</text><path d="M 750 1975 L 750 1895" fill="none" stroke="#9e771c" stroke-width="3"/><polygon points="750,1895 756,1910 744,1910" fill="#9e771c"/><text x="50" y="2190" font-size="23" fill="#24343f" font-weight="normal">光路區圖例：深灰箭頭＝送樣／材料；藍箭頭＝光向偵測端；金箭頭＝外加能量。箭頭不是品質回查。</text><rect x="50" y="2270" width="870" height="420" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="74" y="2314" font-size="27" fill="#356844" font-weight="bold">HCL 內部｜L05</text><text x="74" y="2358" font-size="24" fill="#24343f" font-weight="normal">低壓 Ne（氖）／Ar（氬）＋放電 → 正離子撞陰極 → 濺射元素原子 → 激發、</text><text x="74" y="2392.8" font-size="24" fill="#24343f" font-weight="normal">放特徵光。</text><text x="74" y="2440.6" font-size="24" fill="#24343f" font-weight="normal">陰極含目標元素；陽極與填充氣也有各自角色。填充氣不是 N₂，也不是火焰</text><text x="74" y="2475.4" font-size="24" fill="#24343f" font-weight="normal">燃料。</text><text x="74" y="2523.2" font-size="24" fill="#24343f" font-weight="normal">燈內原子發光只是供光；樣品端量吸收，所以儀器可仍屬 AAS。多元素 HCL</text><text x="74" y="2558" font-size="24" fill="#24343f" font-weight="normal">存在。</text><rect x="980" y="2270" width="870" height="420" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1004" y="2314" font-size="27" fill="#356844" font-weight="bold">Chopper 與背景｜L06</text><text x="1004" y="2358" font-size="24" fill="#24343f" font-weight="normal">簡化：開燈 D_on＝I透射＋B；關燈 D_off≈B；相減辨出燈光成分。</text><text x="1004" y="2405.8" font-size="24" fill="#24343f" font-weight="normal">可區分未調變的火焰放光；參考／樣品切換依配置。</text><text x="1004" y="2453.6" font-size="24" fill="#24343f" font-weight="normal">非特異吸收／散射需合適 D₂（氘燈）或 Zeeman（塞曼）等背景處理並驗證；</text><text x="1004" y="2488.4" font-size="24" fill="#24343f" font-weight="normal">不是一個斬光器包辦。</text><rect x="50" y="2750" width="570" height="335" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="2794" font-size="27" fill="#9e771c" font-weight="bold">氣體：先看放在哪裡</text><text x="74" y="2838" font-size="23" fill="#24343f" font-weight="normal">HCL：低壓 Ne／Ar 填充氣。</text><text x="74" y="2884.35" font-size="23" fill="#24343f" font-weight="normal">火焰：乙炔／天然氣燃料；空氣／N₂O 助燃。</text><text x="74" y="2930.7" font-size="23" fill="#24343f" font-weight="normal">ICP：Ar 工作氣＋RF 供能。</text><text x="74" y="2977.05" font-size="23" fill="#24343f" font-weight="normal">同樣 Ar，HCL 與 ICP 角色不同。</text><rect x="665" y="2750" width="570" height="335" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="689" y="2794" font-size="27" fill="#685185" font-weight="bold">題本試劑配對：不硬造因果</text><text x="689" y="2838" font-size="23" fill="#24343f" font-weight="normal">LaCl₃：磷酸根／硫酸根化學干擾的釋放劑配對。</text><text x="689" y="2884.35" font-size="23" fill="#24343f" font-weight="normal">SrCl₂：題本 K 游離配對；不推出 Sr 比 K 易游</text><text x="689" y="2917.7" font-size="23" fill="#24343f" font-weight="normal">離。</text><text x="689" y="2964.05" font-size="23" fill="#24343f" font-weight="normal">APDC：Pb 前處理錯合試劑；MIBK 為溶劑角色。</text><rect x="1280" y="2750" width="570" height="335" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="1304" y="2794" font-size="27" fill="#b72d4a" font-weight="bold">工具與結果：各自交什麼</text><text x="1304" y="2838" font-size="23" fill="#24343f" font-weight="normal">選線→λ（nm）。</text><text x="1304" y="2884.35" font-size="23" fill="#24343f" font-weight="normal">偵測→S（依儀器單位）。</text><text x="1304" y="2930.7" font-size="23" fill="#24343f" font-weight="normal">AAS 參考／透射→T、A（無因次）。</text><text x="1304" y="2977.05" font-size="23" fill="#24343f" font-weight="normal">校正＋稀釋→原液 c（mg/L 等）。</text><rect x="50" y="3145" width="1800" height="230" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="74" y="3189" font-size="27" fill="#b72d4a" font-weight="bold">操作不符才回查；修正後要有新證據</text><text x="74" y="3233" font-size="23" fill="#24343f" font-weight="normal">吸入／霧化不符 → M02 修送樣與基質匹配；另有代表性問題才回 M01。</text><text x="74" y="3279.35" font-size="23" fill="#24343f" font-weight="normal">分析線、背景點或讀數單位不符 → M03 修正再讀；超出模型範圍 → M02 合適稀釋、M04 回算。</text><text x="74" y="3325.7" font-size="23" fill="#24343f" font-weight="normal">目的或方法不符 → M01 重選；推論超出證據 → M04 重查判準。</text><text x="50" y="3465" font-size="20" fill="#61717a" font-weight="normal">本圖深灰箭頭＝送樣；藍箭頭＝光；金箭頭＝供能。品質回查依圖下方的條件文字。</text><text x="50" y="3505" font-size="20" fill="#61717a" font-weight="normal">原子光譜 v3.0｜參照題本 p3–p4 與 S01–S04；光路是功能簡圖，chopper 的真實位置依機型。</text></g></svg>