<svg width="1900" height="2330" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 2330" style="max-width:100%;height:auto" role="img" aria-labelledby="uv3_g1_title uv3_g1_desc"><title id="uv3_g1_title">UV–Vis｜先量穿過多少光，再把讀數變成答案</title><desc id="uv3_g1_desc">紫外光與可見光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="uv3_g1_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="uv3_g1_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="uv3_g1_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="2330" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH27  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">UV–Vis｜先量穿過多少光，再把讀數變成答案</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">第一輪走含量支線；結構、pH 與選擇性處理從同一主幹分出，再交回讀數與判讀。</text><rect x="50" y="215" width="265" height="1700" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="259" font-size="27" fill="#9e771c" font-weight="bold">檢品與條件</text><text x="74" y="303" font-size="24" fill="#24343f" font-weight="normal">先圈問題：含量？型</text><text x="74" y="337.8" font-size="24" fill="#24343f" font-weight="normal">態？能否鑑別？</text><text x="74" y="385.6" font-size="24" fill="#24343f" font-weight="normal">目標物與吸收系統</text><text x="74" y="433.4" font-size="24" fill="#24343f" font-weight="normal">溶媒、pH、反應時</text><text x="74" y="468.2" font-size="24" fill="#24343f" font-weight="normal">間</text><text x="74" y="516" font-size="24" fill="#24343f" font-weight="normal">光徑 b、稀釋與取</text><text x="74" y="550.8" font-size="24" fill="#24343f" font-weight="normal">樣</text><text x="74" y="598.6" font-size="24" fill="#24343f" font-weight="normal">空白、賦形劑與顆粒</text><text x="74" y="646.4" font-size="24" fill="#24343f" font-weight="normal">第一輪：L01 → L02</text><text x="74" y="681.2" font-size="24" fill="#24343f" font-weight="normal">→ L03 → L04</text><text x="74" y="729" font-size="24" fill="#24343f" font-weight="normal">只回需要補的那一步；</text><text x="74" y="763.8" font-size="24" fill="#24343f" font-weight="normal">合格結果可直接交出。</text><rect x="380" y="215" width="1470" height="140" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="404" y="259" font-size="27" fill="#b72d4a" font-weight="bold">M01｜先定問題</text><text x="404" y="303" font-size="24" fill="#24343f" font-weight="normal">我要知道什麼？先選含量、化學型態或選擇性路徑；檢品與空白能否比較？</text><path d="M 1115 355 L 1115 405" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1115,405 1109,390 1121,390" fill="#61717a"/><rect x="380" y="405" width="1470" height="210" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="404" y="449" font-size="27" fill="#9e771c" font-weight="bold">M02｜準備與測量：先讓光與可比檢品相遇</text><text x="404" y="493" font-size="24" fill="#24343f" font-weight="normal">M01 分析波長 → L14 燈／槽／溶媒適配 → 足夠有效光，交 M02。</text><text x="404" y="540.8" font-size="24" fill="#24343f" font-weight="normal">M02 光路 → L13 透射量測 → I、I₀，交 M03；L16 查核不符才修正重測。</text><path d="M 1115 615 L 1115 650 M 610 650 L 1620 650" fill="none" stroke="#61717a" stroke-width="3"/><path d="M 610 650 L 610 700" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="610,700 604,685 616,685" fill="#61717a"/><path d="M 1115 650 L 1115 700" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1115,700 1109,685 1121,685" fill="#61717a"/><path d="M 1620 650 L 1620 700" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1620,700 1614,685 1626,685" fill="#61717a"/><rect x="380" y="700" width="460" height="445" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="404" y="744" font-size="27" fill="#685185" font-weight="bold">第一輪｜含量</text><text x="404" y="788" font-size="24" fill="#24343f" font-weight="normal">取 M02 可比量測條件</text><text x="404" y="835.8" font-size="24" fill="#24343f" font-weight="normal">L01：I／I₀ → T</text><text x="404" y="883.6" font-size="24" fill="#24343f" font-weight="normal">L02：T → A</text><text x="404" y="931.4" font-size="24" fill="#24343f" font-weight="normal">L03：同條件 A ∝ c</text><text x="404" y="979.2" font-size="24" fill="#24343f" font-weight="normal">L04：配係數與單位</text><text x="404" y="1027" font-size="24" fill="#24343f" font-weight="normal">交 M03：A；交 M04：濃度、百分比。</text><rect x="885" y="700" width="460" height="445" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="909" y="744" font-size="27" fill="#356844" font-weight="bold">結構與 pH</text><text x="909" y="788" font-size="24" fill="#24343f" font-weight="normal">取 M01 結構／pH</text><text x="909" y="835.8" font-size="24" fill="#24343f" font-weight="normal">L05–L09：電子、能量、有效共軛</text><text x="909" y="883.6" font-size="24" fill="#24343f" font-weight="normal">L11：型態改變 → 譜變</text><text x="909" y="931.4" font-size="24" fill="#24343f" font-weight="normal">交 M03：λ、強度</text><text x="909" y="979.2" font-size="24" fill="#24343f" font-weight="normal">L10 命名變化；L12 用三個 A 求 pKa。</text><rect x="1390" y="700" width="460" height="445" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="1414" y="744" font-size="27" fill="#326991" font-weight="bold">需要更高選擇性</text><text x="1414" y="788" font-size="24" fill="#24343f" font-weight="normal">取 M02 兩條件或原譜</text><text x="1414" y="835.8" font-size="24" fill="#24343f" font-weight="normal">L17：兩條件 A 相減</text><text x="1414" y="883.6" font-size="24" fill="#24343f" font-weight="normal">L18：沿 λ 讀斜率</text><text x="1414" y="931.4" font-size="24" fill="#24343f" font-weight="normal">HPLC 先分離；L15：多波長資料</text><text x="1414" y="979.2" font-size="24" fill="#24343f" font-weight="normal">交 M03：ΔA、導數、A(λ,t)。</text><path d="M 610 1145 L 610 1190" fill="none" stroke="#61717a" stroke-width="3"/><path d="M 1115 1145 L 1115 1190" fill="none" stroke="#61717a" stroke-width="3"/><path d="M 1620 1145 L 1620 1190" fill="none" stroke="#61717a" stroke-width="3"/><path d="M 610 1190 L 1620 1190" fill="none" stroke="#61717a" stroke-width="3"/><path d="M 1115 1190 L 1115 1240" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1115,1240 1109,1225 1121,1225" fill="#61717a"/><rect x="380" y="1240" width="1470" height="230" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="404" y="1284" font-size="27" fill="#286c68" font-weight="bold">M03｜讀訊號：先分清正在讀哪個量</text><text x="404" y="1328" font-size="24" fill="#24343f" font-weight="normal">λmax：峰的位置，nm；T：通過比例，無單位；A：吸光度，無單位。</text><text x="404" y="1375.8" font-size="24" fill="#24343f" font-weight="normal">ε：L·mol⁻¹·cm⁻¹；ΔA：兩條件吸光度差；n 階導數：nm⁻ⁿ（A 無單位）。</text><text x="404" y="1423.6" font-size="24" fill="#24343f" font-weight="normal">DAD 的 A(λ,t)：波長＋時間＋吸光度；位置、強度與差值分開。</text><path d="M 880 1470 L 880 1550" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="880,1550 874,1535 886,1535" fill="#61717a"/><rect x="380" y="1550" width="1000" height="245" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="404" y="1594" font-size="27" fill="#b72d4a" font-weight="bold">M04｜核對結論</text><text x="404" y="1638" font-size="24" fill="#24343f" font-weight="normal">L19：訊號是否真的回答問題？用正確公式與校正，補取樣、稀釋和單位。</text><text x="404" y="1685.8" font-size="24" fill="#24343f" font-weight="normal">查方法範圍、回收與性能；L20 對異常先列候選原因，再用條件分辨。</text><path d="M 1380 1672 L 1450 1672" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1450,1672 1435,1678 1435,1666" fill="#61717a"/><rect x="1450" y="1550" width="400" height="245" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1474" y="1594" font-size="27" fill="#356844" font-weight="bold">符合要求 → 交出</text><text x="1474" y="1638" font-size="24" fill="#24343f" font-weight="normal">含量、pKa 或有範圍的光譜判讀。</text><text x="1474" y="1685.8" font-size="24" fill="#24343f" font-weight="normal">不把單一 UV 譜當完整結構／晶</text><text x="1474" y="1720.6" font-size="24" fill="#24343f" font-weight="normal">型證明。</text><path d="M 880 1795 L 880 1875" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="880,1875 874,1860 886,1860" fill="#61717a"/><text x="915" y="1844" font-size="23" fill="#b72d4a" font-weight="normal">不符才回查</text><rect x="380" y="1875" width="1470" height="290" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="404" y="1919" font-size="27" fill="#b72d4a" font-weight="bold">品質回查：每種問題有自己的修正站</text><text x="404" y="1963" font-size="24" fill="#24343f" font-weight="normal">檢品／空白不合 → 重配可比檢品 → 回 M01。</text><text x="404" y="2010.8" font-size="24" fill="#24343f" font-weight="normal">波長、光路或型態不合 → 修正量測條件 → 回 M02，再測。</text><text x="404" y="2058.6" font-size="24" fill="#24343f" font-weight="normal">讀數、單位或處理不合 → 改正讀法／處理 → 回 M03，再判。</text><path d="M 380 1970 L 333 1970 L 333 285 L 380 285" fill="none" stroke="#b72d4a" stroke-width="3" stroke-dasharray="10 7"/><polygon points="380,285 365,291 365,279" fill="#b72d4a"/><path d="M 380 2020 L 348 2020 L 348 505 L 380 505" fill="none" stroke="#b72d4a" stroke-width="3" stroke-dasharray="10 7"/><polygon points="380,505 365,511 365,499" fill="#b72d4a"/><path d="M 380 2070 L 363 2070 L 363 1355 L 380 1355" fill="none" stroke="#b72d4a" stroke-width="3" stroke-dasharray="10 7"/><polygon points="380,1355 365,1361 365,1349" fill="#b72d4a"/><text x="50" y="2245" font-size="20" fill="#61717a" font-weight="normal">深灰實線＝分析流程／因果；紅色虛線＝條件不符才回查。回查是分析者修正流程。</text><text x="50" y="2285" font-size="20" fill="#61717a" font-weight="normal">UV–Vis v3.0｜與雙檔同源；所有 L 在圖 2 有主要位置。示意不按比例。</text></g></svg>