<svg width="1900" height="3060" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 3060" style="max-width:100%;height:auto" role="img" aria-labelledby="at3_g5_title at3_g5_desc"><title id="at3_g5_title">公式與誤差判讀總表｜先問正在算哪個量</title><desc id="at3_g5_desc">原子光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="at3_g5_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="at3_g5_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="at3_g5_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="3060" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH31  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">公式與誤差判讀總表｜先問正在算哪個量</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">先辨訊號、測定液、原液與單一光子；公式寫量、單位與成立條件。下方示例均為自編，非考古原題。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">原子化、作用、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><rect x="50" y="405" width="875" height="315" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="74" y="449" font-size="27" fill="#b72d4a" font-weight="bold">C1／C2｜訊號→測定液</text><text x="74" y="493" font-size="24" fill="#24343f" font-weight="normal">S＝mc＋b → c＝(S−b)/m。</text><text x="74" y="540.8" font-size="24" fill="#24343f" font-weight="normal">S、b：a.u.；m：a.u./(mg/L)；c：mg/L。</text><text x="74" y="588.6" font-size="24" fill="#24343f" font-weight="normal">線性、有效範圍、可比條件成立；b＝0 才可直接用 S 比例。</text><rect x="975" y="405" width="875" height="315" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="999" y="449" font-size="27" fill="#286c68" font-weight="bold">C4｜透射比→吸光度</text><text x="999" y="493" font-size="24" fill="#24343f" font-weight="normal">T＝I/I₀；A＝−log₁₀T。</text><text x="999" y="540.8" font-size="24" fill="#24343f" font-weight="normal">T、A 無因次；%T 先除以 100。</text><text x="999" y="588.6" font-size="24" fill="#24343f" font-weight="normal">T＝10%→A＝1；T＝1%→A＝2。A 還不是原液濃度。</text><rect x="50" y="770" width="875" height="315" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="74" y="814" font-size="27" fill="#b72d4a" font-weight="bold">C2｜測定液→原液</text><text x="74" y="858" font-size="24" fill="#24343f" font-weight="normal">c原 V取＝c測 V終。</text><text x="74" y="905.8" font-size="24" fill="#24343f" font-weight="normal">c原＝c測×V終/V取；體積同單位。</text><text x="74" y="953.6" font-size="24" fill="#24343f" font-weight="normal">元素保留且定容紀錄正確；10→50 mL 是五倍，不是增加元素。</text><rect x="975" y="770" width="875" height="315" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="999" y="814" font-size="27" fill="#b72d4a" font-weight="bold">C3｜標準添加→原液</text><text x="999" y="858" font-size="24" fill="#24343f" font-weight="normal">k＝(S₁−S₀)/Cadd；c終＝S₀/k。</text><text x="999" y="905.8" font-size="24" fill="#24343f" font-weight="normal">c原＝c終×Vf/Vx；Cadd 指終液增加量。</text><text x="999" y="953.6" font-size="24" fill="#24343f" font-weight="normal">等樣品量、等終體積、等效響應、線性與背景已處理。</text><rect x="50" y="1135" width="875" height="315" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="74" y="1179" font-size="27" fill="#356844" font-weight="bold">C5｜波長→單一光子能量</text><text x="74" y="1223" font-size="24" fill="#24343f" font-weight="normal">E＝hc₀/λ；λ 增兩倍→E 減半。</text><text x="74" y="1270.8" font-size="24" fill="#24343f" font-weight="normal">E：J；h：J·s；c₀：m/s；λ：m。</text><text x="74" y="1318.6" font-size="24" fill="#24343f" font-weight="normal">1 nm＝10⁻⁹ m。單一光子能量不等於整束光的強度。</text><rect x="975" y="1135" width="875" height="315" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="999" y="1179" font-size="27" fill="#685185" font-weight="bold">L08／L10｜先定位受影響的量</text><text x="999" y="1223" font-size="24" fill="#24343f" font-weight="normal">送入速率 ṁ＝CQη：mg/min。</text><text x="999" y="1270.8" font-size="24" fill="#24343f" font-weight="normal">M ⇌ M⁺＋e⁻：物種人口重新分配。</text><text x="999" y="1318.6" font-size="24" fill="#24343f" font-weight="normal">固定溫度下電子增多可提高中性比例；元素總量沒有因此消失。</text><text x="50" y="1570" font-size="30" fill="#24343f" font-weight="bold">C2 自編校正示意｜S＝20c＋10；未知 S＝70</text><rect x="50" y="1610" width="870" height="620" rx="16" fill="#fff" stroke="#b72d4a" stroke-width="2"/><path d="M 180 2090 L 180 2100" fill="none" stroke="#61717a" stroke-width="3"/><text x="173" y="2132" font-size="23" fill="#24343f" font-weight="normal">0</text><path d="M 337.5 2090 L 337.5 2100" fill="none" stroke="#61717a" stroke-width="3"/><text x="330.5" y="2132" font-size="23" fill="#24343f" font-weight="normal">1</text><path d="M 495 2090 L 495 2100" fill="none" stroke="#61717a" stroke-width="3"/><text x="488" y="2132" font-size="23" fill="#24343f" font-weight="normal">2</text><path d="M 652.5 2090 L 652.5 2100" fill="none" stroke="#61717a" stroke-width="3"/><text x="645.5" y="2132" font-size="23" fill="#24343f" font-weight="normal">3</text><path d="M 810 2090 L 810 2100" fill="none" stroke="#61717a" stroke-width="3"/><text x="803" y="2132" font-size="23" fill="#24343f" font-weight="normal">4</text><path d="M 170 2090 L 180 2090" fill="none" stroke="#61717a" stroke-width="3"/><text x="122" y="2098" font-size="23" fill="#24343f" font-weight="normal">0</text><path d="M 170 2054 L 180 2054" fill="none" stroke="#61717a" stroke-width="3"/><text x="122" y="2062" font-size="23" fill="#24343f" font-weight="normal">10</text><path d="M 170 1982 L 180 1982" fill="none" stroke="#61717a" stroke-width="3"/><text x="122" y="1990" font-size="23" fill="#24343f" font-weight="normal">30</text><path d="M 170 1910 L 180 1910" fill="none" stroke="#61717a" stroke-width="3"/><text x="122" y="1918" font-size="23" fill="#24343f" font-weight="normal">50</text><path d="M 170 1838 L 180 1838" fill="none" stroke="#61717a" stroke-width="3"/><text x="122" y="1846" font-size="23" fill="#24343f" font-weight="normal">70</text><path d="M 170 1766 L 180 1766" fill="none" stroke="#61717a" stroke-width="3"/><text x="122" y="1774" font-size="23" fill="#24343f" font-weight="normal">90</text><path d="M 170 1730 L 180 1730" fill="none" stroke="#61717a" stroke-width="3"/><text x="122" y="1738" font-size="23" fill="#24343f" font-weight="normal">100</text><path d="M 180 2090 L 840 2090" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="840,2090 825,2096 825,2084" fill="#61717a"/><path d="M 180 2090 L 180 1705" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="180,1705 186,1720 174,1720" fill="#61717a"/><path d="M 180 2054 L 810 1766" fill="none" stroke="#b72d4a" stroke-width="3"/><path d="M 180 1838 L 190 1838 M 197 1838 L 207 1838 M 214 1838 L 224 1838 M 231 1838 L 241 1838 M 248 1838 L 258 1838 M 265 1838 L 275 1838 M 282 1838 L 292 1838 M 299 1838 L 309 1838 M 316 1838 L 326 1838 M 333 1838 L 343 1838 M 350 1838 L 360 1838 M 367 1838 L 377 1838 M 384 1838 L 394 1838 M 401 1838 L 411 1838 M 418 1838 L 428 1838 M 435 1838 L 445 1838 M 452 1838 L 462 1838 M 469 1838 L 479 1838 M 486 1838 L 496 1838 M 503 1838 L 513 1838 M 520 1838 L 530 1838 M 537 1838 L 547 1838 M 554 1838 L 564 1838 M 571 1838 L 581 1838 M 588 1838 L 598 1838 M 605 1838 L 615 1838 M 622 1838 L 632 1838 M 639 1838 L 649 1838 M 652.5 1838 L 652.5 1848 M 652.5 1855 L 652.5 1865 M 652.5 1872 L 652.5 1882 M 652.5 1889 L 652.5 1899 M 652.5 1906 L 652.5 1916 M 652.5 1923 L 652.5 1933 M 652.5 1940 L 652.5 1950 M 652.5 1957 L 652.5 1967 M 652.5 1974 L 652.5 1984 M 652.5 1991 L 652.5 2001 M 652.5 2008 L 652.5 2018 M 652.5 2025 L 652.5 2035 M 652.5 2042 L 652.5 2052 M 652.5 2059 L 652.5 2069 M 652.5 2076 L 652.5 2086" fill="none" stroke="#326991" stroke-width="3"/><circle cx="652.5" cy="1838" r="8" fill="#326991"/><text x="672.5" y="1823" font-size="25" fill="#326991" font-weight="normal">(3, 70)</text><text x="200" y="2036" font-size="23" fill="#b72d4a" font-weight="normal">截距 b＝10</text><text x="100" y="1680" font-size="24" fill="#24343f" font-weight="normal">S（a.u.）</text><text x="540" y="2190" font-size="24" fill="#24343f" font-weight="normal">測定液 c（mg/L）</text><rect x="980" y="1610" width="870" height="620" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="1004" y="1654" font-size="27" fill="#b72d4a" font-weight="bold">紙筆樓梯｜先扣，再除，再乘</text><text x="1004" y="1698" font-size="24" fill="#24343f" font-weight="normal">① 想求 c，先把非斜率部分移開：S−b＝mc。</text><text x="1004" y="1745.8" font-size="24" fill="#24343f" font-weight="normal">② 測定液：(70−10)/20＝60/20＝3 mg/L。</text><text x="1004" y="1793.6" font-size="24" fill="#24343f" font-weight="normal">③ 取 10 mL 定容至 50 mL，倍數 D＝50/10＝5。</text><text x="1004" y="1841.4" font-size="24" fill="#24343f" font-weight="normal">④ 原液：3×5＝15 mg/L。</text><text x="1004" y="1889.2" font-size="24" fill="#24343f" font-weight="normal">⑤ 驗算：15/5＝3；20×3＋10＝70。</text><text x="1004" y="1937" font-size="24" fill="#24343f" font-weight="normal">錯法：70/20×5＝17.5，忘了先扣截距。</text><text x="1004" y="1984.8" font-size="24" fill="#24343f" font-weight="normal">圖是給定模型的精確示意，非實測數據；b 不必等同程序空白。</text><text x="50" y="2310" font-size="29" fill="#24343f" font-weight="bold">偏差在哪一段？先找位置，再預測方向</text><rect x="50" y="2360" width="420" height="350" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="2404" font-size="27" fill="#9e771c" font-weight="bold">物理干擾｜L08</text><text x="74" y="2448" font-size="23" fill="#24343f" font-weight="normal">改送入量 CQη；原瓶 C 可不變。</text><text x="74" y="2494.35" font-size="23" fill="#24343f" font-weight="normal">題本糖液低／乙醇例高。</text><text x="74" y="2540.7" font-size="23" fill="#24343f" font-weight="normal">M02 修進樣、霧化與基質匹配。</text><rect x="512" y="2360" width="420" height="350" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="536" y="2404" font-size="27" fill="#685185" font-weight="bold">化學／離子化｜L09、L10</text><text x="536" y="2448" font-size="23" fill="#24343f" font-weight="normal">難解離或物種人口改變。</text><text x="536" y="2494.35" font-size="23" fill="#24343f" font-weight="normal">原子線、離子線方向須分開。</text><text x="536" y="2540.7" font-size="23" fill="#24343f" font-weight="normal">M02 修原子化、試劑與條件。</text><rect x="974" y="2360" width="420" height="350" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="998" y="2404" font-size="27" fill="#685185" font-weight="bold">光譜／背景｜L11</text><text x="998" y="2448" font-size="23" fill="#24343f" font-weight="normal">改讀到的光，不必改原子總量。</text><text x="998" y="2494.35" font-size="23" fill="#24343f" font-weight="normal">重疊可能高、過扣可能低。</text><text x="998" y="2540.7" font-size="23" fill="#24343f" font-weight="normal">M03 換合適線、處理背景。</text><rect x="1436" y="2360" width="420" height="350" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="1460" y="2404" font-size="27" fill="#b72d4a" font-weight="bold">回算／品質｜L13、L16</text><text x="1460" y="2448" font-size="23" fill="#24343f" font-weight="normal">截距、範圍、稀釋與單位。</text><text x="1460" y="2494.35" font-size="23" fill="#24343f" font-weight="normal">測定液不可直接當原液。</text><text x="1460" y="2540.7" font-size="23" fill="#24343f" font-weight="normal">M04 重查模型；需新資料回上游。</text><text x="50" y="2790" font-size="23" fill="#24343f" font-weight="normal">ppm 是百萬分之一比例，須交代基準；mg/L 是質量／體積，只有密度與基準合適時才可常見近似換算。</text><text x="50" y="2855" font-size="23" fill="#24343f" font-weight="normal">品質閉合：異常證據 → 指定修正 → 新讀數或處理證據 → 再過 M04。不是看到「低」就唯一判化學干擾。</text><text x="50" y="2975" font-size="20" fill="#61717a" font-weight="normal">色塊沿用六組存檔；校正圖藍色虛線為讀值定位。偏差方向須連同條件與所量物種判斷。</text><text x="50" y="3015" font-size="20" fill="#61717a" font-weight="normal">原子光譜 v3.0｜C1–C5 自編紙筆題；定量模型須先驗證。本圖不設定通用回收率合格門檻。</text></g></svg>