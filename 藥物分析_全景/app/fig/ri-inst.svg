<text x="1132" y="2281" font-size="27" font-weight="600" fill="#326991">光學比較（功能示意）</text>
<text x="1132" y="2328" font-size="24" font-weight="400" fill="#24343f">光比較兩池 n，差異造成偏折／差動讀出。</text>
<text x="1132" y="2362.08" font-size="24" font-weight="400" fill="#24343f">實際光源、雙程或光電配置依型號。</text>
