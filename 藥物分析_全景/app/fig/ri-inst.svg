<text x="74" y="1325" font-size="26" font-weight="400" fill="#24343f">n sin i＝N sin r；sin i→1</text>
<text x="74" y="1375" font-size="25" font-weight="400" fill="#326991">n＝N sin r_c；r_c 是折射角。</text>
