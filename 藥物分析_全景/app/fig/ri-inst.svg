<text x="975" y="2210" font-size="22" font-weight="400" fill="#61717a">樣品池 n</text>
<text x="1037" y="2308" font-size="21" font-weight="400" fill="#61717a">參考 n</text>
<polyline points="1455,2460 1455,2550" fill="none" stroke="#61717a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1455.0,2550.0 1448.8,2538.6 1461.2,2538.6" fill="#61717a"/>
<rect x="1110" y="2550" width="690" height="255" rx="18" fill="#fff" stroke="#61717a" stroke-width="2"/>
<text x="1132" y="2591" font-size="27" font-weight="600" fill="#61717a">M03｜差動訊號→時間紀錄</text>
<text x="1132" y="2638" font-size="24" font-weight="400" fill="#24343f">Δn＝n_sample−n_reference，可正可負。</text>
<text x="1132" y="2672.08" font-size="24" font-weight="400" fill="#24343f">實際儀器訊號單位與極性另記。</text>
<text x="1132" y="2706.16" font-size="24" font-weight="400" fill="#24343f">M04：校正、範圍與背景合格才報含量。</text>
<rect x="75" y="2550" width="945" height="255" rx="18" fill="#fff" stroke="#b72d4a" stroke-width="2"/>
<text x="97" y="2591" font-size="27" font-weight="600" fill="#b72d4a">L9｜固定組成與穩定溫度</text>
<text x="97" y="2638" font-size="24" font-weight="400" fill="#24343f">等度：移動相背景較穩定。</text>
<text x="97" y="2672.08" font-size="24" font-weight="400" fill="#24343f">梯度：溶劑自身 n 改變，可造成大基線漂移。</text>
<text x="97" y="2706.16" font-size="24" font-weight="400" fill="#24343f">常規 RI 不宜溶劑組成梯度；通用不等於必夠靈敏。</text>
<text x="75" y="2880" font-size="22" font-weight="400" fill="#61717a">本圖保留兩池的功能與內容；未畫成特定儀器的精確雙程光學，也未把分析流路串入參考池。</text>
<text x="50" y="3000" font-size="29" font-weight="600" fill="#b72d4a">異常先回哪一站？｜紅虛線是分析者的修正動作</text>
<rect x="50" y="3050" width="570" height="265" rx="18" fill="#fff" stroke="#b72d4a" stroke-width="2"/>
<text x="72" y="3091" font-size="27" font-weight="600" fill="#b72d4a">彩色／模糊邊界</text>
