<text x="97" y="2281" font-size="27" font-weight="600" fill="#356844">移動相填充／沖洗</text>
<text x="97" y="2328" font-size="24" font-weight="400" fill="#24343f">依原廠程序建立參考</text>
<text x="97" y="2362.08" font-size="24" font-weight="400" fill="#24343f">不是分析物純品</text>
<rect x="550" y="2240" width="470" height="220" rx="18" fill="#fff" stroke="#356844" stroke-width="2"/>
<text x="572" y="2281" font-size="27" font-weight="600" fill="#356844">參考池</text>
<text x="572" y="2328" font-size="24" font-weight="400" fill="#24343f">分析時保持所需參考</text>
<text x="572" y="2362.08" font-size="24" font-weight="400" fill="#24343f">內容＝移動相</text>
<polyline points="465,2350 545,2350" fill="none" stroke="#356844" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="545.0,2350.0 533.6,2356.2 533.6,2343.8" fill="#356844"/>
