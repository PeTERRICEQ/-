<text x="1457.5" y="1085" font-size="22" font-weight="400" fill="#326991">臨界折射角 φ＝90°</text>
<text x="999" y="1325" font-size="26" font-weight="400" fill="#24343f">N sin θ_c＝n sin 90°＝n</text>
<text x="999" y="1375" font-size="25" font-weight="400" fill="#326991">θ_c＝r_c；θ&gt;θ_c 才全反射。</text>
<rect x="50" y="1490" width="1800" height="250" rx="18" fill="#e8e1f2" stroke="#685185" stroke-width="2"/>
<text x="72" y="1531" font-size="27" font-weight="600" fill="#685185">實際操作｜讓被測界面符合母式</text>
<text x="72" y="1578" font-size="24" font-weight="400" fill="#24343f">標準及清潔 → 設定 T、λ → 液體覆蓋／固體相容接觸 → 樣品與稜鏡平衡</text>
<text x="72" y="1612.08" font-size="24" font-weight="400" fill="#24343f">→ 必要補償與對焦 → 對清楚邊界讀數 → 題本至少三次 → 檢查離散、報 n_D^T。</text>
<text x="72" y="1646.16" font-size="24" font-weight="400" fill="#24343f">接觸液填空隙，不作黏膠；角度沒有吸收光程 b，仍不能忽略氣泡、殘留與覆蓋。</text>
