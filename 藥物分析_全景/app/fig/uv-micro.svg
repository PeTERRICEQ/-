<svg width="1900" height="3600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 3600" style="max-width:100%;height:auto" role="img" aria-labelledby="uv3_g2_title uv3_g2_desc"><title id="uv3_g2_title">UV–Vis｜20 條小循環都有入口、短鏈與出口</title><desc id="uv3_g2_desc">紫外光與可見光譜教學向量圖。包含四站定位、明確入口與出口，回查與正常結論分開。</desc><defs><marker id="uv3_g2_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717a"/></marker><marker id="uv3_g2_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b72d4a"/></marker><marker id="uv3_g2_light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326991"/></marker></defs><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1900" height="3600" rx="0" fill="#f8f6ee" stroke="none" stroke-width="2"/><text x="50" y="48" font-size="21" fill="#61717a" font-weight="normal">PHARMACEUTICAL ANALYSIS  /  CH27  /  v3.0</text><text x="50" y="100" font-size="38" fill="#24343f" font-weight="bold">UV–Vis｜20 條小循環都有入口、短鏈與出口</text><text x="50" y="146" font-size="24" fill="#24343f" font-weight="normal">先讀 D（定量），再讀 B／C（分子與結構）；A、E、F 補儀器、進階方法與品質。</text><rect x="50" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="72" y="247" font-size="27" fill="#24343f" font-weight="bold">M01｜先定問題</text><text x="72" y="291" font-size="24" fill="#24343f" font-weight="normal">目的、檢品、方法</text><path d="M 470 265 L 510 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="510,265 495,271 495,259" fill="#61717a"/><rect x="510" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="532" y="247" font-size="27" fill="#24343f" font-weight="bold">M02｜準備與測量</text><text x="532" y="291" font-size="24" fill="#24343f" font-weight="normal">型態、波長、條件</text><path d="M 930 265 L 970 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="970,265 955,271 955,259" fill="#61717a"/><rect x="970" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="992" y="247" font-size="27" fill="#24343f" font-weight="bold">M03｜讀訊號</text><text x="992" y="291" font-size="24" fill="#24343f" font-weight="normal">量、單位、讀法</text><path d="M 1390 265 L 1430 265" fill="none" stroke="#61717a" stroke-width="3"/><polygon points="1430,265 1415,271 1415,259" fill="#61717a"/><rect x="1430" y="205" width="420" height="120" rx="16" fill="#fff" stroke="#61717a" stroke-width="2"/><text x="1452" y="247" font-size="27" fill="#24343f" font-weight="bold">M04｜核對結論</text><text x="1452" y="291" font-size="24" fill="#24343f" font-weight="normal">計算、判讀、品質</text><rect x="50" y="390" width="580" height="1410" rx="16" fill="#fff1c8" stroke="#9e771c" stroke-width="2"/><text x="74" y="434" font-size="27" fill="#9e771c" font-weight="bold">A｜光先到得了</text><text x="74" y="476" font-size="23" fill="#24343f" font-weight="normal">分析波長先決定，才配燈、槽、溶媒與查核。</text><text x="74" y="555" font-size="25" fill="#9e771c" font-weight="bold">L13｜沿透射光路讀數</text><text x="74" y="594" font-size="23" fill="#24343f" font-weight="normal">入口 M02：光源、選波長、樣品與偵測配置</text><text x="74" y="631.35" font-size="24" fill="#24343f" font-weight="normal">供光 → 選波長／樣品吸收 → 偵測透射光 → 換成</text><text x="74" y="666.15" font-size="24" fill="#24343f" font-weight="normal">T、A</text><text x="74" y="705.95" font-size="23" fill="#24343f" font-weight="normal">出口 M03：可比的透射讀數</text><path d="M 74 807 L 606 807" fill="none" stroke="#61717a" stroke-width="3"/><text x="74" y="835" font-size="25" fill="#9e771c" font-weight="bold">L14｜燈、槽、溶媒要透光</text><text x="74" y="874" font-size="23" fill="#24343f" font-weight="normal">入口 M01：選定的分析波長與檢品介質</text><text x="74" y="911.35" font-size="24" fill="#24343f" font-weight="normal">光源有光＋容槽透光＋溶媒低背景 → 有效光足夠</text><text x="74" y="946.15" font-size="24" fill="#24343f" font-weight="normal">→ 才能量檢品</text><text x="74" y="985.95" font-size="23" fill="#24343f" font-weight="normal">出口 M02：可用的量測條件</text><path d="M 74 1087 L 606 1087" fill="none" stroke="#61717a" stroke-width="3"/><text x="74" y="1115" font-size="25" fill="#9e771c" font-weight="bold">L16｜四項性能分開查</text><text x="74" y="1154" font-size="23" fill="#24343f" font-weight="normal">入口 M04：發現位置／強度／分辨／漏光不符</text><text x="74" y="1191.35" font-size="24" fill="#24343f" font-weight="normal">先認查核目標 → 選正確參考標準 → 修正設定／</text><text x="74" y="1226.15" font-size="24" fill="#24343f" font-weight="normal">性能 → 重測</text><text x="74" y="1265.95" font-size="23" fill="#24343f" font-weight="normal">出口 M02：合格量測條件</text><text x="74" y="1710" font-size="23" fill="#9e771c" font-weight="normal">條件：分析 λ 先確定；修正後重測。</text><rect x="660" y="390" width="580" height="1410" rx="16" fill="#d9eeea" stroke="#286c68" stroke-width="2"/><text x="684" y="434" font-size="27" fill="#286c68" font-weight="bold">B｜分子如何吸光</text><text x="684" y="476" font-size="23" fill="#24343f" font-weight="normal">先看電子與能量，再分開讀位置、強度。</text><text x="684" y="555" font-size="25" fill="#286c68" font-weight="bold">L05｜波長與電子能量</text><text x="684" y="594" font-size="23" fill="#24343f" font-weight="normal">入口 M02：光波長與分子可用能階</text><text x="684" y="631.35" font-size="24" fill="#24343f" font-weight="normal">波長越短 → 每光子能量越高 → 匹配能階差 → 出</text><text x="684" y="666.15" font-size="24" fill="#24343f" font-weight="normal">現吸收帶</text><text x="684" y="705.95" font-size="23" fill="#24343f" font-weight="normal">出口 M03：吸收帶位置</text><path d="M 684 807 L 1216 807" fill="none" stroke="#61717a" stroke-width="3"/><text x="684" y="835" font-size="25" fill="#286c68" font-weight="bold">L06｜四種電子躍遷</text><text x="684" y="874" font-size="23" fill="#24343f" font-weight="normal">入口 M02：結構；再比對 λ 與 ε</text><text x="684" y="911.35" font-size="24" fill="#24343f" font-weight="normal">找 σ／π／n 電子 → 確認可用躍遷 → 比對波長 →</text><text x="684" y="946.15" font-size="24" fill="#24343f" font-weight="normal">選最合適答案</text><text x="684" y="985.95" font-size="23" fill="#24343f" font-weight="normal">出口 M03：躍遷判斷</text><path d="M 684 1087 L 1216 1087" fill="none" stroke="#61717a" stroke-width="3"/><text x="684" y="1115" font-size="25" fill="#286c68" font-weight="bold">L07｜位置與強度分開讀</text><text x="684" y="1154" font-size="23" fill="#24343f" font-weight="normal">入口 M03：峰位置 λmax 與吸收強度 ε／A</text><text x="684" y="1191.35" font-size="24" fill="#24343f" font-weight="normal">讀 λ 判位置 → 讀 ε 判響應強弱 → 合併結構線</text><text x="684" y="1226.15" font-size="24" fill="#24343f" font-weight="normal">索 → 判躍遷</text><text x="684" y="1265.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：兩條獨立線索</text><text x="684" y="1710" font-size="23" fill="#286c68" font-weight="normal">條件：結構、λ、ε 合看；典型帶非硬邊界。</text><rect x="1270" y="390" width="580" height="1410" rx="16" fill="#dcecdc" stroke="#356844" stroke-width="2"/><text x="1294" y="434" font-size="27" fill="#356844" font-weight="bold">C｜結構與 pH 改譜</text><text x="1294" y="476" font-size="23" fill="#24343f" font-weight="normal">看連接與型態，再命名紅藍移、增減色。</text><text x="1294" y="555" font-size="25" fill="#356844" font-weight="bold">L08｜發色與助色看連接</text><text x="1294" y="594" font-size="23" fill="#24343f" font-weight="normal">入口 M01：化學結構與真正吸收系統</text><text x="1294" y="631.35" font-size="24" fill="#24343f" font-weight="normal">找發色系統 → 看基團能否直接參與共軛 → 判助</text><text x="1294" y="666.15" font-size="24" fill="#24343f" font-weight="normal">色作用 → 預測譜變</text><text x="1294" y="705.95" font-size="23" fill="#24343f" font-weight="normal">出口 M02：結構角色</text><path d="M 1294 807 L 1826 807" fill="none" stroke="#61717a" stroke-width="3"/><text x="1294" y="835" font-size="25" fill="#356844" font-weight="bold">L09｜共軛與吸收帶</text><text x="1294" y="874" font-size="23" fill="#24343f" font-weight="normal">入口 M02：有效共軛長度；同系列比較</text><text x="1294" y="911.35" font-size="24" fill="#24343f" font-weight="normal">有效共軛延伸 → 相應能階差常縮小 → λ 常變長</text><text x="1294" y="946.15" font-size="24" fill="#24343f" font-weight="normal">→ 另讀強度</text><text x="1294" y="985.95" font-size="23" fill="#24343f" font-weight="normal">出口 M03：波長趨勢與強度線索</text><path d="M 1294 1087 L 1826 1087" fill="none" stroke="#61717a" stroke-width="3"/><text x="1294" y="1115" font-size="25" fill="#356844" font-weight="bold">L10｜紅藍移與增減色</text><text x="1294" y="1154" font-size="23" fill="#24343f" font-weight="normal">入口 M03：前後 λ 與同條件吸收強度</text><text x="1294" y="1191.35" font-size="24" fill="#24343f" font-weight="normal">λ 增／減 → 紅移／藍移；強度增／減 → 增色／</text><text x="1294" y="1226.15" font-size="24" fill="#24343f" font-weight="normal">減色 → 分別命名</text><text x="1294" y="1265.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：兩個獨立名稱</text><path d="M 1294 1367 L 1826 1367" fill="none" stroke="#61717a" stroke-width="3"/><text x="1294" y="1395" font-size="25" fill="#356844" font-weight="bold">L11｜酸鹼先改型態</text><text x="1294" y="1434" font-size="23" fill="#24343f" font-weight="normal">入口 M01：pH、結構、反應時間</text><text x="1294" y="1471.35" font-size="24" fill="#24343f" font-weight="normal">pH 改變 → 質子化型態改變 → 共軛／吸光能力改</text><text x="1294" y="1506.15" font-size="24" fill="#24343f" font-weight="normal">變 → λ、A 可改變</text><text x="1294" y="1545.95" font-size="23" fill="#24343f" font-weight="normal">出口 M03：可解釋的酸鹼光譜</text><text x="1294" y="1710" font-size="23" fill="#356844" font-weight="normal">條件：同濃度／光徑、對應帶與型態可比。</text><rect x="50" y="1840" width="580" height="1410" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="74" y="1884" font-size="27" fill="#685185" font-weight="bold">D｜讀數轉成濃度</text><text x="74" y="1926" font-size="23" fill="#24343f" font-weight="normal">I／I₀ → T → A → 配係數單位 → 濃度。</text><text x="74" y="2005" font-size="25" fill="#685185" font-weight="bold">L01｜參考光與透射光</text><text x="74" y="2044" font-size="23" fill="#24343f" font-weight="normal">入口 M01：匹配空白與檢品；同波長、同光徑</text><text x="74" y="2081.35" font-size="24" fill="#24343f" font-weight="normal">空白給 I₀ → 檢品給 I → T＝I／I₀ → 得到通過</text><text x="74" y="2116.15" font-size="24" fill="#24343f" font-weight="normal">比例</text><text x="74" y="2155.95" font-size="23" fill="#24343f" font-weight="normal">出口 M03：透射率 T</text><path d="M 74 2257 L 606 2257" fill="none" stroke="#61717a" stroke-width="3"/><text x="74" y="2285" font-size="25" fill="#685185" font-weight="bold">L02｜透射率換吸光度</text><text x="74" y="2324" font-size="23" fill="#24343f" font-weight="normal">入口 M03：T，先把百分比換小數</text><text x="74" y="2361.35" font-size="24" fill="#24343f" font-weight="normal">T＝10⁻¹ → A＝−log₁₀T＝1 → 光每少十倍，A 多</text><text x="74" y="2396.15" font-size="24" fill="#24343f" font-weight="normal">1</text><text x="74" y="2435.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：吸光度 A</text><path d="M 74 2537 L 606 2537" fill="none" stroke="#61717a" stroke-width="3"/><text x="74" y="2565" font-size="25" fill="#685185" font-weight="bold">L03｜吸光度回推濃度</text><text x="74" y="2604" font-size="23" fill="#24343f" font-weight="normal">入口 M02：固定物種、λ、b；取用 M03 的 A</text><text x="74" y="2641.35" font-size="24" fill="#24343f" font-weight="normal">同條件下濃度增加 → 吸收增多 → A 成比例增加</text><text x="74" y="2676.15" font-size="24" fill="#24343f" font-weight="normal">→ 回算 c</text><text x="74" y="2715.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：濃度或含量</text><path d="M 74 2817 L 606 2817" fill="none" stroke="#61717a" stroke-width="3"/><text x="74" y="2845" font-size="25" fill="#685185" font-weight="bold">L04｜係數要配濃度單位</text><text x="74" y="2884" font-size="23" fill="#24343f" font-weight="normal">入口 M03：A 與題目給的係數、濃度單位</text><text x="74" y="2921.35" font-size="24" fill="#24343f" font-weight="normal">先認 ε／a／E¹% → 選 mol/L／g/L／g/100 mL →</text><text x="74" y="2956.15" font-size="24" fill="#24343f" font-weight="normal">移項 → 得濃度</text><text x="74" y="2995.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：單位正確的濃度</text><text x="74" y="3160" font-size="23" fill="#685185" font-weight="normal">條件：有效校正範圍；百分比先換小數。</text><rect x="660" y="1840" width="580" height="1410" rx="16" fill="#dceaf7" stroke="#326991" stroke-width="2"/><text x="684" y="1884" font-size="27" fill="#326991" font-weight="bold">E｜選擇性與數學處理</text><text x="684" y="1926" font-size="23" fill="#24343f" font-weight="normal">三個 A 求比例；兩條件相減；一條譜求斜率。</text><text x="684" y="2005" font-size="25" fill="#326991" font-weight="bold">L12｜三個 A 求 pKa</text><text x="684" y="2044" font-size="23" fill="#24343f" font-weight="normal">入口 M03：酸型 AH、鹼型 AB、混合 A 和 pH</text><text x="684" y="2081.35" font-size="24" fill="#24343f" font-weight="normal">A 在兩端間的位置 → 鹼型分率 → 酸／鹼型比例</text><text x="684" y="2116.15" font-size="24" fill="#24343f" font-weight="normal">→ pKa</text><text x="684" y="2155.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：有型態定義的 pKa</text><path d="M 684 2257 L 1216 2257" fill="none" stroke="#61717a" stroke-width="3"/><text x="684" y="2285" font-size="25" fill="#326991" font-weight="bold">L17｜差異法扣相同背景</text><text x="684" y="2324" font-size="23" fill="#24343f" font-weight="normal">入口 M02：兩份等量檢品、兩條件、可比背景</text><text x="684" y="2361.35" font-size="24" fill="#24343f" font-weight="normal">量 A₁ 與 A₂ → 相減 ΔA → 相同背景抵消 → 留目</text><text x="684" y="2396.15" font-size="24" fill="#24343f" font-weight="normal">標差異</text><text x="684" y="2435.95" font-size="23" fill="#24343f" font-weight="normal">出口 M03：差異吸光度 ΔA</text><path d="M 684 2537 L 1216 2537" fill="none" stroke="#61717a" stroke-width="3"/><text x="684" y="2565" font-size="25" fill="#326991" font-weight="bold">L18｜微分法讀斜率</text><text x="684" y="2604" font-size="23" fill="#24343f" font-weight="normal">入口 M03：A 隨 λ 改變的曲線</text><text x="684" y="2641.35" font-size="24" fill="#24343f" font-weight="normal">沿 λ 看 A 的斜率 → 一階；再看斜率變化 → 二</text><text x="684" y="2676.15" font-size="24" fill="#24343f" font-weight="normal">階 → 判峰形</text><text x="684" y="2715.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：指定階數的讀數</text><text x="684" y="3160" font-size="23" fill="#326991" font-weight="normal">條件：pKa 兩態可分；差異背景可比；微分查峰形。</text><rect x="1270" y="1840" width="580" height="1410" rx="16" fill="#f5dfe2" stroke="#b72d4a" stroke-width="2"/><text x="1294" y="1884" font-size="27" fill="#b72d4a" font-weight="bold">F｜資料與品質判讀</text><text x="1294" y="1926" font-size="23" fill="#24343f" font-weight="normal">按目的選證據；不符才回真正需要修的站。</text><text x="1294" y="2005" font-size="25" fill="#b72d4a" font-weight="bold">L15｜DAD 多出光譜維度</text><text x="1294" y="2044" font-size="23" fill="#24343f" font-weight="normal">入口 M03：由 DAD 得到的 A(λ,t)</text><text x="1294" y="2081.35" font-size="24" fill="#24343f" font-weight="normal">每時刻取得多波長 A → 比較峰前／頂／後 → 判</text><text x="1294" y="2116.15" font-size="24" fill="#24343f" font-weight="normal">差異 → 輔助純度與定量</text><text x="1294" y="2155.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：多波長證據</text><path d="M 1294 2257 L 1826 2257" fill="none" stroke="#61717a" stroke-width="3"/><text x="1294" y="2285" font-size="25" fill="#b72d4a" font-weight="bold">L19｜目的決定方法</text><text x="1294" y="2324" font-size="23" fill="#24343f" font-weight="normal">入口 M01：想回答的問題與檢品複雜度</text><text x="1294" y="2361.35" font-size="24" fill="#24343f" font-weight="normal">要哪種資訊 → 選方法與條件 → 讀適當訊號 → 做</text><text x="1294" y="2396.15" font-size="24" fill="#24343f" font-weight="normal">範圍內的結論</text><text x="1294" y="2435.95" font-size="23" fill="#24343f" font-weight="normal">出口 M04：有證據支持的結論</text><path d="M 1294 2537 L 1826 2537" fill="none" stroke="#61717a" stroke-width="3"/><text x="1294" y="2565" font-size="25" fill="#b72d4a" font-weight="bold">L20｜異常值要找來源</text><text x="1294" y="2604" font-size="23" fill="#24343f" font-weight="normal">入口 M04：偏高、偏低或不線性結果</text><text x="1294" y="2641.35" font-size="24" fill="#24343f" font-weight="normal">偏差現象 → 列可能原因 → 用條件或另一讀數分</text><text x="1294" y="2676.15" font-size="24" fill="#24343f" font-weight="normal">辨 → 修正後重測</text><text x="1294" y="2715.95" font-size="23" fill="#24343f" font-weight="normal">出口 M01／M02／M03：對應上游站的修正</text><text x="1294" y="3160" font-size="23" fill="#b72d4a" font-weight="normal">條件：判讀在方法證據範圍內；異常不唯一反推。</text><rect x="50" y="3315" width="1800" height="155" rx="16" fill="#e8e1f2" stroke="#685185" stroke-width="2"/><text x="74" y="3359" font-size="27" fill="#685185" font-weight="bold">完整示範｜含量題走同一主幹</text><text x="74" y="3403" font-size="24" fill="#24343f" font-weight="normal">M01 取題目 E¹%＝500、預期 1 mg/100 mL → M02 同 λ、b＝1 cm → M03 讀 A＝0.45。</text><text x="74" y="3450.8" font-size="24" fill="#24343f" font-weight="normal">M03 A → L04 選 g/100 mL → M04 得 0.9 mg/100 mL；0.9／1＝90%，再查取樣與回收。</text><text x="50" y="3515" font-size="20" fill="#61717a" font-weight="normal">深灰實線＝分析流程／因果；紅色虛線＝條件不符才回查。回查是分析者修正流程。</text><text x="50" y="3555" font-size="20" fill="#61717a" font-weight="normal">UV–Vis v3.0｜與雙檔同源；所有 L 在圖 2 有主要位置。示意不按比例。</text></g></svg>